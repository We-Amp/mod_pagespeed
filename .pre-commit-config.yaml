repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(rgba|gif|png|jpg|jpeg|webp)$'
      - id: end-of-file-fixer
        exclude: '\.(rgba|gif|png|jpg|jpeg|webp)$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.0
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # pagespeed/iis/ uses Windows-specific include ordering that conflicts
        # with SortIncludes:true in Google style (winsock2.h before windows.h)
        exclude: '^(third_party|pagespeed/iis)/'

# PageSpeed Envoy Filter - Production Configuration Example
#
# This configuration demonstrates production-ready settings including:
# - Admin authentication for PageSpeed endpoints
# - Redis cache backend
# - Prometheus metrics exposure
# - Health check endpoint
# - Security-hardened settings
#
# See CLAUDE.md for detailed documentation of all options.

static_resources:
  listeners:
  # Main HTTP listener
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          generate_request_id: true
          codec_type: AUTO
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains:
              - "*"
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: service1
          http_filters:
          - name: pagespeed
            typed_config:
              "@type": type.googleapis.com/pagespeed.Decoder
              # Legacy required fields (will be removed in future version)
              key: "placeholder"
              val: "placeholder"

              # =================================================================
              # CACHE CONFIGURATION
              # =================================================================

              # Redis cache backend for distributed caching
              # Uncomment and configure for production deployments
              # redis:
              #   server:
              #     host: "redis.internal"
              #     port: 6379
              #   timeout_us: 5000000       # 5 seconds
              #   reconnection_delay_ms: 5
              #   database_index: 0
              #   ttl_sec: 86400            # 24 hours

              # File cache path (ensure directory exists and is writable)
              file_cache_path: "/var/cache/pagespeed/files/"

              # Log directory
              log_dir: "/var/log/pagespeed/"

              # In-memory LRU cache size (500 MB default)
              lru_cache_kb_per_process: 512000

              # File cache size limit (10 GB default)
              file_cache_size_kb: 10240000

              # =================================================================
              # ADMIN AUTHENTICATION (Production Security)
              # =================================================================

              # Secure admin endpoints in production
              admin_auth:
                # Enable authentication for /pagespeed_admin and /pagespeed_statistics
                enabled: true

                # Bearer token for Authorization header
                # Generate with: openssl rand -hex 32
                token: "your-secure-token-replace-this"

                # Restrict access to internal networks only (CIDR notation)
                allowed_ips:
                  - "10.0.0.0/8"       # Internal network
                  - "172.16.0.0/12"    # Docker networks
                  - "192.168.0.0/16"   # Private network
                  - "127.0.0.1/32"     # Localhost

                # Rate limit admin requests (requests per minute)
                rate_limit_rpm: 60

              # =================================================================
              # DOMAIN CONFIGURATION
              # =================================================================

              # Domain configuration for authorization and mapping
              domains:
                # Domains authorized for rewriting
                authorized_domains:
                  - "*.example.com"
                  - "cdn.example.com"
                  - "localhost"
                  - "127.0.0.1"

                # CDN domain mapping (rewrite URLs to use CDN)
                # rewrite_mappings:
                #   - to_domain: "cdn.example.com"
                #     from_domains: "www.example.com,static.example.com"

                # Origin domain mapping (fetch from different origin)
                # origin_mappings:
                #   - to_domain: "origin.internal:8080"
                #     from_domains: "www.example.com"
                #     host_header: "www.example.com"

              # =================================================================
              # VIRTUAL HOST CONFIGURATION
              # =================================================================

              # Per-host configuration overrides
              # virtual_hosts:
              #   - host_pattern: "api.example.com"
              #     priority: 0
              #     options:
              #       enabled: false  # Disable PageSpeed for API endpoints
              #
              #   - host_pattern: "*.example.com"
              #     priority: 10
              #     options:
              #       rewrite_level: "CoreFilters"
              #       enabled_filters: "rewrite_css,rewrite_javascript,recompress_images"

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: service1
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: service1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8082
    # Circuit breaker settings for origin connections
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 1024
          max_pending_requests: 1024
          max_requests: 1024
          max_retries: 3

# =================================================================
# ENVOY ADMIN INTERFACE (Security Hardened)
# =================================================================

admin:
  # Bind to localhost only - use a sidecar or SSH tunnel for remote access
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

# =================================================================
# PAGESPEED OPTIONS REFERENCE
# =================================================================
#
# Additional PageSpeed options can be set via custom_options in virtual_hosts
# or via query parameters for testing:
#
# HTML Rewriting:
#   EnableHtmlRewriting: on/off (default: on)
#   HtmlRewriteDeadlineMs: milliseconds (default: 2000)
#   MaxHtmlBufferBytes: bytes (default: 2097152 = 2MB)
#
# Health Check:
#   HealthPath: endpoint path (default: /pagespeed/health)
#
# Admin Endpoints:
#   /pagespeed_admin - Admin console
#   /pagespeed_statistics - Statistics (JSON)
#   /pagespeed_global_admin - Global admin console
#   /pagespeed_global_statistics - Global statistics
#   /pagespeed/health - Health check endpoint
#
# Metrics:
#   Prometheus metrics available at admin port /stats/prometheus
#   Key metrics: pagespeed.requests_total, pagespeed.html_rewrites_total,
#   pagespeed.ipro_cache_hits, pagespeed.rewrite_latency_ms
#
# Example: curl with admin authentication
#   curl -H "Authorization: Bearer your-token" http://localhost:8080/pagespeed_statistics
#
# Example: health check
#   curl http://localhost:8080/pagespeed/health
#
# Example: trigger HTML rewriting with filters
#   curl "http://localhost:8080/page.html?PageSpeedFilters=collapse_whitespace"

# pagespeed_daemon.conf -- points mod_pagespeed at the optimizer daemon.
#
# Installed by the mod-pagespeed package. The two paths below are the defaults
# of the pagespeed-optimizer package this package depends on: the daemon's
# notification socket, and the cache volume the module serves optimized
# responses from. Change them here only if the daemon's SOCKET_PATH or
# CACHE_DIR was relocated in /etc/default/pagespeed-optimizer (the volume path
# is the daemon's cache directory followed by /cache).
#
# This is a configuration file: the package manager keeps your edits across
# upgrades. If the daemon is not running when the web server starts, in-place
# optimization is off for that web-server process and one startup line names
# the cause; start the daemon and restart the web server. To use the module's
# own in-place path instead, comment out both directives.
#
# ORDER MATTERS ON UPGRADE. A release that changes the optimizer's on-disk
# cache format writes a new cache volume, and the web server attaches to the
# volume the daemon created rather than making one of its own. Upgrade and
# start the optimizer daemon first, let it create its volume, then restart the
# web server. A web server started in between refuses to start and says so;
# starting the daemon and restarting the web server clears it. At boot there
# is nothing to do for Apache: the optimizer service is ordered ahead of
# apache2/httpd and counts as started only once its notify socket exists, so
# Apache is not released until the cache volume is there. (Ordering only --
# Apache still starts if the daemon is absent.) A web server under another
# unit name is not ordered against the daemon and needs an ordering drop-in;
# see docs/daemon-adapter-deployment.md.
#
# On Debian/Ubuntu the package enables this file with `a2enconf
# pagespeed_daemon`; on Red Hat family systems httpd reads it from conf.d/
# directly. Its name sorts after pagespeed.conf, which loads the module: a name
# sorting before it would be read before the module exists and be skipped.
<IfModule pagespeed_module>
    ModPagespeedDaemonSocketPath /run/pagespeed-optimizer/notify.sock
    ModPagespeedDaemonVolumePath /var/cache/pagespeed-optimizer/v1/cache
</IfModule>

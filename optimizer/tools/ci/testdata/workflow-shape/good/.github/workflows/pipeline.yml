name: pipeline
on:
  workflow_call:
permissions:
  contents: read
jobs:
  event-guard:
    name: Event guard (refuses merge_group, unexpected events, refs and actors)
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse events, refs and actors this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ALLOWED: "push workflow_dispatch"
          ALLOWED_REFS: "refs/tags/* refs/heads/main"
        run: |
          set -euo pipefail
          set -f
          case " ${ALLOWED} " in *" ${EVENT} "*) ;; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac
          case "${REF}" in refs/heads/gh-readonly-queue/*) echo "::error::merge queue refs never run this pipeline"; exit 1;; esac
          ok=no
          # shellcheck disable=SC2254  # the allowed refs are globs on purpose
          for r in ${ALLOWED_REFS}; do case "${REF}" in ${r}) ok=yes;; esac; done
          [ "${ok}" = yes ] || { echo "::error::ref ${REF} is not allowed in this pipeline"; exit 1; }
          if [ "${EVENT}" = workflow_dispatch ] && [ "${ACTOR}" = "github-actions[bot]" ]; then echo "::error::dispatches made with a workflow token are not allowed"; exit 1; fi
          if [ "${EVENT}" = pull_request ] && { [ "${PR_FORK}" = true ] || [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; }; then echo "::error::pull requests from forks are not allowed in this pipeline"; exit 1; fi
          echo "event ${EVENT} on ${REF} accepted"

  changes:
    runs-on: ubuntu-24.04
    outputs:
      fleet: ${{ steps.scope.outputs.fleet }}
      heavy: ${{ steps.scope.outputs.heavy }}
      css: ${{ steps.diff.outputs.css }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A push reaches this pipeline from the caller's own workflow, and the
      # merge queue pushes a temporary branch: only the default branch (and
      # ci-dev, for the pipeline development lane) may run it.
      - name: Refuse pushes that are not on the default branch
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "${REF}" in "refs/heads/${DEFAULT_BRANCH}"|refs/heads/ci-dev) ;; *) echo "::error::push on ${REF} is not allowed in this pipeline"; exit 1;; esac

      - name: Refuse dispatches made with a workflow token
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ "${ACTOR}" != "github-actions[bot]" ] || { echo "::error::dispatches made with a workflow token are not allowed"; exit 1; }

      - name: Classify the merge group
        id: queue
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git show "origin/${DEFAULT_BRANCH}:tools/ci/queue_fork_guard.sh" > "${RUNNER_TEMP}/qfg.sh"
          rc=0; bash "${RUNNER_TEMP}/qfg.sh" || rc=$?
          case "${rc}" in 0) echo route=fleet;; 3) echo route=hosted;; *) exit 1;; esac >> "$GITHUB_OUTPUT"

      - name: Decide the fleet scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE: ${{ vars.CI_SCOPE }}
          DOCS_LANE: ${{ vars.DOCS_LANE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          FORK_OR_BOT: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
          PR_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:pr-full') }}
        # workflow_dispatch always runs the full PR tier; a pull request and a
        # merge group go through the decision script (and its docs lane), read
        # from the default branch, never the tree.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/fleet-scope.txt"
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) printf 'fleet=true\nheavy=true\n' > "${out}" ;;
            *)
              if git show "origin/${DEFAULT_BRANCH}:tools/ci/pr_tier_scope.sh" > "${RUNNER_TEMP}/pr_tier_scope.sh" 2>/dev/null &&
                bash "${RUNNER_TEMP}/pr_tier_scope.sh" > "${out}" &&
                [ "$(grep -cxE '(fleet|heavy)=(true|false)' "${out}")" = 2 ] && [ "$(wc -l < "${out}")" -eq 2 ]; then
                :
              else
                echo "::warning::fleet scope undecided; running the full PR tier"
                printf 'fleet=true\nheavy=true\n' > "${out}"
              fi ;;
          esac
          cat "${out}" >> "$GITHUB_OUTPUT"
      - id: diff
        run: echo "css=true" >> "$GITHUB_OUTPUT"
  audit:
    runs-on: ubuntu-24.04
    steps:
      - run: echo audit
  vendor:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo vendor
  lint:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-light' }}
    steps:
      - run: echo lint
  windows-build:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    steps:
      - run: echo windows
  css-smoke:
    needs: [event-guard, changes]
    if: ${{ (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && needs.changes.outputs.css == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo smoke
  rig:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED == 'true' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo rig
  switch-vendor:
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo switch
  switch-no-push:
    needs: event-guard
    if: ${{ github.event_name != 'push' }}
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo switch no push
  switch-corpus:
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-light' }}
    steps:
      - run: echo switch light
  switch-win:
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'windows-2022' || 'fleet-windows' }}
    steps:
      - run: echo switch windows
  switch-smoke:
    needs: [event-guard, changes]
    if: ${{ needs.changes.outputs.css == 'true' }}
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo switch smoke
  switch-rig:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo switch rig
  shadow:
    needs: event-guard
    if: ${{ github.event_name == 'workflow_dispatch' && vars.FLEET_ENABLED == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo shadow
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - run: echo report

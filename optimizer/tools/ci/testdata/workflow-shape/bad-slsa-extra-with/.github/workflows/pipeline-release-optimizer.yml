name: x
on:
  workflow_call:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - run: echo manifest
  provenance:
    needs: [manifest]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.manifest.outputs.provenance_subjects }}
      provenance-name: multiple.intoto.jsonl
      upload-assets: false
      draft-release: true

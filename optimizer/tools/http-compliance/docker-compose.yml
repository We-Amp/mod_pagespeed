# mod_pagespeed - HTTP Compliance Test Environment
#
# Three services sharing a named volume:
#   origin  - Programmable compliance origin server
#   worker  - PageSpeed factory worker daemon
#   nginx   - Nginx with pagespeed module (system under test)
# and one on its own volume, with no network at all:
#   module-worker - a second worker, fed by a stand-in for the web-server
#                   module's HTML store (module_standin.py, test_daemon_html.py)
#
# Usage:
#   docker compose -f tools/http-compliance/docker-compose.yml up -d
#   pytest tools/http-compliance/ -v
#   docker compose -f tools/http-compliance/docker-compose.yml down -v

services:
  # Compliance origin: programmable HTTP server with conditional
  # request, range, error, and method handling support.
  origin:
    image: python:3.12-slim
    working_dir: /var/www
    command: python3 /app/compliance_origin.py
    volumes:
      - ./testdata:/var/www
      - ./compliance_origin.py:/app/compliance_origin.py:ro
    environment:
      - PORT=8081
      - BIND=0.0.0.0
      - COMPLIANCE_TESTDATA=/var/www
    ports:
      - "${COMPLIANCE_ORIGIN_PORT:-8181}:8081"

  # PageSpeed factory worker
  worker:
    build:
      context: ../../
      dockerfile: tools/e2e/Dockerfile.e2e
    entrypoint: ["/entrypoint-compliance-worker.sh"]
    environment:
      # The management API over a unix socket in the shared volume, so the
      # html_mode tests can PATCH /v1/config from inside the container. The
      # nginx container shares the volume and can reach the socket too; that
      # is accepted for this test-only stack, which publishes no API port.
      - PAGESPEED_API_SOCKET=/shared/api.sock
    volumes:
      - shared:/shared
      - ./entrypoint-compliance-worker.sh:/entrypoint-compliance-worker.sh:ro
    depends_on:
      - origin

  # Nginx with pagespeed module
  nginx:
    build:
      context: ../../
      dockerfile: tools/e2e/Dockerfile.e2e
    command: ["nginx", "-c", "/etc/nginx/nginx-compliance.conf", "-g", "daemon off;"]
    ports:
      - "${COMPLIANCE_NGINX_PORT:-8180}:8080"
      - "${COMPLIANCE_AGGRESSIVE_PORT:-8183}:8083"
    volumes:
      - shared:/shared
      - ./nginx-compliance.conf:/etc/nginx/nginx-compliance.conf:ro
    depends_on:
      - origin
      - worker

  # A worker for pages a web-server module stores itself. The module stand-in
  # (module_standin.py, run with `exec` in this container) writes through
  # libpagespeed.so into this worker's volume and notifies it. No network:
  # the Markdown copy of such a page is derived from the stored bytes alone.
  module-worker:
    build:
      context: ../../
      dockerfile: tools/e2e/Dockerfile.e2e
    entrypoint: ["/entrypoint-compliance-worker.sh"]
    network_mode: none
    environment:
      - PAGESPEED_AGENT_OPTIMIZE=true
      - PAGESPEED_API_SOCKET=/shared/api.sock
    volumes:
      - module-shared:/shared
      - ./entrypoint-compliance-worker.sh:/entrypoint-compliance-worker.sh:ro
      - ./module_standin.py:/app/module_standin.py:ro

volumes:
  shared:
  module-shared:

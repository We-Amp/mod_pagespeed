# Docker Compose configuration for mod_pagespeed development
# Usage:
#   docker compose up -d          # Start all services
#   docker compose exec dev bash  # Enter dev container
#   docker compose down           # Stop all services

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagespeed-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount source code from host
      - .:/src
      # Mount cyclone-cache for local development (rw to allow fixing bugs)
      # Note: Update this path to match your local cyclone-cache checkout
      - /home/builder/code/we-amp/trafficserver/cyclone-cache:/cyclone-cache
      # Persistent caches on SSD (survives container rebuilds and bazel clean)
      - /media/usbcssd/bazel-cache/disk-cache:/ssd-cache/disk-cache
      - /media/usbcssd/bazel-cache/repo-cache:/ssd-cache/repo-cache
      - /media/usbcssd/bazel-cache/output-base:/home/dev/.cache/bazel
      # SSH agent forwarding for git access (private repos)
      - ${SSH_AUTH_SOCK}:/ssh-agent
    environment:
      # Set PATH explicitly to avoid inheriting host PATH
      - PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Test environment variables for cache backends
      - REDIS_PORT=6379
      - MEMCACHED_PORT=11211
      # Point tests to cache services
      - REDIS_HOST=redis
      - MEMCACHED_HOST=memcached
      # Home directory for dev user
      - HOME=/home/dev
      # SSH agent forwarding
      - SSH_AUTH_SOCK=/ssh-agent
    depends_on:
      - redis
      - memcached
    # IPC mode needed for shared memory support in some tests
    ipc: host
    # Increase ulimits for bazel
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    container_name: pagespeed-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  memcached:
    image: memcached:1.6-alpine
    container_name: pagespeed-memcached
    ports:
      - "11211:11211"
    command: memcached -m 64

  # Windows x64 development VM (optional - requires KVM)
  # Start with: docker compose --profile windows-x64 up -d
  # First boot takes 15-30 min for Windows installation and provisioning
  windows-x64:
    image: dockurr/windows:latest
    container_name: pagespeed-windows-x64
    profiles:
      - windows
      - windows-x64
    environment:
      VERSION: "2022"           # Windows Server 2022
      RAM_SIZE: "48G"
      CPU_CORES: "40"
      DISK_SIZE: "100G"
      USERNAME: "Developer"
      PASSWORD: "ChangeMe1"
    volumes:
      # Persistent VM storage (survives container rebuilds)
      - /media/usbcssd/windows-vm/dockur-x64:/storage
      # OEM provisioning scripts (runs on first boot)
      - ./windows-dev/dockur-oem:/oem:ro
      # Note: Source code is cloned via git, not mounted via SMB
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"    # Web VNC (noVNC in browser)
      - "33389:3389"   # RDP (use 33389 to avoid conflict with host xrdp)
      - "2222:22"      # SSH
      - "8080:8080"    # IIS (for PageSpeed system tests)
    stop_grace_period: 2m

  # Windows ARM64 development VM (optional - requires KVM on ARM64 host)
  # Start with: docker compose --profile windows-arm up -d
  windows-arm:
    image: dockurr/windows-arm:latest
    container_name: pagespeed-windows-arm
    profiles:
      - windows
      - windows-arm
    environment:
      VERSION: "11"             # Windows 11 ARM64
      RAM_SIZE: "16G"
      CPU_CORES: "8"
      DISK_SIZE: "100G"
      USERNAME: "Developer"
      PASSWORD: "ChangeMe1"
    volumes:
      - /media/usbcssd/windows-vm/dockur-arm:/storage
      - ./windows-dev/dockur-oem:/oem:ro
      # Note: Source code is cloned via git, not mounted via SMB
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8007:8006"    # Web VNC (different port to avoid conflict)
      - "33390:3389"   # RDP
      - "2223:22"      # SSH
    stop_grace_period: 2m

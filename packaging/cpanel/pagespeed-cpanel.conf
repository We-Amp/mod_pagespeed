# EasyApache 4 LoadModule fragment for mod_pagespeed 1.1.
#
# Auto-discovered by WHM's EA4 Customize → Apache Modules UI because this file
# lives in conf.modules.d. The full module configuration is at
#   /etc/apache2/conf.d/pagespeed.conf
# Edit that file (not this one) to enable filters, set cache paths, etc.

# Fail-safe guard: <IfFile> skips its body if the .so is absent, so
# a missing module file degrades to plain Apache (site unoptimized) instead of
# httpd refusing to start. This protects ONLY the absent-file case. A present-
# but-ABI-mismatched .so is a different failure mode, handled by the spec's
# `Requires: ea-apache24-mmn = %{_httpd_mmn}` exact pin (a blocked yum update is
# strictly safer than loading an incompatible .so into httpd). <IfFile> needs
# Apache >= 2.4.34; EA4 ships 2.4.67. Absolute installed paths only, to avoid
# ServerRoot-relative path-resolution surprises.

<IfFile "/etc/apache2/modules/mod_version.so">
  <IfModule !mod_version.c>
    LoadModule version_module modules/mod_version.so
  </IfModule>
</IfFile>

<IfFile "/etc/apache2/modules/mod_pagespeed.so">
  LoadModule pagespeed_module modules/mod_pagespeed.so
</IfFile>

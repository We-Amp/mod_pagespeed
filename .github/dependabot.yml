version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/test/package-test"
    schedule:
      interval: "weekly"
    ignore:
      # Base images move to a new major release on purpose, never by a bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ubuntu tags are year.month, so an interim release looks like a minor bump.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-minor"]

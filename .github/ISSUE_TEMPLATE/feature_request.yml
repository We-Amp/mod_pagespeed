name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Alternatives you considered are welcome too.
  - type: input
    id: environment
    attributes:
      label: Your setup
      description: Web server, platform and version you would use this with.

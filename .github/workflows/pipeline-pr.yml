            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # Anti-drift gate for the HTML lexer/parser: the committed goldens
      # manifest must byte-match a fresh regeneration against the just-built
      # html_parse_probe. Any lexer/parser behavior change that does not carry
      # its golden diff in the same PR goes red here.
      - name: Goldens freshness gate (manifest must match probe behavior)
        run: |
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=HOST_CPUS*.75"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel build ${BAZEL_CONFIG} --disk_cache=/cache/disk \
                //pagespeed/kernel/html:html_parse_probe
              python3 tools/html-parse-corpus/gen_goldens.py --check \
                --probe bazel-bin/pagespeed/kernel/html/html_parse_probe
            '


  fuzz-smoke:
    name: Fuzz smoke (deterministic replay plus 60s libFuzzer)
    needs: [changes, vendor]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && needs.changes.outputs.fuzz == 'true' }}
    timeout-minutes: 90
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('WORKSPACE', 'MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # The sanitizer binaries are built, and run, inside the dev image: the
      # sanitizer runtimes and the libFuzzer runtime live there. bazel-bin
      # points into the container-internal output base, so each build copies
      # its binaries onto the mounted workspace in the same container.
      - name: Build the replay binaries
        run: |
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=HOST_CPUS*.75"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                //third_party/css_parser:parser_fuzz \
                //third_party/css_parser:parser_fuzz_corpus_test \
                //pagespeed/kernel/html:html_fuzz \
                //pagespeed/kernel/packs:pack_loader_fuzz \
                //pagespeed/kernel/packs:rule_pack_filter_fuzz \
                //pagespeed/kernel/js:js_minify_fuzz
              B=/workspace/.fuzz-bin
              mkdir -p "$B"
              cp -L bazel-bin/third_party/css_parser/parser_fuzz "$B/parser_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/html/html_fuzz "$B/html_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/packs/pack_loader_fuzz "$B/pack_loader_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/packs/rule_pack_filter_fuzz "$B/rule_pack_filter_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/js/js_minify_fuzz "$B/js_fuzz_replay"
              # The deterministic corpus test: the ASan regression floor.
              bazel --output_user_root=/tmp/bazel-out test ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --test_output=errors \
                //third_party/css_parser:parser_fuzz_corpus_test
            '

      # Deterministic floors: the checked-in seeds through the ASan replay
      # binaries. The JS smoke is deterministic only (no fuzz burst): the
      # known operator-glomming classes trip within seconds on garbage, so a
      # burst on a pull request lane would only generate flakes.
      - name: Seed and corpus replays
        run: |
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=HOST_CPUS*.75"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              B=/workspace/.fuzz-bin
              T=/tmp/fuzz-scratch
              mkdir -p "$T"
              export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
              export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
              "$B/html_fuzz_replay" tools/html-parse-corpus/seeds/*
              "$B/pack_loader_fuzz_replay" tools/pack-loader-corpus/seeds/* \
                test/pagespeed/kernel/packs/testdata/edge-seo/pack.example.json
              "$B/rule_pack_filter_fuzz_replay" tools/rule-pack-filter-corpus/seeds/*
              python3 tools/js-minify-corpus/generate_synthetic.py \
                --seed 20260721 --dest "$T/js-synthetic" --shapes 128 --execs 128
              "$B/js_fuzz_replay" --dump_corpus="$T/js-seed"
              "$B/js_fuzz_replay" \
                "$T"/js-seed/seed-* \
                tools/js-minify-corpus/findings/repros/*.js \
                tools/js-minify-corpus/findings/repros/*.mjs \
                "$T"/js-synthetic/*.js "$T"/js-synthetic/*.mjs \
                test/pagespeed/kernel/js/testdata/third_party/*.original \
                test/pagespeed/kernel/js/testdata/third_party/es2020.js
              # The classifier alone decides what a nightly finding reports;
              # fixture-test its predicates and bucket logic here.
              command -v node >/dev/null 2>&1 || {
                echo "::error::node not on PATH -- the classifier self-test needs it."
                exit 1
              }
              bash tools/ci/classify-js-fuzz-artifacts.sh --self-test
            '

      - name: 60s libFuzzer smoke runs (CSS and HTML)
        run: |
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=HOST_CPUS*.75"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              B=/workspace/.fuzz-bin
              T=/tmp/fuzz-scratch
              mkdir -p "$T/css-corpus" "$T/css-crashes" "$T/html-corpus" "$T/html-crashes" "$T/nightly-empty"
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --copt=-DCSS_PARSER_LIBFUZZER --copt=-fsanitize=fuzzer-no-link \
                --linkopt=-fsanitize=fuzzer \
                //third_party/css_parser:parser_fuzz
              cp -Lf bazel-bin/third_party/css_parser/parser_fuzz "$B/parser_fuzz_lf"
              # Separate invocation: the HTML harness has its own define, and
              # mixing defines would leave one binary in replay mode.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --copt=-DHTML_PARSE_LIBFUZZER --copt=-fsanitize=fuzzer-no-link \
                --linkopt=-fsanitize=fuzzer \
                //pagespeed/kernel/html:html_fuzz
              cp -Lf bazel-bin/pagespeed/kernel/html/html_fuzz "$B/html_fuzz_lf"
              export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
              export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
              "$B/parser_fuzz_replay" --dump_corpus="$T/css-seed"
              cp -n "$T"/css-seed/seed-* "$T/css-corpus"/
              "$B/parser_fuzz_lf" "$T/css-corpus" "$T/nightly-empty" \
                -max_total_time=60 -max_len=4096 -rss_limit_mb=4096 \
                -artifact_prefix="$T/css-crashes/" -print_final_stats=1
              cp -n tools/html-parse-corpus/seeds/* "$T/html-corpus"/
              "$B/html_fuzz_lf" "$T/html-corpus" "$T/nightly-empty" \
                -max_total_time=60 -max_len=4096 -rss_limit_mb=4096 \
                -artifact_prefix="$T/html-crashes/" -print_final_stats=1
              # Crash reproducers go to the mounted workspace for the upload.
              mkdir -p /workspace/.fuzz-evidence
              cp -r "$T/css-crashes" "$T/html-crashes" /workspace/.fuzz-evidence/ 2>/dev/null || true
            '

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload crash evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-smoke-evidence
          path: .fuzz-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3


  windows-build:
    name: Windows Build
    needs: vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hosted runners get the pinned toolchain installed; a fleet runner
      # provides it through its own environment (CI_WIN_TOOLS_DIR,
      # CI_WIN_LLVM_DIR, CI_WIN_PYTHON_DIR; docs/ci/runner-environment.md).
      - name: Provision the toolchain (hosted runner)
        if: runner.environment == 'github-hosted'
        run: |
          $ErrorActionPreference = 'Stop'
          # NASM is pinned to 2.16.03: the AV1 codec dependency rejects 3.x.
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::nasm install failed"; exit 1 }
          (Join-Path $env:ProgramFiles 'NASM') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # clang-cl comes from LLVM 19.
          $major = 0
          $cc = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($cc) { $v = (& clang-cl --version 2>&1 | Select-Object -First 1); if ($v -match 'version (\d+)') { $major = [int]$Matches[1] } }
          if ($major -ne 19) {
            choco install llvm --version=19.1.7 --allow-downgrade -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::llvm install failed"; exit 1 }
          }
          (Join-Path $env:ProgramFiles 'LLVM\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tool locations come from PATH, or from the runner's environment when
      # it provides one. Nothing here names a drive, a user profile or an
      # installation directory, and no tool location is printed.
      - name: Resolve the runner environment
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-JobEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          function Add-ToolDir([string]$Dir) {
            if ($Dir -and (Test-Path -LiteralPath $Dir)) {
              $Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = ($Dir + ';' + $env:PATH)
              return $true
            }
            return $false
          }
          # CI_WIN_TOOLS_DIR is a semicolon-separated list of directories.
          $toolDirs = @()
          if ($env:CI_WIN_TOOLS_DIR) {
            $toolDirs = @($env:CI_WIN_TOOLS_DIR -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
          }
          [array]::Reverse($toolDirs)
          foreach ($d in $toolDirs) { [void](Add-ToolDir $d) }
          [array]::Reverse($toolDirs)
          if ($toolDirs.Count -gt 0) { Write-Host "using the runner's tool directories" }
          # LLVM 19 (clang-cl) and Python 3.12 (ahead of Git for Windows'
          # python stub) when the runner names them.
          if ($env:CI_WIN_LLVM_DIR) { [void](Add-ToolDir (Join-Path $env:CI_WIN_LLVM_DIR 'bin')) }
          if ($env:CI_WIN_PYTHON_DIR) { [void](Add-ToolDir $env:CI_WIN_PYTHON_DIR) }
          $bazel = @('bazelisk', 'bazel') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $bazel) {
            Write-Host "::error::neither bazelisk nor bazel is on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_CMD' $bazel
          # clang-cl: Bazel finds the LLVM installation through BAZEL_LLVM.
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            Write-Host "::error::clang-cl (LLVM 19) is not on PATH; see docs/ci/runner-environment.md (CI_WIN_LLVM_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_LLVM' (Split-Path -Parent (Split-Path -Parent $clangCl.Source))
          # The AV1 encoder needs NASM 2.16.03 (nasm 3.x dropped the "-Ox"
          # line from `nasm -hf` that the codec build greps for). Fail early
          # and legibly instead of deep inside a configure log.
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Write-Host "::error::nasm 2.16.03 is not on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          if (-not (& nasm -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            Write-Host "::error::the nasm on PATH is not usable by the AV1 codec build (no '-Ox' in -hf output; 3.x is not supported). Provide 2.16.03."
            exit 1
          }
          # Bazel's shell: the runner's, else MSYS2 bash, else Git bash.
          $bashCandidates = @()
          if ($env:BAZEL_SH) { $bashCandidates += $env:BAZEL_SH }
          foreach ($d in $toolDirs) { $bashCandidates += (Join-Path $d 'bash.exe') }
          $bashCandidates += (Join-Path $env:SystemDrive 'msys64\usr\bin\bash.exe')
          $bashCandidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
          $bash = $bashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) {
            Write-Host "::error::no bash.exe found for Bazel (MSYS2 or Git for Windows); see docs/ci/runner-environment.md"
            exit 1
          }
          Set-JobEnv 'BAZEL_SH' $bash
          # A short output root keeps paths under the Windows length limit.
          Set-JobEnv 'WIN_BAZEL_OUTPUT_ROOT' ($(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/')
          # Bazel disk cache: the runner's directory when it names one (with
          # its size cap), else a directory under the job's temporary
          # directory that is lost with the job.
          Set-JobEnv 'WIN_CACHE_DIR' $(if ($env:CI_WIN_CACHE_DIR) { $env:CI_WIN_CACHE_DIR } else { Join-Path $env:RUNNER_TEMP 'bazel-disk' })
          if ($env:CI_WIN_CACHE_MAX_SIZE) { Set-JobEnv 'WIN_CACHE_MAX_SIZE' $env:CI_WIN_CACHE_MAX_SIZE }
          Set-JobEnv 'WIN_VENDOR_DL_DIR' (Join-Path $env:RUNNER_TEMP 'vendor-download')
          Write-Host "build tool: $bazel"

      # The Windows build does not use actions/cache for vendor/: a vendor tree
      # saved on Linux does not restore here. On the hub channel the runner
      # takes the tarball the vendor job published (a local directory shared
      # with the Linux jobs of the same machine, or the hub); in every other
      # case Bazel fetches the dependencies itself.
      - name: Fetch the vendored tree (hub channel)
        env:
          VENDOR_CHANNEL: ${{ needs.vendor.outputs.channel }}
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VENDOR_CHANNEL -ne 'hub') {
            Write-Host "vendor channel is '$($env:VENDOR_CHANNEL)': Bazel fetches dependencies directly"
            exit 0
          }
          $name = "mod_pagespeed-$($env:VENDOR_SHORT_SHA).tar.zst"
          $tarball = $null
          foreach ($dir in @($env:CI_WIN_VENDOR_DIR, $env:WIN_VENDOR_DL_DIR)) {
            if ($dir) {
              $candidate = Join-Path $dir $name
              if (Test-Path -LiteralPath $candidate) { $tarball = $candidate; break }
            }
          }
          if (-not $tarball -and $env:CI_HUB_SSH -and $env:CI_HUB_VENDOR_DIR) {
            New-Item -ItemType Directory -Force -Path $env:WIN_VENDOR_DL_DIR | Out-Null
            $final = Join-Path $env:WIN_VENDOR_DL_DIR $name
            $tmp = "$final.$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).tmp"
            Write-Host "fetching $name from the CI hub"
            scp -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o LogLevel=ERROR "$($env:CI_HUB_SSH):$($env:CI_HUB_VENDOR_DIR)/$name" $tmp
            if ($LASTEXITCODE -ne 0) {
              # A failed scp can leave a partial file that a later job would
              # find and feed to zstd; never leave it behind.
              Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
              Write-Host "::warning::[vendor-tarball-unavailable] the vendor tarball could not be fetched from the CI hub; it may have aged out of the hub's retention window. Re-run the full workflow, not only the failed jobs, to regenerate it."
            } else {
              # Publish under the final name only once complete, and never over
              # a tarball another job placed there first.
              try { Move-Item -LiteralPath $tmp -Destination $final -ErrorAction Stop }
              catch { if (Test-Path -LiteralPath $final) { Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue } else { throw } }
              $tarball = $final
            }
          }
          if (-not $tarball) {
            Write-Host "::notice::no vendor tarball reachable from this runner: Bazel fetches dependencies directly (docs/ci/runner-environment.md)"
            exit 0
          }
          Write-Host "extracting $(Split-Path -Leaf $tarball)"
          # Decompress with all cores, then extract with the Windows tar (the
          # MSYS2 GNU tar reads a drive letter as a remote host). The tarball
          # stays: a directory shared with the Linux jobs is pruned by the
          # Linux vendor job.
          & zstd -d -f -T0 $tarball -o "$tarball.tar"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::zstd decompression failed (exit $LASTEXITCODE)"; exit 1 }
          & "$($env:SystemRoot)\System32\tar.exe" xf "$tarball.tar" -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tar extraction failed (exit $LASTEXITCODE)"; exit 1 }
          Remove-Item -LiteralPath "$tarball.tar" -ErrorAction SilentlyContinue
          $stamped = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GIT_COMMIT') -Raw).Trim()
          if ($stamped -ne $env:GITHUB_SHA) {
            Write-Host "::error::[vendor-tarball-unavailable] stale GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      # Age-guarded prune of the vendor download directory (a 2 hour window on
      # top of the host's own housekeeping), so an interrupted fetch or
      # extract cannot leave a multi-gigabyte file behind. A directory shared
      # with the Linux jobs (CI_WIN_VENDOR_DIR) is left to the Linux vendor
      # job. The hermetic self-test runs first; if it fails, the prune is
      # skipped. Housekeeping: continue-on-error, so it never blocks a merge.
      - name: Prune the vendor download directory
        if: needs.vendor.outputs.channel == 'hub'
        continue-on-error: true
        env:
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::prune-win-vendor self-test failed (exit $LASTEXITCODE); not pruning"; exit 1 }
          & "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor.ps1" `
            -VendorDir $env:WIN_VENDOR_DL_DIR -ShortSha $env:VENDOR_SHORT_SHA

      - name: Set up MSVC environment
        run: |
          $ErrorActionPreference = 'Continue'
          # Source vcvars64 and export INCLUDE/LIB/PATH for the later steps.
          $vsDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsDir = & $vswhere -products * -latest -property installationPath 2>$null
          }
          if (-not $vsDir -or -not (Test-Path -LiteralPath "$vsDir\VC\Auxiliary\Build\vcvars64.bat")) {
            # Fallback: probe the usual installation directories.
            $vsDir = @(
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\Community')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vsDir) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = "$vsDir\VC\Auxiliary\Build\vcvars64.bat"
          # Full path through ComSpec: an MSYS2 cmd on PATH would shadow
          # System32\cmd.exe.
          & "$env:ComSpec" /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|PATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # MSYS2 coreutils and Ninja go on PATH for the genrule cmake builds.
          $extra = Join-Path $env:SystemDrive 'msys64\usr\bin'

        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          # Cap the cache before the job uses it (7 days, 12G; the sizing is in
          # tools/ci/prune-bazel-disk-cache.sh). It never fails the job.
          bash "${GITHUB_WORKSPACE}/tools/ci/prune-bazel-disk-cache.sh" "${CACHE_ROOT}/disk" 7d 12G || true
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # Guards the tokenizer-based JS minifier: builds js_minify_probe and
      # runs tools/js-minify-corpus/run.sh --no-fetch --gate (the synthetic
      # corpus only, generated deterministically at run time: no network, no
      # third-party code). The gate is exit-code based and fires only on
      # correctness oracles; coverage stats are reported but never fail it.
      - name: Build the probe and run the synthetic corpus oracles
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          EXTRA_DOCKER=()
          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # BAZEL_BUILD_OPTIONS is the run.sh hook for extra probe-build flags.
              export BAZEL_BUILD_OPTIONS="${BAZEL_CONFIG} --disk_cache=/cache/disk"
              tools/js-minify-corpus/run.sh --no-fetch --gate
            '

      # The committed goldens manifest must byte-match a fresh regeneration
      # against the probe built by the step above: a minifier behavior change
      # that does not carry its golden diff in the same PR goes red here.
      - name: Goldens freshness gate (manifest must match probe behavior)
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          EXTRA_DOCKER=()
          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # Cache-hit no-op when the oracle step already built the probe.
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel build ${BAZEL_CONFIG} --disk_cache=/cache/disk \
                //tools/js-minify-corpus:js_minify_probe
              python3 tools/js-minify-corpus/gen_goldens.py --check
            '

      - name: Surface oracle summary
        if: always()
        run: |
          SUMMARY="${GITHUB_WORKSPACE}/tools/js-minify-corpus/.corpus/reports/latest/SUMMARY.md"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

      # Debugging aid for a failed oracle run only, kept briefly. A refused
      # upload (artifact storage full) must not turn a passing gate red.
      - name: Upload corpus report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: js-minify-corpus-${{ github.sha }}
          path: tools/js-minify-corpus/.corpus/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3



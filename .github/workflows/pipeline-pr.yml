#
# pipeline-pr.yml: the PR tier, as a reusable workflow. Callers (ci.yml,
# ci-dev.yml) hold the triggers and the concurrency block; this file holds
# the jobs. See docs/ci/pipelines.md.
#
# Runner routing, identical in every build runner job and enforced by
# tools/ci/check-workflow-shape.sh:
#   * a pull request from a fork, or from Dependabot, runs on a
#     GitHub-hosted runner;
#   * so does every run while the repository variable FLEET_ENABLED is
#     'false' (the kill switch; unset means on);
#   * everything else runs on a runner class label;
#   * the choice is made from the event payload and the variable here, never
#     from inputs.
# Jobs with no hosted twin (the IIS system tests) are skipped while the switch
# is off. No job here holds a secret or a write token.
#
# Every build runner job also works on the hosted side in a degraded mode: no
# hub, no remote cache, no host paths. Anything host-specific is read from the
# runner environment (docs/ci/runner-environment.md) and used only when set;
# a job runs, slower, when none of it is set.
#
# The vendored tree and the build bundles pass between jobs through the hub
# when the runner environment provides one, and through actions/cache (the
# vendored tree, keyed on the dependency manifest) and actions/upload-artifact
# (the bundles) otherwise.
#
# The IIS system tests run on the fleet-iis class and are skipped, not failed,
# for fork and Dependabot pull requests (no hosted twin). The full, nightly
# and release tiers follow in later steps.
#
# The parity guard of the former pipeline is dropped on purpose: the corpus
# it compared against is not part of this repository.

# Deferred to the nightly tier: the scheduled grype database pin-age
# enforcement and the image scan mode of the dependency scan.
name: pipeline-pr

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Path filters for the guards that only matter when their inputs change: a
  # hosted job diffs the pull request's files and publishes one boolean per
  # filter. Outside a pull request every filter is true, so a push to the
  # default branch and a manual run always run them.
  #
  # The job also decides the fleet scope (docs/ci/pipelines.md, "CI_SCOPE"):
  # `fleet` gates `vendor`, and with it every build runner job. A push whose
  # commit the merge queue already proved may skip them; merge_group and
  # workflow_dispatch always run them. checks: read lets the decision read the
  # commit's check suites; the calling job must grant it too.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      fleet: ${{ steps.scope.outputs.fleet }}
      heavy: ${{ steps.scope.outputs.heavy }}
      signing_key: ${{ steps.diff.outputs.signing_key }}
      serf: ${{ steps.diff.outputs.serf }}
      cve: ${{ steps.diff.outputs.cve }}
      upgrade: ${{ steps.diff.outputs.upgrade }}
      fuzz: ${{ steps.diff.outputs.fuzz }}
      iis: ${{ steps.diff.outputs.iis }}
      sidecar: ${{ steps.diff.outputs.sidecar }}
    steps:
      # fetch-depth: 0 so the diff can reach the pull request's base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push reaches this pipeline from the caller's own workflow, and the
      # merge queue pushes a temporary branch: only the default branch (and
      # ci-dev, for the pipeline development lane) may run it.
      - name: Refuse pushes that are not on the default branch
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "${REF}" in "refs/heads/${DEFAULT_BRANCH}"|refs/heads/ci-dev) ;; *) echo "::error::push on ${REF} is not allowed in this pipeline"; exit 1;; esac

      - name: Refuse dispatches made with a workflow token
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ "${ACTOR}" != "github-actions[bot]" ] || { echo "::error::dispatches made with a workflow token are not allowed"; exit 1; }

      # A merge group is built on the fleet, so a fork or Dependabot pull
      # request in it is refused here, on a hosted runner, before any fleet job
      # starts: `vendor` needs this job, and every fleet job needs `vendor`.
      - name: Refuse fork and Dependabot PRs in the merge queue
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The guard is read from the default branch, never from the queued tree.
        run: |
          set -euo pipefail
          git rev-parse -q --verify "origin/${DEFAULT_BRANCH}^{commit}" >/dev/null ||
            git fetch --no-tags --depth=1 origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git show "origin/${DEFAULT_BRANCH}:tools/ci/queue_fork_guard.sh" | bash

      - name: Decide the fleet scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE: ${{ vars.CI_SCOPE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          FORK_OR_BOT: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
          PR_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:pr-full') }}
        # merge_group and workflow_dispatch always run the full PR tier; the
        # decision script is read from the default branch, never the tree.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/fleet-scope.txt"
          case "${GITHUB_EVENT_NAME}" in
            merge_group|workflow_dispatch) printf 'fleet=true\nheavy=true\n' > "${out}" ;;
            *)
              if git show "origin/${DEFAULT_BRANCH}:tools/ci/pr_tier_scope.sh" > "${RUNNER_TEMP}/pr_tier_scope.sh" 2>/dev/null &&
                bash "${RUNNER_TEMP}/pr_tier_scope.sh" > "${out}" &&
                [ "$(grep -cxE '(fleet|heavy)=(true|false)' "${out}")" = 2 ] && [ "$(wc -l < "${out}")" -eq 2 ]; then
                :
              else
                echo "::warning::fleet scope undecided; running the full PR tier"
                printf 'fleet=true\nheavy=true\n' > "${out}"
              fi ;;
          esac
          cat "${out}" >> "$GITHUB_OUTPUT"

      - name: Diff against the base commit
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          signing_key=true
          serf=true
          cve=true
          upgrade=true
          fuzz=true
          iis=true
          sidecar=true
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            signing_key=false
            serf=false
            cve=false
            upgrade=false
            fuzz=false
            iis=false
            sidecar=false
            changed="${RUNNER_TEMP}/changed-files.txt"
            git diff --name-only "${BASE}...HEAD" > "${changed}"
            wf='\.github/workflows/pipeline-pr\.yml'
            if grep -qE "^(install/common/apt\.include|install/common/rpm\.include|tools/assert-repo-signing-key\.sh|${wf})\$" "${changed}"; then
              signing_key=true
            fi
            if grep -qE "(\.lds\$)|^(MODULE\.bazel|bazel/repositories\.bzl|bazel/extensions\.bzl|tools/assert-serf-removed\.sh|third_party/|${wf})" "${changed}"; then
              serf=true
            fi
            if grep -qE "^(bazel/repositories\.bzl|MODULE\.bazel|tools/dependency/|test/tools/dependency/|tools/generate-sbom\.py|tools/bzlmod_versions\.py|${wf})" "${changed}"; then
              cve=true
            fi
            if grep -qE "^(install/|${wf})" "${changed}"; then
              upgrade=true
            fi
            if grep -qE "^(third_party/css_parser/|pagespeed/kernel/html/|tools/html-parse-corpus/|pagespeed/kernel/packs/|tools/pack-loader-corpus/|tools/rule-pack-filter-corpus/|pagespeed/kernel/js/|tools/js-minify-corpus/|tools/ci/classify-js-fuzz-artifacts\.sh|${wf})" "${changed}"; then
              fuzz=true
            fi
            # Anything the IIS module compiles or the IIS system tests run:
            # the module and its shared engine sources, the build definitions,
            # the IIS install and test trees, the CI scripts and the workflows.
            if grep -qE "^(pagespeed/(iis|windows|kernel|system|automatic|opt)/|net/|third_party/|bazel/|install/iis/|test/system/|test/pagespeed/iis/|tools/ci/[^/]*\.ps1\$|tools/ci/(fetch-build-artifacts|invalidate-stale-artifacts)\.|MODULE\.bazel|pagespeed\.bazelrc|\.bazelrc|extensions_build_config\.bzl|BUILD(\.bazel)?\$|\.github/actions/|\.github/workflows/ci\.yml|${wf})" "${changed}"; then
              iis=true
            fi
            # The ASP.NET Core sidecar, the focal recipe of its native pair and
            # the gates that check the pair.
            if grep -qE "^(aspnetcore/|install/nginx/build_module_in_container\.sh|install/nginx/pagespeed-nginx-launch\.c|install/nginx/assert_symbol_hygiene\.sh|tools/ci/assert_module_symbols\.sh|test/package-test/check-sidecar-pair\.sh|tools/ci/release_sidecar\.sh|${wf})" "${changed}"; then
              sidecar=true
            fi
          fi
          {
            echo "signing_key=${signing_key}"
            echo "serf=${serf}"
            echo "cve=${cve}"
            echo "upgrade=${upgrade}"
            echo "fuzz=${fuzz}"
            echo "iis=${iis}"
            echo "sidecar=${sidecar}"
          } >> "$GITHUB_OUTPUT"
          echo "path filters: signing_key=${signing_key} serf=${serf} cve=${cve} upgrade=${upgrade} fuzz=${fuzz} iis=${iis} sidecar=${sidecar}"

  # One checkout serves every group. Each step runs even when an earlier one
  # failed (`!cancelled()`), so one red run lists every broken guard.
  guards:
    name: Guards (security gates, console drift, placement, pytest exit, bazelrc, git_repository, PR policy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # pull-requests: read is for the PR policy group. The calling job must
    # grant it too: a called workflow cannot raise the caller's token.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      # generate-sbom.py needs Python 3.11 or newer.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every *_test.cc must live under test/: the build and test globs cover
      # //test/... only, so a test next to its source is linted but never
      # compiled or run.
      - name: Every *_test.cc lives under test/
        if: ${{ !cancelled() }}
        run: bash tools/ci/check_tests_in_test_tree.sh

      # No test file may call pytest.main() bare in its __main__ block (a
      # py_test running such a main reports PASS on a red suite), and every
      # test_*.py must have a __main__ block at all.
      - name: No test main swallows the pytest exit status
        if: ${{ !cancelled() }}
        run: bash tools/ci/check_pytest_exit_status.sh

      # The system-test framework's own unit tests (client, assertions,
      # stats helpers, the lane-fixture name pin) run against no server, and
      # nothing else in CI runs them: the Bazel patterns cover
      # //test/pagespeed/ and //test/net/ only, and the lane runners run
      # their lane suites. A framework regression must fail the pull request
      # that causes it. requirements.txt pins the pytest the lanes use.
      - name: System-test framework unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet -r test/system/requirements.txt
          python3 -m pytest test/system/pagespeed_test_framework -q

      # A C++-only (or C-only) compiler flag must never be passed through the
      # language-agnostic --copt. The self-test runs the guard's bypass matrix
      # first: a guard that silently stops detecting a spelling is worse than
      # none.
      - name: Bazelrc language-flag guard - self-test
        if: ${{ !cancelled() }}
        run: python3 tools/assert-bazelrc-lang-flags.py --self-test
      - name: Single-language flags use --cxxopt / --conlyopt, not --copt
        if: ${{ !cancelled() }}
        run: python3 tools/assert-bazelrc-lang-flags.py

      # Every git_repository dependency must carry a vendored override: a
      # git_repository is cloned at build time, and the release containers
      # ship without git, so an un-vendored one builds everywhere except the
      # release.
      - name: git_repository vendor guard - self-test
        if: ${{ !cancelled() }}
        run: python3 tools/assert-git-repository-vendored.py --self-test
      - name: Every git_repository carries a vendored override
        if: ${{ !cancelled() }}
        run: python3 tools/assert-git-repository-vendored.py

      # Self-tests of the policy and release helpers, so a gate whose own
      # logic has rotted cannot report success on every pull request.
      - name: Policy guards - self-tests
        if: ${{ !cancelled() }}
        run: bash tools/ci/check_release_note.sh --self-test

      - name: Release helpers - self-tests (SHA256SUMS, release body)
        if: ${{ !cancelled() }}
        run: |
          bash tools/ci/release_sha256sums.sh --self-test
          bash tools/ci/release_highlights.sh --self-test

      - name: Optimizer pin pair guard - self-test
        if: ${{ !cancelled() }}
        run: python3 tools/ci/check_optimizer_pin_pair.py --self-test

      - name: Changelog fragment tools - self-tests
        if: ${{ !cancelled() }}
        run: |
          # A branch that predates a tool takes it from master (docs/ci/pipelines.md;
          # canonical copy of this block: the changelog self-tests step).
          h=tools/ci/with-default-branch-tool.sh
          if [ ! -f "$h" ]; then
            git fetch --quiet --depth=1 origin master
            h="${RUNNER_TEMP}/with-default-branch-tool.sh"
            git show "FETCH_HEAD:tools/ci/with-default-branch-tool.sh" > "$h"
          fi
          assemble="$(bash "$h" --with CHANGELOG.md tools/changelog/assemble.py)"
          to_fragment="$(bash "$h" tools/changelog/to_fragment.py)"
          python3 -I "$assemble" --self-test
          python3 -I "$to_fragment" --self-test

      - name: Default-branch tool helper - self-test
        if: ${{ !cancelled() && hashFiles('tools/ci/with-default-branch-tool.sh') != '' }}
        run: bash tools/ci/with-default-branch-tool.sh --self-test

      # Fragment content (the release-note gate reads names only).
      - name: Changelog fragments are well formed
        if: ${{ !cancelled() }}
        run: |
          # A branch that predates a tool takes it from master (docs/ci/pipelines.md;
          # canonical copy of this block: the changelog self-tests step).
          h=tools/ci/with-default-branch-tool.sh
          if [ ! -f "$h" ]; then
            git fetch --quiet --depth=1 origin master
            h="${RUNNER_TEMP}/with-default-branch-tool.sh"
            git show "FETCH_HEAD:tools/ci/with-default-branch-tool.sh" > "$h"
          fi
          assemble="$(bash "$h" tools/changelog/assemble.py)"
          python3 -I "$assemble" --lint --repo-root "$PWD"

      # A selected image variant names every request header the selection
      # read in Vary. The module mirrors the optimizer's list; this compares
      # it with the list in the pinned optimizer's source.
      - name: Image-selection Vary matches the optimizer - self-test
        if: ${{ !cancelled() }}
        run: python3 tools/ci/check_image_selection_vary.py --self-test
      - name: Image-selection Vary matches the optimizer
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          COMMIT=$(python3 -c "import json;print(json.load(open('install/debian/optimizer-pin.json'))['optimizer_commit'])")
          BASE="https://raw.githubusercontent.com/We-Amp/pagespeed-optimizer/${COMMIT}"
          curl -fsSL --retry 5 --retry-all-errors "${BASE}/lib/classify/capability_mask.h" -o "${RUNNER_TEMP}/capability_mask.h"
          curl -fsSL --retry 5 --retry-all-errors "${BASE}/lib/cache/vary_emission.cc" -o "${RUNNER_TEMP}/vary_emission.cc"
          python3 tools/ci/check_image_selection_vary.py pagespeed/system/daemon_abi.h \
            "${RUNNER_TEMP}/capability_mask.h" "${RUNNER_TEMP}/vary_emission.cc"

      - name: Legacy-docs guard - self-test
        if: ${{ !cancelled() }}
        run: sh tools/ci/check_legacy_docs.sh --self-test

      - name: Module symbol check - self-test
        if: ${{ !cancelled() }}
        run: bash tools/ci/assert_module_symbols.sh --self-test

      # Signs a rule pack with a throwaway key, verifies it, tampers one byte
      # and expects refusal. Needs OpenSSL 3.
      - name: Rule pack signing tool - self-test
        if: ${{ !cancelled() }}
        run: bash tools/rule-packs/sign-pack.sh --self-test

      # The pull request's changed files, commits and live description come
      # from the API rather than git, so the gates work on a depth-1
      # checkout. The description is read live, not from the event payload:
      # the payload is frozen at event time, so after a failed run the remedy
      # "edit the description and re-run this job" would otherwise re-read the
      # same stale text. Fails closed: any API error fails the step instead of
      # falling back to "nothing changed".
      - name: Collect pull request inputs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          gh api --paginate "${api}/files" > "${RUNNER_TEMP}/pr-files.json"
          jq -r '.[] | .filename, (.previous_filename // empty)' \
            "${RUNNER_TEMP}/pr-files.json" > "${RUNNER_TEMP}/pr-files.txt"
          jq -r '.[] | select(.status=="added") | .filename' \
            "${RUNNER_TEMP}/pr-files.json" > "${RUNNER_TEMP}/pr-added.txt"
          gh api --paginate "${api}/commits" \
            --jq '.[].commit.message' > "${RUNNER_TEMP}/pr-haystack.txt"
          gh api "${api}" --jq '.body // ""' >> "${RUNNER_TEMP}/pr-haystack.txt"
          echo "collected $(wc -l < "${RUNNER_TEMP}/pr-files.txt" | tr -d ' ') changed file name(s)"

      # A user-facing change must add a changelog.d/ fragment (or touch
      # RELEASE_NOTES.md or CHANGELOG.md), or say in one line why it is
      # invisible (`Release-Note: none - <why>` in a commit message or the
      # description). No pipe in this run: a pipe would swallow the gate's
      # exit code.
      - name: User-facing change carries a release note
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          # A branch that predates a tool takes it from master (docs/ci/pipelines.md;
          # canonical copy of this block: the changelog self-tests step).
          h=tools/ci/with-default-branch-tool.sh
          if [ ! -f "$h" ]; then
            git fetch --quiet --depth=1 origin master
            h="${RUNNER_TEMP}/with-default-branch-tool.sh"
            git show "FETCH_HEAD:tools/ci/with-default-branch-tool.sh" > "$h"
          fi
          # An older copy exists but rejects --added-from, so always use master's.
          gate="$(bash "$h" --prefer-default tools/ci/check_release_note.sh)"
          bash "$gate" \
            --files-from "${RUNNER_TEMP}/pr-files.txt" \
            --haystack-from "${RUNNER_TEMP}/pr-haystack.txt" \
            --added-from "${RUNNER_TEMP}/pr-added.txt"

      # html/ is the legacy documentation archive, published unchanged.
      - name: Legacy documentation archive is untouched
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          sh tools/ci/check_legacy_docs.sh \
            --files-from "${RUNNER_TEMP}/pr-files.txt" \
            --haystack-from "${RUNNER_TEMP}/pr-haystack.txt"

      # The console's synced product-facts copy is byte-compared against the
      # canonical file in the optimizer repository. Materialize that file
      # explicitly (anonymous HTTPS, the repository is public) and point the
      # drift check at it, so the check never falls back to its
      # unreachable-canonical path, which is a hard error in CI.
      - name: Materialize canonical product facts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/product-facts"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/We-Amp/pagespeed-optimizer.git "${RUNNER_TEMP}/product-facts"
          git -C "${RUNNER_TEMP}/product-facts" sparse-checkout set --no-cone /shared/product-facts.mjs
          test -f "${RUNNER_TEMP}/product-facts/shared/product-facts.mjs"
          echo "MODPAGESPEED2_DIR=${RUNNER_TEMP}/product-facts" >> "$GITHUB_ENV"

      # Pure-bash source-hash check (no node, no build): fails when the
      # committed admin_console.html is stale relative to its source.
      - name: Admin console bundle is in sync with its source
        if: ${{ !cancelled() }}
        run: bash pagespeed/system/console/check-no-drift.sh

      # Security gates: SBOM drift (the committed SPDX must match what
      # MODULE.bazel.lock, bazel/repositories.bzl and the bundled console
      # dependencies produce today), module version drift, notices drift, OpenVEX format, and a grype scan of the
      # committed SPDX SBOM, failing on medium and above. A not_affected
      # finding gets a documented sbom/*.vex.json entry.
      - name: SBOM drift - generate-sbom.py --verify
        if: ${{ !cancelled() }}
        run: python3 tools/generate-sbom.py --verify

      - name: SBOM scoping - generate-sbom.py --self-test
        if: ${{ !cancelled() }}
        run: python3 tools/generate-sbom.py --self-test

      # The BCR libraries' resolved versions (MODULE.bazel.lock) must equal
      # the root pins and overrides, the bazel/repositories.bzl mirror
      # constants and the committed SBOM.
      - name: Module version drift - check-module-versions.py
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check-module-versions.py --self-test
          python3 tools/check-module-versions.py

      # THIRD-PARTY-NOTICES ships in every package, so it must agree with the
      # SBOM in both directions.
      - name: Notices drift - check-third-party-notices.py
        if: ${{ !cancelled() }}
        run: python3 tools/sbom/check-third-party-notices.py

      - name: VEX file format sanity
        if: ${{ !cancelled() }}
        id: vex
        run: |
          set -euo pipefail
          python3 tools/ci/validate-vex.py --self-test
          python3 tools/ci/validate-vex.py sbom/
          shopt -s nullglob
          vex_files=(sbom/*.vex.json)
          if [ ${#vex_files[@]} -eq 0 ]; then
            echo "vex_path=" >> "$GITHUB_OUTPUT"
          else
            echo "vex_path=${vex_files[0]}" >> "$GITHUB_OUTPUT"
          fi

      # SHA-pinned; bumping it is a deliberate, reviewed change.
      - name: Install grype
        if: ${{ !cancelled() }}
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Vulnerability scan with VEX suppression (grype on the SPDX SBOM, fail on medium and above)
        if: ${{ !cancelled() }}
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          VEX_PATH: ${{ steps.vex.outputs.vex_path }}
        run: |
          # grype's own --vex does not support an sbom: source, so scan
          # without it and apply the OpenVEX not_affected statements with
          # tools/ci/apply-vex.py.
          "${GRYPE_CMD}" -o json --file grype-results.json \
            sbom:sbom/pagespeed-1.1.spdx.json
          vex_args=()
          if [ -n "${VEX_PATH}" ]; then
            vex_args=(--vex "${VEX_PATH}")
          fi
          python3 tools/ci/apply-vex.py --grype grype-results.json \
            "${vex_args[@]}" --fail-on medium

  # Ground-truth scan of every committed npm lockfile. tools/sbom/dep-scan.sh
  # runs in --fail-on medium mode over only that surface. The grype database
  # is pinned (tools/sbom/grype-db-pin.json) and imported with auto-update
  # off, so a newly published advisory cannot break an in-flight pull
  # request; bumping the pin is a reviewed change. The report-only scan
  # below uses the live database to surface fresh advisories promptly.
  blocking-dep-scan:
    name: Blocking Dep Scan (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYFT_VERSION: v1.44.0
      GRYPE_VERSION: v0.112.0
      # Isolated, job-local database cache so the pinned import cannot be
      # clobbered by a live-database auto-update.
      GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/.grype-db-pinned
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_DB_VALIDATE_AGE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A malformed VEX statement is silently ignored by grype, which would
      # let a broken not_affected claim look like an active suppression.
      - name: Validate VEX statements
        run: |
          python3 tools/ci/validate-vex.py --self-test
          python3 tools/ci/validate-vex.py sbom/

      - name: Test pinned-tool installer aborts on checksum mismatch
        run: bash tools/ci/test_install_pinned_tool.sh

      # dep-scan.sh hard-fails a blocking run on an unpinned syft or grype,
      # so this step is load-bearing.
      - name: Ensure pinned syft + grype
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          have() { command -v "$1" >/dev/null 2>&1 && "$1" version 2>/dev/null | awk '/^Version:/{print "v"$2}'; }
          [ "$(have syft)" = "$SYFT_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh syft "$SYFT_VERSION" "$RUNNER_TEMP/bin"
          [ "$(have grype)" = "$GRYPE_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh grype "$GRYPE_VERSION" "$RUNNER_TEMP/bin"
          syft version | awk '/^Version:/{print "syft "$2}'
          grype version | awk '/^Version:/{print "grype "$2}'

      - name: Provision pinned grype DB
        run: bash tools/sbom/provision-grype-db.sh

      - name: Blocking scan (npm, fail on medium and above)
        run: |
          set -uo pipefail
          # Capture the gate's exit but always publish the table to the
          # Summary tab; a non-zero rc then fails the job.
          rc=0
          bash tools/sbom/dep-scan.sh --fail-on medium --surfaces npm || rc=$?
          if [ -f sbom/scan/SUMMARY.md ]; then cat sbom/scan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"

  # Report-only live-database sweep of the same lockfiles: surfaces newly
  # disclosed advisories fast and never reddens the build (the blocking,
  # pinned-database gate is blocking-dep-scan above). This leg only reports;
  # filing the tracking issue belongs to the scheduled tier's hosted report
  # job, which holds the issue permission.
  dep-scan:
    name: Dependency Scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYFT_VERSION: v1.44.0
      GRYPE_VERSION: v0.112.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure pinned syft + grype
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          have() { command -v "$1" >/dev/null 2>&1 && "$1" version 2>/dev/null | awk '/^Version:/{print "v"$2}'; }
          [ "$(have syft)" = "$SYFT_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh syft "$SYFT_VERSION" "$RUNNER_TEMP/bin"
          [ "$(have grype)" = "$GRYPE_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh grype "$GRYPE_VERSION" "$RUNNER_TEMP/bin"
          syft version | awk '/^Version:/{print "syft "$2}'
          grype version | awk '/^Version:/{print "grype "$2}'

      - name: Run dependency scan (report-only)
        run: |
          set -uo pipefail
          bash tools/sbom/dep-scan.sh
          # Surface the severity table on the run's Summary tab.
          if [ -f sbom/scan/SUMMARY.md ]; then cat sbom/scan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      # A new report is produced on every run, so each is kept briefly. A
      # refused upload (artifact storage full) must not turn the scan red.
      - name: Upload SBOMs and grype reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dep-scan-${{ github.sha }}
          path: sbom/scan/
          if-no-files-found: warn
          retention-days: 3

  # Browser tests of the client scripts, in headless Chromium. Sparse
  # checkout: they need nothing else.
  browser-js-tests:
    name: Browser client-JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          sparse-checkout: |
            test/browser
            net/instaweb/rewriter/generated
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run browser client-JS tests
        run: bash test/browser/run_browser_tests.sh

  # The esbuild-compiled client scripts are checked in under
  # net/instaweb/rewriter/generated/. Rebuild them with the pinned toolchain
  # and fail when the checked-in copies (or .source-hash) differ. Sparse
  # checkout: data2c is built from its single source file, no Bazel.
  regen-js-diff:
    name: Regenerated client-JS diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          sparse-checkout: |
            tools/js
            tools/regenerate-rewriter-js.sh
            net/instaweb/js
            net/instaweb/rewriter/*.js
            net/instaweb/rewriter/generated
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/js/.nvmrc
      - name: Install the pinned esbuild
        run: npm ci --prefix tools/js --no-fund --no-audit
      - name: Build data2c
        run: c++ -std=c++17 -O2 -o "$RUNNER_TEMP/data2c" net/instaweb/js/data_to_c.cc
      - name: Regenerate the client JS assets
        run: DATA2C="$RUNNER_TEMP/data2c" bash tools/regenerate-rewriter-js.sh
      - name: Fail on drift
        run: git diff --exit-code net/instaweb/rewriter/generated/

  # Admin console tests: unit tests, type check, and the browser tests that
  # load the committed console bundle with mocked admin endpoints (no server,
  # no build).
  console-tests:
    name: Console SPA tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          sparse-checkout: pagespeed/system/console
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: pagespeed/system/console/.nvmrc
      - name: Run console tests
        run: bash pagespeed/system/console/run-ci-tests.sh

  # The installer fragments embed the repository signing key so end users can
  # verify the signed package repositories. This fails if either fragment
  # regresses to a placeholder or an empty key block, or embeds another key.
  signing-key:
    name: Repo signing key embedded
    needs: changes
    if: ${{ needs.changes.outputs.signing_key == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the guard script is tracked
        run: git ls-files --error-unmatch tools/assert-repo-signing-key.sh
      - name: Assert apt/rpm fragments embed the signing key
        run: bash tools/assert-repo-signing-key.sh

  # The libcurl fetcher replaced serf everywhere. This pure grep check
  # asserts serf does not creep back in as a built or linked artifact (dead
  # exports in a version script, a vendored third_party/serf tree, or a serf
  # Bazel repo rule). Comments that mention it for history do not trip it.
  serf-removed:
    name: Serf stays removed
    needs: changes
    if: ${{ needs.changes.outputs.serf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the guard script is tracked
        run: git ls-files --error-unmatch tools/assert-serf-removed.sh
      - name: Assert serf stays removed
        run: bash tools/assert-serf-removed.sh

  # Vendored C/C++ CVE matcher, anti-drift half: offline and fast. Fails if a
  # dependency in bazel/repositories.bzl lacks a cpe-map.yaml entry, a
  # cve-ignore.yaml fixed_in entry is above the pin, or an ignore entry is
  # stale (suppresses no finding in the committed snapshot). Pure python3.
  cpp-cve-completeness:
    name: Completeness gate (every C++ dep annotated)
    needs: changes
    if: ${{ needs.changes.outputs.cve == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate cpe-map.yaml covers every repositories.bzl dep
        run: python3 tools/dependency/validate-deps.py
      - name: Unit tests (matcher, OSV feed rule, ignore-list checks)
        run: python3 test/tools/dependency/cve_scan_test.py -v

  # Per-pull-request CVE scan against the committed snapshot
  # (tools/dependency/nvd-snapshot.json): offline, reproducible, blocking at
  # medium. A new medium or higher CVE on any annotated dependency fails the
  # pull request; to accept one, justify and suppress it in cve-ignore.yaml.
  # The scan fails closed when the snapshot cannot evaluate a dependency, so
  # an empty or degraded snapshot cannot disable the gate. The scheduled live
  # refresh of the snapshot belongs to the nightly tier.
  cpp-cve-snapshot-scan:
    name: CVE scan vs committed snapshot (per-PR, offline)
    needs: changes
    if: ${{ needs.changes.outputs.cve == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan vendored C/C++ deps against the committed snapshot
        env:
          FAIL_ON: medium
        run: |
          set -euo pipefail
          python3 tools/dependency/cve_scan.py \
            --snapshot tools/dependency/nvd-snapshot.json \
            --severity medium \
            --json "${RUNNER_TEMP}/cve-report.json" \
            --fail-on "${FAIL_ON}" | tee "${RUNNER_TEMP}/cve-pr-scan.txt"
      - name: Job summary
        if: always()
        run: |
          # shellcheck disable=SC2016
          {
            echo '## Vendored C/C++ CVE scan vs committed snapshot'
            echo
            echo 'Offline scan against `tools/dependency/nvd-snapshot.json`.'
            echo 'Blocking at `medium`: a new medium or higher finding fails the'
            echo 'pull request. Accept a finding by justifying and suppressing it'
            echo 'in `cve-ignore.yaml`.'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/cve-pr-scan.txt" 2>/dev/null || echo "(scan produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan half of the module upgrade rehearsal: resolves the version under
  # test (the optimizer pin) and the default distro matrix. The rehearse half
  # boots systemd containers and needs the build runners; it arrives in the
  # next step and consumes these outputs.
  upgrade-rehearsal-plan:
    name: Upgrade rehearsal plan (version + distro matrix)
    needs: changes
    if: ${{ needs.changes.outputs.upgrade == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rc: ${{ steps.plan.outputs.rc }}
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Resolve
        id: plan
        run: |
          set -euo pipefail
          # The optimizer pin names the release the tree currently ships with
          # (optimizer-v<version>); the module release carries the same
          # version without the prefix.
          tag=$(python3 -c "import json;print(json.load(open('install/debian/optimizer-pin.json'))['tag'])")
          case "$tag" in
            optimizer-v[0-9]*) rc="${tag#optimizer-v}" ;;
            *) echo "::error::optimizer-pin.json tag '$tag' is not optimizer-v<version>"; exit 1 ;;
          esac
          json=$(printf '%s\n' debian12 ubuntu2404 alma9 | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "distros=$json" >> "$GITHUB_OUTPUT"
          echo "rc=$rc distros=$json"

  # The xunit suite of the ASP.NET Core sidecar (aspnetcore/) under .NET 8 and
  # .NET 10, in pinned SDK containers (tools/ci/release_sidecar.sh test), and
  # the negative control of the live proof. The live nginx tests need the
  # native pair and run in the sidecar-pair jobs of the full tier
  # (pipeline-full.yml), after the merge.
  sidecar-tests:
    name: Sidecar tests (.NET 8 and 10)
    needs: changes
    if: ${{ needs.changes.outputs.sidecar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Run the sidecar test suite
        run: |
          bash tools/ci/release_sidecar.sh test --src "${GITHUB_WORKSPACE}" \
            --results "${RUNNER_TEMP}/sidecar-results"
      # The negative control of the live proof the pair jobs apply: required
      # and without a pair, every live test must fail.
      - name: The live tests fail without the pair
        if: ${{ !cancelled() }}
        run: |
          bash tools/ci/release_sidecar.sh live-guard --src "${GITHUB_WORKSPACE}" \
            --results "${RUNNER_TEMP}/sidecar-results"
      - name: Upload the test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidecar-test-results
          path: ${{ runner.temp }}/sidecar-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Build runner legs. Each runs on a runner class for same-repository events
  # and on a hosted runner for fork or Dependabot pull requests (see the
  # header). While FLEET_ENABLED is 'false' they run hosted instead. No secret
  # and no write token reaches any of them.
  # ---------------------------------------------------------------------
  lock-check:
    name: Bzlmod lockfile is current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write only to push a regenerated MODULE.bazel.lock back to a
    # same-repository pull request branch (see the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          # The PR head commit from the head repository, not the merge commit
          # and not a branch name resolved in this repository: a fork PR has
          # no such branch here, and a same-named one would check the wrong
          # tree. The push step below only runs for same-repository PRs.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure bazel
        run: |
          if ! command -v bazel >/dev/null 2>&1; then
            npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          fi
          bazel --version
          bash tools/ci/check-bazel-version.sh
      # Resolve the module graph in update mode, then fail if that changed the
      # committed lock. The regenerated lock is uploaded so it can be committed
      # without a local Bazel.
      - name: Regenerate MODULE.bazel.lock
        run: bazel mod deps --lockfile_mode=update
      - name: Print the resolved module graph
        if: ${{ !cancelled() }}
        run: |
          bazel mod graph --depth=1
          bazel mod explain rules_cc abseil-cpp protobuf zlib apple_support || true
      - name: Lockfile unchanged
        id: diff
        run: git diff --stat --exit-code MODULE.bazel.lock
      # The versions Bazel resolved (boringssl included) must be the pinned
      # ones, and the lock must agree with the resolved graph.
      - name: Resolved module versions match the pins
        run: |
          bazel mod graph --output=json > "${RUNNER_TEMP}/mod-graph.json"
          python3 tools/check-module-versions.py --graph "${RUNNER_TEMP}/mod-graph.json"
      - name: Upload regenerated lock
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MODULE.bazel.lock
          path: MODULE.bazel.lock
      # Same-repository PRs only (a fork's token cannot push), plus a manual
      # dispatch on a branch of this repository (ci-dev), and never on top of a
      # lock commit this job made itself (loop guard). The run still fails: a
      # push made with GITHUB_TOKEN does not start a new run, so the branch
      # stays red until the next push or a re-run checks the new lock.
      - name: Commit regenerated lock to the branch
        if: >-
          failure() && steps.diff.conclusion == 'failure' &&
          ((github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'))
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          last_author="$(git log -1 --format=%an)"
          if [ "${last_author}" = "github-actions[bot]" ]; then
            echo "::error::the last commit already regenerated the lock and it is still stale; regenerate it locally"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel.lock
          git commit -m "Build: regenerate MODULE.bazel.lock"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "::error::MODULE.bazel.lock was stale; pushed a regenerated lock to ${HEAD_REF}. Re-run CI on the new commit."
          exit 1

  vendor:
    name: Vendor Dependencies
    needs: changes
    if: ${{ needs.changes.outputs.fleet == 'true' }}
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.stamp.outputs.short_sha }}
      channel: ${{ steps.renv.outputs.channel }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Detect runner environment
        id: renv
        run: |
          # The vendored tree reaches consumer jobs through a runner-local
          # vendor dir or the hub when the runner environment provides it,
          # and through actions/cache otherwise (docs/ci/runner-environment.md).
          channel=cache
          if [ -n "${CI_VENDOR_DIR:-}" ] || { [ -n "${CI_HUB_SSH:-}" ] && [ -n "${CI_HUB_VENDOR_DIR:-}" ]; }; then
            channel=hub
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "vendor distribution channel: ${channel}"

      - name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; bash tools/ci/check-bazel-version.sh; exit 0; fi
          if command -v npm >/dev/null 2>&1; then
            npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          fi
          command -v bazel >/dev/null 2>&1 || {
            echo "::error::bazel is not on PATH and could not be installed via npm; see docs/ci/runner-environment.md"
            exit 1
          }
          bazel --version
          bash tools/ci/check-bazel-version.sh

      # Cache channel (hosted, or a fleet runner without hub configuration):
      # vendor/ rides actions/cache between jobs, keyed on the dependency
      # manifest so a dependency bump re-vendors exactly once.
      - name: Restore vendored dependencies (cache channel)
        if: steps.renv.outputs.channel == 'cache'
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}

      # The dependency sources are public and fetched over https. The vendor
      # script names one of them with an ssh-style address, so the rewrite
      # below (scoped to this step through the environment) sends it over
      # https and no credential of any kind is needed.
      - name: Vendor all dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          bash tools/vendor-deps.sh vendor
          if [ -d vendor/cyclone ]; then
            echo "Cyclone: $(du -sh vendor/cyclone | cut -f1)"
          fi
          echo "Repo cache: $(du -sh vendor/repo-cache | cut -f1)"

      # Hub channel only: stamp + tar the tree (source, vendor/, GIT_COMMIT)
      # for the consumer jobs. On the cache channel consumers get the same
      # tree from their own checkout plus the cached vendor/.
      - name: Stamp GIT_COMMIT
        if: steps.renv.outputs.channel == 'hub'
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Create the source tarball
        if: steps.renv.outputs.channel == 'hub'
        id: tarball
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LOCAL_DIR="${CI_VENDOR_DIR:-${RUNNER_TEMP}}"
          mkdir -p "${LOCAL_DIR}"
          TARBALL="${LOCAL_DIR}/mod_pagespeed-${SHORT_SHA}.tar.zst"
          # Short-circuit re-runs: a complete tarball for this SHA was
          # published atomically by a prior run. A readable file that fails
          # `zstd -t` is not trusted and is tarred again. Re-stamp it so the
          # age-based prunes count from now.
          if [ -r "$TARBALL" ] && zstd -t -q "$TARBALL" >/dev/null 2>&1; then
            echo "Tarball for ${SHORT_SHA} present and readable; skipping re-tar"
            touch "$TARBALL"
          else
            # The temp file is runner-private (the runner's own temp dir) and
            # carries the run id and attempt: the long write never happens in
            # the vendor dir that sibling runners prune and read, and the
            # publish step copies it in under a unique name before linking.
            TMP_TARBALL="${RUNNER_TEMP:-/tmp}/$(basename "$TARBALL").${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
            rm -f "${TMP_TARBALL}"
            # Status 1 is accepted only when the sole complaint is the workspace
            # root directory changing (no file contents); a changed file is torn.
            TAR_ERR="${RUNNER_TEMP:-/tmp}/tar-err-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            set +e
            tar --zstd --dereference --mode='u+w' -cf "${TMP_TARBALL}" \
              --exclude='.git' \
              --exclude='bazel-*' \
              . 2>"${TAR_ERR}"
            tar_rc=$?
            set -e
            if [ "$tar_rc" -eq 1 ] && ! grep -v -x -e '' -e 'tar: .: file changed as we read it' "${TAR_ERR}" | grep -q .; then
              echo "::notice::workspace root changed during archiving; archive accepted"
            elif [ "$tar_rc" -ne 0 ]; then
              while IFS= read -r line; do echo "::error::${line}"; done < "${TAR_ERR}"
              echo "::error::tar failed with status ${tar_rc}"
              exit "$tar_rc"
            fi
          fi
          # Publish create-if-absent and write the digest sidecar
          # (tools/ci/publish-vendor-tarball.sh): a same-SHA tarball another
          # writer published first is adopted, never replaced.
          VENDOR_VERIFY_ZSTD=1 bash tools/ci/publish-vendor-tarball.sh "$TARBALL" ${TMP_TARBALL:+"$TMP_TARBALL"}
          # Prune other SHAs' tarballs from the shared local dir, but only
          # past a grace window (a recent tarball may still be extracting in
          # a concurrent run) and only while file times agree with this
          # host's clock (tools/ci/prune-vendor-dir.sh). Sidecars go with
          # their tarball; *.tmp sweeps cancelled runs.
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            bash tools/ci/prune-vendor-dir.sh "${CI_VENDOR_DIR}" mod_pagespeed "${SHORT_SHA}" 120
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          # Name and size only: the directory is a runner-local path.
          echo "Tarball: $(basename "$TARBALL") ($(du -h "$TARBALL" | cut -f1))"

      - name: Publish the tarball to the hub
        if: steps.renv.outputs.channel == 'hub'
        run: |
          # The ssh remote commands interpolate this runner's environment
          # client-side on purpose: the values are defined by the runner
          # environment contract (docs/ci/runner-environment.md), never
          # logged, and the remote side needs them as literals.
          if [ -z "${CI_HUB_SSH:-}" ] || [ -z "${CI_HUB_VENDOR_DIR:-}" ]; then
            echo "::notice::CI_HUB_SSH/CI_HUB_VENDOR_DIR not set: the vendor tarball stays on this runner. Consumers on other runners fail with a recovery hint; configure the runner environment or use the cache channel (docs/ci/runner-environment.md)."
            exit 0
          fi
          TARBALL="${{ steps.tarball.outputs.tarball }}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o LogLevel=ERROR"
          F="$(basename "$TARBALL")"
          TMP_DEST="${CI_HUB_VENDOR_DIR}/${F}.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME//[^A-Za-z0-9_.-]/_}.tmp"
          # The digest of the local tarball (the publish step above wrote its
          # sidecar): the hub side checks the transferred bytes against it.
          DIGEST="$(cut -d' ' -f1 "${TARBALL}.sha256")"
          # Publish ON the hub with the same script the local publish used,
          # streamed over ssh: create-if-absent (a sound published tarball is
          # never replaced), flushed before the link, digest checked, sidecar
          # written through a temp name. The remote commands expand
          # client-side on purpose.
          # SSH_OPTS is an intentional multi-token option list.
          # shellcheck disable=SC2029,SC2086
          for attempt in 1 2 3; do
            if ssh ${SSH_OPTS} "${CI_HUB_SSH}" "mkdir -p '${CI_HUB_VENDOR_DIR}'" \
               && rsync -a -e "ssh ${SSH_OPTS}" "$TARBALL" "${CI_HUB_SSH}:${TMP_DEST}" \
               && ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                    "GITHUB_RUN_ID='${GITHUB_RUN_ID}' GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' VENDOR_EXPECT_SHA256='${DIGEST}' VENDOR_VERIFY_ZSTD=1 bash -s -- '${CI_HUB_VENDOR_DIR}/${F}' '${TMP_DEST}'" \
                    < tools/ci/publish-vendor-tarball.sh; then
              echo "Published ${F} to the CI hub (attempt ${attempt})"
              # Prune hub tarballs older than the retention window: the hub
              # copy is the only one a rerun-failed-jobs consumer can reach
              # once the local copy is gone.
              ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                "bash -s -- '${CI_HUB_VENDOR_DIR}' mod_pagespeed - ${CI_HUB_VENDOR_RETENTION_MIN:-1440}" \
                < tools/ci/prune-vendor-dir.sh 2>/dev/null || true
              exit 0
            fi
            echo "::warning::hub publish failed (attempt ${attempt}/3)"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "::error::hub publish failed after 3 attempts"
          exit 1

      - name: Stamp outputs
        id: stamp
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"


  linux-build:
    name: Linux Build
    needs: vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          # Cap the cache before the job uses it (7 days, 12G; the sizing is in
          # tools/ci/prune-bazel-disk-cache.sh). It never fails the job.
          bash "${GITHUB_WORKSPACE}/tools/ci/prune-bazel-disk-cache.sh" "${CACHE_ROOT}" 7d 12G || true
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      - name: Build all targets
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget 55g || exit 1
          OUT="${GITHUB_WORKSPACE}/.ci-artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}" "${GITHUB_WORKSPACE}/.build-artifacts"
          BUILD_LOG="${OUT}/build-all.log"
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci --config=ci_lock"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --config=ci_lock --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                build ${BAZEL_CONFIG} --disk_cache=/cache \
                --action_env=CC=clang --action_env=CXX=clang++ \
                -- //:libmod_pagespeed.so \
                //pagespeed/nginx:ngx_pagespeed_module.so \
                //test/pagespeed/kernel/... //test/net/... \
                //test/pagespeed/opt/... //test/pagespeed/system/... \
                //test/pagespeed/apache/... //test/pagespeed/nginx/...
              # The modules carry their own crypto and are loaded into server
              # processes that have another one. Fail before the artifacts are
              # handed on if either module would bind to the host instead:
              # crypto library in NEEDED, an undefined symbol the host would
              # have to resolve, or exported internals. The self-test runs
              # here as well because this container has a compiler: it builds
              # real fixture objects.
              bash tools/ci/assert_module_symbols.sh --self-test --require-fixtures
              bash tools/ci/assert_module_symbols.sh --profile apache \
                bazel-bin/libmod_pagespeed.so
              bash tools/ci/assert_module_symbols.sh --profile nginx \
                bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so
              # Collect the modules for the bundle (bazel-bin points into the
              # container-internal output base).
              mkdir -p /workspace/.build-artifacts/bazel-bin/pagespeed/nginx
              cp -L /workspace/bazel-bin/libmod_pagespeed.so \
                    /workspace/.build-artifacts/bazel-bin/libmod_pagespeed.so
              cp -L /workspace/bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so \
                    /workspace/.build-artifacts/bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so
            ' 2>&1 | tee "${BUILD_LOG}"

      # Non-gating: this only reports, so pre-existing warnings do not break
      # CI. `if: always()` so warnings still surface when the build failed.
      - name: Surface compiler warnings
        if: always()
        run: |
          BUILD_LOG="${GITHUB_WORKSPACE}/.ci-artifacts/build-all.log"
          if [ ! -f "${BUILD_LOG}" ]; then
            echo "No build log -- nothing to scan."
            exit 0
          fi
          WARN_RE=': warning:'
          WARN_COUNT=$(grep -c -E "${WARN_RE}" "${BUILD_LOG}" || true)
          WARN_COUNT=${WARN_COUNT:-0}
          {
            echo "## Compiler warnings (Linux Build)"
            echo ""
            echo "Found **${WARN_COUNT}** \`: warning:\` line(s) in the build log."
            if [ "${WARN_COUNT}" -gt 0 ]; then
              echo ""
              echo "First up to 50:"
              echo ""
              echo '```'
              grep -E "${WARN_RE}" "${BUILD_LOG}" | head -50
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          grep -E "${WARN_RE}" "${BUILD_LOG}" | head -50 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          echo "Surfaced ${WARN_COUNT} build warning(s) (annotations capped at 50)."

      - name: Finalize the build bundle
        run: |
          STAGING="${GITHUB_WORKSPACE}/.ci-artifacts"
          cp -L "${GITHUB_WORKSPACE}/.build-artifacts/bazel-bin/libmod_pagespeed.so" "$STAGING/"
          cp -L "${GITHUB_WORKSPACE}/.build-artifacts/bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so" "$STAGING/"
          cat > "$STAGING/metadata.json" <<EOF
          {"commit":"${GITHUB_SHA}","branch":"${GITHUB_REF_NAME}","run":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","platform":"linux-x64","config":"ci","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cd "$STAGING"
          files=()
          for f in *; do
            [ "$f" = checksums.sha256 ] || [ "$f" = build-all.log ] || files+=("$f")
          done
          sha256sum -- "${files[@]}" > checksums.sha256
          echo "CI artifacts (linux-x64):"
          ls -lh "$STAGING/"

      # The bundle passes between jobs as a GitHub artifact (retention 3
      # days). Nothing here goes to a host-specific path.
      - name: Upload the build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-artifacts-linux-x64
          path: .ci-artifacts
          retention-days: 3
          include-hidden-files: true


  linux-unit-tests:
    name: Linux Unit Tests
    needs: [vendor, linux-build]
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          # Cap the cache before the job uses it (7 days, 12G; the sizing is in
          # tools/ci/prune-bazel-disk-cache.sh). It never fails the job.
          bash "${GITHUB_WORKSPACE}/tools/ci/prune-bazel-disk-cache.sh" "${CACHE_ROOT}" 7d 12G || true
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # Redis and memcached for the tests, on a network of their own. The
      # names carry the job id, run id and attempt so concurrent jobs on one
      # host never collide, and the cleanup step removes only what this job
      # started.
      - name: Start the test services
        run: |
          SUF="${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NET="ci-net-${SUF}"; R="ci-redis-${SUF}"; M="ci-memcached-${SUF}"
          { echo "TEST_NET=${NET}"; echo "TEST_REDIS=${R}"; echo "TEST_MEMCACHED=${M}"; } >> "$GITHUB_ENV"
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "docker daemon not ready ($i/30)"; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon unreachable after 60s"; exit 1; }
          docker network create "$NET" 2>/dev/null || true
          for img in redis:7-alpine memcached:1.6-alpine; do
            for a in 1 2 3; do docker pull "$img" && break; echo "::warning::pull $img failed ($a/3)"; sleep $((a*5)); done
          done
          start() { local name=$1 image=$2; shift 2
            for a in 1 2 3; do
              docker rm -f "$name" 2>/dev/null || true
              docker run -d --init --restart=on-failure:2 --name "$name" --network "$NET" "$@" "$image" && return 0
              echo "::warning::docker run $name failed ($a/3)"; sleep $((a*3))
            done
            echo "::error::could not start $name after 3 attempts"; return 1; }
          start "$R" redis:7-alpine || exit 1
          start "$M" memcached:1.6-alpine || exit 1
          for a in $(seq 1 30); do docker exec "$R" redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; [ "$a" = 30 ] && { echo "::error::redis never became ready"; docker logs "$R" 2>&1 | tail; exit 1; }; done

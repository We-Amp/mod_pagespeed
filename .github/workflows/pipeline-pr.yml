      - name: Start the test services
        run: |
          SUF="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-unit"
          NET="ci-net-${SUF}"; R="ci-redis-${SUF}"; M="ci-memcached-${SUF}"
          { echo "TEST_NET=${NET}"; echo "TEST_REDIS=${R}"; echo "TEST_MEMCACHED=${M}"; } >> "$GITHUB_ENV"
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "docker daemon not ready ($i/30)"; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon unreachable after 60s"; exit 1; }
          docker network create "$NET" 2>/dev/null || true
          for img in redis:7-alpine memcached:1.6-alpine; do
            for a in 1 2 3; do docker pull "$img" && break; echo "::warning::pull $img failed ($a/3)"; sleep $((a*5)); done
          done
          start() { local name=$1 image=$2; shift 2
            for a in 1 2 3; do
              docker rm -f "$name" 2>/dev/null || true
              docker run -d --init --restart=on-failure:2 --name "$name" --network "$NET" "$@" "$image" && return 0
              echo "::warning::docker run $name failed ($a/3)"; sleep $((a*3))
            done
            echo "::error::could not start $name after 3 attempts"; return 1; }
          start "$R" redis:7-alpine || exit 1
          start "$M" memcached:1.6-alpine || exit 1
          for a in $(seq 1 30); do docker exec "$R" redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; [ "$a" = 30 ] && { echo "::error::redis never became ready"; docker logs "$R" 2>&1 | tail; exit 1; }; done
          for a in $(seq 1 15); do echo version | docker exec -i "$M" sh -c 'cat | nc -w1 127.0.0.1 11211' 2>/dev/null | grep -q VERSION && break; sleep 1; [ "$a" = 15 ] && echo "::warning::memcached readiness probe unconfirmed after 15s (container is running; continuing)"; done

      - name: Run unit tests
        run: |
          rm -rf "${GITHUB_WORKSPACE}/_failed-testlogs"
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=HOST_CPUS*.75"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --memory=55g --memory-swap=55g \
            --network="${TEST_NET}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}" \
            -e REDIS_HOST="${TEST_REDIS}" -e MEMCACHED_HOST="${TEST_MEMCACHED}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              # --test_output=errors prints failing-test stderr inline in the
              # step log. BAZEL_CONFIG is an intentional flag list.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                test ${BAZEL_CONFIG} --disk_cache=/cache \
                --test_output=errors \
                --action_env=CC=clang --action_env=CXX=clang++ \
                --keep_going \
                --test_env=REDIS_HOST="${REDIS_HOST}" \
                --test_env=REDIS_PORT=6379 \
                --test_env=MEMCACHED_HOST="${MEMCACHED_HOST}" \
                --test_env=MEMCACHED_PORT=11211 \
                -- //test/pagespeed/kernel/... //test/net/... \
                //test/pagespeed/opt/... //test/pagespeed/system/... \
                //test/pagespeed/apache/... //test/pagespeed/nginx/...
              rc=$?
              if [ $rc -ne 0 ]; then
                # bazel-testlogs lives under the container-internal output
                # base; copy onto the mounted volume so the upload step can
                # pick it up. Best-effort.
                mkdir -p /workspace/_failed-testlogs
                if [ -L /workspace/bazel-testlogs ]; then
                  cp -rL /workspace/bazel-testlogs/* /workspace/_failed-testlogs/ 2>/dev/null || true
                fi
              fi
              exit $rc
            '

      # Debugging aid for a failed test run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload bazel test logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-unit-tests-bazel-testlogs
          path: _failed-testlogs/
          if-no-files-found: warn
          retention-days: 3

      - name: Stop the test services
        if: always()
        run: |
          docker rm -f "${TEST_REDIS:-none}" "${TEST_MEMCACHED:-none}" 2>/dev/null || true
          docker network rm "${TEST_NET:-none}" 2>/dev/null || true


  lint:
    name: Lint (clang-tidy + clang-format)
    needs: vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('WORKSPACE', 'MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # Decide WHICH translation units clang-tidy lints this run:
      #   * workflow_dispatch                  -> full   (manual escape hatch)
      #   * PR touching .cc and/or a header    -> scoped (changed .cc + every TU
      #                                                   that transitively includes
      #                                                   a changed header)
      #   * PR touching neither .cc nor a hdr  -> none   (clang-tidy skipped; clang-format still runs)
      #   * push to the default branch         -> none   (the whole-tree sweep belongs to the nightly tier)
      # tools/ci/lint-scope-expand.sh resolves the include graph for the
      # scoped mode.
      - name: Compute lint scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          MODE=none
          CC_LIST="${GITHUB_WORKSPACE}/.lint-files.txt"
          HDR_LIST="${GITHUB_WORKSPACE}/.lint-headers.txt"
          : > "$CC_LIST"
          : > "$HDR_LIST"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MODE=full
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            CHANGED="${RUNNER_TEMP}/lint-changed.txt"
            # Deleted files are not lintable.
            git diff --name-only --diff-filter=d "${BASE}...HEAD" > "${CHANGED}"
            grep -E '^(pagespeed|net)/.*\.cc$' "${CHANGED}" > "$CC_LIST" || true
            grep -E '^(pagespeed|net)/.*\.(h|hpp)$' "${CHANGED}" > "$HDR_LIST" || true
            if [ -s "$CC_LIST" ] || [ -s "$HDR_LIST" ]; then MODE=scoped; fi
          fi
          echo "LINT_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "lint scope: mode=${MODE}, changed .cc=$(wc -l < "$CC_LIST" | tr -d ' '), changed headers=$(wc -l < "$HDR_LIST" | tr -d ' ')"

      - name: clang-tidy (compdb + lint in one container)
        run: |
          # compdb generation and clang-tidy MUST run in the same container:
          # compile_commands.json contains absolute paths to the Bazel
          # execroot, which only exists inside the container that created it.
          # The container runs as the runner user so nothing root-owned lands
          # in the checkout. HOME and the Bazel state live in the per-runner
          # cache directory mounted at /cache (outside the checkout, which
          # Bazel's repository cache must be); USER is exported because the
          # runner uid has no passwd entry in the image.
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_BUILD_OPTIONS="--config=vendored --deleted_packages=pagespeed/envoy,pagespeed/iis,pagespeed/windows --keep_going --disk_cache=/cache/disk" \
            -e LINT_MODE="${LINT_MODE:-full}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              # Nothing in the lint scope changed: skip the expensive compdb
              # generation (clang-format still runs in the next step).
              if [ "${LINT_MODE}" = "none" ]; then
                echo "lint scope: no .cc/.h changed in lint scope -- skipping compile-commands + clang-tidy."
                exit 0
              fi
              rm -f compile_commands.json
              # Do not let the generator die unannotated: annotations survive
              # a lost step log.
              set +e
              python3 tools/gen_compilation_database.py -- //pagespeed/... //net/...
              gen_rc=$?
              set -e
              if [ "$gen_rc" -ne 0 ]; then
                echo "::error::compile_commands.json generation failed (bazel exited ${gen_rc}) -- see the compdb bazel output above"
                exit 1
              fi
              # Sentinel: a compdb without the nginx module entry point means
              # nginx lint coverage is gone (the dependency override is
              # broken); fail loudly.
              grep -q "pagespeed/nginx/ngx_pagespeed\.cc" compile_commands.json || {
                echo "::error::compile_commands.json has no pagespeed/nginx entries -- nginx dropped out of the compdb"
                exit 1
              }
              if [ "${LINT_MODE}" = "scoped" ]; then
                bash tools/ci/lint-scope-expand.sh \
                  /workspace/.lint-files.txt /workspace/.lint-headers.txt \
                  > /workspace/.lint-targets.txt
                # An empty target list means the changed files reach no TU in
                # the compilation database. SKIP clang-tidy -- never fall
                # through to the full tree.
                if [ ! -s /workspace/.lint-targets.txt ]; then
                  echo "lint scope: changed files reach no TU in the compdb -- skipping clang-tidy."
                  exit 0
                fi
                CT_TARGETS=()
                while read -r t; do CT_TARGETS+=("$t"); done < /workspace/.lint-targets.txt
                echo "lint scope: scoped to ${#CT_TARGETS[@]} dependent TU(s):"
                printf "  %s\n" "${CT_TARGETS[@]}"
              else
                CT_TARGETS=(pagespeed/ net/)
                echo "lint scope: full tree."
              fi
              run-clang-tidy-20 \
                -clang-tidy-binary=clang-tidy-20 \
                -p /workspace \
                -header-filter="^(?!.*/(external|bazel-out|third_party|envoy)/).*\.(h|hpp)$" \
                "${CT_TARGETS[@]}"
            '

      - name: clang-format check
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              # Skip generated files: they carry a GENERATED banner and follow
              # the canonical source style. net/instaweb/rewriter/generated/
              # is data2c output, regenerated wholesale, never hand-formatted.
              find pagespeed net -type f \
                \( -name "*.cc" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
                -not -path "pagespeed/iis/*" \
                -not -path "net/instaweb/rewriter/generated/*" \
                | xargs -r grep -L "DO NOT EDIT BY HAND" \
                | xargs -r clang-format-20 --dry-run --Werror
            '

      - name: Doc version-literal drift
        run: bash tools/ci/check_doc_commands.sh



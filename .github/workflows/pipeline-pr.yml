          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel build ${BAZEL_CONFIG} --disk_cache=/cache/disk \
                //pagespeed/kernel/html:html_parse_probe
              python3 tools/html-parse-corpus/gen_goldens.py --check \
                --probe bazel-bin/pagespeed/kernel/html/html_parse_probe
            '


  fuzz-smoke:
    name: Fuzz smoke (deterministic replay plus 60s libFuzzer)
    needs: [changes, vendor]
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ needs.changes.outputs.fuzz == 'true' }}
    timeout-minutes: 90
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mps-vendor-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'bazel/**', 'third_party/**', 'tools/vendor-deps.sh') }}
          fail-on-cache-miss: true

      # Hub channel: extract the vendor job's tarball over this checkout
      # (same SHA; the tarball also carries vendor/ and the GIT_COMMIT stamp
      # verified below). Integrity-checked with a hub fallback
      # (tools/ci/extract-vendor-tarball.sh).
      - name: Extract the vendored workspace (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || {
            echo "::error::[vendor-tarball-unavailable] stale or missing GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds
          # the image cold every time: the degraded mode.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # A per-runner directory for the Bazel disk cache, mounted at /cache.
      # It persists across jobs on a fleet runner and is empty on a hosted
      # one. The name is suffixed per runner instance (two instances can
      # share one host's home) and is never logged.
      - name: Prepare the per-runner Bazel cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          # Cap the cache before the job uses it (7 days, 12G; the sizing is in
          # tools/ci/prune-bazel-disk-cache.sh). It never fails the job.
          bash "${GITHUB_WORKSPACE}/tools/ci/prune-bazel-disk-cache.sh" "${CACHE_ROOT}/disk" 7d 12G || true
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # The sanitizer binaries are built, and run, inside the dev image: the
      # sanitizer runtimes and the libFuzzer runtime live there. bazel-bin
      # points into the container-internal output base, so each build copies
      # its binaries onto the mounted workspace in the same container.
      - name: Build the replay binaries
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          EXTRA_DOCKER=()
          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                //third_party/css_parser:parser_fuzz \
                //third_party/css_parser:parser_fuzz_corpus_test \
                //pagespeed/kernel/html:html_fuzz \
                //pagespeed/kernel/packs:pack_loader_fuzz \
                //pagespeed/kernel/packs:rule_pack_filter_fuzz \
                //pagespeed/kernel/js:js_minify_fuzz
              B=/workspace/.fuzz-bin
              mkdir -p "$B"
              cp -L bazel-bin/third_party/css_parser/parser_fuzz "$B/parser_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/html/html_fuzz "$B/html_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/packs/pack_loader_fuzz "$B/pack_loader_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/packs/rule_pack_filter_fuzz "$B/rule_pack_filter_fuzz_replay"
              cp -L bazel-bin/pagespeed/kernel/js/js_minify_fuzz "$B/js_fuzz_replay"
              # The deterministic corpus test: the ASan regression floor.
              bazel --output_user_root=/tmp/bazel-out test ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --test_output=errors \
                //third_party/css_parser:parser_fuzz_corpus_test
            '

      # Deterministic floors: the checked-in seeds through the ASan replay
      # binaries. The JS smoke is deterministic only (no fuzz burst): the
      # known operator-glomming classes trip within seconds on garbage, so a
      # burst on a pull request lane would only generate flakes.
      - name: Seed and corpus replays
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          EXTRA_DOCKER=()
          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              B=/workspace/.fuzz-bin
              T=/tmp/fuzz-scratch
              mkdir -p "$T"
              export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
              export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
              "$B/html_fuzz_replay" tools/html-parse-corpus/seeds/*
              "$B/pack_loader_fuzz_replay" tools/pack-loader-corpus/seeds/* \
                test/pagespeed/kernel/packs/testdata/edge-seo/pack.example.json
              "$B/rule_pack_filter_fuzz_replay" tools/rule-pack-filter-corpus/seeds/*
              python3 tools/js-minify-corpus/generate_synthetic.py \
                --seed 20260721 --dest "$T/js-synthetic" --shapes 128 --execs 128
              "$B/js_fuzz_replay" --dump_corpus="$T/js-seed"
              "$B/js_fuzz_replay" \
                "$T"/js-seed/seed-* \
                tools/js-minify-corpus/findings/repros/*.js \
                tools/js-minify-corpus/findings/repros/*.mjs \
                "$T"/js-synthetic/*.js "$T"/js-synthetic/*.mjs \
                test/pagespeed/kernel/js/testdata/third_party/*.original \
                test/pagespeed/kernel/js/testdata/third_party/es2020.js
              # The classifier alone decides what a nightly finding reports;
              # fixture-test its predicates and bucket logic here.
              command -v node >/dev/null 2>&1 || {
                echo "::error::node not on PATH -- the classifier self-test needs it."
                exit 1
              }
              bash tools/ci/classify-js-fuzz-artifacts.sh --self-test
            '

      - name: 60s libFuzzer smoke runs (CSS and HTML)
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          EXTRA_DOCKER=()
          [ -z "${SLOT_MEM}" ] || EXTRA_DOCKER+=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          [ -z "${SLOT_CPUS}" ] || EXTRA_DOCKER+=(--cpus="${SLOT_CPUS}")
          BAZEL_CONFIG="--config=ci"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
          else
            # Degraded mode: the ci config pulls in the remote cache, so
            # switch it off and size the job count for a small runner.
            BAZEL_CONFIG="--config=ci --remote_cache= --remote_upload_local_results=false --jobs=${SLOT_JOBS}"
            echo "::notice::BAZEL_CACHE_HOST not set: running without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail
              B=/workspace/.fuzz-bin
              T=/tmp/fuzz-scratch
              mkdir -p "$T/css-corpus" "$T/css-crashes" "$T/html-corpus" "$T/html-crashes" "$T/nightly-empty"
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --copt=-DCSS_PARSER_LIBFUZZER --copt=-fsanitize=fuzzer-no-link \
                --linkopt=-fsanitize=fuzzer \
                //third_party/css_parser:parser_fuzz
              cp -Lf bazel-bin/third_party/css_parser/parser_fuzz "$B/parser_fuzz_lf"
              # Separate invocation: the HTML harness has its own define, and
              # mixing defines would leave one binary in replay mode.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build ${BAZEL_CONFIG} --config=clang-asan -c opt \
                --disk_cache=/cache/disk --action_env=CC=clang --action_env=CXX=clang++ \
                --copt=-DHTML_PARSE_LIBFUZZER --copt=-fsanitize=fuzzer-no-link \
                --linkopt=-fsanitize=fuzzer \
                //pagespeed/kernel/html:html_fuzz
              cp -Lf bazel-bin/pagespeed/kernel/html/html_fuzz "$B/html_fuzz_lf"
              export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
              export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
              "$B/parser_fuzz_replay" --dump_corpus="$T/css-seed"
              cp -n "$T"/css-seed/seed-* "$T/css-corpus"/
              "$B/parser_fuzz_lf" "$T/css-corpus" "$T/nightly-empty" \
                -max_total_time=60 -max_len=4096 -rss_limit_mb=4096 \
                -artifact_prefix="$T/css-crashes/" -print_final_stats=1
              cp -n tools/html-parse-corpus/seeds/* "$T/html-corpus"/
              "$B/html_fuzz_lf" "$T/html-corpus" "$T/nightly-empty" \
                -max_total_time=60 -max_len=4096 -rss_limit_mb=4096 \
                -artifact_prefix="$T/html-crashes/" -print_final_stats=1
              # Crash reproducers go to the mounted workspace for the upload.
              mkdir -p /workspace/.fuzz-evidence
              cp -r "$T/css-crashes" "$T/html-crashes" /workspace/.fuzz-evidence/ 2>/dev/null || true
            '

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload crash evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-smoke-evidence
          path: .fuzz-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3


  windows-build:
    name: Windows Build
    needs: vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'windows-2022' || 'fleet-windows' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      # The fleet runners carry the same setting; byte-compared fixtures need LF.
      - name: Check out with LF line endings (hosted runner)
        if: runner.environment == 'github-hosted'
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hosted runners get the pinned toolchain installed; a fleet runner
      # provides it through its own environment (CI_WIN_TOOLS_DIR,
      # CI_WIN_LLVM_DIR, CI_WIN_PYTHON_DIR; docs/ci/runner-environment.md).
      - name: Provision the toolchain (hosted runner)
        if: runner.environment == 'github-hosted'
        run: |
          $ErrorActionPreference = 'Stop'
          # NASM is pinned to 2.16.03: the AV1 codec dependency rejects 3.x.
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::nasm install failed"; exit 1 }
          (Join-Path $env:ProgramFiles 'NASM') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # clang-cl comes from LLVM 19.
          $major = 0
          $cc = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($cc) { $v = (& clang-cl --version 2>&1 | Select-Object -First 1); if ($v -match 'version (\d+)') { $major = [int]$Matches[1] } }
          if ($major -ne 19) {
            choco install llvm --version=19.1.7 --allow-downgrade -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::llvm install failed"; exit 1 }
          }
          (Join-Path $env:ProgramFiles 'LLVM\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # gperf for the Bazel genrules, from the MSYS2 that ships with the image.
          & (Join-Path $env:SystemDrive 'msys64\usr\bin\pacman.exe') -Sy --noconfirm --needed gperf
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gperf install failed"; exit 1 }

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tool locations come from PATH, or from the runner's environment when
      # it provides one. Nothing here names a drive, a user profile or an
      # installation directory, and no tool location is printed.
      - name: Resolve the runner environment
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-JobEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          function Add-ToolDir([string]$Dir) {
            if ($Dir -and (Test-Path -LiteralPath $Dir)) {
              $Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = ($Dir + ';' + $env:PATH)
              return $true
            }
            return $false
          }
          # CI_WIN_TOOLS_DIR is a semicolon-separated list of directories.
          $toolDirs = @()
          if ($env:CI_WIN_TOOLS_DIR) {
            $toolDirs = @($env:CI_WIN_TOOLS_DIR -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
          }
          [array]::Reverse($toolDirs)
          foreach ($d in $toolDirs) { [void](Add-ToolDir $d) }
          [array]::Reverse($toolDirs)
          if ($toolDirs.Count -gt 0) { Write-Host "using the runner's tool directories" }
          # LLVM 19 (clang-cl) and Python 3.12 (ahead of Git for Windows'
          # python stub) when the runner names them.
          if ($env:CI_WIN_LLVM_DIR) { [void](Add-ToolDir (Join-Path $env:CI_WIN_LLVM_DIR 'bin')) }
          if ($env:CI_WIN_PYTHON_DIR) { [void](Add-ToolDir $env:CI_WIN_PYTHON_DIR) }
          $bazel = @('bazelisk', 'bazel') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $bazel) {
            Write-Host "::error::neither bazelisk nor bazel is on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_CMD' $bazel
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\Check-BazelVersion.ps1') -Launcher $bazel -Root $env:GITHUB_WORKSPACE
          # clang-cl: Bazel finds the LLVM installation through BAZEL_LLVM.
          if ($env:CI_WIN_LLVM_DIR -and (Test-Path -LiteralPath (Join-Path $env:CI_WIN_LLVM_DIR 'bin\clang-cl.exe'))) {
            $env:PATH = (Join-Path $env:CI_WIN_LLVM_DIR 'bin') + ';' + $env:PATH
          } elseif ($env:CI_WIN_LLVM_DIR -and (Test-Path -LiteralPath (Join-Path $env:CI_WIN_LLVM_DIR 'clang-cl.exe'))) {
            $env:PATH = $env:CI_WIN_LLVM_DIR + ';' + $env:PATH
          }
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            Write-Host "::error::clang-cl (LLVM 19) is not on PATH; see docs/ci/runner-environment.md (CI_WIN_LLVM_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_LLVM' (Split-Path -Parent (Split-Path -Parent $clangCl.Source))
          # The AV1 encoder needs NASM 2.16.03 (nasm 3.x dropped the "-Ox"
          # line from `nasm -hf` that the codec build greps for). Fail early
          # and legibly instead of deep inside a configure log.
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Write-Host "::error::nasm 2.16.03 is not on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          if (-not (& nasm -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            Write-Host "::error::the nasm on PATH is not usable by the AV1 codec build (no '-Ox' in -hf output; 3.x is not supported). Provide 2.16.03."
            exit 1
          }
          # Bazel's shell: the runner's, else MSYS2 bash, else Git bash.
          $bashCandidates = @()
          if ($env:BAZEL_SH) { $bashCandidates += $env:BAZEL_SH }
          foreach ($d in $toolDirs) { $bashCandidates += (Join-Path $d 'bash.exe') }
          $bashCandidates += (Join-Path $env:SystemDrive 'msys64\usr\bin\bash.exe')
          $bashCandidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
          $bash = $bashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) {
            Write-Host "::error::no bash.exe found for Bazel (MSYS2 or Git for Windows); see docs/ci/runner-environment.md"
            exit 1
          }
          Set-JobEnv 'BAZEL_SH' $bash
          # A short output root keeps paths under the Windows length limit.
          Set-JobEnv 'WIN_BAZEL_OUTPUT_ROOT' ($(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/')
          # Bazel disk cache: the runner's directory when it names one (with
          # its size cap), else a directory under the job's temporary
          # directory that is lost with the job.
          Set-JobEnv 'WIN_CACHE_DIR' $(if ($env:CI_WIN_CACHE_DIR) { $env:CI_WIN_CACHE_DIR } else { Join-Path $env:RUNNER_TEMP 'bazel-disk' })
          if ($env:CI_WIN_CACHE_MAX_SIZE) { Set-JobEnv 'WIN_CACHE_MAX_SIZE' $env:CI_WIN_CACHE_MAX_SIZE }
          Set-JobEnv 'WIN_VENDOR_DL_DIR' (Join-Path $env:RUNNER_TEMP 'vendor-download')
          Write-Host "build tool: $bazel"

      # The Windows build does not use actions/cache for vendor/: a vendor tree
      # saved on Linux does not restore here. On the hub channel the runner
      # takes the tarball the vendor job published (a local directory shared
      # with the Linux jobs of the same machine, or the hub); in every other
      # case Bazel fetches the dependencies itself.
      - name: Fetch the vendored tree (hub channel)
        env:
          VENDOR_CHANNEL: ${{ needs.vendor.outputs.channel }}
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VENDOR_CHANNEL -ne 'hub') {
            Write-Host "vendor channel is '$($env:VENDOR_CHANNEL)': Bazel fetches dependencies directly"
            exit 0
          }
          $name = "mod_pagespeed-$($env:VENDOR_SHORT_SHA).tar.zst"
          # Never extract straight from a directory that Linux jobs of the
          # same machine publish into and prune: stage a private copy, check
          # it against the sidecar digest (retrying a copy that is short or
          # mid-publish), and decompress and extract only that copy
          # (tools/ci/fetch-vendor-tarball.ps1).
          $dirs = @($env:CI_WIN_VENDOR_DIR) | Where-Object { $_ }
          & "$($env:GITHUB_WORKSPACE)\tools\ci\fetch-vendor-tarball.ps1" `
            -Name $name -Dest $env:GITHUB_WORKSPACE -StageDir $env:WIN_VENDOR_DL_DIR `
            -SearchDirs $dirs -HubSsh $env:CI_HUB_SSH -HubDir $env:CI_HUB_VENDOR_DIR
          $rc = $LASTEXITCODE
          if ($rc -eq 4) {
            if ($env:CI_HUB_SSH -and $env:CI_HUB_VENDOR_DIR) {
              Write-Host "::warning::[vendor-tarball-unavailable] the vendor tarball could not be fetched from the CI hub; it may have aged out of the hub's retention window. Re-run the full workflow, not only the failed jobs, to regenerate it."
            }
            Write-Host "::notice::no vendor tarball reachable from this runner: Bazel fetches dependencies directly (docs/ci/runner-environment.md)"
            exit 0
          }
          if ($rc -ne 0) { exit $rc }
          $stamped = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GIT_COMMIT') -Raw).Trim()
          if ($stamped -ne $env:GITHUB_SHA) {
            Write-Host "::error::[vendor-tarball-unavailable] stale GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      # Age-guarded prune of the vendor download directory (a 2 hour window on
      # top of the host's own housekeeping), so an interrupted fetch or
      # extract cannot leave a multi-gigabyte file behind. A directory shared
      # with the Linux jobs (CI_WIN_VENDOR_DIR) is left to the Linux vendor
      # job. The hermetic self-test runs first; if it fails, the prune is
      # skipped. Housekeeping: continue-on-error, so it never blocks a merge.
      - name: Vendor fetch and prune scripts - self-test
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::prune-win-vendor self-test failed (exit $LASTEXITCODE)"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\fetch-vendor-tarball_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::fetch-vendor-tarball self-test failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Prune the vendor download directory
        if: needs.vendor.outputs.channel == 'hub'
        continue-on-error: true
        env:
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          & "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor.ps1" `
            -VendorDir $env:WIN_VENDOR_DL_DIR -ShortSha $env:VENDOR_SHORT_SHA

      - name: Set up MSVC environment
        run: |
          $ErrorActionPreference = 'Continue'
          # Source vcvars64 and export INCLUDE/LIB/PATH for the later steps.
          $vsDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsDir = & $vswhere -products * -latest -property installationPath 2>$null
          }
          if (-not $vsDir -or -not (Test-Path -LiteralPath "$vsDir\VC\Auxiliary\Build\vcvars64.bat")) {
            # Fallback: probe the usual installation directories.
            $vsDir = @(
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\Community')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vsDir) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = "$vsDir\VC\Auxiliary\Build\vcvars64.bat"
          # Full path through ComSpec: an MSYS2 cmd on PATH would shadow
          # System32\cmd.exe.
          & "$env:ComSpec" /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^PATH=(.*)$') {
              $vcPath = $Matches[1]
            } elseif ($_ -match '^(INCLUDE|LIB)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # MSYS2 coreutils and Ninja go on PATH for the genrule cmake builds.
          $extra = Join-Path $env:SystemDrive 'msys64\usr\bin'
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) { $extra = "$extra;" + (Split-Path $ninja.Source) }
          # One PATH line: the vcvars PATH (MSVC and Windows Kits tools, plus the
          # original PATH) behind MSYS2 and Ninja. A later line would override it.
          if (-not $vcPath) { $vcPath = $env:PATH }
          "PATH=$extra;$vcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the IIS module
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location $env:GITHUB_WORKSPACE
          $bazel = $env:BAZEL_CMD
          $root = "--output_user_root=$($env:WIN_BAZEL_OUTPUT_ROOT)"
          # Forward slashes for every Bazel path (a Windows Bazel requirement).
          $diskCache = $env:WIN_CACHE_DIR -replace '\\', '/'
          $comspec = $env:ComSpec -replace '\\', '/'
          $common = @('--config=windows', '--config=clang-cl', '--jobs=HOST_CPUS*.75', '--nostamp',
                      "--workspace_status_command=echo.",
                      "--disk_cache=$diskCache")
          if ($env:WIN_CACHE_MAX_SIZE) { $common += "--experimental_disk_cache_gc_max_size=$($env:WIN_CACHE_MAX_SIZE)" }
          if (Test-Path -LiteralPath 'vendor') { $common = @('--config=vendored') + $common }
          if ($env:BAZEL_REMOTE_CACHE_URL) {
            $common += "--remote_cache=$($env:BAZEL_REMOTE_CACHE_URL)"
            Write-Host "using the remote cache"
          } else {
            Write-Host "::notice::BAZEL_REMOTE_CACHE_URL not set: building without the remote cache (docs/ci/runner-environment.md)"
          }
          # Shut down a stale server so it picks up the vcvars-enriched PATH.
          & { $ErrorActionPreference = 'Continue'; & $bazel $root shutdown 2>$null } *>$null
          # A branch that predates a tool takes it from master (docs/ci/pipelines.md;
          # canonical copy of this block: the Build the IIS module step).
          $dbt = 'tools\ci\Get-DefaultBranchTool.ps1'
          if (-not (Test-Path -LiteralPath $dbt)) {
            git fetch --quiet --depth=1 origin master
            $dbt = Join-Path $env:RUNNER_TEMP 'Get-DefaultBranchTool.ps1'
            git show 'FETCH_HEAD:tools/ci/Get-DefaultBranchTool.ps1' | Set-Content -Encoding ascii -LiteralPath $dbt
          }
          if (Test-Path tools\ci\Get-DefaultBranchTool_test.ps1) { powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\Get-DefaultBranchTool_test.ps1"; if ($LASTEXITCODE -ne 0) { Write-Host "::error::Get-DefaultBranchTool self-test failed (exit $LASTEXITCODE)"; exit 1 } }
          $prune = & $dbt -Path 'tools/ci/Prune-WinDiskCache.ps1' -With 'tools/ci/Prune-WinDiskCache_test.ps1' | Select-Object -Last 1
          if (-not $prune -or -not (Test-Path -LiteralPath $prune)) { Write-Host "::error::could not locate Prune-WinDiskCache.ps1"; exit 1 }
          $pruneTest = Join-Path (Split-Path -Parent $prune) 'Prune-WinDiskCache_test.ps1'
          powershell -NoProfile -ExecutionPolicy Bypass -File $pruneTest
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Prune-WinDiskCache self-test failed (exit $LASTEXITCODE)"; exit 1 }
          # Bazel's own cache collection never runs here (the server is shut down
          # before it is idle); cap the disk cache with CI_WIN_CACHE_MAX_SIZE ourselves.
          if ($env:WIN_CACHE_DIR) { & $prune -CacheDir $env:WIN_CACHE_DIR }
          # Build-tool runfiles trees with junctions that an earlier job left in this
          # output base break rules_foreign_cc's tool copy; drop them first, after
          # the cleanup's own hermetic test.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\Remove-StaleToolRunfiles_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Remove-StaleToolRunfiles self-test failed (exit $LASTEXITCODE)"; exit 1 }
          $outputBase = "$(& $bazel $root info output_base 2>$null)".Trim()
          if ($outputBase) { & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\Remove-StaleToolRunfiles.ps1') -OutputBase $outputBase }
          & $bazel $root build @common -- //pagespeed/iis:pagespeed_iis.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Stage the bundle: the module plus its debug symbols and provenance.
          $staging = Join-Path $env:GITHUB_WORKSPACE '.ci-artifacts'
          if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          # bazel-bin is a convenience link that a runner without link
          # privileges does not have, so ask Bazel.
          $bazelBin = (& $bazel $root info @common bazel-bin 2>$null).Trim()
          Copy-Item "$bazelBin\pagespeed\iis\pagespeed_iis.dll" "$staging\"
          Get-ChildItem $bazelBin -Recurse -Filter '*.pdb' | Where-Object {
            $_.Name -match 'pagespeed_iis'
          } | ForEach-Object { Copy-Item $_.FullName "$staging\" }
          $ts = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $meta = @{commit=$env:GITHUB_SHA; branch=$env:GITHUB_REF_NAME; run="$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"; platform='win-x64'; config='windows+clang-cl'; timestamp=$ts} | ConvertTo-Json -Compress
          Set-Content -LiteralPath "$staging\metadata.json" -Value $meta -Encoding ASCII
          Get-ChildItem $staging -File | Where-Object { $_.Name -ne 'checksums.sha256' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath "$staging\checksums.sha256" -Encoding ASCII
          Write-Host 'CI artifacts (win-x64):'
          Get-ChildItem $staging | Format-Table Name, Length

      # The bundle passes to later jobs as a GitHub artifact (retention 3
      # days), like the Linux bundle; nothing goes to a host-specific path.
      - name: Upload the build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-artifacts-win-x64
          path: .ci-artifacts
          retention-days: 3
          include-hidden-files: true


  windows-unit-tests:
    name: Windows Unit Tests
    needs: [vendor, windows-build]
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'windows-2022' || 'fleet-windows' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      # The fleet runners carry the same setting; byte-compared fixtures need LF.
      - name: Check out with LF line endings (hosted runner)
        if: runner.environment == 'github-hosted'
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hosted runners get the pinned toolchain installed; a fleet runner
      # provides it through its own environment (CI_WIN_TOOLS_DIR,
      # CI_WIN_LLVM_DIR, CI_WIN_PYTHON_DIR; docs/ci/runner-environment.md).
      - name: Provision the toolchain (hosted runner)
        if: runner.environment == 'github-hosted'
        run: |
          $ErrorActionPreference = 'Stop'
          # NASM is pinned to 2.16.03: the AV1 codec dependency rejects 3.x.
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::nasm install failed"; exit 1 }
          (Join-Path $env:ProgramFiles 'NASM') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # clang-cl comes from LLVM 19.
          $major = 0
          $cc = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($cc) { $v = (& clang-cl --version 2>&1 | Select-Object -First 1); if ($v -match 'version (\d+)') { $major = [int]$Matches[1] } }
          if ($major -ne 19) {
            choco install llvm --version=19.1.7 --allow-downgrade -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::llvm install failed"; exit 1 }
          }
          (Join-Path $env:ProgramFiles 'LLVM\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # gperf for the Bazel genrules, from the MSYS2 that ships with the image.
          & (Join-Path $env:SystemDrive 'msys64\usr\bin\pacman.exe') -Sy --noconfirm --needed gperf
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gperf install failed"; exit 1 }

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tool locations come from PATH, or from the runner's environment when
      # it provides one. Nothing here names a drive, a user profile or an
      # installation directory, and no tool location is printed.
      - name: Resolve the runner environment
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-JobEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          function Add-ToolDir([string]$Dir) {
            if ($Dir -and (Test-Path -LiteralPath $Dir)) {
              $Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = ($Dir + ';' + $env:PATH)
              return $true
            }
            return $false
          }
          # CI_WIN_TOOLS_DIR is a semicolon-separated list of directories.
          $toolDirs = @()
          if ($env:CI_WIN_TOOLS_DIR) {
            $toolDirs = @($env:CI_WIN_TOOLS_DIR -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
          }
          [array]::Reverse($toolDirs)
          foreach ($d in $toolDirs) { [void](Add-ToolDir $d) }
          [array]::Reverse($toolDirs)
          if ($toolDirs.Count -gt 0) { Write-Host "using the runner's tool directories" }
          # LLVM 19 (clang-cl) and Python 3.12 (ahead of Git for Windows'
          # python stub) when the runner names them.
          if ($env:CI_WIN_LLVM_DIR) { [void](Add-ToolDir (Join-Path $env:CI_WIN_LLVM_DIR 'bin')) }
          if ($env:CI_WIN_PYTHON_DIR) { [void](Add-ToolDir $env:CI_WIN_PYTHON_DIR) }
          $bazel = @('bazelisk', 'bazel') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $bazel) {
            Write-Host "::error::neither bazelisk nor bazel is on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_CMD' $bazel
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\Check-BazelVersion.ps1') -Launcher $bazel -Root $env:GITHUB_WORKSPACE
          # clang-cl: Bazel finds the LLVM installation through BAZEL_LLVM.
          if ($env:CI_WIN_LLVM_DIR -and (Test-Path -LiteralPath (Join-Path $env:CI_WIN_LLVM_DIR 'bin\clang-cl.exe'))) {
            $env:PATH = (Join-Path $env:CI_WIN_LLVM_DIR 'bin') + ';' + $env:PATH
          } elseif ($env:CI_WIN_LLVM_DIR -and (Test-Path -LiteralPath (Join-Path $env:CI_WIN_LLVM_DIR 'clang-cl.exe'))) {
            $env:PATH = $env:CI_WIN_LLVM_DIR + ';' + $env:PATH
          }
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            Write-Host "::error::clang-cl (LLVM 19) is not on PATH; see docs/ci/runner-environment.md (CI_WIN_LLVM_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_LLVM' (Split-Path -Parent (Split-Path -Parent $clangCl.Source))
          # The AV1 encoder needs NASM 2.16.03 (nasm 3.x dropped the "-Ox"
          # line from `nasm -hf` that the codec build greps for). Fail early
          # and legibly instead of deep inside a configure log.
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Write-Host "::error::nasm 2.16.03 is not on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          if (-not (& nasm -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            Write-Host "::error::the nasm on PATH is not usable by the AV1 codec build (no '-Ox' in -hf output; 3.x is not supported). Provide 2.16.03."
            exit 1
          }
          # Bazel's shell: the runner's, else MSYS2 bash, else Git bash.
          $bashCandidates = @()
          if ($env:BAZEL_SH) { $bashCandidates += $env:BAZEL_SH }
          foreach ($d in $toolDirs) { $bashCandidates += (Join-Path $d 'bash.exe') }
          $bashCandidates += (Join-Path $env:SystemDrive 'msys64\usr\bin\bash.exe')
          $bashCandidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
          $bash = $bashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) {
            Write-Host "::error::no bash.exe found for Bazel (MSYS2 or Git for Windows); see docs/ci/runner-environment.md"
            exit 1
          }
          Set-JobEnv 'BAZEL_SH' $bash
          # A short output root keeps paths under the Windows length limit.
          Set-JobEnv 'WIN_BAZEL_OUTPUT_ROOT' ($(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/')
          # Bazel disk cache: the runner's directory when it names one (with
          # its size cap), else a directory under the job's temporary
          # directory that is lost with the job.
          Set-JobEnv 'WIN_CACHE_DIR' $(if ($env:CI_WIN_CACHE_DIR) { $env:CI_WIN_CACHE_DIR } else { Join-Path $env:RUNNER_TEMP 'bazel-disk' })
          if ($env:CI_WIN_CACHE_MAX_SIZE) { Set-JobEnv 'WIN_CACHE_MAX_SIZE' $env:CI_WIN_CACHE_MAX_SIZE }
          Set-JobEnv 'WIN_VENDOR_DL_DIR' (Join-Path $env:RUNNER_TEMP 'vendor-download')
          Write-Host "build tool: $bazel"

      # The Windows build does not use actions/cache for vendor/: a vendor tree
      # saved on Linux does not restore here. On the hub channel the runner
      # takes the tarball the vendor job published (a local directory shared
      # with the Linux jobs of the same machine, or the hub); in every other
      # case Bazel fetches the dependencies itself.
      - name: Fetch the vendored tree (hub channel)
        env:
          VENDOR_CHANNEL: ${{ needs.vendor.outputs.channel }}
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VENDOR_CHANNEL -ne 'hub') {
            Write-Host "vendor channel is '$($env:VENDOR_CHANNEL)': Bazel fetches dependencies directly"
            exit 0
          }
          $name = "mod_pagespeed-$($env:VENDOR_SHORT_SHA).tar.zst"
          # Never extract straight from a directory that Linux jobs of the
          # same machine publish into and prune: stage a private copy, check
          # it against the sidecar digest (retrying a copy that is short or
          # mid-publish), and decompress and extract only that copy
          # (tools/ci/fetch-vendor-tarball.ps1).
          $dirs = @($env:CI_WIN_VENDOR_DIR) | Where-Object { $_ }
          & "$($env:GITHUB_WORKSPACE)\tools\ci\fetch-vendor-tarball.ps1" `
            -Name $name -Dest $env:GITHUB_WORKSPACE -StageDir $env:WIN_VENDOR_DL_DIR `
            -SearchDirs $dirs -HubSsh $env:CI_HUB_SSH -HubDir $env:CI_HUB_VENDOR_DIR
          $rc = $LASTEXITCODE
          if ($rc -eq 4) {
            if ($env:CI_HUB_SSH -and $env:CI_HUB_VENDOR_DIR) {
              Write-Host "::warning::[vendor-tarball-unavailable] the vendor tarball could not be fetched from the CI hub; it may have aged out of the hub's retention window. Re-run the full workflow, not only the failed jobs, to regenerate it."
            }
            Write-Host "::notice::no vendor tarball reachable from this runner: Bazel fetches dependencies directly (docs/ci/runner-environment.md)"
            exit 0
          }
          if ($rc -ne 0) { exit $rc }
          $stamped = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GIT_COMMIT') -Raw).Trim()
          if ($stamped -ne $env:GITHUB_SHA) {
            Write-Host "::error::[vendor-tarball-unavailable] stale GIT_COMMIT stamp in the extracted workspace; re-run the full workflow, not only the failed jobs"
            exit 1
          }

      # Age-guarded prune of the vendor download directory (a 2 hour window on
      # top of the host's own housekeeping), so an interrupted fetch or
      # extract cannot leave a multi-gigabyte file behind. A directory shared
      # with the Linux jobs (CI_WIN_VENDOR_DIR) is left to the Linux vendor
      # job. The hermetic self-test runs first; if it fails, the prune is
      # skipped. Housekeeping: continue-on-error, so it never blocks a merge.
      - name: Vendor fetch and prune scripts - self-test
        if: needs.vendor.outputs.channel == 'hub'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::prune-win-vendor self-test failed (exit $LASTEXITCODE)"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($env:GITHUB_WORKSPACE)\tools\ci\fetch-vendor-tarball_test.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::fetch-vendor-tarball self-test failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Prune the vendor download directory
        if: needs.vendor.outputs.channel == 'hub'
        continue-on-error: true
        env:
          VENDOR_SHORT_SHA: ${{ needs.vendor.outputs.short_sha }}
        run: |
          & "$($env:GITHUB_WORKSPACE)\tools\ci\prune-win-vendor.ps1" `
            -VendorDir $env:WIN_VENDOR_DL_DIR -ShortSha $env:VENDOR_SHORT_SHA

      - name: Set up MSVC environment
        run: |
          $ErrorActionPreference = 'Continue'
          # Source vcvars64 and export INCLUDE/LIB/PATH for the later steps.
          $vsDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsDir = & $vswhere -products * -latest -property installationPath 2>$null
          }
          if (-not $vsDir -or -not (Test-Path -LiteralPath "$vsDir\VC\Auxiliary\Build\vcvars64.bat")) {
            # Fallback: probe the usual installation directories.
            $vsDir = @(
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\Community')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vsDir) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = "$vsDir\VC\Auxiliary\Build\vcvars64.bat"
          # Full path through ComSpec: an MSYS2 cmd on PATH would shadow
          # System32\cmd.exe.
          & "$env:ComSpec" /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^PATH=(.*)$') {
              $vcPath = $Matches[1]
            } elseif ($_ -match '^(INCLUDE|LIB)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # MSYS2 coreutils and Ninja go on PATH for the genrule cmake builds.
          $extra = Join-Path $env:SystemDrive 'msys64\usr\bin'
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) { $extra = "$extra;" + (Split-Path $ninja.Source) }
          # One PATH line: the vcvars PATH (MSVC and Windows Kits tools, plus the
          # original PATH) behind MSYS2 and Ninja. A later line would override it.
          if (-not $vcPath) { $vcPath = $env:PATH }
          "PATH=$extra;$vcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run unit tests
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location $env:GITHUB_WORKSPACE
          $bazel = $env:BAZEL_CMD
          $root = "--output_user_root=$($env:WIN_BAZEL_OUTPUT_ROOT)"
          # Forward slashes for every Bazel path (a Windows Bazel requirement).
          $diskCache = $env:WIN_CACHE_DIR -replace '\\', '/'
          $comspec = $env:ComSpec -replace '\\', '/'
          $common = @('--config=windows', '--config=clang-cl', '--jobs=HOST_CPUS*.75', '--nostamp',
                      "--workspace_status_command=echo.",
                      "--disk_cache=$diskCache")
          if ($env:WIN_CACHE_MAX_SIZE) { $common += "--experimental_disk_cache_gc_max_size=$($env:WIN_CACHE_MAX_SIZE)" }
          if (Test-Path -LiteralPath 'vendor') { $common = @('--config=vendored') + $common }
          if ($env:BAZEL_REMOTE_CACHE_URL) {
            $common += "--remote_cache=$($env:BAZEL_REMOTE_CACHE_URL)"
            Write-Host "using the remote cache"
          } else {
            Write-Host "::notice::BAZEL_REMOTE_CACHE_URL not set: building without the remote cache (docs/ci/runner-environment.md)"
          }
          # Shut down a stale server so it picks up the vcvars-enriched PATH.
          & { $ErrorActionPreference = 'Continue'; & $bazel $root shutdown 2>$null } *>$null
          # A branch that predates a tool takes it from master (docs/ci/pipelines.md;
          # canonical copy of this block: the Build the IIS module step).
          $dbt = 'tools\ci\Get-DefaultBranchTool.ps1'
          if (-not (Test-Path -LiteralPath $dbt)) {
            git fetch --quiet --depth=1 origin master
            $dbt = Join-Path $env:RUNNER_TEMP 'Get-DefaultBranchTool.ps1'
            git show 'FETCH_HEAD:tools/ci/Get-DefaultBranchTool.ps1' | Set-Content -Encoding ascii -LiteralPath $dbt
          }
          $prune = & $dbt -Path 'tools/ci/Prune-WinDiskCache.ps1' | Select-Object -Last 1
          if (-not $prune -or -not (Test-Path -LiteralPath $prune)) { Write-Host "::error::could not locate Prune-WinDiskCache.ps1"; exit 1 }
          # Bazel's own cache collection never runs here (the server is shut down
          # before it is idle); cap the disk cache with CI_WIN_CACHE_MAX_SIZE ourselves.
          if ($env:WIN_CACHE_DIR) { & $prune -CacheDir $env:WIN_CACHE_DIR }
          # Build-tool runfiles trees with junctions that an earlier job left in this
          # output base break rules_foreign_cc's tool copy; drop them first.
          $outputBase = "$(& $bazel $root info output_base 2>$null)".Trim()
          if ($outputBase) { & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\Remove-StaleToolRunfiles.ps1') -OutputBase $outputBase }
          & $bazel $root test @common --test_output=errors --keep_going -- `
            //test/pagespeed/iis/... `
            //test/pagespeed/system:daemon_adapter_test `
            //test/pagespeed/kernel/image:avif_test `
            //test/pagespeed/kernel/packs/...
          exit $LASTEXITCODE


  # The IIS system tests run the module under a real IIS on a host the job
  # administers (sites, application pools, ports, the default web site). There
  # is no hosted twin, so a fork or Dependabot pull request skips the job (it
  # is skipped, not failed), and so does any run while FLEET_ENABLED is
  # 'false' or FLEET_IIS_ENABLED is not 'true', and a pull request or merge
  # group whose changed files cannot affect IIS (the iis path filter of the
  # changes job). The module under test comes from the windows-build bundle; nothing
  # is built here. The job holds no secret and no write token.
  iis-sys-tests:
    name: IIS System Tests
    needs: [changes, windows-build, windows-unit-tests]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-iis' }}
    if: ${{ (vars.FLEET_ENABLED != 'false' && vars.FLEET_IIS_ENABLED == 'true' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && needs.changes.outputs.iis == 'true' }}
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      # This job runs pull request code with administrator rights. The guest
      # password that the host's runner environment holds is for the release
      # gates only, so it is blanked for every later step of this job.
      - name: Withhold the guest password
        run: |
          "CI_IIS_VM_ADMIN_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tool locations come from PATH, or from the runner's environment when
      # it provides one (docs/ci/runner-environment.md). Nothing here names a
      # drive, a user profile or an installation directory, and no tool
      # location is printed.
      - name: Resolve the runner environment
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-JobEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          function Add-ToolDir([string]$Dir) {
            if ($Dir -and (Test-Path -LiteralPath $Dir)) {
              $Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = ($Dir + ';' + $env:PATH)
              return $true
            }
            return $false
          }
          # CI_WIN_TOOLS_DIR is a semicolon-separated list of directories.
          $toolDirs = @()
          if ($env:CI_WIN_TOOLS_DIR) {
            $toolDirs = @($env:CI_WIN_TOOLS_DIR -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
          }
          [array]::Reverse($toolDirs)
          foreach ($d in $toolDirs) { [void](Add-ToolDir $d) }
          if ($toolDirs.Count -gt 0) { Write-Host "using the runner's tool directories" }
          # Python 3.12 ahead of Git for Windows' python stub, when named.
          if ($env:CI_WIN_PYTHON_DIR) { [void](Add-ToolDir $env:CI_WIN_PYTHON_DIR) }
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python -or $python.Source -like '*\WindowsApps\*') {
            Write-Host "::error::no usable python on PATH; see docs/ci/runner-environment.md (CI_WIN_PYTHON_DIR)"
            exit 1
          }
          # The dump directory is the runner's when it names one; the scripts
          # read it as PAGESPEED_DUMP_DIR. The evidence directory is what the
          # failure upload ships (crash dumps are staged into it).
          $dumpDir = if ($env:CI_WIN_DUMP_DIR) { $env:CI_WIN_DUMP_DIR } else { Join-Path $env:RUNNER_TEMP 'dumps' }
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          Set-JobEnv 'PAGESPEED_DUMP_DIR' $dumpDir
          $evidence = Join-Path $env:RUNNER_TEMP 'iis-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Set-JobEnv 'PAGESPEED_EVIDENCE_DIR' $evidence
          Write-Host "dump and evidence directories ready"

      # Visual Studio's runtime directories on PATH, found with vswhere and
      # then by probing the usual installation directories. The module is
      # already built, so a host without Visual Studio only warns.
      - name: Set up the MSVC runtime environment
        run: |
          $ErrorActionPreference = 'Continue'
          $vsDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsDir = & $vswhere -products * -latest -property installationPath 2>$null
          }
          if (-not $vsDir -or -not (Test-Path -LiteralPath "$vsDir\VC\Auxiliary\Build\vcvars64.bat")) {
            $vsDir = @(
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\Community')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vsDir) {
            Write-Host "::warning::no Visual Studio installation found; relying on the runtime already on the host"
            exit 0
          }
          $vcvars = "$vsDir\VC\Auxiliary\Build\vcvars64.bat"
          # Full path through ComSpec: an MSYS2 cmd on PATH would shadow
          # System32\cmd.exe.
          & "$env:ComSpec" /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^(PATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      # The module the windows-build job produced, checked against the
      # checksums that job wrote, and placed where the IIS harness looks.
      - name: Download the Windows build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifacts-win-x64
          path: .ci-artifacts

      - name: Place the module
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE '.ci-artifacts'
          $dll = Join-Path $bundle 'pagespeed_iis.dll'
          if (-not (Test-Path -LiteralPath $dll) -or (Get-Item -LiteralPath $dll).Length -eq 0) {
            Write-Host "::error::pagespeed_iis.dll is missing from the build bundle; re-run the full workflow, not only the failed jobs"
            exit 1
          }
          $sums = Join-Path $bundle 'checksums.sha256'
          if (Test-Path -LiteralPath $sums) {
            $want = (Get-Content -LiteralPath $sums | Where-Object { $_ -match 'pagespeed_iis\.dll$' } |
              ForEach-Object { ($_ -split '\s+')[0] } | Select-Object -First 1)
            if ($want) {
              $got = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLower()
              if ($got -ne $want.ToLower()) {
                Write-Host "::error::pagespeed_iis.dll does not match checksums.sha256 (partial or corrupt download); re-run the full workflow"
                exit 1
              }
              Write-Host "pagespeed_iis.dll verified against checksums.sha256"
            }
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'bazel-bin\pagespeed\iis'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath $dll -Destination $dest -Force
          Get-ChildItem -LiteralPath $bundle -Filter '*.pdb' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest -Force }

      - name: Install test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet -r test\system\requirements.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install of the test dependencies failed"; exit 1 }

      # A previous job may have left Application Verifier or page heap armed
      # for the worker; the system tests must run without either.
      - name: Clear stale Application Verifier settings
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Command appverif -ErrorAction SilentlyContinue) {
            & appverif -disable * -for w3wp.exe 2>$null | Out-Null
          }
          $gflags = Get-Command gflags -ErrorAction SilentlyContinue
          if (-not $gflags) {
            $probe = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\gflags.exe'
            if (Test-Path -LiteralPath $probe) { $gflags = $probe }
          }
          if ($gflags) { & $gflags /p /disable w3wp.exe 2>$null | Out-Null }
          $global:LASTEXITCODE = 0
          Write-Host "Application Verifier and page heap cleared for w3wp.exe"

      # Windows Error Reporting keeps a full dump of any worker that dies
      # during the run, in the dump directory; the run's start time tells this
      # run's dumps from older ones. The files are written outside the job's
      # directories, so cleanup removes this run's dumps again.
      - name: Arm worker crash dumps
        run: |
          $ErrorActionPreference = 'Stop'
          "IIS_RUN_T0=$((Get-Date).ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & .\tools\ci\Set-WerLocalDumps.ps1 -Enable -DumpDir $env:PAGESPEED_DUMP_DIR | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not arm crash dumps"; exit 1 }

      # The optimizer worker the module's daemon paths talk to: the pinned
      # optimizer release's Windows zip, fetched and verified the way the
      # installer does it, started as a background process with its volume
      # under C:\pagespeed_optimizer and the management API on loopback
      # behind a token generated for this run. It is started in the test step
      # itself, right before the tests, and its environment reaches the test
      # script through the same session, and setup_iis_full.ps1
      # writes DaemonSocketPath and DaemonVolumePath into the configuration
      # of an extra site only (its URL is exported as
      # PAGESPEED_IIS_DAEMON_SITE_URL), so the main site keeps classic
      # in-place optimization. The volume is emptied at each start. A pinned
      # release that cannot be fetched fails the job; it is never skipped.
      # Full IIS, not IIS Express: the runner is a service, and IIS Express
      # needs an interactive desktop session.
      - name: Run the IIS system tests
        timeout-minutes: 35
        env:
          # Cold IIS under load can push a CSS-filter rewrite past its default
          # fetch budget while the server still converges; the multiplier and
          # one extra fetch attempt buy wall-clock only. A rewrite that never
          # converges still times out.
          PAGESPEED_TEST_TIMEOUT_MULTIPLIER: "3"
          PAGESPEED_TEST_FETCH_RETRIES: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\ci\Start-OptimizerWorker.ps1 -Action start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\test\system\run_iis_tests.ps1 -SkipBuild -UseFullIIS -Verbose
          exit $LASTEXITCODE

      # The worker goes down with the job's tests, whatever their outcome; its
      # logs are in the evidence directory the failure upload ships.
      - name: Stop the optimizer worker
        if: ${{ always() }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          .\tools\ci\Start-OptimizerWorker.ps1 -Action stop
          $global:LASTEXITCODE = 0

      # On a failure, stage this run's dumps (compressed, with a decode when
      # symbols are available) into the evidence directory that the upload
      # below ships. The multi-gigabyte originals never leave the host.
      - name: Collect crash dumps
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $since = [DateTime]::Parse($env:IIS_RUN_T0)
          & .\tools\ci\Collect-CrashDumps.ps1 -DumpDir $env:PAGESPEED_DUMP_DIR `
            -StageDir (Join-Path $env:PAGESPEED_EVIDENCE_DIR 'crash-dumps') `
            -Since $since -SymbolDir (Join-Path $env:GITHUB_WORKSPACE '.ci-artifacts')
          $global:LASTEXITCODE = 0

      # Leave the host as found: no verifier settings, no dump override (this
      # run's dumps are removed, older ones stay), and a stopped test site.
      # Each tolerates a host that is already clean.
      - name: Clean up the host
        if: ${{ always() }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Command appverif -ErrorAction SilentlyContinue) {
            & appverif -disable * -for w3wp.exe 2>$null | Out-Null
          }
          if ($env:IIS_RUN_T0) {
            & .\tools\ci\Set-WerLocalDumps.ps1 -Disable -DumpDir $env:PAGESPEED_DUMP_DIR -Purge -Since ([DateTime]::Parse($env:IIS_RUN_T0)) | Out-Null
          }
          & .\test\system\setup_iis_full.ps1 -Action stop -SourceRoot $env:GITHUB_WORKSPACE 2>$null | Out-Null
          $global:LASTEXITCODE = 0

      - name: Upload the evidence
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iis-sys-tests-evidence
          path: ${{ runner.temp }}/iis-evidence
          retention-days: 7
          if-no-files-found: ignore

  upgrade-rehearsal:
    name: Upgrade rehearsal (${{ matrix.distro }})
    needs: upgrade-rehearsal-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.upgrade-rehearsal-plan.outputs.distros) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Rehearse the previous release to ${{ needs.upgrade-rehearsal-plan.outputs.rc }} on ${{ matrix.distro }}
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ needs.upgrade-rehearsal-plan.outputs.rc }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          # The module releases that carry the previous pair are not published
          # in this repository until the public release lane does so; until
          # then the rehearsal has nothing to install and steps aside.
          if ! gh release view "v${RC}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::no release v${RC} in this repository yet; the upgrade rehearsal runs once the module releases are published here"
            exit 0
          fi
          bash install/upgrade_test/run_upgrade_test.sh \
            --rc "${RC}" --distro "${DISTRO}" \
            --work "${RUNNER_TEMP}/upgrade-rehearsal-${DISTRO}"

      # Debugging aid for a failed rehearsal, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-rehearsal-${{ matrix.distro }}-logs
          path: ${{ runner.temp }}/upgrade-rehearsal-${{ matrix.distro }}/logs
          if-no-files-found: ignore
          retention-days: 3

  # Kill switch notice. While the repository variable FLEET_ENABLED is 'false'
  # every build runner job here runs on its hosted twin, and the jobs that
  # have no hosted twin (the IIS and Application Verifier lanes and the
  # privileged stress rigs) are skipped. This job only says so, in an
  # annotation and the job summary, so a skipped check is never a silent one.
  fleet-off-notice:
    name: Shared build runners are switched off
    if: ${{ vars.FLEET_ENABLED == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what the switch changed
        run: |
          echo "::notice::FLEET_ENABLED is 'false': build runner jobs run on hosted runners; jobs that need a build runner host are skipped."
          {
            echo "### Shared build runners are switched off"
            echo
            echo "The repository variable FLEET_ENABLED is 'false'. Jobs that normally use the"
            echo "build runners ran on GitHub-hosted runners, slower and without the shared caches."
            echo "Jobs that need a host only the build runners provide were skipped."
            echo "Set FLEET_ENABLED back to 'true' to use the build runners again."
          } >> "$GITHUB_STEP_SUMMARY"

  # The IIS system tests may be skipped for five reasons only: the switch is
  # off, the event is a fork or Dependabot pull request, the class is not
  # registered (FLEET_IIS_ENABLED is not 'true'), the path filter found no
  # IIS-relevant change, or a job they need failed.
  # Any other skip is a routing mistake and fails here, so the CI gate never
  # accepts it silently.
  fleet-only-skip-check:
    name: IIS system tests ran or were switched off
    needs: [changes, windows-build, windows-unit-tests, iis-sys-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IIS_RESULT: ${{ needs.iis-sys-tests.result }}
      BUILD_RESULT: ${{ needs.windows-build.result }}
      UNIT_RESULT: ${{ needs.windows-unit-tests.result }}
      FLEET: ${{ vars.FLEET_ENABLED }}
      FLEET_IIS: ${{ vars.FLEET_IIS_ENABLED }}
      IIS_FILTER: ${{ needs.changes.outputs.iis }}
      FORK_OR_BOT: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
    steps:
      - name: Check the IIS system tests
        run: |
          echo "iis-sys-tests=${IIS_RESULT} windows-build=${BUILD_RESULT} windows-unit-tests=${UNIT_RESULT}"
          [ "${IIS_RESULT}" = skipped ] || exit 0
          [ "${BUILD_RESULT}" = success ] && [ "${UNIT_RESULT}" = success ] || exit 0
          if [ "$(printf %s "${FLEET}" | tr A-Z a-z)" = false ]; then
            echo "::notice::IIS system tests skipped: FLEET_ENABLED is 'false'"
          elif [ "${FORK_OR_BOT}" = true ]; then
            echo "::notice::IIS system tests skipped: fork or Dependabot pull request"
          elif [ "${FLEET_IIS}" != true ]; then
            echo "::notice::IIS system tests skipped: FLEET_IIS_ENABLED is not 'true'"
          elif [ "${IIS_FILTER}" = false ]; then
            echo "::notice::IIS system tests skipped: no IIS-relevant change"
          else
            echo "::error::IIS system tests were skipped with the fleet on and the class enabled"
            exit 1
          fi

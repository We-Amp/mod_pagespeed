#
# Exercise a pipeline change on the fleet before it reaches master: push the
# change to the ci-dev branch, then dispatch this workflow. It calls the PR
# tier at @ci-dev instead of @master. See docs/ci/pipelines.md.

name: CI (ci-dev)

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier (pipeline-full.yml@ci-dev)
        type: boolean
        default: false

concurrency:
  group: ci-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    # The called pipeline requests pull-requests: read for the release-note
    # gate, contents: write for its lock-push job alone (pushes a
    # regenerated MODULE.bazel.lock to a same-repository PR branch; it never
    # runs for a merge group or a fork) and checks: read for its fleet scope
    # (reads the commit's check suites); a called workflow cannot exceed what
    # its caller grants.
    permissions:
      checks: read
      contents: write
      pull-requests: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-pr.yml@ci-dev

  # Dispatch with full=true to exercise pipeline-full.yml from the ci-dev
  # branch; actions: read is for its path filter (reads the push runs of the
  # default branch), and a called workflow cannot exceed what its caller grants.
  full:
    if: ${{ inputs.full }}
    permissions:
      actions: read
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@ci-dev

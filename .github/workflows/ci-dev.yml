#
# Exercise a pipeline change on the fleet before it reaches master: push the
# change to the ci-dev branch, then dispatch this workflow. It calls the PR
# tier at @ci-dev instead of @master. See docs/ci/pipelines.md.

name: CI (ci-dev)

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier (pipeline-full.yml@ci-dev)
        type: boolean
        default: false

concurrency:
  # Keyed on the ref: a stray dispatch from another ref runs no jobs (both
  # jobs require refs/heads/ci-dev) and must not cancel a ci-dev run.
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Both jobs run only on a dispatch from the ci-dev branch
  # (`gh workflow run ci-dev.yml --ref ci-dev`, docs/ci/pipelines.md), so the
  # pipelines @ci-dev never run under another ref's name.
  pr:
    if: ${{ github.ref == 'refs/heads/ci-dev' }}
    # The called pipeline requests pull-requests: read for the release-note
    # gate, contents: write for its lock-push job alone (pushes a
    # regenerated MODULE.bazel.lock to a same-repository PR branch; it never
    # runs for a merge group or a fork) and checks: read for its fleet scope
    # (reads the commit's check suites), and actions: read for the IIS retry
    # legs (read the run's job list to land on another runner); a called
    # workflow cannot exceed what its caller grants.
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-pr.yml@ci-dev

  # Dispatch with full=true to exercise pipeline-full.yml from the ci-dev
  # branch; actions: read is for its path filter (reads the push runs of the
  # default branch), and a called workflow cannot exceed what its caller grants.
  full:
    if: ${{ inputs.full && github.ref == 'refs/heads/ci-dev' }}
    permissions:
      actions: read
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@ci-dev

  # A dispatch on any other ref skips both jobs above; this job turns such a
  # run red instead of a green run where everything was skipped.
  ref-check:
    name: Dispatched on ci-dev
    permissions: {}
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The run's ref is refs/heads/ci-dev
        env:
          REF: ${{ github.ref }}
        run: |
          [ "${REF}" = refs/heads/ci-dev ] || { echo "::error::dispatch ci-dev.yml on the ci-dev branch (gh workflow run ci-dev.yml --ref ci-dev), not on '${REF}'; nothing ran"; exit 1; }
          echo "dispatch on ${REF}"

#
# Exercise a pipeline change on the fleet before it reaches master: push the
# change to the ci-dev branch, then dispatch this workflow. It calls the PR
# tier at @ci-dev instead of @master. See docs/ci/pipelines.md.

name: CI (ci-dev)

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier (pipeline-full.yml@ci-dev)
        type: boolean
        default: false

concurrency:
  group: ci-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    # The called pipeline requests pull-requests: read for the release-note
    # gate; a called workflow cannot exceed what its caller grants.
    permissions:
      contents: read
      pull-requests: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-pr.yml@ci-dev

  # Dispatch with full=true to exercise pipeline-full.yml from the ci-dev
  # branch; the called workflow takes its permissions from the top level.
  full:
    if: ${{ inputs.full }}
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@ci-dev

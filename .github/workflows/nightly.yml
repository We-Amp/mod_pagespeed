#
# Nightly caller: schedule and manual dispatch. The nightly jobs live in
# pipeline-nightly.yml and the full tier in pipeline-full.yml (job `full`),
# both pinned to master. Every scheduled night runs both; a dispatch runs the
# full tier only with full_tier set. The hosted `nightly-red` job reports a
# red full tier in one issue. See docs/ci/pipelines.md.

name: Nightly

# A full-tier dispatch is titled `Nightly (full)`: the schedule guard and the
# external dispatcher count it as a real night. Any other dispatch is `Nightly`.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tier && 'Nightly (full)' || 'Nightly' }}

on:
  schedule:
    - cron: "17 4 * * 1-6"
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: libFuzzer time budget in seconds, per harness (1 to 1800)
        required: false
        default: "600"
      duration:
        description: Sanitizer stress duration in seconds (Apache, nginx and IIS rigs, 1 to 1800)
        required: false
        default: "600"
      concurrency:
        description: Concurrent request workers of the stress rigs
        required: false
        default: "16"
      protocols:
        description: Space separated curl protocol flags for the nginx protocol matrix (empty means h1 and h2)
        required: false
        default: ""
      arms:
        description: IIS Application Verifier arms, comma separated arm:iterations
        required: false
        default: "cuzz-nopageheap:5,cuzz-pageheap:3"
      severity:
        description: Severity floor of the NVD scan (low, medium, high, critical)
        required: false
        default: "medium"
      shared_cache_packages:
        description: "Shared-cache check packages: published (the public package repository) or local (built from this tree, with the pinned optimizer release)"
        type: choice
        options: [published, local]
        default: published
      full_tier:
        description: Also run the full tier (default branch only)
        type: boolean
        default: false

# One nightly at a time; a running nightly is never cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  # The schedule guard. GitHub's cron is best effort, and an external
  # scheduler also dispatches this workflow every night. A first-attempt
  # scheduled run skips all its work when a real night started in the
  # previous 20 hours, and cancels itself so that a skipped night reads
  # `cancelled`. A real night is a run on the default branch that is not
  # cancelled and is either a scheduled run or a full-tier dispatch (titled
  # `Nightly (full)`); other dispatches and skipped runs never count. A
  # dispatch and a re-run never skip. The guard runs inside the `nightly`
  # concurrency group, so a late cron run that waited for a running dispatch
  # sees that run. A queued dispatch can be replaced by a newer queued run in
  # the group; it then reads `cancelled`, is not counted, and the cron run
  # proceeds. Any error in the check leaves skip=false: a night that runs
  # twice is better than a night that is lost.
  guard:
    name: Schedule guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip a scheduled run when a real night started in the last 20 hours
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          skip=false
          if [ "${EVENT}" = schedule ] && [ "${ATTEMPT}" = 1 ]; then
            recent="$(gh api "repos/${REPO}/actions/workflows/nightly.yml/runs?per_page=50" 2>/dev/null \
              | jq -r --arg run "${RUN_ID}" --arg br "${DEFAULT_BRANCH}" --argjson now "$(date -u +%s)" \
                  '[.workflow_runs[]
                    | select((.id | tostring) != $run and .head_branch == $br and .conclusion != "cancelled"
                             and (.event == "schedule" or ((.display_title // "") | endswith("(full)")))
                             and ((.created_at | fromdateiso8601) > ($now - 72000)))] | length' 2>/dev/null || true)"
            case "${recent}" in
              ''|*[!0-9]*) echo "::notice::the guard could not read the run list; running" ;;
              0) echo "no real night in the last 20 hours; running" ;;
              *) skip=true; echo "::notice::${recent} real night(s) started in the last 20 hours; skipping this scheduled run" ;;
            esac
          fi
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"
      # A separate step, so the output is recorded before the run is
      # cancelled. If the cancel cannot be made to work the step fails, so a
      # skipped run never ends `success` and counts as a real night.
      - name: Cancel this skipped run
        if: steps.check.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          for _ in 1 2 3; do
            if gh run cancel "${RUN_ID}"; then sleep 30; exit 0; fi
            sleep 5
          done
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"; then sleep 30; exit 0; fi
          echo "::error::could not cancel this skipped run"
          exit 1

  nightly:
    needs: [guard]
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    # Nothing in the nightly tier writes to GitHub: read access is both the
    # ceiling the called workflow may narrow and everything it uses.
    permissions:
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-nightly.yml@master
    with:
      fuzz_seconds: ${{ inputs.fuzz_seconds || '600' }}
      duration: ${{ inputs.duration || '600' }}
      concurrency: ${{ inputs.concurrency || '16' }}
      protocols: ${{ inputs.protocols || '' }}
      arms: ${{ inputs.arms || 'cuzz-nopageheap:5,cuzz-pageheap:3' }}
      severity: ${{ inputs.severity || 'medium' }}
      shared_cache_packages: ${{ inputs.shared_cache_packages || 'published' }}

  # The full tier, named `full` like the push tier's call in ci.yml, so its
  # checks read `full / <job name>` in both. It runs on every scheduled night
  # and on a dispatch with full_tier set: the make-up path for a missed or
  # late night. The dispatch path also needs the default branch, so a
  # dispatch on ci-dev or any other ref never reaches it. It shares the
  # `nightly` concurrency group above, so it never starts while another
  # nightly is pending or running. A release-candidate nightly dispatch keeps
  # full_tier false: the candidate's CI dispatch with full=true covers the
  # full tier. actions: read is what the callee's change-detection job
  # (`changes`, the runs and jobs API) requests; a called workflow cannot
  # exceed what its caller grants, and a missing grant fails the whole run at
  # startup.
  full:
    needs: [guard]
    if: >-
      !cancelled() && needs.guard.outputs.skip != 'true' && (
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_tier && github.ref == 'refs/heads/master'))
    permissions:
      actions: read
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@master

  # The nightly-red issue (docs/ci/pipelines.md, "The nightly-red issue").
  # Hosted, no secret: it reads this run's own job list, because the caller
  # sees one result for `full` and a continue-on-error job never turns it
  # red, and opens, updates or closes one issue labelled nightly-red. The
  # issue body carries job names, SHAs, failing targets and run links only.
  # The script comes from master; on any other ref it is a dry run that
  # prints what it would write.
  nightly-red:
    name: Nightly full-tier report
    needs: [guard, full]
    if: always() && needs.guard.outputs.skip != 'true' && needs.full.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Open, update or close the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: master
          DRY_RUN: ${{ github.ref != 'refs/heads/master' }}
          RUNTIME_STEP_CHECKS: "full / Windows ASan=Run the unit tests under ASan"
        run: bash tools/ci/nightly_red_report.sh

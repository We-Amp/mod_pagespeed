#
# Nightly caller: schedule and manual dispatch. The nightly jobs live in
# pipeline-nightly.yml and the full tier in pipeline-full.yml (job `full`),
# both pinned to master. Every scheduled night runs both; a dispatch runs the
# full tier only with full_tier set. See docs/ci/pipelines.md.

name: Nightly

on:
  schedule:
    - cron: "0 4 * * 1-6"
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: libFuzzer time budget in seconds, per harness (1 to 1800)
        required: false
        default: "600"
      duration:
        description: Sanitizer stress duration in seconds (Apache, nginx and IIS rigs, 1 to 1800)
        required: false
        default: "600"
      concurrency:
        description: Concurrent request workers of the stress rigs
        required: false
        default: "16"
      protocols:
        description: Space separated curl protocol flags for the nginx protocol matrix (empty means h1 and h2)
        required: false
        default: ""
      arms:
        description: IIS Application Verifier arms, comma separated arm:iterations
        required: false
        default: "cuzz-nopageheap:5,cuzz-pageheap:3"
      severity:
        description: Severity floor of the NVD scan (low, medium, high, critical)
        required: false
        default: "medium"
      full_tier:
        description: Also run the full tier (default branch only)
        type: boolean
        default: false

# One nightly at a time; a running nightly is never cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    # Nothing in the nightly tier writes to GitHub: read access is both the
    # ceiling the called workflow may narrow and everything it uses.
    permissions:
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-nightly.yml@master
    with:
      fuzz_seconds: ${{ inputs.fuzz_seconds || '600' }}
      duration: ${{ inputs.duration || '600' }}
      concurrency: ${{ inputs.concurrency || '16' }}
      protocols: ${{ inputs.protocols || '' }}
      arms: ${{ inputs.arms || 'cuzz-nopageheap:5,cuzz-pageheap:3' }}
      severity: ${{ inputs.severity || 'medium' }}

  # The full tier, named `full` like the push tier's call in ci.yml, so its
  # checks read `full / <job name>` in both. It runs on every scheduled night
  # and on a dispatch with full_tier set: the make-up path for a missed or
  # late night. The dispatch path also needs the default branch, so a
  # dispatch on ci-dev or any other ref never reaches it. It shares the
  # `nightly` concurrency group above, so it never starts while another
  # nightly is pending or running. A release-candidate nightly dispatch keeps
  # full_tier false: the candidate's CI dispatch with full=true covers the
  # full tier. actions: read is what the callee's change-detection job
  # (`changes`, the runs and jobs API) requests; a called workflow cannot
  # exceed what its caller grants, and a missing grant fails the whole run at
  # startup.
  full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_tier && github.ref == 'refs/heads/master')
    permissions:
      actions: read
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@master

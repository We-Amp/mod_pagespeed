#
# The thin CI caller. It holds the triggers and the concurrency group; the
# pull request tier lives in the reusable workflow pipeline-pr.yml, pinned to
# master. See docs/ci/pipelines.md. Next to the call, three small hosted jobs
# run inline: the whole-tree Apache RAT license audit (tools/ci/rat.sh, backed
# by .rat-excludes), the public-tree hygiene gate with the workflow-shape
# gate (tools/ci/check-public-hygiene.sh, tools/ci/check-workflow-shape.sh)
# and the self-tests of the CI tooling. They are hosted-only on purpose.
#
# Required checks after the switch are named `pr / <job name>` (for example
# `pr / Blocking Dep Scan (npm)`), the inline jobs under their own names, and
# `CI gate`.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The merge queue's temporary branch: the same pipeline runs on the
  # queued merge result, and `CI gate` reports on it.
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier
        type: boolean
        default: false

# Cancel superseded pull request runs only; a push to master always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr:
    # The called pipeline requests pull-requests: read for the release-note
    # gate; a called workflow cannot exceed what its caller grants.
    permissions:
      contents: read
      pull-requests: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-pr.yml@master

  # The ci:full label is read when the pull request run starts (open, push,
  # reopen); after adding it, push or re-run to get the full tier.
  full:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@master

  rat:
    name: License audit (Apache RAT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      # tools/ci/rat.sh fetches the SHA-1-pinned RAT jar itself (fails
      # closed) and audits against .rat-excludes; the report is written
      # outside the checkout so RAT never audits its own output.
      - name: Run Apache RAT
        env:
          RAT_REPORT: ${{ runner.temp }}/rat-report.txt
        run: tools/ci/rat.sh
      - name: Upload RAT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rat-report
          path: ${{ runner.temp }}/rat-report.txt
          if-no-files-found: warn

  public-hygiene:
    name: Public-tree hygiene gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the tracked tree for non-public vocabulary
        run: tools/ci/check-public-hygiene.sh
      - name: Workflow-shape gate
        run: tools/ci/check-workflow-shape.sh
      - name: Workflow-shape gate fixtures
        run: tools/ci/test_check_workflow_shape.sh
      - name: Hygiene gate credential-rule fixtures
        run: tools/ci/test_check_public_hygiene.sh

  ci-tooling-tests:
    name: CI tooling self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hermetic: docker, ssh, rsync and gh are shims inside each test.
      - name: Release ref guard
        run: tools/ci/test_ref_guard.sh
      - name: System-test gate
        run: tools/ci/test_systest_gate.sh
      - name: Queued-run sweep
        run: tools/ci/test_sweep_queued_runs.sh
      - name: Post-merge tests never reuse cached results
        run: tools/ci/test_post_merge_nocache.sh
      - name: Artifact staging and bundle validation
        run: |
          tools/ci/test_stage_artifacts.sh
          tools/ci/validate-local-bundle_test.sh
      - name: Vendor tarball publish and extract
        run: |
          tools/ci/test_publish_vendor_tarball.sh
          tools/ci/test_extract_vendor_tarball.sh
          tools/ci/test_prune_vendor_dir.sh
      - name: Slot budget helper
        run: tools/ci/test_slot_budget.sh
      - name: Dev image naming and build lock
        run: tools/ci/test_ensure_dev_image.sh
      - name: Build script supply-chain checks
        run: tools/ci/test_build_nginx_verify.sh
      - name: Release lane tooling
        run: |
          tools/ci/release_version.sh --self-test
          python3 -I tools/ci/release_manifest.py --self-test
          python3 -I tools/ci/release_signature_check.py --self-test
          tools/ci/release_nginx.sh --self-test
          tools/ci/release_sidecar.sh --self-test
          python3 -I tools/ci/sidecar_pair_manifest.py --self-test
          tools/ci/release_ea4_build.sh --self-test
          python3 -I tools/ci/check_module_optimizer_version.py --self-test
          tools/ci/test_cache_gen_for_version.sh

  # Aggregate gate: the one check branch protection needs besides the
  # per-job ones. A called workflow cannot read needs.*.result of its
  # siblings, so this job runs inline, on a hosted label only.
  # A job skipped by its FLEET_ENABLED or FLEET_IIS_ENABLED term (the
  # fleet-iis class jobs) is accepted as skipped; failure and cancelled still
  # fail the gate.
  gate:
    name: CI gate
    needs: [rat, public-hygiene, ci-tooling-tests, pr, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a job finished with '${r}'"; exit 1 ;;
            esac
          done

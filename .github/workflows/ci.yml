#
# The thin CI caller. It holds the triggers and the concurrency group; the
# pull request tier lives in the reusable workflow pipeline-pr.yml, pinned to
# master. See docs/ci/pipelines.md. Next to the call, three small hosted jobs
# run inline: the whole-tree Apache RAT license audit (tools/ci/rat.sh, backed
# by .rat-excludes), the public-tree hygiene gate with the workflow-shape
# gate (tools/ci/check-public-hygiene.sh, tools/ci/check-workflow-shape.sh)
# and the self-tests of the CI tooling. They are hosted-only on purpose.
#
# Required checks after the switch are named `pr / <job name>` (for example
# `pr / Blocking Dep Scan (npm)`), the inline jobs under their own names, and
# `CI gate`.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The merge queue's temporary branch: the same pipeline runs on the
  # queued merge result, and `CI gate` reports on it.
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier
        type: boolean
        default: false

# Cancel superseded pull request runs only; a push to master always finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr:
    # The called pipeline requests pull-requests: read for the release-note
    # gate, contents: write for its lock-push job alone (pushes a regenerated
    # MODULE.bazel.lock to a same-repository PR branch; it never runs for a
    # merge group or a fork, and every other job is read-only) and checks:
    # read for its fleet scope (reads the commit's check suites) and actions:
    # read for the IIS retry legs (read the run's job list to land on another
    # runner); a called workflow cannot exceed what its caller grants.
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-pr.yml@master

  # Does this push change the full tier's own definition? A hosted job reads
  # tools/ci/full_tier_scope.sh (and the push_range_base.sh it calls) from
  # the default branch, never from the tree under test, and prints
  # full_tier_change. Anything other than one clean line counts as true.
  full-scope:
    name: Full tier scope
    if: github.event_name == 'push'
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for the runs and jobs API (the base of the push range).
    permissions:
      actions: read
      contents: read
    outputs:
      full_tier_change: ${{ steps.scope.outputs.full_tier_change }}
    steps:
      # fetch-depth: 0 so the diff can reach the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the push changes the full tier
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Every failure (mkdir, fetch, read, run, output shape) takes the
          # warning path and prints true; the step itself never goes red.
          set +e
          set -uo pipefail
          dir="${RUNNER_TEMP}/full-tier-scope"
          out="${dir}/out.txt"
          if mkdir -p "${dir}" &&
            { git rev-parse -q --verify "origin/${DEFAULT_BRANCH}^{commit}" >/dev/null ||
              git fetch --no-tags --depth=1 origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"; } &&
            git show "origin/${DEFAULT_BRANCH}:tools/ci/full_tier_scope.sh" > "${dir}/full_tier_scope.sh" 2>/dev/null &&
            git show "origin/${DEFAULT_BRANCH}:tools/ci/push_range_base.sh" > "${dir}/push_range_base.sh" 2>/dev/null &&
            bash "${dir}/full_tier_scope.sh" > "${out}" &&
            [ "$(wc -l < "${out}")" -eq 1 ] && grep -qxE 'full_tier_change=(true|false)' "${out}"; then
            cat "${out}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::full tier scope undecided; running the full tier"
            echo "full_tier_change=true" >> "$GITHUB_OUTPUT"
          fi

  # The full tier runs on a dispatch with full=true, on a pull request
  # labelled ci:full, and on a push to master. The ci:full label is read when
  # the pull request run starts (open, push, reopen); after adding it, push or
  # re-run to get the full tier. A push skips the full tier only when the
  # repository variable FULL_TIER_TRIGGER is `nightly`, full-scope succeeded
  # and it printed false; then the scheduled nightly (nightly.yml) carries it.
  # Unset or any other value runs it on every push. !cancelled() keeps the
  # implicit success() off, which would skip this job on every dispatch and
  # ci:full pull request, where full-scope is skipped.
  full:
    needs: [full-scope]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.full) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (vars.FULL_TIER_TRIGGER != 'nightly' ||
           needs.full-scope.result != 'success' ||
           needs.full-scope.outputs.full_tier_change != 'false')))
    # actions: read for the full tier's path filter (reads the push runs of
    # the default branch); a called workflow cannot exceed what its caller grants.
    permissions:
      actions: read
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-full.yml@master

  rat:
    permissions:
      contents: read
    name: License audit (Apache RAT)
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      # tools/ci/rat.sh fetches the SHA-1-pinned RAT jar itself (fails
      # closed) and audits against .rat-excludes; the report is written
      # outside the checkout so RAT never audits its own output.
      - name: Run Apache RAT
        env:
          RAT_REPORT: ${{ runner.temp }}/rat-report.txt
        run: tools/ci/rat.sh
      - name: Upload RAT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rat-report
          path: ${{ runner.temp }}/rat-report.txt
          if-no-files-found: warn

  public-hygiene:
    permissions:
      contents: read
    name: Public-tree hygiene gate
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the tracked tree for non-public vocabulary
        run: tools/ci/check-public-hygiene.sh
      - name: Workflow-shape gate
        run: tools/ci/check-workflow-shape.sh
      - name: Workflow-shape gate fixtures
        run: tools/ci/test_check_workflow_shape.sh
      - name: CI rot gate (self-test steps fail the job, compose project names)
        run: python3 tools/ci/check_ci_rot.py
      - name: CI rot gate fixtures
        run: tools/ci/test_check_ci_rot.sh
      - name: Hygiene gate credential-rule fixtures
        run: tools/ci/test_check_public_hygiene.sh

  ci-tooling-tests:
    permissions:
      contents: read
    name: CI tooling self-tests
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hermetic: docker, ssh, rsync and gh are shims inside each test.
      - name: Release ref guard
        run: tools/ci/test_ref_guard.sh
      - name: System-test gate
        run: tools/ci/test_systest_gate.sh
      - name: Queued-run sweep
        run: tools/ci/test_sweep_queued_runs.sh
      - name: Merge-queue fork guard
        run: tools/ci/test_queue_fork_guard.sh
      - name: PR tier fleet scope
        run: tools/ci/test_pr_tier_scope.sh
      - name: Docs lane classifier
        run: tools/ci/test_docs_only.sh
      - name: Push range base
        run: tools/ci/test_push_range_base.sh
      - name: dnf retry helper
        run: tools/ci/test_dnf_retry.sh
      - name: docker pull retry helper
        run: tools/ci/test_docker_pull_retry.sh
      - name: Full tier scope
        run: tools/ci/test_full_tier_scope.sh
      - name: Failing target extraction
        run: tools/ci/test_failing_targets.sh
      - name: Nightly red report
        run: tools/ci/test_nightly_red_report.sh
      - name: Rehearsal full-tier gate
        run: tools/ci/test_rehearsal_fulltier_gate.sh
      - name: Post-merge tests never reuse cached results
        run: tools/ci/test_post_merge_nocache.sh --selftest && tools/ci/test_post_merge_nocache.sh
      - name: Artifact staging and bundle validation
        run: |
          tools/ci/test_stage_artifacts.sh
          tools/ci/validate-local-bundle_test.sh
      - name: Vendor tarball publish and extract
        run: |
          tools/ci/test_publish_vendor_tarball.sh
          tools/ci/test_extract_vendor_tarball.sh
          tools/ci/test_prune_vendor_dir.sh
      - name: Bazel disk cache prune
        run: tools/ci/test_prune_bazel_disk_cache.sh
      - name: Bazel repository cache prune
        run: tools/ci/test_prune_bazel_repository_cache.sh
      - name: Slot budget helper
        run: tools/ci/test_slot_budget.sh
      - name: Bazel cache container flags helper
        run: tools/ci/test_remote_cache_docker_args.sh
      - name: Nightly schedule
        run: tools/ci/test_nightly_schedule.sh
      - name: Shared-cache check, local packages
        run: tools/ci/test_shared_cache_local_packages.sh
      - name: Dev image naming and build lock
        run: tools/ci/test_ensure_dev_image.sh
      - name: Container identity under rootful and rootless daemons
        run: tools/ci/test_container_identity.sh
      - name: CI and release lane write sets on one runner host
        run: tools/ci/test_lane_write_sets.sh
      - name: Build script supply-chain checks
        run: tools/ci/test_build_nginx_verify.sh
      - name: nginx module filter order (builds from config)
        run: tools/ci/test_nginx_config_filter_order.sh
      - name: Bisect driver
        run: tools/ci/test_bisect_job.sh
      - name: Release lane tooling
        run: |
          tools/ci/release_version.sh --self-test
          python3 -I tools/ci/release_manifest.py --self-test
          python3 -I tools/ci/release_signature_check.py --self-test
          tools/ci/release_nginx.sh --self-test
          tools/ci/nginx_org_lane.sh --self-test
          tools/ci/release_sidecar.sh --self-test
          python3 -I tools/ci/sidecar_pair_manifest.py --self-test
          python3 -I tools/ci/release_adopt.py --self-test
          python3 -I tools/ci/release_job_graph.py --self-test
          tools/ci/release_ea4_build.sh --self-test
          python3 -I tools/ci/check_module_optimizer_version.py --self-test
          python3 -I tools/ci/optimizer_pin_pairing.py --self-test
          tools/ci/test_release_unpaired_pin.sh
          tools/ci/pair_rehearsal.sh --self-test
          tools/ci/test_pair_rehearsal_shape.sh
          tools/ci/test_cache_gen_for_version.sh
          bash tools/ci/test_assert_release_stamp.sh
      - name: Release CI gate
        run: tools/ci/test_ci_release_gate.sh
      - name: IIS failure classifier
        run: python3 -I tools/ci/iis_failure_class.py --self-test
      - name: Runner-health record
        run: tools/ci/test_runner_health.sh
      - name: IIS retry check of the skip-check job
        run: tools/ci/test_iis_retry_check.sh
      - name: Report-only job registry
        run: tools/ci/test_check_quarantine.sh
      # Red on every run once a report-only job's expiry has passed
      # (tools/ci/quarantine.txt), so report-only cannot become permanent.
      - name: Report-only jobs have not expired
        run: python3 -I tools/ci/check_quarantine.py

  # Aggregate gate: the one check branch protection needs besides the
  # per-job ones. A called workflow cannot read needs.*.result of its
  # siblings, so this job runs inline, on a hosted label only.
  # A job skipped by its FLEET_ENABLED or FLEET_IIS_ENABLED term (the
  # fleet-iis class jobs) is accepted as skipped, and so are full-scope (it
  # runs on a push only) and full (off unless its trigger matches); failure
  # and cancelled still fail the gate.
  gate:
    permissions: {}
    name: CI gate
    needs: [rat, public-hygiene, ci-tooling-tests, pr, full-scope, full]
    if: always()
    # pinned to 24.04: ubuntu-latest is 26.04 since 2026-11-07; migrate via https://github.com/We-Amp/mod_pagespeed/issues/671
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a job finished with '${r}'"; exit 1 ;;
            esac
          done

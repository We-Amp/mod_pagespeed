#
# pipeline-release-module.yml: the module release lane as a reusable workflow.
# The caller (release.yml) holds the triggers and the concurrency group and
# passes the signing secrets by name; this file holds the jobs. See
# docs/ci/release.md and docs/ci/pipelines.md.
#
# For a tag `module-v<version>` (for example module-v1.19.0, or
# module-v1.19.0-rc.1 for a release candidate) this lane builds every module
# package, the Windows installer and the native pair of the ASP.NET Core
# sidecar (tested with the sidecar's suite), runs the package smokes, the security
# gates, the unit tests, the system-test gate and the two release gates on the
# fleet-hyperv class (installer upgrade, cPanel), validates the asset set and
# ends in one run artifact, `release-assets`: the validated asset set with
# SHA256SUMS and manifest.json (docs/ci/release.md describes the contract).
# In a real run (dry_run false) it also signs the Windows binaries and the
# installer, signs SHA256SUMS, creates the GitHub release as a draft, checks
# it and publishes it. Those jobs, and only those, run on hosted runners in
# the protected `release` environment and hold the secrets or the write
# token. Nothing is published to a package repository and no other repository
# is notified: the consumer pulls the release.
#
# Runs:
#   * push of a tag matching module-v*            -> dry_run is false
#   * workflow_dispatch { tag, dry_run: true }    -> the default
#   * workflow_dispatch { tag, dry_run: false }
# A dry run builds and validates everything, builds the installer unsigned
# and runs the gates, and signs and creates nothing. The tag must exist and
# its commit must be on master (the ref guard, which also refuses a run on any
# other ref), for a dry run as well.
#
# Runners. Every build job exists twice: on a runner class (fleet-heavy,
# fleet-windows) while the repository variable FLEET_ENABLED is 'true', and as
# a `-hosted` twin with the same steps on a GitHub-hosted runner otherwise, so
# the kill switch never blocks a release. A small hosted `-ready` job joins
# each pair for the jobs that depend on it. Native arm64 builds run on hosted
# arm64 runners. A hosted twin has no remote cache and a small machine: it is
# slow (docs/ci/release.md). Only the jobs of the `release` environment hold a
# secret or a write token, and every one of them runs on a hosted runner.
#
# Artifacts. Names with the prefix `asset-` hold release files (the `validate`
# job builds the asset set from exactly those); `tree` is the prepared source
# tree every build starts from; `testdata-*`, `debug-*`, `stock-el8`,
# `unsigned-windows`, `signed-windows`, `msi-unsigned`, `msi-old` and
# `release-signature` are inputs of later jobs and are not release files.
#
# Fetched from outside this repository (all public, read only, no credential):
# the canonical product facts file of the optimizer repository at vendoring
# time; the pinned optimizer release (its packages, by the `optimizer-fetch`
# job, verified against the pin file install/debian/optimizer-pin.json); and
# dependency sources named in the Bazel files.

name: pipeline-release-module

on:
  workflow_call:
    inputs:
      tag:
        description: Module tag to build (module-v<version>); empty on a tag push.
        type: string
        default: ''
      dry_run:
        description: Dispatch only. Nothing is signed or created when true. Ignored on a tag push.
        type: boolean
        default: true
    # Declared per secret and passed one by one by the caller, never inherited.
    # They are environment secrets of `release`: a job that runs in that
    # environment reads the environment's value, which takes precedence over
    # the value the caller passed. None is required, so a dry run needs none of
    # them; only the jobs of the `release` environment read them.
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT:
        required: false
      AZURE_TRUSTED_SIGNING_PROFILE:
        required: false
      PACKAGE_SIGNING_KEY:
        required: false
      PACKAGE_SIGNING_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  event-guard:
    name: Event guard (refuses merge_group and unexpected events)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse events this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          ALLOWED: "push workflow_dispatch"
        run: |
          set -euo pipefail
          case " ${ALLOWED} " in *" ${EVENT} "*) echo "event ${EVENT} accepted";; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac

  # ---------------------------------------------------------------------
  # Control: the ref guard and the version, both hosted. The guard code is
  # checked out from master, never from the tree being released.
  # ---------------------------------------------------------------------
  ref-guard:
    name: Ref guard
    needs: event-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.guard.outputs.ref }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Checkout master (guard code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false

      - name: Enforce the ref guard
        id: guard
        uses: ./.github/actions/ref-guard
        with:
          tag-glob: 'module-v*'
          dispatch-tag: ${{ inputs.tag }}
          events: 'push workflow_dispatch'

  version:
    name: Derive versions from the tag
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.derive.outputs.ref }}
      sha: ${{ steps.derive.outputs.sha }}
      short_sha: ${{ steps.derive.outputs.short_sha }}
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      base: ${{ steps.derive.outputs.base }}
      pkg_version: ${{ steps.derive.outputs.pkg_version }}
      release_tag: ${{ steps.derive.outputs.release_tag }}
      optimizer_tag: ${{ steps.derive.outputs.optimizer_tag }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      is_prerelease: ${{ steps.derive.outputs.is_prerelease }}
      dry_run: ${{ steps.derive.outputs.dry_run }}
    steps:
      - name: Checkout master (version tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Derive
        id: derive
        env:
          REF: ${{ needs.ref-guard.outputs.ref }}
          SHA: ${{ needs.ref-guard.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # msi-build passes the run number as the installer's build revision,
          # the 4th ProductVersion field, which cannot exceed 65535. Fail here,
          # before any build, rather than in msi-build.
          if [ "$RUN_NUMBER" -gt 65535 ]; then
            echo "::error::run number $RUN_NUMBER exceeds 65535, the largest installer build revision (install/iis/build-msi.ps1)"
            exit 1
          fi
          # The guard also accepts the master branch; this lane releases a tag.
          case "$REF" in
            refs/tags/module-v*) ;;
            *) echo "::error::the module lane releases a module-v* tag, not '$REF'"; exit 1 ;;
          esac
          TAG="${REF#refs/tags/}"
          # A tag push is a real run; a dispatch is real only when dry_run is
          # explicitly false.
          DRY_RUN=true
          if [ "$EVENT_NAME" = push ] || [ "$DRY_RUN_INPUT" = false ]; then
            DRY_RUN=false
          fi
          {
            bash tools/ci/release_version.sh parse "$TAG"
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "short_sha=${SHA:0:7}"
            echo "dry_run=$DRY_RUN"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Vendor: one prepared source tree for every build, as the `tree` artifact:
  # the source at the tag with the module version stamped into VERSION, the
  # admin console rebuilt with that version, vendor/, and the GIT_COMMIT
  # stamp. The source tarball of the release is made from the same files.
  # ---------------------------------------------------------------------
  vendor:
    name: Vendor Dependencies
    needs: [ref-guard, version]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_REF: ${{ needs.version.outputs.ref }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps: &vendor-steps
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true

      - &v-checkout
        name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: false
          persist-credentials: false

      - &v-verify
        name: Verify the checkout is the release commit
        run: |
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::checked-out HEAD $(git rev-parse HEAD) != release commit $RELEASE_SHA"; exit 1; }

      # The tree carries the module version; the packages carry the version
      # of the tag, stamped here. Every later job builds from this stamped
      # copy.
      - &v-stamp
        name: Stamp the module version
        run: |
          bash tools/ci/release_version.sh stamp "$RELEASE_TAG" net/instaweb/public/VERSION
          cat net/instaweb/public/VERSION

      # A dry run may name a version whose paired optimizer release does not
      # exist yet; the pin then names an older one and the packages depend on
      # that. The file tells the package build which version to depend on. A
      # real run has none and depends on the tag's version.
      - name: Record the optimizer pair version of a dry run
        run: |
          set -euo pipefail
          rm -f optimizer-pair-version
          if [ "$DRY_RUN" = true ]; then
            pin_tag="$(python3 -c "import json;print(json.load(open('install/debian/optimizer-pin.json'))['tag'])")"
            case "$pin_tag" in optimizer-v[0-9]*) ;; *) echo "::error::unusable optimizer pin tag '$pin_tag'"; exit 1 ;; esac
            pair="${pin_tag#optimizer-v}"
            tilde='~'
            printf '%s' "${pair/-/$tilde}" > optimizer-pair-version
            echo "dry run: the packages depend on the pinned optimizer ${pair}"
          fi

      - &v-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: pagespeed/system/console/.nvmrc

      - &v-bazel
        name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; exit 0; fi
          if command -v npm >/dev/null 2>&1; then
            npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          fi
          command -v bazel >/dev/null 2>&1 || {
            echo "::error::bazel is not on PATH and could not be installed via npm; see docs/ci/runner-environment.md"
            exit 1
          }
          bazel --version

      # The dependency sources are public and fetched over https. The vendor
      # script names one of them with an ssh-style address, so the rewrite
      # below (scoped to this step through the environment) sends it over
      # https and no credential of any kind is needed.
      - &v-vendor
        name: Vendor all dependencies
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          bash tools/vendor-deps.sh vendor
          if [ -d vendor/cyclone ]; then
            echo "Cyclone: $(du -sh vendor/cyclone | cut -f1)"
          fi
          echo "Repo cache: $(du -sh vendor/repo-cache | cut -f1)"

      # The console build checks its synced product facts against the
      # canonical file of the optimizer repository and fails closed in CI
      # when that file cannot be read. The clone lives under RUNNER_TEMP so
      # the tree tarball does not pick it up.
      - &v-facts
        name: Materialize canonical product facts
        run: |
          set -euo pipefail
          FACTS_DIR="${RUNNER_TEMP}/product-facts"
          rm -rf "$FACTS_DIR"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/We-Amp/pagespeed-optimizer.git "$FACTS_DIR"
          git -C "$FACTS_DIR" sparse-checkout set --no-cone /shared/product-facts.mjs
          test -f "$FACTS_DIR/shared/product-facts.mjs"
          echo "MODPAGESPEED2_DIR=${FACTS_DIR}" >> "$GITHUB_ENV"

      # The admin console shows the release version, so it is rebuilt with
      # it rather than carrying the stamp of whoever last committed the file.
      - &v-console
        name: Rebuild the admin console with the release version
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.release_tag }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          # A hosted runner has node but no pnpm; corepack provides the
          # version pinned by the console's packageManager field.
          command -v pnpm >/dev/null 2>&1 || corepack enable
          bash pagespeed/system/console/build.sh
          html=pagespeed/system/console/admin_console.html
          if grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*-dirty' "$html" >/dev/null 2>&1; then
            echo "::error::admin_console.html still contains a -dirty stamp after the rebuild"
            exit 1
          fi
          grep -qF "$VITE_APP_VERSION" "$html" || { echo "::error::admin_console.html does not contain $VITE_APP_VERSION"; exit 1; }
          echo "console stamped with ${VITE_APP_VERSION}"

      - &v-gitcommit
        name: Stamp GIT_COMMIT
        run: echo -n "$RELEASE_SHA" > GIT_COMMIT

      # The source tarball of the release: the committed files, the stamped
      # version and console, vendor/ and the commit stamp. A tarball build has
      # no .git, so its LASTCHANGE is the short commit.
      - name: Create the source tarball
        run: |
          set -euo pipefail
          PREFIX="mod_pagespeed-${RELEASE_VERSION}"
          STAGE="${RUNNER_TEMP}/source-stage"
          OUT="${RUNNER_TEMP}/source-out"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE" "$OUT"
          git archive --format=tar --prefix="${PREFIX}/" HEAD | tar x -C "$STAGE"
          cp net/instaweb/public/VERSION "$STAGE/${PREFIX}/net/instaweb/public/VERSION"
          sed -i.bak "s/^LASTCHANGE=.*/LASTCHANGE=${RELEASE_SHA:0:7}/" "$STAGE/${PREFIX}/net/instaweb/public/VERSION"
          rm -f "$STAGE/${PREFIX}/net/instaweb/public/VERSION.bak"
          cp pagespeed/system/console/admin_console.html pagespeed/system/console/admin_console.html.srchash \
            "$STAGE/${PREFIX}/pagespeed/system/console/"
          echo -n "$RELEASE_SHA" > "$STAGE/${PREFIX}/GIT_COMMIT"
          cp -a vendor "$STAGE/${PREFIX}/vendor"
          # POSIX format: some paths in the repository cache are long.
          tar czf "${OUT}/${PREFIX}.tar.gz" --format=posix -C "$STAGE" "${PREFIX}"
          rm -rf "$STAGE"
          ls -lh "$OUT"

      - &v-tree
        name: Create the tree tarball
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/tree-out"
          rm -rf "$OUT"; mkdir -p "$OUT"
          tar --zstd --dereference --mode='u+w' -cf "${OUT}/module-tree.tar.zst" \
            --exclude='.git' \
            --exclude='bazel-*' \
            --exclude='system/console/node_modules' \
            --exclude='system/console/dist' \
            .
          zstd -t "${OUT}/module-tree.tar.zst"
          echo "Tree: $(du -h "${OUT}/module-tree.tar.zst" | cut -f1)"

      # Already compressed: no second pass.
      - name: Upload the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tree
          path: ${{ runner.temp }}/tree-out/module-tree.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Upload the source tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-source
          path: ${{ runner.temp }}/source-out/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  vendor-hosted:
    name: Vendor Dependencies (hosted)
    needs: [ref-guard, version]
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_REF: ${{ needs.version.outputs.ref }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps: *vendor-steps

  vendor-ready:
    name: Vendor ready
    needs: [vendor, vendor-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.vendor.result }}
          HOSTED: ${{ needs.vendor-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the vendor job did not succeed"; exit 1; }

  # ---------------------------------------------------------------------
  # Release security gates, hosted: SBOM freshness at the module version,
  # notices, VEX statements and a grype scan with the VEX applied. The
  # versioned SBOM and VEX files become release files.
  # ---------------------------------------------------------------------
  security-gates:
    name: Security Gates (SBOM + Grype + VEX)
    needs: [ref-guard, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The SBOM carries the module version, which comes from the tag.
      - name: Stamp the module version
        run: bash tools/ci/release_version.sh stamp "$RELEASE_TAG" net/instaweb/public/VERSION

      # The release SBOM is generated for the stamped tree, not compared with
      # the committed copy: the committed file carries the version of the
      # tree's VERSION, which is not necessarily the tag's. The drift check
      # (generate-sbom.py --verify) runs in the pull request tier. The scans below, the
      # notices check and the release file all use the generated SBOM.
      - name: Generate the SBOM for the stamped tree
        run: python3 tools/generate-sbom.py

      - name: SBOM generator self-test
        run: python3 tools/generate-sbom.py --self-test

      # THIRD-PARTY-NOTICES ships in every package, so it must agree with the
      # SBOM in both directions.
      - name: Notices drift - check-third-party-notices.py
        run: python3 tools/sbom/check-third-party-notices.py

      - name: VEX file format sanity
        id: vex
        run: |
          set -euo pipefail
          python3 tools/ci/validate-vex.py --self-test
          python3 tools/ci/validate-vex.py sbom/
          shopt -s nullglob
          vex_files=(sbom/*.vex.json)
          if [ ${#vex_files[@]} -eq 0 ]; then
            echo "::error::no sbom/*.vex.json: the release carries one"
            exit 1
          fi
          echo "vex_path=${vex_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Vulnerability scan with VEX suppression (grype on the SPDX SBOM, fail on medium and above)
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          VEX_PATH: ${{ steps.vex.outputs.vex_path }}
        run: |
          # grype's own --vex does not support an sbom: source, so scan
          # without it and apply the OpenVEX statements with apply-vex.py.
          "${GRYPE_CMD}" -o json --file grype-results.json \
            sbom:sbom/pagespeed-1.1.spdx.json
          python3 tools/ci/apply-vex.py --grype grype-results.json \
            --vex "${VEX_PATH}" --fail-on medium

      # Versioned names: the release carries one SBOM and one VEX file per
      # version.
      - name: Collect the SBOM and VEX files
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/sbom-out"
          rm -rf "$OUT"; mkdir -p "$OUT"
          for kind in spdx vex; do
            src=""
            for c in sbom/*."${kind}".json; do [ -f "$c" ] && { src="$c"; break; }; done
            [ -n "$src" ] || { echo "::error::sbom/*.${kind}.json missing"; exit 1; }
            stem="$(basename "$src" ".${kind}.json")"
            cp "$src" "${OUT}/${stem}-${RELEASE_VERSION}.${kind}.json"
          done
          ls -l "$OUT"

      - name: Upload the SBOM and VEX files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-sbom
          path: ${{ runner.temp }}/sbom-out/*
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The optimizer packages the module is released with (the serving pair).
  # Fetched from the public optimizer release named by the pin file, verified
  # against the pin (the hash of the release's SHA256SUMS, then every file
  # against the sums). Anonymous: the release is public. The job's own
  # read-only token is sent to the API endpoint only, to avoid the anonymous
  # rate limit of shared runner addresses.
  # ---------------------------------------------------------------------
  optimizer-fetch:
    name: Fetch and verify the optimizer packages
    needs: [ref-guard, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pair_tag: ${{ steps.fetch.outputs.pair_tag }}
      pair_pkg_version: ${{ steps.fetch.outputs.pair_pkg_version }}
    env:
      OPTIMIZER_TAG: ${{ needs.version.outputs.optimizer_tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: false
          persist-credentials: false
      # The version guard comes from master (release.yml calls this lane
      # @master), so a tag cut before the guard existed still releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: lane-tools
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Download and verify against the pin
        id: fetch
        run: |
          set -euo pipefail
          PIN=install/debian/optimizer-pin.json
          [ -f "$PIN" ] || { echo "::error::missing $PIN"; exit 1; }
          PIN_TAG=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'])")
          PIN_SUMS=$(python3 -c "import json;print(json.load(open('$PIN'))['sha256sums_sha256'])")
          case "$PIN_TAG" in
            PLACEHOLDER*) echo "::error::optimizer-pin.json is a placeholder: cut the optimizer release first and record the pin"; exit 1 ;;
          esac
          # The pinned optimizer tag must be the pair of this module version.
          # In a dry run the paired release cannot exist yet, so the pin is
          # taken as it is and the packages are checked against it.
          if [ "$PIN_TAG" != "$OPTIMIZER_TAG" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::dry run: optimizer-pin.json pins '$PIN_TAG' but a release of this version needs '$OPTIMIZER_TAG'; continuing with the pinned release"
            else
              echo "::error::optimizer-pin.json pins '$PIN_TAG' but this release needs '$OPTIMIZER_TAG'"; exit 1
            fi
          fi
          PAIR_VERSION="${PIN_TAG#optimizer-v}"
          tilde='~'
          {
            echo "pair_tag=$PIN_TAG"
            echo "pair_pkg_version=${PAIR_VERSION/-/$tilde}"
          } >> "$GITHUB_OUTPUT"
          # The pair must link the same cache library commit: a pair that
          # does not has an Apache that cannot start. The tag comparison
          # above cannot see it; the pin records the optimizer commit, and
          # this compares what that commit builds with what this tree builds.
          OPTIMIZER_COMMIT=$(python3 -c "import json;print(json.load(open('$PIN')).get('optimizer_commit',''))")
          case "$OPTIMIZER_COMMIT" in
            PLACEHOLDER*|"") echo "::error::optimizer-pin.json has no optimizer_commit"; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/We-Amp/pagespeed-optimizer/$OPTIMIZER_COMMIT/MODULE.bazel" \
            -o optimizer-MODULE.bazel
          python3 tools/ci/check_optimizer_pin_pair.py "$PIN" optimizer-MODULE.bazel bazel/repositories.bzl
          # From 2.5.0 on the module version equals the pinned optimizer's
          # VERSION.txt. Only while the pin is not yet the pair this release
          # needs (a dry run, see above) does a mismatch warn instead of fail.
          GUARD=lane-tools/tools/ci/check_module_optimizer_version.py
          if python3 "$GUARD" --enforced --module-version "$RELEASE_VERSION"; then
            curl -fsSL --retry 5 --retry-all-errors \
              "https://raw.githubusercontent.com/We-Amp/pagespeed-optimizer/$OPTIMIZER_COMMIT/VERSION.txt" \
              -o optimizer-VERSION.txt
          fi
          VERSION_ARGS=(--module-version "$RELEASE_VERSION" --optimizer-version-file optimizer-VERSION.txt)
          if [ "$PIN_TAG" != "$OPTIMIZER_TAG" ]; then
            VERSION_ARGS+=(--dry-run)
          elif [ "$DRY_RUN" = true ]; then
            echo "::notice::dry run with a final pin: optimizer-pin.json already names $PIN_TAG, so a VERSION.txt mismatch fails here as in a real run. To rehearse an unfinished pair, dispatch a dry run of a module-v2.5.0-pre.N tag instead."
          fi
          python3 "$GUARD" "${VERSION_ARGS[@]}"

          rm -rf optimizer-dist && mkdir optimizer-dist
          curl -fsSL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            "https://api.github.com/repos/We-Amp/pagespeed-optimizer/releases/tags/$PIN_TAG" \
            -o optimizer-release.json
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("optimizer-release.json"))
          urls = [a["browser_download_url"] for a in doc.get("assets", [])]
          if not urls:
              sys.exit("::error::the pinned optimizer release has no assets")
          with open("optimizer-assets.txt", "w") as fh:
              fh.write("\n".join(urls) + "\n")
          PY
          cd optimizer-dist
          while IFS= read -r url; do
            curl -fsSL --retry 5 --retry-all-errors -O "$url"
          done < ../optimizer-assets.txt
          echo "$PIN_SUMS  SHA256SUMS" | sha256sum -c -
          # The downloaded set must be exactly the set SHA256SUMS lists. A
          # signed optimizer release also carries SHA256SUMS.asc; the pin above
          # already fixes the bytes of SHA256SUMS, so the signature is not
          # part of the set.
          diff <(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort) \
               <(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.asc -printf '%f\n' | LC_ALL=C sort) \
            || { echo "::error::the downloaded files differ from the files SHA256SUMS lists"; exit 1; }
          sha256sum -c SHA256SUMS
          ls -la

      # The modules load the optimizer client library into the web-server
      # process. It is built elsewhere and only fetched here, so check the
      # fetched packages: no crypto library in NEEDED and no undefined symbol
      # the server would have to resolve. Every deb and rpm must carry it.
      - name: Client library binds no crypto to the host process
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm cpio binutils >/dev/null
          shopt -s nullglob
          pkgs=(optimizer-dist/*.deb optimizer-dist/*.rpm)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::no optimizer deb or rpm packages to check"
            exit 1
          fi
          for p in "${pkgs[@]}"; do
            bash tools/ci/assert_module_symbols.sh --profile client-lib "$p"
          done

      # The optimizer's own SHA256SUMS was verified above; the release
      # derives its own manifest over every file it ships and signs its own
      # SHA256SUMS, so neither optimizer file travels on.
      - name: Keep the verified packages
        run: |
          set -euo pipefail
          rm -f optimizer-dist/SHA256SUMS optimizer-dist/SHA256SUMS.asc
          ls optimizer-dist

      - name: Upload the optimizer packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-optimizer
          path: optimizer-dist/*
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The release is gated on the system-test lanes of the CI run of the same
  # commit: the package smokes below run the suite against a stock install,
  # whose configuration lacks the lane fixtures, so their pytest step is
  # informational. A completed run of the main workflow for the release
  # commit must have passed both lanes. While that run is still queued or in
  # progress the gate waits for it (the tag may be pushed right after the
  # merge), and transient API failures are retried. On a dry run the verdict
  # is reported and the run continues. See tools/ci/systest_gate.sh.
  # ---------------------------------------------------------------------
  systest-gate:
    name: System-test gate (CI run of the release commit)
    needs: [ref-guard, version]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Reads the workflow runs of this public repository with the default
    # read-only token; no extra permission is requested.
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps:
      - name: Checkout master (gate script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Require green Apache and Nginx system tests for this commit
        run: bash tools/ci/systest_gate.sh

  # ---------------------------------------------------------------------
  # Linux packages. One step list for three jobs: x64 on the build runners,
  # its hosted twin, and arm64 on a hosted arm64 runner (a native build).
  # The Apache module, its deb and rpm, the nginx module tarball built in the
  # dev image, the unstripped debug files, and the synthetic old-version
  # packages the upgrade smoke installs first. The job env selects the
  # architecture.
  # ---------------------------------------------------------------------
  linux-release-build:
    name: Linux Release Build (x64)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 180
    env: &linux-x64-env
      ARCH: x64
      SO_ARCH: x86_64
      BAZEL_CI_CONFIG: ci
      HARDEN_ISA: hardening-cet
    steps: &linux-build-steps
      - &clear-workspace
        name: Clear the workspace
        run: |
          if [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+w "${GITHUB_WORKSPACE}" || echo "::warning::could not make every file of the workspace writable"
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + \
            || { echo "::error::could not clear the workspace (files left by an earlier run?)"; exit 1; }

      - &tree-download
        name: Download the release tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree
          path: ${{ runner.temp }}/tree

      - &tree-extract
        name: Extract the release tree
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP}/tree/module-tree.tar.zst"
          zstd -t "$T"
          tar --zstd -xf "$T" -C "${GITHUB_WORKSPACE}"
          rm -f "$T"
          STAMPED="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/GIT_COMMIT" 2>/dev/null || true)"
          [ "$STAMPED" = "$RELEASE_SHA" ] || { echo "::error::stale or missing GIT_COMMIT stamp in the extracted tree (have '${STAMPED}', want '${RELEASE_SHA}')"; exit 1; }
          cat net/instaweb/public/VERSION

      - &dev-image
        name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host lock around the build
          # (tools/ci/ensure-dev-image.sh). On a hosted runner this builds the
          # image cold every time.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest "$ARCH" docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # The remote cache is used only when the runner environment names it
      # (docs/ci/runner-environment.md). Without it the trailing empty
      # --remote_cache= overrides the cache the ci configs chain, and nothing
      # is uploaded.
      - &cache-settings
        name: Remote cache and per-runner cache directory
        run: |
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            echo "DOCKER_CACHE_HOST_ARG=--add-host=bazel-remote-cache:${BAZEL_CACHE_HOST}" >> "$GITHUB_ENV"
            echo "BAZEL_CACHE_FLAGS=" >> "$GITHUB_ENV"
            echo "using the remote Bazel cache from the runner environment"
          else
            echo "DOCKER_CACHE_HOST_ARG=" >> "$GITHUB_ENV"
            echo "BAZEL_CACHE_FLAGS=--remote_cache= --remote_upload_local_results=false" >> "$GITHUB_ENV"
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          # A per-runner directory for the disk cache, mounted at /cache. The
          # name is suffixed per runner instance and never logged.
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-release-bazel${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          echo "BAZEL_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      # Debug info is kept (--strip=never) and stripped afterwards, the
      # binary is hardened, and it must neither bind its crypto to the host
      # process nor export internals. The deb and rpm depend on the optimizer
      # package at the pair version, which is the module version.
      - name: Build the Apache module and its packages
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          set -euo pipefail
          echo "dev:x:$(id -u):$(id -g)::/workspace:/bin/bash" > "${RUNNER_TEMP}/ci-passwd"
          cat /etc/passwd >> "${RUNNER_TEMP}/ci-passwd" 2>/dev/null || true
          # shellcheck disable=SC2086
          docker run --rm --init ${DOCKER_CACHE_HOST_ARG} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e ARCH -e BAZEL_CI_CONFIG -e HARDEN_ISA -e BAZEL_CACHE_FLAGS \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              # BAZEL_CACHE_FLAGS is an intentional flag list: word splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                build --config="${BAZEL_CI_CONFIG}" --config=hardening --config="${HARDEN_ISA}" \
                ${BAZEL_CACHE_FLAGS} --disk_cache=/cache -c opt --strip=never \
                -- //:libmod_pagespeed.so

              bash tools/assert-binary-hardening.sh bazel-bin/libmod_pagespeed.so
              bash tools/ci/assert_module_symbols.sh --profile apache bazel-bin/libmod_pagespeed.so

              # Debug symbols before stripping.
              mkdir -p /workspace/debug
              objcopy --only-keep-debug bazel-bin/libmod_pagespeed.so \
                /workspace/debug/libmod_pagespeed.so.debug
              cp bazel-bin/libmod_pagespeed.so /workspace/debug/libmod_pagespeed.so.unstripped

              # Bazel outputs are read-only: copy, then strip the copy.
              install -m 755 bazel-bin/libmod_pagespeed.so /workspace/libmod_pagespeed.so
              strip --strip-debug /workspace/libmod_pagespeed.so

              mkdir -p /workspace/packages
              OPT_PKG_VERSION="$(. net/instaweb/public/VERSION; v="${MAJOR}.${MINOR}.${BUILD}"; [ -n "${PRERELEASE}" ] && v="${v}~${PRERELEASE}"; echo "$v")"
              # A dry run depends on the pinned optimizer (see the vendor job).
              if [ -f optimizer-pair-version ]; then OPT_PKG_VERSION="$(cat optimizer-pair-version)"; fi
              install/debian/build.sh -a "${ARCH}" -b . -o /workspace/packages/ -d "$OPT_PKG_VERSION"
              install/rpm/build.sh -a "${ARCH}" -b . -o /workspace/packages/ -d "$OPT_PKG_VERSION"

              # Synthetic old-version packages, installed first by the
              # upgrade smoke.
              mkdir -p /workspace/packages-old
              cp net/instaweb/public/VERSION net/instaweb/public/VERSION.real
              sed -i "s/^MAJOR=.*/MAJOR=1/;s/^MINOR=.*/MINOR=0/;s/^BUILD=.*/BUILD=99/;s/^PRERELEASE=.*/PRERELEASE=/" \
                net/instaweb/public/VERSION
              install/debian/build.sh -a "${ARCH}" -b . -o /workspace/packages-old/
              install/rpm/build.sh -a "${ARCH}" -b . -o /workspace/packages-old/
              mv net/instaweb/public/VERSION.real net/instaweb/public/VERSION
            '

      # The tarball of the module built in the dev image, for the
      # from-source nginx smoke. The distro packages are built in their own
      # jobs, inside containers of each distro.
      - name: Build the nginx module tarball
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          set -euo pipefail
          # shellcheck disable=SC2086
          docker run --rm --init ${DOCKER_CACHE_HOST_ARG} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CI_CONFIG -e HARDEN_ISA -e BAZEL_CACHE_FLAGS \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                build --config="${BAZEL_CI_CONFIG}" --config=hardening --config="${HARDEN_ISA}" \
                ${BAZEL_CACHE_FLAGS} --disk_cache=/cache -c opt \
                -- //pagespeed/nginx:ngx_pagespeed_module.so
              bash tools/assert-binary-hardening.sh bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so
              bash tools/ci/assert_module_symbols.sh --profile nginx \
                bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so
              ./install/nginx/build_nginx_package.sh -o .
            '

      - name: Collect the files
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/out"
          rm -rf "$OUT"; mkdir -p "$OUT/asset" "$OUT/oldpkgs" "$OUT/debug"
          cp packages/* "$OUT/asset/"
          cp libmod_pagespeed.so "$OUT/asset/libmod_pagespeed-linux-${SO_ARCH}.so"
          cp ngx_pagespeed-*-linux-"${SO_ARCH}".tar.gz "$OUT/asset/"
          cp packages-old/* "$OUT/oldpkgs/"
          cp debug/* "$OUT/debug/"
          ls -lh "$OUT"/*

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-linux-${{ env.ARCH }}
          path: ${{ runner.temp }}/out/asset
          retention-days: 14
          if-no-files-found: error

      - name: Upload the old-version packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testdata-oldpkgs-${{ env.ARCH }}
          path: ${{ runner.temp }}/out/oldpkgs
          retention-days: 3
          if-no-files-found: error

      - name: Upload the debug files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-linux-${{ env.ARCH }}
          path: ${{ runner.temp }}/out/debug
          retention-days: 14
          if-no-files-found: error

  linux-release-build-hosted:
    name: Linux Release Build (x64, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: *linux-x64-env
    steps: *linux-build-steps

  linux-ready:
    name: Linux build ready
    needs: [linux-release-build, linux-release-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.linux-release-build.result }}
          HOSTED: ${{ needs.linux-release-build-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the Linux x64 build did not succeed"; exit 1; }

  linux-arm64-release-build:
    name: Linux Release Build (arm64)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success'}}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      ARCH: arm64
      SO_ARCH: aarch64
      BAZEL_CI_CONFIG: ci-linux-arm64
      HARDEN_ISA: hardening-bti
    steps: *linux-build-steps

  # ---------------------------------------------------------------------
  # Nginx distro packages. The module is built inside a container of each
  # target distro against that distro's stock nginx version, wrapped into a
  # deb or rpm, and checked for leaked symbols and, for an rpm, for its name
  # routing. The legs run concurrently within the job (tools/ci/release_nginx.sh).
  # One step list for the x64 job and its hosted twin.
  # ---------------------------------------------------------------------
  nginx-distro-build:
    name: Nginx Distro Packages (x64)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 240
    env: &nginx-x64-env
      ARCH: x64
    steps: &nginx-steps
      - *clear-workspace
      - *tree-download
      - *tree-extract

      - name: Build all distro packages
        run: |
          set -euo pipefail
          CACHE_ROOT="${HOME}/.cache/mps-release-nginx"
          mkdir -p "${CACHE_ROOT}"
          CACHE_DIR="${CACHE_ROOT}" bash tools/ci/release_nginx.sh build \
            --arch "$ARCH" --set main \
            --workspace "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/nginx-out"

      - name: Symbol-leak gate
        run: |
          bash tools/ci/release_nginx.sh symbol-leak --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Rpm routing gate
        run: |
          mkdir -p "${RUNNER_TEMP}/nginx-rpms"
          cp "${RUNNER_TEMP}"/nginx-out/*.rpm "${RUNNER_TEMP}/nginx-rpms/"
          bash tools/ci/release_nginx.sh routing --arch "$ARCH" --pkgdir "${RUNNER_TEMP}/nginx-rpms"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-nginx-${{ env.ARCH }}
          path: ${{ runner.temp }}/nginx-out
          retention-days: 14
          if-no-files-found: error

      # Containers that run as root leave root-owned files in the mounts.
      - &reown
        name: Re-own the files containers left behind
        if: always()
        run: |
          mounts=(-v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TEMP}:/t")
          dirs="/w /t"
          i=0
          for d in "${GITHUB_WORKSPACE}"-leg-*; do
            [ -d "$d" ] || continue
            i=$((i + 1))
            mounts+=(-v "${d}:/l${i}")
            dirs="${dirs} /l${i}"
          done
          docker run --rm "${mounts[@]}" alpine:3.20 sh -c "chown -R $(id -u):$(id -g) ${dirs}" \
            || echo "::warning::could not re-own the workspace; a later run on this runner may fail to clear it"

  nginx-distro-build-hosted:
    name: Nginx Distro Packages (x64, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: *nginx-x64-env
    steps: *nginx-steps

  nginx-ready:
    name: Nginx packages ready
    needs: [nginx-distro-build, nginx-distro-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.nginx-distro-build.result }}
          HOSTED: ${{ needs.nginx-distro-build-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the nginx x64 packages did not build"; exit 1; }

  # arm64: one job per distro, so the legs run side by side on separate hosted
  # runners instead of one after another on one small runner. The plan job
  # reads the distro names from the leg table of the release tree, so the
  # matrix cannot drift from it; the join job runs the gates over the combined
  # set and hands over `asset-nginx-arm64`, the one artifact the asset set
  # expects. The per-leg artifacts have no `asset-` prefix on purpose.
  nginx-arm64-plan:
    name: Nginx Distro Packages (arm64, plan)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      # The leg table and the build driver come from master, like the other
      # tooling of this lane, so a tag cut before a tooling change still
      # builds with it; the packages are built from the tag's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          submodules: false
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: List the distro legs
        id: plan
        run: |
          set -euo pipefail
          D="$(bash tools/ci/release_nginx.sh legs --arch arm64 --set main --json)"
          echo "legs: ${D}"
          echo "distros=${D}" >> "$GITHUB_OUTPUT"

  nginx-distro-build-arm64:
    name: Nginx Distro Packages (arm64, ${{ matrix.distro }})
    needs: [version, vendor-ready, nginx-arm64-plan]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && needs.nginx-arm64-plan.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.nginx-arm64-plan.outputs.distros || '["none"]') }}
    env:
      ARCH: arm64
    steps:
      - *clear-workspace

      # The build driver (and the leg table in it) comes from master, the same
      # file the plan job listed the matrix from; it is kept outside the
      # workspace, which is the tag's tree.
      - name: Check out the build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: lane-tools
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Keep the build tooling outside the tree
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lane-tools"
          cp lane-tools/tools/ci/release_nginx.sh lane-tools/tools/ci/slot-budget.sh "${RUNNER_TEMP}/lane-tools/"
          rm -rf lane-tools

      - *tree-download
      - *tree-extract

      - name: Build the distro package
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          CACHE_ROOT="${HOME}/.cache/mps-release-nginx"
          mkdir -p "${CACHE_ROOT}"
          CACHE_DIR="${CACHE_ROOT}" bash "${RUNNER_TEMP}/lane-tools/release_nginx.sh" build \
            --arch "$ARCH" --set main --distro "$DISTRO" \
            --workspace "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/nginx-out"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nginx-arm64-${{ matrix.distro }}
          path: ${{ runner.temp }}/nginx-out
          retention-days: 14
          if-no-files-found: error

      - *reown

  nginx-arm64-join:
    name: Nginx Distro Packages (arm64)
    needs: [version, nginx-distro-build-arm64]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-distro-build-arm64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: false
          sparse-checkout: |
            tools/ci
            test/package-test
          persist-credentials: false

      # The gates' driver comes from master, like the plan and the legs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: lane-tools
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Download the per-distro packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nginx-arm64-*
          merge-multiple: true
          path: ${{ runner.temp }}/nginx-out

      - name: The set is exactly one package per leg
        run: |
          ls -l "${RUNNER_TEMP}/nginx-out"
          bash lane-tools/tools/ci/release_nginx.sh check-set --arch "$ARCH" \
            --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Symbol-leak gate
        run: |
          bash lane-tools/tools/ci/release_nginx.sh symbol-leak --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Rpm routing gate
        run: |
          mkdir -p "${RUNNER_TEMP}/nginx-rpms"
          cp "${RUNNER_TEMP}"/nginx-out/*.rpm "${RUNNER_TEMP}/nginx-rpms/"
          bash lane-tools/tools/ci/release_nginx.sh routing --arch "$ARCH" --pkgdir "${RUNNER_TEMP}/nginx-rpms"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-nginx-arm64
          path: ${{ runner.temp }}/nginx-out
          retention-days: 14
          if-no-files-found: error

  # The el10 module builds with a much newer toolchain than the other legs and
  # is a leg of its own so that its long build cannot hold up the others.
  nginx-distro-build-el10:
    name: Nginx Distro Packages (el10)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 180
    env: &nginx-el10-env
      ARCH: x64
      CORES_PER_LEG: "12"
    steps: &nginx-el10-steps
      - *clear-workspace
      - *tree-download
      - *tree-extract

      - name: Build the el10 module and package
        run: |
          set -euo pipefail
          CACHE_ROOT="${HOME}/.cache/mps-release-nginx-el10"
          mkdir -p "${CACHE_ROOT}"
          CACHE_DIR="${CACHE_ROOT}" bash tools/ci/release_nginx.sh build \
            --arch "$ARCH" --set el10 \
            --workspace "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/nginx-out"

      - name: Symbol-leak gate
        run: |
          bash tools/ci/release_nginx.sh symbol-leak --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Rpm routing gate
        run: |
          bash tools/ci/release_nginx.sh routing --arch "$ARCH" --set el10 \
            --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Load into the stock packaged nginx
        run: |
          bash tools/ci/release_nginx.sh load-check --arch "$ARCH" --set el10 \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-out"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-nginx-el10
          path: ${{ runner.temp }}/nginx-out
          retention-days: 14
          if-no-files-found: error

      - *reown

  nginx-distro-build-el10-hosted:
    name: Nginx Distro Packages (el10, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: *nginx-el10-env
    steps: *nginx-el10-steps

  # ---------------------------------------------------------------------
  # The native pair of the ASP.NET Core sidecar (WeAmp.PageSpeed.Sidecar):
  # nginx, the module built against exactly that nginx, and the launch shim,
  # per architecture (tools/ci/release_sidecar.sh). Every byte of these
  # release files comes from hosted runners: vendor-sidecar prepares its own
  # tree on a hosted runner with the steps of the vendor job (checkout of the
  # tag, the stamped version, vendor/, the admin console rebuilt with the
  # release version), and the two pair jobs build from that tree on hosted
  # x64 and arm64 runners, whatever FLEET_ENABLED says. The build runner
  # class plays no part here (it builds the pair only in the path-filtered
  # pull request tier). Each pair job runs `check` (the focal build in the
  # pinned Ubuntu 20.04 image, glibc 2.31 being the sidecar's compatibility
  # floor; the symbol and glibc gate and the Debian 11 and 12 smoke before
  # and after stripping; the sidecar's xunit suite under .NET 8 and .NET 10
  # with the live nginx tests against the stripped pair, proven to have run)
  # and only then packages the pair and its debug files as release files; a
  # red, skipped or missing live test stops the job before the upload.
  # `validate` adds sidecar-pair.json, the manifest the NuGet lane pins.
  # ---------------------------------------------------------------------
  vendor-sidecar:
    name: Vendor Dependencies (sidecar, hosted)
    needs: [ref-guard, version]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_REF: ${{ needs.version.outputs.ref }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps:
      - *v-checkout
      - *v-verify
      - *v-stamp
      - *v-node
      - *v-bazel
      - *v-vendor
      - *v-facts
      - *v-console
      - *v-gitcommit
      - *v-tree

      # Already compressed: no second pass.
      - name: Upload the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tree-sidecar
          path: ${{ runner.temp }}/tree-out/module-tree.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  sidecar-pair:
    name: Sidecar Native Pair (x64, hosted)
    needs: [version, vendor-sidecar]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-sidecar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ARCH: x64
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps: &sidecar-steps
      - name: Download the sidecar's release tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sidecar
          path: ${{ runner.temp }}/tree

      - *tree-extract

      # The whole sequence, each part in its own log group: build, the symbol
      # and glibc gate, the Debian 11 and 12 smoke, strip, gate and smoke
      # again, and the test suite under .NET 8 and .NET 10 with the live nginx
      # tests against the stripped pair, the pair that ships.
      - name: Build, gate and test the pair
        run: |
          bash tools/ci/release_sidecar.sh check --arch "$ARCH" \
            --workspace "${GITHUB_WORKSPACE}" --pair "${RUNNER_TEMP}/pair" \
            --debug "${RUNNER_TEMP}/pair-debug" --results "${RUNNER_TEMP}/sidecar-results"

      - name: Package the pair and its debug files
        run: |
          bash tools/ci/release_sidecar.sh package --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pair "${RUNNER_TEMP}/pair" \
            --debug "${RUNNER_TEMP}/pair-debug" \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA" \
            --out "${RUNNER_TEMP}/sidecar-out"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-sidecar-${{ env.ARCH }}
          path: ${{ runner.temp }}/sidecar-out
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload the test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testdata-sidecar-results-${{ env.ARCH }}
          path: ${{ runner.temp }}/sidecar-results
          if-no-files-found: ignore
          retention-days: 7

  sidecar-pair-arm64:
    name: Sidecar Native Pair (arm64, hosted)
    needs: [version, vendor-sidecar]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-sidecar.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      ARCH: arm64
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps: *sidecar-steps

  # ---------------------------------------------------------------------
  # Stock Apache rpms built natively on el8 and el10 (their own glibc and
  # toolchain). The el8 rpm only feeds the cPanel package; the el10 rpm is a
  # release file of its own. The rpm of el10 carries no dist tag, so its
  # release file name gets a prefix (docs/ci/release.md).
  # ---------------------------------------------------------------------
  apache-el8-build:
    name: Apache EL8 Build (glibc 2.28)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 240
    env: &apache-el8-env
      EL: el8
      ARTIFACT: stock-el8
    steps: &apache-el-steps
      - *clear-workspace
      - *tree-download
      - *tree-extract

      - name: Build the module and the stock rpm in almalinux
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 80g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=80g
          fi
          set -euo pipefail
          CACHE_ROOT="${HOME}/.cache/mps-release-${EL}"
          mkdir -p "${CACHE_ROOT}"
          docker run --rm --init \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${CACHE_ROOT}:/cache" \
            -w /workspace \
            "almalinux:${EL#el}" \
            bash -c "bash install/rpm/build_apache_${EL}_in_container.sh -o /workspace/packages-${EL}"
          echo "stock rpms:"
          ls -lh "packages-${EL}"/*.rpm

      - name: Upload the rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: packages-${{ env.EL }}/mod-pagespeed-*.x86_64.rpm
          retention-days: 14
          if-no-files-found: error

      - *reown

  apache-el8-build-hosted:
    name: Apache EL8 Build (glibc 2.28, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: *apache-el8-env
    steps: *apache-el-steps

  el8-ready:
    name: EL8 build ready
    needs: [apache-el8-build, apache-el8-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.apache-el8-build.result }}
          HOSTED: ${{ needs.apache-el8-build-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the el8 build did not succeed"; exit 1; }

  apache-el10-build:
    name: Apache EL10 Build (glibc 2.39, native)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 240
    env: &apache-el10-env
      EL: el10
      ARTIFACT: asset-apache-el10
    steps: *apache-el-steps

  apache-el10-build-hosted:
    name: Apache EL10 Build (glibc 2.39, native, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: *apache-el10-env
    steps: *apache-el-steps

  el10-ready:
    name: EL10 build ready
    needs: [apache-el10-build, apache-el10-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.apache-el10-build.result }}
          HOSTED: ${{ needs.apache-el10-build-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the el10 build did not succeed"; exit 1; }

  # ---------------------------------------------------------------------
  # Unit tests of the optimized build, with the cache servers they talk to
  # started as containers on a job-local network.
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Release)
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 120
    env: &unit-env
      ARCH: x64
      BAZEL_CI_CONFIG: ci
    steps: &unit-steps
      - *clear-workspace
      - *tree-download
      - *tree-extract
      - *dev-image
      - *cache-settings

      - name: Create the Docker network and start the services
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-clean"; mkdir -p "$DOCKER_CONFIG"; printf '{}' > "$DOCKER_CONFIG/config.json"
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "docker daemon not ready ($i/30)"; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon unreachable after 60s"; exit 1; }
          NET="ci-net-release-${GITHUB_RUN_ID}"; R="ci-redis-release-${GITHUB_RUN_ID}"; M="ci-memcached-release-${GITHUB_RUN_ID}"
          {
            echo "UNIT_NET=${NET}"
            echo "UNIT_REDIS=${R}"
            echo "UNIT_MEMCACHED=${M}"
          } >> "$GITHUB_ENV"
          docker network create "$NET" 2>/dev/null || true
          docker rm -f "$R" "$M" 2>/dev/null || true
          for img in redis:7-alpine memcached:1.6-alpine; do
            for a in 1 2 3; do docker pull "$img" && break; echo "::warning::pull $img failed ($a/3)"; sleep $((a*5)); done
          done
          start() { local name=$1 image=$2; shift 2
            for a in 1 2 3; do
              docker rm -f "$name" 2>/dev/null || true
              docker run -d --init --restart=on-failure:2 --name "$name" --network "$NET" "$@" "$image" && return 0
              echo "::warning::docker run $name failed ($a/3)"; sleep $((a*3))
            done
            echo "::error::could not start $name after 3 attempts"; return 1; }
          start "$R" redis:7-alpine || exit 1
          start "$M" memcached:1.6-alpine || exit 1
          for a in $(seq 1 30); do docker exec "$R" redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; [ "$a" = 30 ] && { echo "::error::redis never became ready"; docker logs "$R" 2>&1 | tail; exit 1; }; done
          for a in $(seq 1 15); do echo version | docker exec -i "$M" sh -c 'cat | nc -w1 127.0.0.1 11211' 2>/dev/null | grep -q VERSION && break; sleep 1; [ "$a" = 15 ] && echo "::warning::memcached readiness probe unconfirmed after 15s (container is running; continuing)"; done

      - name: Run the unit tests
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          echo "dev:x:$(id -u):$(id -g)::/workspace:/bin/bash" > "${RUNNER_TEMP}/ci-passwd"
          cat /etc/passwd >> "${RUNNER_TEMP}/ci-passwd" 2>/dev/null || true
          # shellcheck disable=SC2086
          docker run --rm --init ${DOCKER_CACHE_HOST_ARG} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --network="${UNIT_NET}" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZEL_CI_CONFIG -e BAZEL_CACHE_FLAGS \
            -e REDIS_HOST_NAME="${UNIT_REDIS}" -e MEMCACHED_HOST_NAME="${UNIT_MEMCACHED}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${BAZEL_CACHE_DIR}:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              for a in 1 2 3; do
                if bazel --output_user_root=/tmp/bazel-out --version; then break; fi
                echo "::warning::bazel launcher download failed (attempt ${a}/3)"
                sleep $((a * 5))
              done
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                test --config="${BAZEL_CI_CONFIG}" ${BAZEL_CACHE_FLAGS} --disk_cache=/cache -c opt \
                --deleted_packages=test/pagespeed/envoy \
                --keep_going \
                --test_tag_filters=-external \
                --test_env=REDIS_HOST="${REDIS_HOST_NAME}" \
                --test_env=REDIS_PORT=6379 \
                --test_env=MEMCACHED_HOST="${MEMCACHED_HOST_NAME}" \
                --test_env=MEMCACHED_PORT=11211 \
                -- //test/pagespeed/kernel/... //test/net/... \
                //test/pagespeed/opt/... //test/pagespeed/system/... \
                //test/pagespeed/apache/... //test/pagespeed/nginx/...
            '

      - name: Stop the test services
        if: always()
        run: |
          docker rm -f "${UNIT_REDIS:-}" "${UNIT_MEMCACHED:-}" 2>/dev/null || true
          docker network rm "${UNIT_NET:-}" 2>/dev/null || true

  unit-tests-hosted:
    name: Unit Tests (Release, hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env: *unit-env
    steps: *unit-steps

  # ---------------------------------------------------------------------
  # Package smokes. Each installs the built packages into a container of the
  # target family, exercises install, upgrade over the synthetic old version,
  # the module's presence and version, and removal. The pytest step inside
  # the Apache smokes is informational (the system-test gate is the gate); it
  # fails the job only when the suite did not run at all.
  # ---------------------------------------------------------------------
  package-smoke-deb:
    name: Smoke Test (Debian)
    needs: [version, linux-ready, optimizer-fetch]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.optimizer-fetch.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 60
    env: &smoke-env
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      EXPECTED_VERSION_STRING: ${{ needs.version.outputs.version }}
    steps: &smoke-deb-steps
      - &unlock-vendor
        name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true

      - &checkout-tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: false
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-linux-x64
          path: ${{ runner.temp }}/packages

      - name: Download the old-version packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testdata-oldpkgs-x64
          path: ${{ runner.temp }}/packages-old

      - name: Download the optimizer packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-optimizer
          path: ${{ runner.temp }}/optimizer

      # A minimal Ubuntu and Apache container WITHOUT the package installed,
      # so the test exercises the whole install, upgrade and uninstall life
      # cycle.
      - name: Build the base test container
        run: |
          docker build -t mps-smoke-deb-base - <<'DOCKERFILE'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              apache2 ca-certificates curl python3 python3-pip \
              && rm -rf /var/lib/apt/lists/*
          RUN pip3 install --no-cache-dir pytest==8.3.5 pytest-timeout==2.3.1
          DOCKERFILE

      - name: Run upgrade, test and uninstall
        run: |
          docker run --rm --init \
            -e RELEASE_TAG -e EXPECTED_VERSION_STRING \
            -v "${RUNNER_TEMP}/packages-old:/packages-old:ro" \
            -v "${RUNNER_TEMP}/packages:/packages:ro" \
            -v "${RUNNER_TEMP}/optimizer:/optimizer:ro" \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            mps-smoke-deb-base bash -c '
              set -ex

              force_restart_apache() {
                apache2ctl graceful-stop 2>/dev/null || apache2ctl stop 2>/dev/null || true
                sleep 3
                if [ -f /var/run/apache2/apache2.pid ]; then
                  kill -9 $(cat /var/run/apache2/apache2.pid) 2>/dev/null || true
                fi
                sleep 2  # allow TIME_WAIT on port 80 to clear
                rm -f /var/run/apache2/apache2.pid
                apache2ctl start
              }

              wait_for_apache() {
                for i in $(seq 1 20); do
                  if curl -s --max-time 2 -o /dev/null http://localhost/; then return 0; fi
                  sleep 1
                done
                echo "=== Apache failed to respond. Error log: ==="
                tail -50 /var/log/apache2/error.log 2>/dev/null || true
                return 1
              }

              echo "<html><body><p>Smoke test</p></body></html>" > /var/www/html/index.html

              {
                echo "<IfModule pagespeed_module>"
                echo "  LogLevel pagespeed:trace1 filter:trace4"
                echo "</IfModule>"
              } >> /etc/apache2/apache2.conf

              apt-get update -qq
              apt-get install -y /packages-old/mod-pagespeed_*_amd64.deb
              apache2ctl configtest
              apache2ctl start
              wait_for_apache
              curl -sI http://localhost/ | head -20
              curl -sI http://localhost/ | grep -qi "X-Mod-Pagespeed\|X-Page-Speed" \
                || echo "WARNING: header not present on old version (expected for synthetic pkg)"

              echo "# user customization marker" >> /etc/apache2/mods-available/pagespeed.conf

              apt-get install -y /optimizer/pagespeed-optimizer_*_amd64.deb \
                /packages/mod-pagespeed_*_amd64.deb
              mkdir -p /var/cache/mod_pagespeed /var/log/pagespeed
              chown -R www-data:www-data /var/cache/mod_pagespeed /var/log/pagespeed
              apache2ctl configtest
              force_restart_apache
              wait_for_apache
              apache2ctl -M 2>/dev/null | grep -q "pagespeed_module" \
                || { echo "FAIL: pagespeed_module not loaded"; apache2ctl -M 2>/dev/null; false; }
              echo "Module loaded OK"
              HDR_VALUE=""
              for attempt in 1 2 3 4 5; do
                HDR_LINE="$(curl -sI http://localhost/ | tee /dev/stderr | grep -i "^X-Mod-Pagespeed\|^X-Page-Speed" || true)"
                if [ -n "$HDR_LINE" ]; then
                  HDR_VALUE="$HDR_LINE"
                  echo "Header found on attempt $attempt: $HDR_VALUE"
                  break
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "FAIL: X-Mod-Pagespeed header missing after 5 attempts"
                  echo "=== Apache error log (last 30 lines): ==="
                  tail -30 /var/log/apache2/error.log 2>/dev/null || true
                  echo "=== PageSpeed log: ==="
                  cat /var/log/pagespeed/*.log 2>/dev/null || true
                  false
                fi
                echo "Attempt $attempt: header not yet present, retrying in 3s..."
                sleep 3
              done

              if [ -z "$EXPECTED_VERSION_STRING" ]; then
                echo "FAIL: EXPECTED_VERSION_STRING env not passed into container"; false
              fi
              echo "$HDR_VALUE" | grep -F "$EXPECTED_VERSION_STRING" >/dev/null \
                || { echo "FAIL: header $HDR_VALUE does not contain $EXPECTED_VERSION_STRING"; false; }
              echo "Header version assertion passed: $HDR_VALUE contains $EXPECTED_VERSION_STRING"

              ADMIN_BODY="$(curl -s --max-time 5 http://localhost/pagespeed_admin/ 2>/dev/null || true)"
              if [ -z "$ADMIN_BODY" ]; then
                echo "WARN: /pagespeed_admin/ returned empty - skipping admin tag assertion"
              elif echo "$ADMIN_BODY" | grep -qF "$RELEASE_TAG"; then
                echo "Admin page contains release tag $RELEASE_TAG"
              else
                echo "WARN: /pagespeed_admin/ body did not contain $RELEASE_TAG"
              fi

              grep -q "user customization marker" /etc/apache2/mods-available/pagespeed.conf

              for dir in mod_pagespeed_example mod_pagespeed_test do_not_modify; do
                [ -d "/src/install/$dir" ] && cp -r "/src/install/$dir" /var/www/html/
              done
              chown -R www-data:www-data /var/www/html
              mkdir -p /var/cache/mod_pagespeed /var/log/pagespeed
              chown www-data:www-data /var/cache/mod_pagespeed /var/log/pagespeed

              cd /src/test/system
              export PAGESPEED_HOST=localhost
              export PAGESPEED_PORT=80
              export PAGESPEED_SERVER_TYPE=apache
              export PAGESPEED_CACHE_DIR=/var/cache/mod_pagespeed
              export PAGESPEED_STATS_ENABLED=1
              export PAGESPEED_EXAMPLE_ROOT=/mod_pagespeed_example
              export PAGESPEED_TEST_ROOT=/mod_pagespeed_test
              export PYTHONDONTWRITEBYTECODE=1
              python3 -c "import pytest"
              PYTEST_RC=0
              python3 -m pytest -p no:cacheprovider automatic/ -v --tb=short \
                > /tmp/pytest-smoke.out 2>&1 || PYTEST_RC=$?
              cat /tmp/pytest-smoke.out
              echo "pytest exit status: ${PYTEST_RC}"
              if [ "${PYTEST_RC}" -ne 0 ] && [ "${PYTEST_RC}" -ne 1 ]; then
                echo "::error title=Package smoke pytest did not run::pytest exited ${PYTEST_RC} (not a plain test failure); the suite did not execute"
                exit "${PYTEST_RC}"
              fi
              if ! grep -Eq "[0-9]+ passed" /tmp/pytest-smoke.out; then
                echo "::error title=Package smoke pytest ran nothing useful::no passed test in the pytest summary; the suite did not meaningfully run"
                exit 1
              fi
              if [ "${PYTEST_RC}" -eq 1 ]; then
                echo "::warning title=Package smoke pytest (informational)::some pytest tests failed against the stock package config; the release gate is systest-gate"
              fi

              apt-get remove -y mod-pagespeed
              apache2ctl configtest
              force_restart_apache
              wait_for_apache
              ! curl -sI http://localhost/ | grep -qi "X-Mod-Pagespeed\|X-Page-Speed"
              echo "=== Debian smoke test PASSED ==="
            '

  package-smoke-deb-hosted:
    name: Smoke Test (Debian, hosted)
    needs: [version, linux-ready, optimizer-fetch]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.optimizer-fetch.result == 'success' && vars.FLEET_ENABLED != 'true' }}

  package-smoke-rpm-hosted:
    name: Smoke Test (RPM, hosted)
    needs: [version, linux-ready, optimizer-fetch]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.optimizer-fetch.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *smoke-env
    steps: *smoke-rpm-steps

  # The from-source nginx smoke: the module tarball built in the dev image is
  # unpacked into a container that builds nginx from source to match it.
  package-smoke-nginx:
    name: Smoke Test (Nginx)
    needs: [version, linux-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 60
    steps: &smoke-nginx-steps
      - *unlock-vendor

      - *checkout-tag

      - name: Download the module tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-linux-x64
          path: ${{ runner.temp }}/packages

      - name: Build the test container
        run: |
          # The Dockerfile globs packages/ngx_pagespeed*.tar.gz: exactly one.
          rm -rf test/package-test/packages
          mkdir -p test/package-test/packages
          cp -f "${RUNNER_TEMP}"/packages/ngx_pagespeed-*-linux-x86_64.tar.gz test/package-test/packages/
          docker build -t mps-smoke-nginx -f test/package-test/Dockerfile.ubuntu-nginx test/package-test/

      # The entrypoint sets up content, configures nginx, starts it and runs
      # the pytest suite.
      - name: Run install and test
        run: |
          docker run --rm --init \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            mps-smoke-nginx

      # Clean module load and unload, not a rewriting check: the install step
      # above runs the suite.
      - name: Run the uninstall verification
        run: |
          docker run --rm --init --entrypoint bash \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            mps-smoke-nginx -c '
              set -ex
              mkdir -p /tmp/nginx_test/logs
              cat > /tmp/nginx_test/nginx.conf <<CONF
              load_module /usr/local/nginx/modules/ngx_pagespeed_module.so;
              events { worker_connections 64; }
              http {
                server {
                  listen 8080;
                  location / { return 200 "ok"; }
                }
              }
          CONF
              /usr/local/nginx/sbin/nginx -p /tmp/nginx_test -c /tmp/nginx_test/nginx.conf
              sleep 1
              curl -sI http://localhost:8080/ | grep -qi "X-Page-Speed" || true
              /usr/local/nginx/sbin/nginx -p /tmp/nginx_test -c /tmp/nginx_test/nginx.conf -s stop
              sleep 1
              rm -f /usr/local/nginx/modules/ngx_pagespeed_module.so
              sed -i "/load_module/d" /tmp/nginx_test/nginx.conf
              /usr/local/nginx/sbin/nginx -p /tmp/nginx_test -c /tmp/nginx_test/nginx.conf -t
              /usr/local/nginx/sbin/nginx -p /tmp/nginx_test -c /tmp/nginx_test/nginx.conf
              sleep 1
              ! curl -sI http://localhost:8080/ | grep -qi "X-Page-Speed"
              /usr/local/nginx/sbin/nginx -p /tmp/nginx_test -c /tmp/nginx_test/nginx.conf -s stop
              echo "=== Nginx uninstall verification PASSED ==="
            '

  package-smoke-nginx-hosted:
    name: Smoke Test (Nginx, hosted)
    needs: [version, linux-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: *smoke-nginx-steps

  # Load the freshly built module into the STOCK packaged nginx of each
  # distro (installed with apt or dnf, not built from source). A module is
  # pinned to the exact nginx version it was built against, so this is the
  # check that the distro matrix is right: a mismatch is refused at install or
  # by `nginx -t`.
  package-load-check-nginx:
    name: Packaged-Nginx Load Check (x64)
    needs: [version, nginx-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 90
    env: &loadcheck-x64-env
      ARCH: x64
    steps: &loadcheck-steps
      - *unlock-vendor

      - *checkout-tag

      - name: Download the nginx packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-nginx-${{ env.ARCH }}
          path: ${{ runner.temp }}/nginx-packages

      - name: Load into the stock packaged nginx of each suite
        run: |
          bash tools/ci/release_nginx.sh load-check --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-packages"

  package-load-check-nginx-hosted:
    name: Packaged-Nginx Load Check (x64, hosted)
    needs: [version, nginx-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: *loadcheck-x64-env
    steps: *loadcheck-steps

  package-load-check-nginx-arm64:
    name: Packaged-Nginx Load Check (arm64)
    needs: [version, nginx-arm64-join]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-arm64-join.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ARCH: arm64
    steps: *loadcheck-steps

  # Install each package into its stock nginx and run the nginx test suite
  # against it.
  package-smoke-nginx-packaged:
    name: Smoke Test (Nginx, packaged)
    needs: [version, nginx-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 180
    env: &packaged-env
      ARCH: x64
    steps: &packaged-steps
      - *unlock-vendor

      - *checkout-tag

      - name: Download the nginx packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-nginx-${{ env.ARCH }}
          path: ${{ runner.temp }}/nginx-packages

      - name: Package install and the nginx test suite, per suite
        run: |
          bash tools/ci/release_nginx.sh suite --arch "$ARCH" \
            --src "${GITHUB_WORKSPACE}" --pkgdir "${RUNNER_TEMP}/nginx-packages"

  package-smoke-nginx-packaged-hosted:
    name: Smoke Test (Nginx, packaged, hosted)
    needs: [version, nginx-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.nginx-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: *packaged-env
    steps: *packaged-steps

  # ---------------------------------------------------------------------
  # cPanel (EasyApache 4) packages: a repackaging of the stock Apache rpm of
  # the matching floor (the el9 rpm of the x64 build, the el8 rpm of the el8
  # build). Unsigned; the release lane does not sign rpms. A pre-release tag builds none (the
  # spec carries the release version).
  # ---------------------------------------------------------------------
  ea4-build:
    name: EA4 Build (${{ matrix.os }})
    needs: [version, linux-ready, el8-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.el8-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [el9, el8]
    env: &ea4-env
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      EA4_OS: ${{ matrix.os }}
    steps: &ea4-steps
      - *unlock-vendor

      - *checkout-tag

      - name: Stamp the module version
        run: bash tools/ci/release_version.sh stamp "$RELEASE_TAG" net/instaweb/public/VERSION

      - name: Download the stock rpm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.os == 'el8' && 'stock-el8' || 'asset-linux-x64' }}
          path: ${{ runner.temp }}/upstream

      - name: Build the cPanel package
        id: build
        run: |
          set -euo pipefail
          # Only the stock rpm belongs in the upstream directory.
          mkdir -p "${RUNNER_TEMP}/stock"
          cp "${RUNNER_TEMP}"/upstream/mod-pagespeed-*.x86_64.rpm "${RUNNER_TEMP}/stock/"
          bash tools/ci/release_ea4_build.sh --os "$EA4_OS" \
            --upstream "${RUNNER_TEMP}/stock" \
            --version-file net/instaweb/public/VERSION \
            --out "${RUNNER_TEMP}/ea4-out" \
            --work "${RUNNER_TEMP}/ea4-work"

      - name: Upload the unsigned cPanel package
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-ea4-${{ matrix.os }}
          path: ${{ runner.temp }}/ea4-out/*.rpm
          retention-days: 14
          if-no-files-found: error

      - *reown

  ea4-build-hosted:
    name: EA4 Build (${{ matrix.os }}, hosted)
    needs: [version, linux-ready, el8-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.el8-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [el9, el8]
    env: *ea4-env
    steps: *ea4-steps

  # el10 is additive: a stock rpm whose name does not match the spec skips
  # the package instead of failing the release.
  ea4-el10-build:
    name: EA4 Build (el10)
    needs: [version, linux-ready, el10-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.el10-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 60
    env: &ea4-el10-env
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps: &ea4-el10-steps
      - *unlock-vendor

      - *checkout-tag

      - name: Stamp the module version
        run: bash tools/ci/release_version.sh stamp "$RELEASE_TAG" net/instaweb/public/VERSION

      - name: Download the stock rpm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-apache-el10
          path: ${{ runner.temp }}/stock

      - name: Build the cPanel package
        id: build
        run: |
          bash tools/ci/release_ea4_build.sh --os el10 \
            --upstream "${RUNNER_TEMP}/stock" \
            --version-file net/instaweb/public/VERSION \
            --out "${RUNNER_TEMP}/ea4-out" \
            --work "${RUNNER_TEMP}/ea4-work"

      - name: Upload the unsigned cPanel package
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-ea4-el10
          path: ${{ runner.temp }}/ea4-out/*.rpm
          retention-days: 14
          if-no-files-found: error

      - *reown

  ea4-el10-build-hosted:
    name: EA4 Build (el10, hosted)
    needs: [version, linux-ready, el10-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-ready.result == 'success' && needs.el10-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *ea4-el10-env
    steps: *ea4-el10-steps

  # ---------------------------------------------------------------------
  # Windows: the IIS module and the pinned optimizer worker, unsigned. The
  # installer is built from signed binaries, so signing and the installer are
  # separate hosted jobs further down; this job hands over the unsigned
  # payload as `unsigned-windows` (not a release file). One step list for the build runner and its hosted
  # twin; a hosted image gets the pinned toolchain installed, a build runner
  # provides it through its runner environment (docs/ci/runner-environment.md).
  # ---------------------------------------------------------------------
  windows-release-build:
    name: Windows Release Build
    needs: [version, vendor-ready]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps: &windows-steps
      - name: Clear the workspace
        run: |
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download the release tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree
          path: ${{ runner.temp }}/tree

      - name: Provision the toolchain (hosted runner)
        if: runner.environment == 'github-hosted'
        run: |
          $ErrorActionPreference = 'Stop'
          # NASM is pinned to 2.16.03: the AV1 codec dependency rejects 3.x.
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::nasm install failed"; exit 1 }
          (Join-Path $env:ProgramFiles 'NASM') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # clang-cl comes from LLVM 19.
          $major = 0
          $cc = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($cc) { $v = (& clang-cl --version 2>&1 | Select-Object -First 1); if ($v -match 'version (\d+)') { $major = [int]$Matches[1] } }
          if ($major -ne 19) {
            choco install llvm --version=19.1.7 --allow-downgrade -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::llvm install failed"; exit 1 }
          }
          (Join-Path $env:ProgramFiles 'LLVM\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tool locations come from PATH, or from the runner's environment when
      # it provides one. Nothing here names a drive, a user profile or an
      # installation directory, and no tool location is printed.
      - name: Resolve the runner environment
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-JobEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          function Add-ToolDir([string]$Dir) {
            if ($Dir -and (Test-Path -LiteralPath $Dir)) {
              $Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = ($Dir + ';' + $env:PATH)
              return $true
            }
            return $false
          }
          # CI_WIN_TOOLS_DIR is a semicolon-separated list of directories.
          $toolDirs = @()
          if ($env:CI_WIN_TOOLS_DIR) {
            $toolDirs = @($env:CI_WIN_TOOLS_DIR -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
          }
          [array]::Reverse($toolDirs)
          foreach ($d in $toolDirs) { [void](Add-ToolDir $d) }
          [array]::Reverse($toolDirs)
          if ($toolDirs.Count -gt 0) { Write-Host "using the runner's tool directories" }
          if ($env:CI_WIN_LLVM_DIR) { [void](Add-ToolDir (Join-Path $env:CI_WIN_LLVM_DIR 'bin')) }
          if ($env:CI_WIN_PYTHON_DIR) { [void](Add-ToolDir $env:CI_WIN_PYTHON_DIR) }
          $bazel = @('bazelisk', 'bazel') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $bazel) {
            Write-Host "::error::neither bazelisk nor bazel is on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_CMD' $bazel
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            Write-Host "::error::clang-cl (LLVM 19) is not on PATH; see docs/ci/runner-environment.md (CI_WIN_LLVM_DIR)"
            exit 1
          }
          Set-JobEnv 'BAZEL_LLVM' (Split-Path -Parent (Split-Path -Parent $clangCl.Source))
          # The AV1 encoder needs NASM 2.16.03 (nasm 3.x dropped the "-Ox"
          # line from `nasm -hf` that the codec build greps for).
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Write-Host "::error::nasm 2.16.03 is not on PATH; see docs/ci/runner-environment.md (CI_WIN_TOOLS_DIR)"
            exit 1
          }
          if (-not (& nasm -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            Write-Host "::error::the nasm on PATH is not usable by the AV1 codec build (3.x is not supported). Provide 2.16.03."
            exit 1
          }
          # Bazel's shell: the runner's, else MSYS2 bash, else Git bash.
          $bashCandidates = @()
          if ($env:BAZEL_SH) { $bashCandidates += $env:BAZEL_SH }
          foreach ($d in $toolDirs) { $bashCandidates += (Join-Path $d 'bash.exe') }
          $bashCandidates += (Join-Path $env:SystemDrive 'msys64\usr\bin\bash.exe')
          $bashCandidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
          $bash = $bashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) {
            Write-Host "::error::no bash.exe found for Bazel (MSYS2 or Git for Windows); see docs/ci/runner-environment.md"
            exit 1
          }
          Set-JobEnv 'BAZEL_SH' $bash
          # A short output root keeps paths under the Windows length limit.
          Set-JobEnv 'WIN_BAZEL_OUTPUT_ROOT' ($(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/')
          Set-JobEnv 'WIN_CACHE_DIR' $(if ($env:CI_WIN_CACHE_DIR) { $env:CI_WIN_CACHE_DIR } else { Join-Path $env:RUNNER_TEMP 'bazel-disk' })
          if ($env:CI_WIN_CACHE_MAX_SIZE) { Set-JobEnv 'WIN_CACHE_MAX_SIZE' $env:CI_WIN_CACHE_MAX_SIZE }
          Write-Host "build tool: $bazel"

      # Decompress with all cores, then extract with the Windows tar (the
      # MSYS2 GNU tar reads a drive letter as a remote host).
      - name: Extract the release tree
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tarball = Join-Path $env:RUNNER_TEMP 'tree\module-tree.tar.zst'
          & zstd -d -f -T0 $tarball -o "$tarball.tar"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::zstd decompression failed (exit $LASTEXITCODE)"; exit 1 }
          & "$($env:SystemRoot)\System32\tar.exe" xf "$tarball.tar" -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tar extraction failed (exit $LASTEXITCODE)"; exit 1 }
          Remove-Item -LiteralPath $tarball, "$tarball.tar" -ErrorAction SilentlyContinue
          $stamped = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GIT_COMMIT') -Raw).Trim()
          if ($stamped -ne $env:RELEASE_SHA) {
            Write-Host "::error::stale or missing GIT_COMMIT stamp in the extracted tree"
            exit 1
          }

      - name: Set up the MSVC environment
        run: |
          $ErrorActionPreference = 'Continue'
          # Source vcvars64 and export INCLUDE/LIB/PATH for the later steps.
          # Build Tools installs are products too: without -products * vswhere
          # reports nothing on a host that has only them.
          $vsDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsDir = & $vswhere -products * -latest -property installationPath 2>$null
          }
          if (-not $vsDir -or -not (Test-Path -LiteralPath "$vsDir\VC\Auxiliary\Build\vcvars64.bat")) {
            $vsDir = @(
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\Community')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vsDir) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = "$vsDir\VC\Auxiliary\Build\vcvars64.bat"
          # Full path through ComSpec: an MSYS2 cmd on PATH would shadow
          # System32\cmd.exe.
          & "$env:ComSpec" /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|PATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # MSYS2 coreutils and Ninja go on PATH for the genrule cmake builds.
          $extra = Join-Path $env:SystemDrive 'msys64\usr\bin'
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) { $extra = "$extra;" + (Split-Path $ninja.Source) }
          "PATH=$extra;$($env:PATH)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the IIS module (optimized, with debug symbols)
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location $env:GITHUB_WORKSPACE
          $bazel = $env:BAZEL_CMD
          $outRoot = $env:WIN_BAZEL_OUTPUT_ROOT
          $startup = @("--output_user_root=$outRoot")
          # Forward slashes for every Bazel path (a Windows Bazel requirement).
          $diskCache = $env:WIN_CACHE_DIR -replace '\\', '/'
          $common = @('--config=windows', '--config=clang-cl', '-c', 'opt',
                      '--copt=/Z7', '--linkopt=/DEBUG', '--nostamp',
                      "--workspace_status_command=echo.",
                      "--disk_cache=$diskCache")
          if ($env:WIN_CACHE_MAX_SIZE) { $common += "--experimental_disk_cache_gc_max_size=$($env:WIN_CACHE_MAX_SIZE)" }
          if (Test-Path -LiteralPath 'vendor') { $common = @('--config=vendored') + $common }
          if ($env:BAZEL_REMOTE_CACHE_URL) {
            $common += "--remote_cache=$($env:BAZEL_REMOTE_CACHE_URL)"
            Write-Host "using the remote cache"
          } else {
            Write-Host "::notice::BAZEL_REMOTE_CACHE_URL not set: building without the remote cache (docs/ci/runner-environment.md)"
          }
          # Shut down a stale server so it picks up the vcvars-enriched PATH.
          & { $ErrorActionPreference = 'Continue'; & $bazel @startup shutdown 2>$null } *>$null
          & $bazel @startup build @common -- //pagespeed/iis:pagespeed_iis.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # bazel-bin is a convenience link that a runner without link
          # privileges does not have, so ask Bazel.
          $bazelBin = (& $bazel @startup info @common bazel-bin 2>$null).Trim()
          $staging = Join-Path $env:GITHUB_WORKSPACE '.unsigned-windows'
          if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $staging 'iis') | Out-Null
          Copy-Item "$bazelBin\pagespeed\iis\pagespeed_iis.dll" (Join-Path $staging 'iis')
          $pdb = Get-ChildItem $bazelBin -Recurse -Filter '*.pdb' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'pagespeed_iis' } | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName (Join-Path $staging 'iis\pagespeed_iis.pdb') }
          else { Write-Host "::warning::no debug symbols file found for the IIS module" }
          Get-ChildItem (Join-Path $staging 'iis') | Format-Table Name, Length

      # The optimizer worker the installer carries: the Windows zip of the
      # pinned optimizer release, verified against the pin. Exit 3 means the
      # pinned release has no Windows zip; the installer is then the module
      # alone.
      - name: Fetch the pinned optimizer worker
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = Join-Path $env:GITHUB_WORKSPACE '.unsigned-windows\optimizer'
          & .\install\iis\fetch-optimizer-windows.ps1 -OutDir $dir
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            Write-Host "optimizer worker fetched and verified"
          } elseif ($rc -eq 3) {
            Write-Host "::warning::the pinned optimizer release has no Windows zip; the installer carries the module only"
            $global:LASTEXITCODE = 0
          } else {
            exit $rc
          }

      - name: Upload the unsigned payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows
          path: .unsigned-windows
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  windows-release-build-hosted:
    name: Windows Release Build (hosted)
    needs: [version, vendor-ready]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.vendor-ready.result == 'success' && vars.FLEET_ENABLED != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: powershell
    steps: *windows-steps

  windows-ready:
    name: Windows build ready
    needs: [windows-release-build, windows-release-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two legs succeeded
        env:
          FLEET: ${{ needs.windows-release-build.result }}
          HOSTED: ${{ needs.windows-release-build-hosted.result }}
        run: |
          echo "fleet leg: ${FLEET}, hosted leg: ${HOSTED}"
          [ "$FLEET" = success ] || [ "$HOSTED" = success ] || { echo "::error::the Windows build did not succeed"; exit 1; }

  ea4-ready:
    name: cPanel packages ready
    needs: [ea4-build, ea4-build-hosted, ea4-el10-build, ea4-el10-build-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Each pair has a leg that succeeded
        env:
          A: ${{ needs.ea4-build.result }}
          B: ${{ needs.ea4-build-hosted.result }}
          C: ${{ needs.ea4-el10-build.result }}
          D: ${{ needs.ea4-el10-build-hosted.result }}
        run: |
          echo "el9 and el8: ${A}, ${B}; el10: ${C}, ${D}"
          if [ "$A" != success ] && [ "$B" != success ]; then echo "::error::the el9 and el8 cPanel build did not succeed"; exit 1; fi
          if [ "$C" != success ] && [ "$D" != success ]; then echo "::error::the el10 cPanel build did not succeed"; exit 1; fi

  # ---------------------------------------------------------------------
  # Windows installer and signing. In a real run (dry_run false) the binaries are signed
  # first, in the `release` environment on a hosted runner, and the installer
  # is built from the signed binaries and then signed itself. In a dry run
  # nothing is signed: the installer is built from the unsigned payload and
  # handed on as it is, so the gates and the validation see the same shape.
  #
  #   windows-release-build -> windows-sign (real run) -> msi-build
  #     -> msi-sign (real run) -> the two release gates -> validate
  #
  # The signing code is checked out from master (never from the tag) because
  # it runs with the signing secrets; the ref guard makes the tag a commit of
  # master in any case. The artifact `asset-windows` is the installer that
  # the rest of the lane uses: signed in a real run, unsigned in a dry run.
  # ---------------------------------------------------------------------
  windows-sign:
    name: Sign the Windows binaries
    needs: [version, windows-ready]
    if: ${{ !cancelled() && needs.windows-ready.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout master (signing code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: /tools/ci/
          sparse-checkout-cone-mode: false

      - name: Download the unsigned payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: signed-output

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The module, and the optimizer worker and its client library when
          # the installer carries them. The optimizer release publishes them
          # unsigned; everything the installer installs is signed here.
          $files = @('signed-output\iis\pagespeed_iis.dll')
          foreach ($f in @('factory_worker.exe', 'pagespeed.dll')) {
            $p = Join-Path 'signed-output\optimizer' $f
            if (Test-Path -LiteralPath $p) { $files += $p }
          }
          .\tools\ci\Sign-Windows.ps1 -Files $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the signed payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-windows
          path: signed-output
          retention-days: 14
          if-no-files-found: error

  # No secret, no environment: the installer is built from the signed
  # binaries of a real run, or from the unsigned ones of a dry run. WiX comes
  # from the pinned dotnet tool the build script installs. Also builds the
  # synthetic older installer the upgrade gate starts from.
  msi-build:
    name: Build the Windows installer
    needs: [version, windows-ready, windows-sign]
    if: ${{ !cancelled() && needs.windows-ready.result == 'success' && (needs.version.outputs.dry_run == 'true' || needs.windows-sign.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      # The installer's build revision, the 4th field of its ProductVersion
      # (install/iis/build-msi.ps1). run_number belongs to the calling
      # release.yml: it increases across tag runs, dispatches and dry runs,
      # and a rerun keeps the same number: two builds then share a revision
      # and can replace each other (intended: only a lower revision is
      # refused). Never a date or a hash. The version job refuses a run
      # number above 65535.
      PAGESPEED_MSI_REVISION: ${{ github.run_number }}
    steps:
      - name: Checkout the tag (installer sources only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /install/iis/
            /LICENSE
            /NOTICE
            /net/instaweb/public/VERSION
            /tools/ci/release_version.sh
          sparse-checkout-cone-mode: false

      - name: Stamp the module version
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::checked-out HEAD is not the release commit"; exit 1; }
          bash tools/ci/release_version.sh stamp "$RELEASE_TAG" net/instaweb/public/VERSION
          cat net/instaweb/public/VERSION

      - name: Download the signed payload (real run)
        if: ${{ env.DRY_RUN == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows
          path: payload

      - name: Download the unsigned payload (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: payload

      # The build script installs the pinned WiX tool when it is missing; put
      # the tool directory on the path first so the new process finds it.
      - name: Install WiX
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the WiX install failed"; exit 1 }
          (Join-Path $env:USERPROFILE '.dotnet\tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The older installer (version 1.0.99, module only) that the upgrade
      # gate installs first. The stamped version file is restored afterwards.
      - name: Build the older installer for the upgrade gate
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'net\instaweb\public\VERSION'
          $backup = "$versionFile.real"
          Copy-Item $versionFile $backup -Force
          try {
            $patched = Get-Content $versionFile | ForEach-Object {
              if ($_ -match '^MAJOR=') { 'MAJOR=1' }
              elseif ($_ -match '^MINOR=') { 'MINOR=0' }
              elseif ($_ -match '^BUILD=') { 'BUILD=99' }
              elseif ($_ -match '^PRERELEASE=') { 'PRERELEASE=' }
              else { $_ }
            }
            Set-Content -Path $versionFile -Value $patched -Encoding ASCII
            New-Item -ItemType Directory -Path 'msi-old' -Force | Out-Null
            .\install\iis\build-msi.ps1 -OutputDir (Join-Path $env:GITHUB_WORKSPACE 'msi-old') `
              -BinDir (Join-Path $env:GITHUB_WORKSPACE 'payload\iis') -SrcDir $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Move-Item -Path $backup -Destination $versionFile -Force
          }
          Get-ChildItem msi-old -Filter *.msi | Format-Table Name, Length

      - name: Build the installer
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'msi-out' -Force | Out-Null
          # Hashtable splat: an array splat binds its elements positionally.
          $optimizer = @{}
          $workerDir = Join-Path $env:GITHUB_WORKSPACE 'payload\optimizer'
          if (Test-Path -LiteralPath (Join-Path $workerDir 'factory_worker.exe')) { $optimizer = @{ OptimizerDir = $workerDir } }
          else { Write-Host "::warning::the payload has no optimizer worker; the installer carries the module only" }
          .\install\iis\build-msi.ps1 -OutputDir (Join-Path $env:GITHUB_WORKSPACE 'msi-out') `
            -BinDir (Join-Path $env:GITHUB_WORKSPACE 'payload\iis') -SrcDir $env:GITHUB_WORKSPACE @optimizer
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }
          $want = "pagespeed-iis-$($env:RELEASE_VERSION)-win-x64.msi"
          $found = @(Get-ChildItem msi-out -Filter *.msi)
          if ($found.Count -ne 1 -or $found[0].Name -ne $want) {
            Write-Host "::error::expected exactly $want, found: $($found.Name -join ', ')"
            exit 1
          }
          Get-ChildItem msi-out | Format-Table Name, Length

      - name: Upload the older installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msi-old
          path: msi-old/*.msi
          retention-days: 14
          if-no-files-found: error

      # The installer of a real run still has to be signed; it goes on as
      # `msi-unsigned`. A dry run hands it on as the release file.
      - name: Upload the installer for signing (real run)
        if: ${{ env.DRY_RUN == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msi-unsigned
          path: msi-out/*.msi
          retention-days: 14
          if-no-files-found: error

      - name: Upload the installer (dry run, unsigned)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-windows
          path: msi-out/*.msi
          retention-days: 14
          if-no-files-found: error

  msi-sign:
    name: Sign the Windows installer
    needs: [version, msi-build]
    if: ${{ !cancelled() && needs.msi-build.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout master (signing code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: /tools/ci/
          sparse-checkout-cone-mode: false

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-unsigned
          path: msi

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem msi -Filter *.msi)
          if ($msi.Count -ne 1) { Write-Host "::error::expected exactly one installer, found $($msi.Count)"; exit 1 }
          .\tools\ci\Sign-Windows.ps1 -Files $msi[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-windows
          path: msi/*.msi
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The release gates on the fleet-hyperv class: reusable workflows of
  # this repository that need a Hyper-V guest (docs/ci/pipelines.md). They
  # hold no secret and no write token. They run in a dry run as well; the
  # installer under test is the one in `asset-windows` (unsigned in a dry run,
  # signed in a real one). A gate workflow can succeed without having tested
  # anything (it skips when its guest is not provisioned, and the cPanel gate
  # skips on a pre-release, which has no package). So each gate workflow
  # exposes an output `ran`, true only when the smoke actually executed, and in
  # a real run `validate` requires ran == 'true' from the installer gate and,
  # on a release (not a pre-release), from both cPanel gates. A missing output
  # reads as false: the gates fail closed until the gate workflows define it.
  # While the repository variable FLEET_IIS_ENABLED is not 'true' (no runner
  # of the class is registered) the gate jobs are skipped, not queued. A real
  # run then fails closed at `validate`, which requires ran == 'true' from
  # them; a dry run tolerates the skipped gates.
  # The called workflows are pinned to master by name and not by relative path.
  # ---------------------------------------------------------------------
  gate-iis-msi-upgrade:
    name: Gate, IIS installer
    needs: [version, msi-build, msi-sign]
    if: ${{ !cancelled() && vars.FLEET_IIS_ENABLED == 'true' && needs.msi-build.result == 'success' && (needs.version.outputs.dry_run == 'true' || needs.msi-sign.result == 'success') }}
    permissions:
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/gate-iis-msi-upgrade.yml@master
    with:
      msi_artifact: asset-windows
      old_msi_artifact: msi-old
      release_tag: ${{ needs.version.outputs.release_tag }}

  # One job per operating system (a matrix would leave `ran` ambiguous). el10
  # has no gate: its package is optional in the asset set.
  gate-cpanel-smoke-el9:
    name: Gate, cPanel (el9)
    needs: [version, ea4-ready]
    if: ${{ !cancelled() && vars.FLEET_IIS_ENABLED == 'true' && needs.ea4-ready.result == 'success' }}
    permissions:
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/gate-cpanel-smoke.yml@master
    with:
      os: el9
      rpm_artifact: asset-ea4-el9
      release_tag: ${{ needs.version.outputs.release_tag }}

  gate-cpanel-smoke-el8:
    name: Gate, cPanel (el8)
    needs: [version, ea4-ready]
    if: ${{ !cancelled() && vars.FLEET_IIS_ENABLED == 'true' && needs.ea4-ready.result == 'success' }}
    permissions:
      contents: read
    uses: We-Amp/mod_pagespeed/.github/workflows/gate-cpanel-smoke.yml@master
    with:
      os: el8
      rpm_artifact: asset-ea4-el8
      release_tag: ${{ needs.version.outputs.release_tag }}

  # ---------------------------------------------------------------------
  # Validate: assemble the asset set from the run artifacts, check it fails
  # closed on any deviation, write SHA256SUMS and manifest.json, and upload
  # them with the files as the one run artifact `release-assets`
  # (docs/ci/release.md). Hosted, no secret. The tooling comes from master,
  # not from the tree being released.
  # ---------------------------------------------------------------------
  validate:
    name: Validate the asset set, SHA256SUMS and manifest
    needs:
      - version
      - vendor-ready
      - security-gates
      - optimizer-fetch
      - systest-gate
      - linux-ready
      - linux-arm64-release-build
      - nginx-ready
      - nginx-arm64-plan
      - nginx-distro-build-arm64
      - nginx-arm64-join
      - nginx-distro-build-el10
      - nginx-distro-build-el10-hosted
      - vendor-sidecar
      - sidecar-pair
      - sidecar-pair-arm64
      - el8-ready
      - el10-ready
      - windows-release-build
      - windows-release-build-hosted
      - windows-ready
      - windows-sign
      - msi-build
      - msi-sign
      - gate-iis-msi-upgrade
      - gate-cpanel-smoke-el9
      - gate-cpanel-smoke-el8
      - ea4-ready
      - unit-tests
      - unit-tests-hosted
      - package-smoke-deb
      - package-smoke-deb-hosted
      - package-smoke-rpm
      - package-smoke-rpm-hosted
      - package-smoke-nginx
      - package-smoke-nginx-hosted
      - package-load-check-nginx
      - package-load-check-nginx-hosted
      - package-load-check-nginx-arm64
      - package-smoke-nginx-packaged
      - package-smoke-nginx-packaged-hosted
      - ea4-build
      - ea4-build-hosted
      - ea4-el10-build
      - ea4-el10-build-hosted
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEEDS: ${{ toJSON(needs) }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
      IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
      OPTIMIZER_TAG: ${{ needs.optimizer-fetch.outputs.pair_tag }}
      PAIR_VERSION: ${{ needs.optimizer-fetch.outputs.pair_pkg_version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      FLEET_ENABLED: ${{ vars.FLEET_ENABLED }}
    steps:
      # Every upstream job succeeded, except that of each build runner pair
      # exactly the leg that ran may have, and the other was skipped.
      - name: Every upstream job succeeded
        run: |
          set -euo pipefail
          # name of the job, then the name of its hosted twin ("-" for none)
          PAIRS="
          nginx-distro-build-el10 nginx-distro-build-el10-hosted
          windows-release-build windows-release-build-hosted
          unit-tests unit-tests-hosted
          package-smoke-deb package-smoke-deb-hosted
          package-smoke-rpm package-smoke-rpm-hosted
          package-smoke-nginx package-smoke-nginx-hosted
          package-load-check-nginx package-load-check-nginx-hosted
          package-smoke-nginx-packaged package-smoke-nginx-packaged-hosted
          ea4-build ea4-build-hosted
          ea4-el10-build ea4-el10-build-hosted
          "
          bad=0
          in_pair=" "
          # The signing jobs run in a real run only: they must have
          # succeeded there and been skipped in a dry run. The gates need the
          # fleet-hyperv class and can succeed without testing anything, so in a
          # real run each must have succeeded AND reported ran == true (the
          # cPanel gates are exempt on a pre-release, which has no package);
          # in a dry run a skipped gate is allowed.
          for j in windows-sign msi-sign; do
            r="$(printf '%s' "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
            echo "${j}: ${r} (dry run: ${DRY_RUN})"
            in_pair="${in_pair}${j} "
            if [ "$DRY_RUN" = false ]; then [ "$r" = success ] || bad=1; else [ "$r" = skipped ] || bad=1; fi
          done
          for j in gate-iis-msi-upgrade gate-cpanel-smoke-el9 gate-cpanel-smoke-el8; do
            r="$(printf '%s' "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
            ran="$(printf '%s' "$NEEDS" | jq -r --arg j "$j" '.[$j].outputs.ran // "false"')"
            echo "${j}: ${r}, ran: ${ran} (dry run: ${DRY_RUN}, pre-release: ${IS_PRERELEASE})"
            in_pair="${in_pair}${j} "
            if [ "$DRY_RUN" = false ]; then
              [ "$r" = success ] || { echo "::error::the ${j} gate did not succeed"; bad=1; }
              if [ "$IS_PRERELEASE" = true ] && [ "${j#gate-cpanel-smoke-}" != "$j" ]; then continue; fi
              [ "$ran" = true ] || { echo "::error::the ${j} gate did not run its smoke (it needs the fleet and its guest); a skipped gate is not a pass"; bad=1; }
            else
              [ "$r" = success ] || [ "$r" = skipped ] || bad=1
            fi
          done
          while read -r a b; do
            [ -n "${a:-}" ] || continue
            in_pair="${in_pair}${a} ${b} "
            ra="$(printf '%s' "$NEEDS" | jq -r --arg j "$a" '.[$j].result')"
            rb="$(printf '%s' "$NEEDS" | jq -r --arg j "$b" '.[$j].result')"
            echo "${a}: ${ra}, ${b}: ${rb}"
            if [ "$ra" != success ] && [ "$rb" != success ]; then bad=1; fi
          done <<<"$PAIRS"
          for j in $(printf '%s' "$NEEDS" | jq -r 'keys[]'); do
            case "$in_pair" in *" $j "*) continue ;; esac
            r="$(printf '%s' "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
            echo "${j}: ${r}"
            [ "$r" = success ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::an upstream job did not succeed"; exit 1; }

      - name: Checkout master (tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/stage
          pattern: asset-*

      # The manifest of the sidecar pair, from the two tarballs: one more
      # release file, so SHA256SUMS (and its signature) covers it.
      - name: Write the sidecar pair manifest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sidecar-pair" "${RUNNER_TEMP}/stage/asset-sidecar-manifest"
          cp "${RUNNER_TEMP}"/stage/asset-sidecar-x64/*.tar.gz "${RUNNER_TEMP}"/stage/asset-sidecar-arm64/*.tar.gz \
            "${RUNNER_TEMP}/sidecar-pair/"
          python3 -I tools/ci/sidecar_pair_manifest.py build --dir "${RUNNER_TEMP}/sidecar-pair" \
            --tag "$TAG" --version "$VERSION" --source-sha "$RELEASE_SHA" \
            --out "${RUNNER_TEMP}/stage/asset-sidecar-manifest/sidecar-pair.json"
          cat "${RUNNER_TEMP}/stage/asset-sidecar-manifest/sidecar-pair.json"

      - name: Assemble the asset set
        run: |
          set -euo pipefail
          ls "${RUNNER_TEMP}/stage"
          python3 -I tools/ci/release_manifest.py build \
            --stage "${RUNNER_TEMP}/stage" \
            --out "${RUNNER_TEMP}/release-assets" \
            --tag "$TAG" --version "$VERSION" --pkg-version "$PKG_VERSION" \
            --prerelease "$IS_PRERELEASE" \
            --source-sha "$RELEASE_SHA" --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --optimizer-tag "$OPTIMIZER_TAG" \
            --profile part-b

      # What the names promise, the packages must contain: the version of
      # every package, and the serving pair (the module packages require the
      # optimizer at exactly the pair version, and the optimizer packages
      # have it).
      - name: Package contents match the tag
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm >/dev/null
          cd "${RUNNER_TEMP}/release-assets"
          shopt -s nullglob
          for deb in mod-pagespeed_*.deb nginx-module-pagespeed_*.deb; do
            v="$(dpkg-deb -f "$deb" Version)"
            case "$v" in "${PKG_VERSION}"-*) ;; *) echo "::error::$deb Version '$v' does not start with '${PKG_VERSION}-'"; exit 1 ;; esac
            dep="$(dpkg-deb -f "$deb" Depends)"
            case "$deb" in
              mod-pagespeed_*)
                case "$dep" in *"pagespeed-optimizer (= ${PAIR_VERSION})"*) ;; *) echo "::error::$deb does not depend on pagespeed-optimizer (= ${PAIR_VERSION}): $dep"; exit 1 ;; esac
                # Takes over from Google's archived packages in one step, and
                # keeps their LoadModule ... mod_pagespeed_ap24.so loading.
                # The packaging tools may reorder a relationship list, so the
                # set of names is compared, not the string.
                for f in Conflicts Replaces; do
                  got="$(dpkg-deb -f "$deb" "$f" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sort | paste -sd, -)"
                  [ "$got" = "mod-pagespeed-beta,mod-pagespeed-stable" ] \
                    || { echo "::error::$deb $f is '$(dpkg-deb -f "$deb" "$f")'"; exit 1; }
                done
                dpkg-deb -c "$deb" | grep -Eq '^l.* \./usr/lib/apache2/modules/mod_pagespeed_ap24\.so -> mod_pagespeed\.so$' \
                  || { echo "::error::$deb lacks the mod_pagespeed_ap24.so -> mod_pagespeed.so link"; exit 1; } ;;
            esac
            echo "$deb: Version $v"
          done
          for deb in pagespeed-optimizer_*.deb; do
            v="$(dpkg-deb -f "$deb" Version)"
            [ "$v" = "$PAIR_VERSION" ] || { echo "::error::$deb Version '$v' != '${PAIR_VERSION}'"; exit 1; }
            echo "$deb: Version $v"
          done
          for r in mod-pagespeed-*.rpm el10-mod-pagespeed-*.rpm nginx-module-pagespeed-*.rpm; do
            v="$(rpm -qp --qf '%{VERSION}' "$r")"
            [ "$v" = "$PKG_VERSION" ] || { echo "::error::$r version '$v' != '${PKG_VERSION}'"; exit 1; }
            case "$r" in
              mod-pagespeed-*|el10-mod-pagespeed-*)
                rpm -qp --requires "$r" | grep -Eq "^pagespeed-optimizer = $(printf '%s' "${PAIR_VERSION}" | sed 's/\./\\./g')(-[0-9A-Za-z.]+)?$" \
                  || { echo "::error::$r does not require pagespeed-optimizer = ${PAIR_VERSION}"; rpm -qp --requires "$r"; exit 1; }
                # Conflicts, never Obsoletes: the move from Google's package is
                # an explicit dnf swap, not something dnf upgrade does unasked.
                [ "$(rpm -qp --conflicts "$r" | sort | tr '\n' ' ')" = "mod-pagespeed-beta < 1.15 mod-pagespeed-stable < 1.15 " ] \
                  || { echo "::error::$r conflicts are wrong"; rpm -qp --conflicts "$r"; exit 1; }
                [ -z "$(rpm -qp --obsoletes "$r")" ] || { echo "::error::$r must not obsolete anything"; rpm -qp --obsoletes "$r"; exit 1; }
                rpm -qp --qf '[%{FILENAMES} %{FILELINKTOS}\n]' "$r" | grep -Eq '^/usr/lib64/httpd/modules/mod_pagespeed_ap24\.so mod_pagespeed\.so$' \
                  || { echo "::error::$r lacks the mod_pagespeed_ap24.so -> mod_pagespeed.so link"; exit 1; } ;;
            esac
            echo "$r: version $v"
          done
          for r in pagespeed-optimizer-*.rpm; do
            v="$(rpm -qp --qf '%{VERSION}' "$r")"
            [ "$v" = "$PAIR_VERSION" ] || { echo "::error::$r version '$v' != '${PAIR_VERSION}'"; exit 1; }
          done
          echo "package contents: ok"

      - name: Verify SHA256SUMS across the job boundary
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release-assets"
          sha256sum -c SHA256SUMS
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/release_manifest.py" verify .
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/sidecar_pair_manifest.py" verify \
            --manifest sidecar-pair.json --dir . --tag "$TAG" --version "$VERSION" --source-sha "$RELEASE_SHA"
          {
            echo "### Release assets of ${TAG}"
            echo ""
            echo "Version ${VERSION}, source commit ${RELEASE_SHA}, pre-release: ${IS_PRERELEASE}."
            echo ""
            echo '```'
            ls -l
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # In a real run the Windows files that reach the release must carry a
      # signature: the signed binaries and the installer in the set. (The
      # signing jobs have already had Windows validate each signature; this is
      # the check at the job boundary, for a file that was handed over
      # unsigned.) A dry run signs nothing.
      - name: Download the signed Windows binaries (real run)
        if: ${{ env.DRY_RUN == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows
          path: ${{ runner.temp }}/signed-windows

      - name: The Windows files are signed (real run)
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          python3 -I tools/ci/release_signature_check.py --self-test
          cd "${RUNNER_TEMP}"
          set -- signed-windows/iis/pagespeed_iis.dll
          for f in signed-windows/optimizer/factory_worker.exe signed-windows/optimizer/pagespeed.dll; do
            [ ! -f "$f" ] || set -- "$@" "$f"
          done
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/release_signature_check.py" pe "$@"
          python3 -I "${GITHUB_WORKSPACE}/tools/ci/release_signature_check.py" msi "release-assets/pagespeed-iis-${VERSION}-win-x64.msi"

      # Signing the checksums (SHA256SUMS.asc), creating the draft release and
      # publishing it are the jobs `sign-checksums` and `create-release`, in
      # the protected `release` environment after this job and only when
      # needs.version.outputs.dry_run is 'false'. Nothing in this job holds a
      # secret or a write token.
      - name: Upload the validated asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Signing of the checksums and the release. Real runs only (dry_run
  # false), hosted, in the protected `release` environment, after `validate`
  # succeeded. The package signing key lives in this one job; the release job
  # holds only the write token.
  # ---------------------------------------------------------------------
  sign-checksums:
    name: Sign SHA256SUMS
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      # The Release Signing Key, by full fingerprint. A new key changes this
      # line, RELEASE-SIGNING-KEY.asc and SECURITY.md together.
      RELEASE_KEY_FPR: 411DEFDB571351D2B25AEFCC9C02B5BDCCE75313
    steps:
      - name: Download the validated asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      # The published public key, from master (never from the tree being
      # released), is what the signature is verified against below.
      - name: Checkout master (published release key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trust
          sparse-checkout: RELEASE-SIGNING-KEY.asc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # SHA256SUMS lists manifest.json, so one signature covers the whole set.
      - name: Verify the set across the job boundary
        run: |
          set -euo pipefail
          cd assets
          sha256sum -c SHA256SUMS

      - name: Sign SHA256SUMS (detached, armored)
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE_SIGNING_KEY" ] || [ -z "$PACKAGE_SIGNING_PASSPHRASE" ]; then
            echo "::error::the package signing key or its passphrase is not set in the release environment (docs/ci/release.md)"
            exit 1
          fi
          # The private key must never outlive this step, also if the job is
          # ever moved to a persistent (fleet) runner: a fresh mktemp keyring,
          # removed by the EXIT trap on success and failure alike, and again
          # by the always() step below if the shell itself is killed.
          GNUPGHOME="$(mktemp -d "${RUNNER_TEMP}/gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          # The secret is the armored private key, base64 encoded.
          printf '%s' "$PACKAGE_SIGNING_KEY" | base64 -d | gpg --batch --quiet --import
          [ "$(gpg --batch --list-secret-keys --with-colons | grep -c '^sec:')" = 1 ] \
            || { echo "::error::the signing secret must hold exactly one secret key"; exit 1; }
          FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr" {print $10; exit}')"
          if [ "$FPR" != "$RELEASE_KEY_FPR" ]; then
            echo "::error::the signing secret holds key ${FPR:-<none>}, not the release signing key ${RELEASE_KEY_FPR}; nothing was signed"
            exit 1
          fi
          mkdir -p signature
          printf '%s' "$PACKAGE_SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$FPR" --armor --detach-sign --output signature/SHA256SUMS.asc assets/SHA256SUMS
          echo "Signed SHA256SUMS with key ${FPR}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Verified in a fresh keyring that holds only the published public key,
      # never the keyring the secret was imported into: a release whose
      # signature a user cannot check with RELEASE-SIGNING-KEY.asc fails here.
      - name: Verify SHA256SUMS.asc against the published release key
        run: |
          set -euo pipefail
          KEY=trust/RELEASE-SIGNING-KEY.asc
          if [ ! -s "$KEY" ]; then
            echo "::error::RELEASE-SIGNING-KEY.asc is missing on master; the signature cannot be checked against the published key"
            exit 1
          fi
          GNUPGHOME="$(mktemp -d "${RUNNER_TEMP}/gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          # The file must hold exactly one key, the release signing key.
          KEYS="$(gpg --batch --with-colons --show-keys "$KEY" \
            | awk -F: '$1=="pub"||$1=="sub" {want=($1=="pub")} $1=="fpr" && want {print $10; want=0}')"
          if [ "$KEYS" != "$RELEASE_KEY_FPR" ]; then
            echo "::error::RELEASE-SIGNING-KEY.asc holds [${KEYS//$'\n'/ }], expected exactly ${RELEASE_KEY_FPR}"
            exit 1
          fi
          gpg --batch --quiet --import "$KEY"
          STATUS="$(gpg --batch --status-fd 1 --verify signature/SHA256SUMS.asc assets/SHA256SUMS 2>/dev/null)" || {
            echo "::error::SHA256SUMS.asc does not verify against the published release key"
            exit 1
          }
          # gpg exits 0 and prints VALIDSIG also for a signature by a revoked
          # or expired key (REVKEYSIG / EXPKEYSIG): require exactly one good
          # signature and none of the bad-key or bad-signature states.
          count() { printf '%s\n' "$STATUS" | awk -v t="$1" '$1=="[GNUPG:]" && $2==t {n++} END {print n+0}'; }
          for t in REVKEYSIG EXPKEYSIG EXPSIG KEYREVOKED ERRSIG BADSIG; do
            if [ "$(count "$t")" != 0 ]; then
              echo "::error::SHA256SUMS.asc verification reports $t; not a good signature by a valid release key"
              exit 1
            fi
          done
          if [ "$(count GOODSIG)" != 1 ] || [ "$(count VALIDSIG)" != 1 ]; then
            echo "::error::SHA256SUMS.asc must carry exactly one good signature (GOODSIG $(count GOODSIG), VALIDSIG $(count VALIDSIG))"
            exit 1
          fi
          # VALIDSIG field 10 (awk $12) is the primary-key fingerprint.
          SIGNER="$(printf '%s\n' "$STATUS" | awk '$1=="[GNUPG:]" && $2=="VALIDSIG" {print $12}')"
          if [ "$SIGNER" != "$RELEASE_KEY_FPR" ]; then
            echo "::error::SHA256SUMS.asc VALIDSIG primary key is [${SIGNER//$'\n'/ }], expected exactly ${RELEASE_KEY_FPR}"
            exit 1
          fi
          echo "Verified SHA256SUMS.asc against RELEASE-SIGNING-KEY.asc (${RELEASE_KEY_FPR})" | tee -a "$GITHUB_STEP_SUMMARY"

      # Belt and braces for the EXIT traps above: a cancelled or killed step
      # skips its trap, and a leftover keyring on a persistent runner would
      # keep the private key on disk.
      - name: Remove the temporary keyrings
        if: always()
        run: |
          for h in "${RUNNER_TEMP}"/gnupg.*; do
            [ -d "$h" ] || continue
            GNUPGHOME="$h" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "$h"
          done

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-signature
          path: signature/SHA256SUMS.asc
          retention-days: 30
          if-no-files-found: error

  # The release is created as a draft, filled with every asset, checked
  # against what was uploaded, and only then published. Nothing is promoted
  # beyond that: no repository publication, no dispatch to another
  # repository. A pre-release tag produces a pre-release.
  create-release:
    name: Create the GitHub release
    needs: [version, validate, sign-checksums]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.sign-checksums.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      # gh release create --verify-tag needs a git checkout of the tag.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - name: Verify the checkout is the release commit
        run: |
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::checked-out HEAD is not the release commit"; exit 1; }

      - name: Checkout master (tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: tooling
          persist-credentials: false
          sparse-checkout: /tools/ci/
          sparse-checkout-cone-mode: false

      - name: Download the validated asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature
          path: signature

      # The set is what validate released, nothing else: the manifest names
      # this tag, this commit and this pre-release state, every file checks
      # out, and the signature is the one extra file.
      - name: Re-verify the set across the job boundary
        run: |
          set -euo pipefail
          python3 -I tooling/tools/ci/release_manifest.py verify dist
          python3 -I tooling/tools/ci/sidecar_pair_manifest.py verify \
            --manifest dist/sidecar-pair.json --dir dist --tag "$TAG" --version "$VERSION" --source-sha "$RELEASE_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          [ "$(jq -r .tag dist/manifest.json)" = "$TAG" ] || { echo "::error::the manifest names another tag"; exit 1; }
          [ "$(jq -r .source_sha dist/manifest.json)" = "$RELEASE_SHA" ] || { echo "::error::the manifest names another commit"; exit 1; }
          [ "$(jq -r .prerelease dist/manifest.json)" = "$IS_PRERELEASE" ] || { echo "::error::the manifest and the version disagree on the pre-release state"; exit 1; }
          [ -s signature/SHA256SUMS.asc ] || { echo "::error::no signature"; exit 1; }
          cp signature/SHA256SUMS.asc dist/SHA256SUMS.asc
          echo "OPTIMIZER_TAG=$(jq -r .optimizer_tag dist/manifest.json)" >> "$GITHUB_ENV"
          ls -l dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A draft left by an earlier run of this tag (failed or cancelled
          # before publishing) is deleted and made again; the tag itself is
          # kept. A published release is never reused or replaced.
          if state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = true ]; then
              echo "::notice::deleting the draft of an earlier run of ${TAG}"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::${TAG} is already published; a published release is never replaced (a new build of the same sources needs a new tag)"
              exit 1
            fi
          fi
          {
            printf '## mod_pagespeed %s\n\n' "$VERSION"
            if [ "$IS_PRERELEASE" = true ]; then
              printf 'This is a release candidate. It is built and tested like a release but is not meant for production.\n\n'
            fi
            printf 'The module packages for Apache, nginx and IIS, released with the pagespeed-optimizer packages of %s. Install the optimizer and the module package of the same version together.\n\n' "$OPTIMIZER_TAG"
            printf 'The native pair of the ASP.NET Core sidecar (nginx, the module built against it and the launch shim, per architecture) is in pagespeed-sidecar-native-%s-linux-*.tar.gz, described by sidecar-pair.json, and is for the WeAmp.PageSpeed.Sidecar NuGet packages.\n\n' "$VERSION"
            printf 'Source commit: %s\n\n' "$RELEASE_SHA"
            cat <<'NOTES'
          ### Verify a download

          Download the files and run `sha256sum -c SHA256SUMS`. `SHA256SUMS.asc` is a
          detached signature of `SHA256SUMS`. `manifest.json` lists every file with its
          kind, distribution and architecture, and is covered by `SHA256SUMS`. The
          Windows installer and the binaries in it are Authenticode signed.
          NOTES
          } > notes.md
          FLAGS=(--draft --verify-tag --title "mod_pagespeed ${VERSION}" --notes-file notes.md)
          if [ "$IS_PRERELEASE" = true ]; then FLAGS+=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}" dist/*

      # Download what the draft now holds and check it against SHA256SUMS: a
      # missing, truncated or extra asset stops the release before it is
      # published.
      - name: Check the draft against the set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir check
          [ "$(find check -type f -printf '%f\n' | LC_ALL=C sort)" = "$(find dist -type f -printf '%f\n' | LC_ALL=C sort)" ] \
            || { echo "::error::the draft's assets differ from the set"; find check -type f -printf '%f\n'; exit 1; }
          (cd check && sha256sum -c SHA256SUMS)
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "::error::the release is not a draft"; exit 1; }

      # The one promotion this lane performs: the draft becomes the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=(--draft=false)
          if [ "$IS_PRERELEASE" = true ]; then FLAGS+=(--prerelease=true --latest=false); else FLAGS+=(--prerelease=false); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Published ${URL} (pre-release: ${IS_PRERELEASE})" | tee -a "$GITHUB_STEP_SUMMARY"

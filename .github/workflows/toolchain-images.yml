#
# Toolchain images (tools/ci/toolchain-images/): the Ubuntu 20.04 and 22.04
# base images plus the compilers the nginx build recipe installs for those
# suites (g++-13 from the Ubuntu toolchain PPA, clang 18 from apt.llvm.org),
# built once and pushed to GHCR, so that a build can pull a pinned image
# instead of fetching the compilers from third-party repositories each time.
#
# Dispatch (from master) and a monthly schedule (scheduled runs happen on the
# default branch only). A scheduled run rebuilds and attests the images, nothing
# more. The focal and jammy build legs build in the images that
# install/nginx/toolchain-images.lock names; the digests a run gets are printed
# in the job summary and kept in the toolchain-images lock artifact, to be
# pasted into that file by hand in a reviewed pull request.
#
# Each suite is built natively on amd64 and arm64 hosted runners, pushed by
# digest, and joined into one multi-arch image. Build provenance and an SBOM
# are attested for each image; the multi-arch image gets a provenance
# attestation. Every job with write access runs on a hosted runner.
#
# A scheduled run whose multi-arch digests differ from
# install/nginx/toolchain-images.lock on master opens one issue (or updates the
# open one) with the new lock lines (job lock-notice). The lock changes only
# through a reviewed pull request; no job opens one.
#
# Try it:  gh workflow run toolchain-images.yml

name: Toolchain images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 3 * *'

permissions:
  contents: read

concurrency:
  group: toolchain-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/we-amp/mod-pagespeed-toolchain

jobs:
  # Keep in sync with build-arm64 below: the two jobs differ only in the runner,
  # the platform and the artifact names.
  build-amd64:
    name: Build ${{ matrix.suite }} amd64
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [focal, jammy]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tag: the image is pushed by digest and named only by the join job.
      # Provenance and the SBOM are attested below, not stored in the image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/ci/toolchain-images/Dockerfile.${{ matrix.suite }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.suite }},push-by-digest=true,name-canonical=true,push=true

      - name: Check the compilers in the pushed image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" bash -c 'g++-13 --version | head -n 1; clang-18 --version | head -n 1; cat /etc/pagespeed-toolchain-baked' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.suite }}-amd64.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.suite }}-amd64.spdx.json
          push-to-registry: true

      - name: Keep the digest for the join job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digest
          printf '%s\n' "${DIGEST}" > "digest/${{ matrix.suite }}-amd64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-digest-${{ matrix.suite }}-amd64
          path: digest/${{ matrix.suite }}-amd64
          if-no-files-found: error

  # Keep in sync with build-amd64 above: the two jobs differ only in the runner,
  # the platform and the artifact names.
  build-arm64:
    name: Build ${{ matrix.suite }} arm64
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [focal, jammy]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tag: the image is pushed by digest and named only by the join job.
      # Provenance and the SBOM are attested below, not stored in the image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/ci/toolchain-images/Dockerfile.${{ matrix.suite }}
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.suite }},push-by-digest=true,name-canonical=true,push=true

      - name: Check the compilers in the pushed image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" bash -c 'g++-13 --version | head -n 1; clang-18 --version | head -n 1; cat /etc/pagespeed-toolchain-baked' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.suite }}-arm64.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.suite }}-arm64.spdx.json
          push-to-registry: true

      - name: Keep the digest for the join job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digest
          printf '%s\n' "${DIGEST}" > "digest/${{ matrix.suite }}-arm64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-digest-${{ matrix.suite }}-arm64
          path: digest/${{ matrix.suite }}-arm64
          if-no-files-found: error

  join:
    name: Join ${{ matrix.suite }}
    needs: [build-amd64, build-arm64]
    strategy:
      fail-fast: false
      matrix:
        suite: [focal, jammy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-digest-${{ matrix.suite }}-*
          path: digests
          merge-multiple: true

      - name: Create the multi-arch image
        id: join
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
        run: |
          set -euo pipefail
          AMD64="$(cat "digests/${{ matrix.suite }}-amd64")"
          ARM64="$(cat "digests/${{ matrix.suite }}-arm64")"
          case "$AMD64$ARM64" in *sha256:*sha256:*) ;; *) echo "::error::a per-arch digest is missing"; exit 1 ;; esac
          tag="run-${GITHUB_RUN_ID}"
          docker buildx imagetools create -t "${IMAGE}:${tag}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p lock
          echo "${{ matrix.suite }}=${IMAGE}@${digest}" > "lock/${{ matrix.suite }}.line"
          {
            echo "### ${{ matrix.suite }}"
            echo '```'
            cat "lock/${{ matrix.suite }}.line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance of the multi-arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.suite }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-images-lock-${{ matrix.suite }}
          path: lock/${{ matrix.suite }}.line
          if-no-files-found: error

  # Scheduled runs only. When the rebuilt multi-arch images have other
  # digests than install/nginx/toolchain-images.lock on master, open one issue
  # (or update the open one) with the two new lock lines and the commands that
  # check their attestations. Equal digests: nothing happens. Only this job
  # can write issues; it opens no pull request.
  lock-notice:
    name: Lock update notice
    needs: join
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: install/nginx/toolchain-images.lock
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-images-lock-*
          path: new-lock
          merge-multiple: true

      - name: Compare with the lock, then open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOCK=install/nginx/toolchain-images.lock
          TITLE="Toolchain images rebuilt: update toolchain-images.lock"
          SIGNER="${GITHUB_REPOSITORY}/.github/workflows/toolchain-images.yml"
          changed=0
          lines=()
          for suite in focal jammy; do
            new="$(cat "new-lock/${suite}.line")"
            if ! printf '%s\n' "$new" | grep -Eqx "${suite}=ghcr\.io/we-amp/mod-pagespeed-toolchain-${suite}@sha256:[0-9a-f]{64}"; then
              echo "::error::the ${suite} line of this run is malformed: ${new}"
              exit 1
            fi
            cur="$(grep -E "^${suite}=" "$LOCK" || true)"
            echo "${suite}: lock ${cur:-<none>}, this run ${new}"
            [ "$cur" = "$new" ] || changed=1
            lines+=("$new")
          done
          if [ "$changed" = 0 ]; then
            echo "The rebuilt images have the digests of the lock on master: no issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only digests whose attestation verifies are proposed.
          for line in "${lines[@]}"; do
            gh attestation verify "oci://${line#*=}" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER" --source-ref refs/heads/master >/dev/null
          done
          body="${RUNNER_TEMP}/lock-notice.md"
          {
            echo "The scheduled toolchain image build rebuilt the focal and jammy images, and their digests differ from \`${LOCK}\` on master."
            echo
            echo "To take them, open a pull request that replaces the two lines of \`${LOCK}\` with:"
            echo
            echo '```'
            printf '%s\n' "${lines[@]}"
            echo '```'
            echo
            echo "and updates the \`Current:\` comment above them. The attestations verified in this run; check them again with:"
            echo
            echo '```'
            for line in "${lines[@]}"; do
              echo "gh attestation verify oci://${line#*=} -R ${GITHUB_REPOSITORY} --signer-workflow ${SIGNER} --source-ref refs/heads/master"
            done
            echo '```'
            echo
            echo "Compare the compiler versions in each image's \`/etc/pagespeed-toolchain-baked\` (listed in the build jobs' summaries of the run) with the current images', and name any change in the pull request."
            echo
            echo "Run: ${RUN_URL}"
          } > "$body"
          number="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
            echo "Updated issue #${number}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body-file "$body"
            echo "Opened the lock update issue." >> "$GITHUB_STEP_SUMMARY"
          fi

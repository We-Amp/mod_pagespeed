#
# Release caller: triggers, concurrency and the secrets by name. The module
# release lane is a reusable workflow pinned to master (docs/ci/release.md):
#   * module-v* tags -> pipeline-release-module.yml (the module packages)
# The nginx.org lane's releases (nginxorg-v*) are made by nginx-org-rebuild.yml
# and never run this workflow.
#
# Triggers:
#   * push of a tag                                -> dry_run is false
#   * workflow_dispatch { tag, dry_run: true  }    -> the default
#   * workflow_dispatch { tag, dry_run: false }
#   * workflow_dispatch { tag, dry_run: true, candidate: true, sha }
# A real run adopts the candidate run that the tag message names (the
# Release-Candidate-* trailers), unless a dispatch sets adopt=off; a tag push
# always means auto (docs/ci/release.md).
# The tag must exist and its commit must be on master; the lane's ref guard
# refuses anything else. A dry run builds and validates; it signs, creates and
# publishes nothing. A real run signs and creates the release, in jobs of the
# protected `release` environment on hosted runners.
#
# A candidate run is a dry run of a release tag that does not exist yet. It
# runs on master only, at the commit named by `sha`, builds exactly what the
# real run of that tag builds, and ends with a seal of its artifacts
# (docs/ci/release.md). It never enters the `release` environment.
#
# Try it:  gh workflow run release.yml -f tag=module-v1.19.0 -f dry_run=true
#          gh workflow run release.yml --ref master -f tag=module-v1.19.0 \
#            -f dry_run=true -f candidate=true -f sha=<40-hex master tip>

name: Release

# GitHub computes the run's title from this when the run is created, outside
# any job, so it is a value a job cannot write: it names the tag, the mode and
# the commit the run was started for.
run-name: "Release ${{ inputs.tag || github.ref_name }}${{ inputs.candidate && ' candidate' || '' }}${{ inputs.dry_run && ' dry run' || '' }} @ ${{ inputs.sha || github.sha }}"

on:
  push:
    tags: ['module-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (module-v1.19.0, or module-v1.19.0-rc.1 for a release candidate)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate only. Default: true.'
        required: true
        type: boolean
        default: true
      candidate:
        description: 'Candidate run: a dry run of a tag that does not exist yet, on master only (needs dry_run and sha). Default: false.'
        required: false
        type: boolean
        default: false
      sha:
        description: 'Candidate only: the 40-character master tip to build; must be the commit this run is dispatched at.'
        required: false
        type: string
        default: ''
      adopt:
        description: 'Real run only. auto: adopt the candidate run that the tag message names (a tag without the trailers builds everything). off: build everything. Default: auto.'
        required: false
        type: choice
        options: [auto, off]
        default: auto

permissions:
  contents: read

# Serialize runs per released ref (the dispatched tag, or the pushed tag):
# two runs of one tag never race. A release always runs out.
concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  module:
    # Only a module tag reaches the module lane, whatever the triggers above
    # say: the nginx.org lane's tags (nginxorg-v*) and any other tag stop here.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/module-v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'module-v')) }}
    # The called workflow keeps every job read-only except the release job of
    # the `release` environment, which raises its own permission to this.
    # `actions: read` is for the candidate seal, which lists the artifacts of
    # its own run.
    permissions:
      contents: write
      actions: read
    uses: We-Amp/mod_pagespeed/.github/workflows/pipeline-release-module.yml@master
    with:
      tag: ${{ inputs.tag || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      candidate: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
      sha: ${{ inputs.sha || '' }}
      # A tag push is always auto. The input only matters to a real run.
      adopt: ${{ inputs.adopt || 'auto' }}
    # Passed one by one, never `secrets: inherit`. The jobs of the `release`
    # environment read the environment's value of each; no other job reads one.
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}

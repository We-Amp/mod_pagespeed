          CTR="nightly-fuzz-js-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RAM_GB="${CI_BUILD_RAM_BUDGET_GB:-16}"
          case "${RAM_GB}" in ''|*[!0-9]*) RAM_GB=16 ;; esac
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB) wins over the older RAM budget.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget "${RAM_GB}g" || exit 1
          RAM_GB="${SLOT_MEM_GB}"
          EXTRA=()
          BZL_FLAGS="--config=vendored --config=clang-libstdcxx13 --cxxopt=-std=c++20 --host_cxxopt=-std=c++20 --define=go_build=disabled --nostamp --jobs=${SLOT_JOBS}"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            BZL_FLAGS="${BZL_FLAGS} --config=remote-cache"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          BZL_FLAGS="${BZL_FLAGS} --local_ram_resources=$((RAM_GB * 1024 * 3 / 4))"
          { echo "dev:x:$(id -u):$(id -g)::/tmp/ci-home:/bin/bash"
            docker run --rm --entrypoint cat "${DOCKER_IMAGE}" /etc/passwd; } > "${RUNNER_TEMP}/ci-passwd"
          docker rm -f "${CTR}" >/dev/null 2>&1 || true
          docker run -d --init --name "${CTR}" "${EXTRA[@]}" \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${RAM_GB}g" --memory-swap="${RAM_GB}g" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/tmp/ci-home -e USER=dev \
            -e "RUNNER_TEMP=${RUNNER_TEMP}" \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w /workspace \
            "${DOCKER_IMAGE}" sleep infinity >/dev/null
          docker exec "${CTR}" bash -c 'mkdir -p "$HOME" && echo "startup --output_user_root=/tmp/bazel-out" > "$HOME/.bazelrc"'
          echo "CTR=${CTR}" >> "$GITHUB_ENV"
          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      # The classifier's parseability axis shells out to node. Its absence
      # fails open (every token-channel trip becomes needs-triage), which is
      # safe but turns the night into noise, so assert it up front.
      - name: Assert node is available (classifier validity axis)
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          command -v node >/dev/null 2>&1 || {
            echo "::error::node is not on PATH in the build image; the JS fuzz classifier needs it for the parseability axis"
            exit 1
          }
          node --version
          EOS

      - name: Build the ASan replay binary
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt //pagespeed/kernel/js:js_minify_fuzz
          mkdir -p "${RUNNER_TEMP}/js-fuzz-bin"
          cp bazel-bin/pagespeed/kernel/js/js_minify_fuzz "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_replay"
          EOS

      - name: Build the libFuzzer binary
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            --copt=-DJS_MINIFY_LIBFUZZER \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            //pagespeed/kernel/js:js_minify_fuzz
          cp -f bazel-bin/pagespeed/kernel/js/js_minify_fuzz "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_lf"
          EOS

      - name: Restore the persisted corpus (js-fuzz-corpus)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/js-fuzz-corpus
          key: js-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: js-fuzz-corpus-v1-

      # A bounded, deterministic seed set: the harness's embedded seeds, the
      # hand-minimal reproducers, seeded synthetic files (the generator is
      # deterministic per --seed) and the third-party originals. The replay
      # floor below runs the same fixed set, never the cache-grown corpus.
      - name: Seed the corpus (embedded, reproducers, synthetic, third-party)
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          CORPUS="${RUNNER_TEMP}/js-fuzz-corpus"; SYNTH="${RUNNER_TEMP}/js-fuzz-synthetic"
          mkdir -p "$CORPUS" "$SYNTH"
          "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_replay" --dump_corpus="${RUNNER_TEMP}/js-fuzz-seed"
          python3 tools/js-minify-corpus/generate_synthetic.py \
            --seed 20260721 --dest "$SYNTH" --shapes 128 --execs 128
          # -n: never overwrite what the persisted cache already grew.
          cp -n "${RUNNER_TEMP}/js-fuzz-seed"/seed-* "$CORPUS"/
          cp -n tools/js-minify-corpus/findings/repros/*.js \
                tools/js-minify-corpus/findings/repros/*.mjs \
                "$SYNTH"/*.js "$SYNTH"/*.mjs \
                test/pagespeed/kernel/js/testdata/third_party/*.original \
                test/pagespeed/kernel/js/testdata/third_party/es2020.js \
                "$CORPUS"/
          EOS

      # Deterministic floor: the valid-seed battery (a hard abort built into
      # the harness) plus a trip-counted replay of the fixed corpus sources.
      - name: Run the seed and corpus replay (regression floor)
        run: |
          set +e
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          SYNTH="${RUNNER_TEMP}/js-fuzz-synthetic"
          "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_replay" \
            "${RUNNER_TEMP}/js-fuzz-seed"/seed-* \
            tools/js-minify-corpus/findings/repros/*.js \
            tools/js-minify-corpus/findings/repros/*.mjs \
            "$SYNTH"/*.js "$SYNTH"/*.mjs \
            test/pagespeed/kernel/js/testdata/third_party/*.original \
            test/pagespeed/kernel/js/testdata/third_party/es2020.js \
            2>&1 | tail -3
          exit "${PIPESTATUS[0]}"
          EOS
          echo "REPLAY_RC=$?" >> "$GITHUB_ENV"

      # Fork mode so the known-class crashes (operator-gluing over-catches
      # trip within seconds on garbage input) cannot truncate the campaign;
      # crash units land in the crash directory for the classifier.
      - name: Run libFuzzer (bounded budget, fork mode)
        run: |
          set +e
          docker exec -i -e FUZZ_SECONDS "${CTR}" bash -s <<'EOS'
          mkdir -p "${RUNNER_TEMP}/js-fuzz-crashes"
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_lf" "${RUNNER_TEMP}/js-fuzz-corpus" \
            -fork=2 -ignore_crashes=1 \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=4096 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${RUNNER_TEMP}/js-fuzz-crashes/" \
            -print_final_stats=1
          EOS
          echo "FUZZ_RC=$?" >> "$GITHUB_ENV"

      # Bucket the artifacts; only needs-triage items (plus a red floor or a
      # campaign that never ran) reach the findings file and turn the job red.
      - name: Classify the artifacts and gate
        run: |
          set -uo pipefail
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          set +e
          docker exec -i -e REPLAY_RC -e FUZZ_RC "${CTR}" bash -s <<'EOS'
          set -uo pipefail
          F="${RUNNER_TEMP}/js-fuzz-crashes/findings.md"; mkdir -p "${RUNNER_TEMP}/js-fuzz-crashes"; : > "$F"
          if [ "${REPLAY_RC:-1}" != "0" ]; then
            {
              echo "### deterministic replay floor is RED (rc=${REPLAY_RC})"
              echo
              echo "The valid-seed battery or the fixed corpus sources trip an oracle or a sanitizer on the default branch: a genuine regression, not a fuzz find. See the run log."
              echo
            } >> "$F"
          fi
          # Fork mode exits non-zero when it FOUND crashes (artifacts in the
          # crash directory): a normal night. Non-zero with ZERO artifacts
          # means the campaign never ran, which must be reported.
          n_artifacts="$(find "${RUNNER_TEMP}/js-fuzz-crashes" -type f ! -name findings.md | wc -l | tr -d ' ')"
          if [ "${FUZZ_RC:-1}" != "0" ] && [ "$n_artifacts" = "0" ]; then
            {
              echo "### libFuzzer campaign failed (rc=${FUZZ_RC}, zero artifacts)"
              echo
              echo "The fuzzer exited non-zero without producing a single unit: a startup or campaign failure, not a fuzz find. See the run log."
              echo
            } >> "$F"
          fi
          bash tools/ci/classify-js-fuzz-artifacts.sh \
            "${RUNNER_TEMP}/js-fuzz-bin/js_fuzz_replay" "${RUNNER_TEMP}/js-fuzz-crashes" "$F"
          [ -s "$F" ] || exit 0
          cat "$F"
          exit 1
          EOS
          rc=$?
          [ -s "${RUNNER_TEMP}/js-fuzz-crashes/findings.md" ] && cat "${RUNNER_TEMP}/js-fuzz-crashes/findings.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload the evidence (crash reproducers and corpus)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-js-fuzz-evidence
          path: |
            ${{ runner.temp }}/js-fuzz-crashes/
            ${{ runner.temp }}/js-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 3

      # Save even on findings: libFuzzer writes a crash unit into the corpus
      # directory before it stops, and keeping it makes the finding a
      # persistent regression input once the bug is fixed. Guarded on the
      # lane having run so a build-stage failure cannot error the save on a
      # missing path.
      - name: Persist the corpus (js-fuzz-corpus)
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/js-fuzz-corpus
          key: js-fuzz-corpus-v1-${{ github.run_id }}

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi

  # ---------------------------------------------------------------------
  # IIS lanes (class fleet-iis: a Windows host with the IIS role, a local
  # administrator service account and one runner instance per host, so the IIS
  # jobs serialize per host and may run on different hosts at the same time). No hosted twin exists, so
  # a fork pull request or a missing fleet skips them. Toolchain, caches and
  # the dump directory come from the optional runner environment
  # (docs/ci/runner-environment.md).
  # ---------------------------------------------------------------------
  iis-asan-systest:
    permissions:
      contents: read
    name: IIS ASan recycle stress
    needs: nightly-vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-iis' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && vars.FLEET_IIS_ENABLED == 'true' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    env:
      DURATION: ${{ inputs.duration || '600' }}
      CONCURRENCY: ${{ inputs.concurrency || '16' }}
    steps:
      - name: Validate the stress parameters
        shell: bash
        run: |
          # Length-capped digit patterns first, so a huge value never reaches
          # an arithmetic test.
          if ! [[ "${DURATION}" =~ ^[0-9]{1,4}$ ]] || [ "$((10#${DURATION}))" -lt 1 ] || [ "$((10#${DURATION}))" -gt 1800 ]; then
            echo "::error::duration must be a whole number of seconds between 1 and 1800"
            exit 1
          fi
          if ! [[ "${CONCURRENCY}" =~ ^[0-9]{1,3}$ ]] || [ "$((10#${CONCURRENCY}))" -lt 1 ] || [ "$((10#${CONCURRENCY}))" -gt 256 ]; then
            echo "::error::concurrency must be a whole number between 1 and 256"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      # A vendor tarball on the runner makes the dependency fetch local; without
      # one, Bazel fetches its dependencies (docs/ci/runner-environment.md).
      # tools/ci/fetch-vendor-tarball.ps1 is the one hardened Windows path: it
      # stages a private, verified copy, clears the destination of everything
      # an earlier job left in this persistent workspace (never entering a
      # link, keeping .git) and only then extracts, so tar never writes over
      # an existing file (issue #231).
      - name: Use a local vendor tarball when the runner has one
        shell: powershell
        env:
          VENDOR_SHORT_SHA: ${{ needs.nightly-vendor.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @($env:CI_WIN_VENDOR_DIR) | Where-Object { $_ }
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\fetch-vendor-tarball.ps1') `
            -Name "mod_pagespeed-$($env:VENDOR_SHORT_SHA).tar.zst" `
            -Dest $env:GITHUB_WORKSPACE `
            -StageDir (Join-Path $env:RUNNER_TEMP 'vendor-download') `
            -SearchDirs $dirs -HubSsh $env:CI_HUB_SSH -HubDir $env:CI_HUB_VENDOR_DIR
          $rc = $LASTEXITCODE
          if ($rc -eq 4) {
            Write-Host "::notice::no runner-local vendor tarball: Bazel fetches its dependencies (docs/ci/runner-environment.md)"
            exit 0
          }
          if ($rc -ne 0) { exit $rc }

      - name: Stamp GIT_COMMIT
        shell: bash
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT


      - name: Set up the toolchain from the runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Directories the runner environment offers go to the front of PATH
          # for the following steps: bazelisk, bash, the pinned NASM, Python.
          $dirs = @()
          if ($env:CI_WIN_TOOLS_DIR) { $dirs += ($env:CI_WIN_TOOLS_DIR -split ';') }
          if ($env:CI_WIN_PYTHON_DIR) { $dirs += $env:CI_WIN_PYTHON_DIR; $dirs += (Join-Path $env:CI_WIN_PYTHON_DIR 'Scripts') }
          if ($env:CI_WIN_LLVM_DIR) {
            # The AddressSanitizer runtime sits under lib\clang\<version>\lib\windows.
            $rt = Get-ChildItem -Path (Join-Path $env:CI_WIN_LLVM_DIR 'lib\clang') -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'lib\windows' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($rt) { $dirs += $rt } else { Write-Host "::notice::no AddressSanitizer runtime directory under the LLVM install" }
          }
          [array]::Reverse($dirs)
          foreach ($d in $dirs) {
            if ($d -and (Test-Path $d)) { $d | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }

      # The AV1 encoder needs NASM 2.16.03: libaom rejects 3.x, which dropped
      # the -Ox line from the help text that libaom checks for. The check runs
      # before the build loop so a missing assembler is not retried five times.
      - name: Check the pinned assembler
        shell: powershell
        run: |
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) { throw "nasm is not on PATH. Provide NASM 2.16.03 through CI_WIN_TOOLS_DIR (docs/ci/runner-environment.md)." }
          if (-not (& $nasm.Source -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            throw "the nasm on PATH is not usable by libaom (no -Ox in -hf output; 3.x dropped it). Provide 2.16.03."
          }
          Write-Host "nasm ok: $(& $nasm.Source -v)"

      - name: Ensure bazel
        shell: bash
        run: |
          if command -v bazelisk >/dev/null 2>&1; then
            echo "BAZEL_BIN=bazelisk" >> "$GITHUB_ENV"
          elif command -v bazel >/dev/null 2>&1; then
            echo "BAZEL_BIN=bazel" >> "$GITHUB_ENV"
          else
            npm install -g @bazel/bazelisk@1.28.1
            echo "BAZEL_BIN=bazelisk" >> "$GITHUB_ENV"
          fi
          bash tools/ci/check-bazel-version.sh "$(command -v bazelisk >/dev/null 2>&1 && echo bazelisk || echo bazel)"


      - name: Build the IIS module with ASan
        shell: bash
        timeout-minutes: 60
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          set -uo pipefail
          FLAGS=(--config=windows --config=clang-cl --config=win-asan "--jobs=${SLOT_JOBS}" --nostamp
                 "--workspace_status_command=cmd /c echo.")
          if [ -d vendor ]; then FLAGS+=(--config=vendored); fi
          if [ -n "${BAZEL_REMOTE_CACHE_URL:-}" ]; then
            echo "using the remote cache"
            FLAGS+=("--remote_cache=${BAZEL_REMOTE_CACHE_URL}")
          else
            echo "::notice::BAZEL_REMOTE_CACHE_URL not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          if [ -n "${CI_WIN_CACHE_DIR:-}" ]; then
            CACHE_DIR="${CI_WIN_CACHE_DIR//\\//}"
            FLAGS+=("--disk_cache=${CACHE_DIR}-asan")
            if [ -n "${CI_WIN_CACHE_MAX_SIZE:-}" ]; then
              FLAGS+=("--experimental_disk_cache_gc_max_size=${CI_WIN_CACHE_MAX_SIZE}")
            fi
            # Shut down the server an earlier job left, so nothing holds the disk cache.
            "$BAZEL_BIN" --output_user_root="$(echo "${CI_WIN_BAZEL_OUTPUT_ROOT:-${SYSTEMDRIVE:-C:}/b}" | tr '\\' '/')" shutdown || true
            # Bazel's own cache collection never runs here (the server is shut down
            # before it is idle); cap the disk cache with CI_WIN_CACHE_MAX_SIZE ourselves.
            powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "${GITHUB_WORKSPACE}/tools/ci/Prune-WinDiskCache.ps1")" -CacheDir "$(cygpath -w "${CACHE_DIR}-asan")" || true
          fi
          # A short output root keeps Windows path lengths in bounds.
          OUT_ROOT="${CI_WIN_BAZEL_OUTPUT_ROOT:-${SYSTEMDRIVE:-C:}/b}"
          OUT_ROOT="${OUT_ROOT//\\//}"
          # A transient permission-denied on a freshly materialized generated
          # header is a known Bazel-on-Windows race; retry the build.
          built=0
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "build attempt ${attempt} (the previous one hit a transient permission error)"
              "$BAZEL_BIN" --output_user_root="$OUT_ROOT" shutdown || true
              sleep 5
            fi
            if "$BAZEL_BIN" --output_user_root="$OUT_ROOT" build "${FLAGS[@]}" //pagespeed/iis:pagespeed_iis.dll; then
              built=1; break
            fi
          done
          if [ "$built" != 1 ]; then echo "::error::build failed after 5 attempts"; exit 1; fi
          BAZEL_BIN_DIR="$("$BAZEL_BIN" --output_user_root="$OUT_ROOT" info bazel-bin 2>/dev/null | tr -d '\r')"
          test -f "$BAZEL_BIN_DIR/pagespeed/iis/pagespeed_iis.dll" || { echo "::error::module missing after the build"; exit 1; }
          echo "BAZEL_BIN_DIR=$(cygpath -w "$BAZEL_BIN_DIR" 2>/dev/null || echo "$BAZEL_BIN_DIR")" >> "$GITHUB_ENV"
          echo "built the module: $(wc -c < "$BAZEL_BIN_DIR/pagespeed/iis/pagespeed_iis.dll") bytes"


      - name: Set up the ASan IIS rig
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $rig = Join-Path $env:RUNNER_TEMP 'iis-asan-rig'
          "RIG_DIR=$rig" >> $env:GITHUB_ENV
          & "$env:GITHUB_WORKSPACE\tools\stress\iis\setup_iis_asan_rig.ps1" `
            -RigDir $rig `
            -DllSourceDir "$env:BAZEL_BIN_DIR\pagespeed\iis" `
            -RepoDir $env:GITHUB_WORKSPACE

      # The first request into an ASan-instrumented worker is slow, and a
      # module that failed to load answers every request with an error. Wait
      # for the page to answer 200 and, if it never does, log why, so a rig
      # that is not ready fails here and not as a harness health abort.
      - name: Wait for the ASan IIS rig to answer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'http://localhost:18180/stress/page1.html'
          $deadline = (Get-Date).AddSeconds(180)
          $lastStatus = ''
          $lastBody = ''
          $ready = $false
          while ($true) {
            $stamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri $url
              $lastStatus = [string][int]$r.StatusCode
              $lastBody = [string]$r.Content
              Write-Host "[$stamp] probe $url -> $lastStatus"
              if ([int]$r.StatusCode -eq 200) { $ready = $true; break }
            } catch {
              $resp = $_.Exception.Response
              if ($resp) {
                $lastStatus = [string][int]$resp.StatusCode
                try {
                  $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
                  $lastBody = $sr.ReadToEnd()
                  $sr.Close()
                } catch { $lastBody = '' }
                Write-Host "[$stamp] probe $url -> $lastStatus ($($_.Exception.Message))"
              } else {
                $lastStatus = 'no response: ' + $_.Exception.Message
                $lastBody = ''
                Write-Host "[$stamp] probe $url -> $lastStatus"
              }
            }
            if ((Get-Date) -ge $deadline) { break }
            Start-Sleep -Seconds 5
          }
          if ($ready) { Write-Host "rig answers 200"; exit 0 }

          Write-Host "==== last probe status: $lastStatus ===="
          Write-Host "==== last probe body (first 800 chars) ===="
          if ($lastBody.Length -gt 800) { $lastBody = $lastBody.Substring(0, 800) }
          Write-Host $lastBody

          $ac = "$env:SystemRoot\System32\inetsrv\appcmd.exe"
          Write-Host "==== appcmd list site ===="
          $siteLine = (& $ac list site PageSpeedAsanStressSite 2>&1 | Out-String).Trim()
          Write-Host $siteLine
          if ($siteLine -match 'id:(\d+)') {
            $logDir = "C:\inetpub\logs\LogFiles\W3SVC$($Matches[1])"
            $f = Get-ChildItem $logDir -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Write-Host "==== last 40 lines of the site IIS log ($($f.FullName)) ===="
            if ($f) { Get-Content $f.FullName -Tail 40 } else { Write-Host "(no log file in $logDir)" }
          } else {
            Write-Host "(could not derive the site id)"
          }

          $f = Get-ChildItem 'C:\Windows\System32\LogFiles\HTTPERR' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "==== last 20 lines of HTTPERR ($($f.FullName)) ===="
          if ($f) { Get-Content $f.FullName -Tail 20 } else { Write-Host "(no HTTPERR log)" }

          # Same "since" derivation as sweep_iis_asan_rig.ps1: the rig-start
          # marker minus a 30 s skew buffer.
          $since = (Get-Date).AddHours(-2)
          $marker = Join-Path $env:RIG_DIR 'logs\rig.setup.started'
          if (Test-Path $marker) {
            $s = ((Get-Content $marker -TotalCount 1) -replace '^started\s+', '').Trim()
            try {
              $since = ([datetime]::Parse($s, [cultureinfo]::InvariantCulture,
                [System.Globalization.DateTimeStyles]::RoundtripKind)).ToLocalTime().AddSeconds(-30)
            } catch { Write-Host "could not parse '$s' from $marker" }
          }
          Write-Host "==== w3wp and WAS events since $since ===="
          foreach ($log in 'Application', 'System') {
            Write-Host "-- $log --"
            Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=$since} -MaxEvents 500 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'WAS|W3SVC|IIS' -or $_.Message -match 'w3wp' } |
              ForEach-Object { "{0} {1} id={2} {3}" -f $_.TimeCreated, $_.ProviderName, $_.Id, (($_.Message -split "`r?`n")[0]) }
          }
          Write-Host "==== appcmd list wp ===="
          & $ac list wp 2>&1 | Out-String | Write-Host

          Write-Host "::error::IIS ASan rig not ready after 180 s"
          exit 1

      # Crash-dump capture is WER LocalDumps for w3wp.exe, installed by the
      # setup script and removed by the cleanup script.
      - name: Run the recycle-under-load stress
        id: stress
        shell: powershell
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\tools\stress\iis\run_iis_asan_rig.ps1" `
            -RigDir $env:RIG_DIR -Duration ([int]$env:DURATION) -Concurrency ([int]$env:CONCURRENCY) `
            -RepoDir $env:GITHUB_WORKSPACE
          # The harness status alone does not fail the step; the sweep is the gate.
          Write-Host "run step rc=$LASTEXITCODE (the sweep adjudicates)"

      # Runs even when the stress step failed (the harness exits non-zero when
      # it sees a crash): the sweep collects the evidence and gates either way.
      - name: Sweep for ASan and crash evidence (gate)
        if: ${{ !cancelled() && steps.stress.outcome != 'skipped' }}
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\stress\iis\sweep_iis_asan_rig.ps1" -RigDir $env:RIG_DIR
          if ($LASTEXITCODE -ne 0) { Write-Error "ASan or crash evidence found; see the logs above and the uploaded artifact"; exit 1 }

      - name: Stage the evidence for upload
        if: always()
        shell: powershell
        run: |
          # upload-artifact computes one common root across all input paths,
          # so stage everything into one folder first.
          $stage = Join-Path $env:RUNNER_TEMP 'iis-asan-evidence'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if ($env:RIG_DIR) { Copy-Item "$env:RIG_DIR\logs\*" $stage -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem C:\pagespeed_asan* -File -ErrorAction SilentlyContinue | Copy-Item -Destination $stage -Force
          Write-Host "staged $((Get-ChildItem $stage -ErrorAction SilentlyContinue | Measure-Object).Count) file(s)"

      # Full worker dumps run to gigabytes and stay on the host for on-box
      # analysis; only logs go up. Debugging aid for a failed night only.
      - name: Upload the evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-iis-asan-evidence
          path: ${{ runner.temp }}\iis-asan-evidence\*
          if-no-files-found: ignore
          retention-days: 3

      - name: Tear down the rig (restore the module configuration)
        if: always()
        shell: powershell
        run: |
          if ($env:RIG_DIR) { & "$env:GITHUB_WORKSPACE\tools\stress\iis\cleanup_iis_asan_rig.ps1" -RigDir $env:RIG_DIR }

  iis-appverif-matrix:
    permissions:
      contents: read
    name: IIS AppVerif provider matrix
    needs: nightly-vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-iis' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && vars.FLEET_IIS_ENABLED == 'true' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 240
    env:
      ARMS: ${{ inputs.arms }}
    steps:
      # The arms string goes to a script as an argument; keep it to the
      # documented shape.
      - name: Validate the arms
        shell: bash
        run: |
          arm='(cuzz-nopageheap|cuzz-pageheap|pageheap-nocuzz):[0-9]{1,2}'
          if ! [[ "${ARMS}" =~ ^${arm}(,${arm})*$ ]]; then
            echo "::error::arms must be a comma separated list of <arm>:<iterations> (cuzz-nopageheap, cuzz-pageheap, pageheap-nocuzz)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      # A vendor tarball on the runner makes the dependency fetch local; without
      # one, Bazel fetches its dependencies (docs/ci/runner-environment.md).
      # tools/ci/fetch-vendor-tarball.ps1 is the one hardened Windows path: it
      # stages a private, verified copy, clears the destination of everything
      # an earlier job left in this persistent workspace (never entering a
      # link, keeping .git) and only then extracts, so tar never writes over
      # an existing file (issue #231).
      - name: Use a local vendor tarball when the runner has one
        shell: powershell
        env:
          VENDOR_SHORT_SHA: ${{ needs.nightly-vendor.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @($env:CI_WIN_VENDOR_DIR) | Where-Object { $_ }
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\ci\fetch-vendor-tarball.ps1') `
            -Name "mod_pagespeed-$($env:VENDOR_SHORT_SHA).tar.zst" `
            -Dest $env:GITHUB_WORKSPACE `
            -StageDir (Join-Path $env:RUNNER_TEMP 'vendor-download') `
            -SearchDirs $dirs -HubSsh $env:CI_HUB_SSH -HubDir $env:CI_HUB_VENDOR_DIR
          $rc = $LASTEXITCODE
          if ($rc -eq 4) {
            Write-Host "::notice::no runner-local vendor tarball: Bazel fetches its dependencies (docs/ci/runner-environment.md)"
            exit 0
          }
          if ($rc -ne 0) { exit $rc }

      - name: Stamp GIT_COMMIT
        shell: bash
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT


      - name: Set up the toolchain from the runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Directories the runner environment offers go to the front of PATH
          # for the following steps: bazelisk, bash, the pinned NASM, Python.
          $dirs = @()
          if ($env:CI_WIN_TOOLS_DIR) { $dirs += ($env:CI_WIN_TOOLS_DIR -split ';') }
          if ($env:CI_WIN_PYTHON_DIR) { $dirs += $env:CI_WIN_PYTHON_DIR; $dirs += (Join-Path $env:CI_WIN_PYTHON_DIR 'Scripts') }
          if ($env:CI_WIN_LLVM_DIR) {
            # The AddressSanitizer runtime sits under lib\clang\<version>\lib\windows.
            $rt = Get-ChildItem -Path (Join-Path $env:CI_WIN_LLVM_DIR 'lib\clang') -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'lib\windows' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($rt) { $dirs += $rt } else { Write-Host "::notice::no AddressSanitizer runtime directory under the LLVM install" }
          }
          [array]::Reverse($dirs)
          foreach ($d in $dirs) {
            if ($d -and (Test-Path $d)) { $d | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }

      # The AV1 encoder needs NASM 2.16.03: libaom rejects 3.x, which dropped
      # the -Ox line from the help text that libaom checks for. The check runs
      # before the build loop so a missing assembler is not retried five times.
      - name: Check the pinned assembler
        shell: powershell
        run: |
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) { throw "nasm is not on PATH. Provide NASM 2.16.03 through CI_WIN_TOOLS_DIR (docs/ci/runner-environment.md)." }
          if (-not (& $nasm.Source -hf 2>&1 | Select-String -SimpleMatch -Quiet '-Ox')) {
            throw "the nasm on PATH is not usable by libaom (no -Ox in -hf output; 3.x dropped it). Provide 2.16.03."
          }
          Write-Host "nasm ok: $(& $nasm.Source -v)"

      - name: Ensure bazel
        shell: bash
        run: |
          if command -v bazelisk >/dev/null 2>&1; then
            echo "BAZEL_BIN=bazelisk" >> "$GITHUB_ENV"
          elif command -v bazel >/dev/null 2>&1; then
            echo "BAZEL_BIN=bazel" >> "$GITHUB_ENV"
          else
            npm install -g @bazel/bazelisk@1.28.1
            echo "BAZEL_BIN=bazelisk" >> "$GITHUB_ENV"
          fi
          bash tools/ci/check-bazel-version.sh "$(command -v bazelisk >/dev/null 2>&1 && echo bazelisk || echo bazel)"


      - name: Build the IIS module
        shell: bash
        timeout-minutes: 60
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          set -uo pipefail
          FLAGS=(--config=windows --config=clang-cl "--jobs=${SLOT_JOBS}" --nostamp
                 "--workspace_status_command=cmd /c echo.")
          if [ -d vendor ]; then FLAGS+=(--config=vendored); fi
          if [ -n "${BAZEL_REMOTE_CACHE_URL:-}" ]; then
            echo "using the remote cache"
            FLAGS+=("--remote_cache=${BAZEL_REMOTE_CACHE_URL}")
          else
            echo "::notice::BAZEL_REMOTE_CACHE_URL not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          if [ -n "${CI_WIN_CACHE_DIR:-}" ]; then
            CACHE_DIR="${CI_WIN_CACHE_DIR//\\//}"
            FLAGS+=("--disk_cache=${CACHE_DIR}-appverif")
            if [ -n "${CI_WIN_CACHE_MAX_SIZE:-}" ]; then
              FLAGS+=("--experimental_disk_cache_gc_max_size=${CI_WIN_CACHE_MAX_SIZE}")
            fi
            # Shut down the server an earlier job left, so nothing holds the disk cache.
            "$BAZEL_BIN" --output_user_root="$(echo "${CI_WIN_BAZEL_OUTPUT_ROOT:-${SYSTEMDRIVE:-C:}/b}" | tr '\\' '/')" shutdown || true
            # Bazel's own cache collection never runs here (the server is shut down
            # before it is idle); cap the disk cache with CI_WIN_CACHE_MAX_SIZE ourselves.
            powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "${GITHUB_WORKSPACE}/tools/ci/Prune-WinDiskCache.ps1")" -CacheDir "$(cygpath -w "${CACHE_DIR}-appverif")" || true
          fi
          # A short output root keeps Windows path lengths in bounds.
          OUT_ROOT="${CI_WIN_BAZEL_OUTPUT_ROOT:-${SYSTEMDRIVE:-C:}/b}"
          OUT_ROOT="${OUT_ROOT//\\//}"
          # A transient permission-denied on a freshly materialized generated
          # header is a known Bazel-on-Windows race; retry the build.
          built=0
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "build attempt ${attempt} (the previous one hit a transient permission error)"
              "$BAZEL_BIN" --output_user_root="$OUT_ROOT" shutdown || true
              sleep 5
            fi
            if "$BAZEL_BIN" --output_user_root="$OUT_ROOT" build "${FLAGS[@]}" //pagespeed/iis:pagespeed_iis.dll; then
              built=1; break
            fi
          done
          if [ "$built" != 1 ]; then echo "::error::build failed after 5 attempts"; exit 1; fi
          BAZEL_BIN_DIR="$("$BAZEL_BIN" --output_user_root="$OUT_ROOT" info bazel-bin 2>/dev/null | tr -d '\r')"
          test -f "$BAZEL_BIN_DIR/pagespeed/iis/pagespeed_iis.dll" || { echo "::error::module missing after the build"; exit 1; }
          echo "BAZEL_BIN_DIR=$(cygpath -w "$BAZEL_BIN_DIR" 2>/dev/null || echo "$BAZEL_BIN_DIR")" >> "$GITHUB_ENV"
          echo "built the module: $(wc -c < "$BAZEL_BIN_DIR/pagespeed/iis/pagespeed_iis.dll") bytes"


      - name: Install the test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet -r "$env:GITHUB_WORKSPACE\test\system\requirements.txt"

      # Armed before the zero-copy gate: that gate runs under full page heap
      # too, so a stop there must self-capture as well.
      - name: Arm crash-dump capture
        shell: powershell
        run: |
          $extra = @('-Enable', '-GitHubEnv')
          if ($env:CI_WIN_DUMP_DIR) { $extra += @('-DumpDir', $env:CI_WIN_DUMP_DIR) }
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tools\ci\Set-WerLocalDumps.ps1" @extra | Out-Null
          "APPVERIF_T0=$((Get-Date).ToString('o'))" >> $env:GITHUB_ENV

      # The on-IIS validation the aliased serve path demands: a slow client
      # while flood writes wrap the cache volume, asserting byte-identity or
      # reset. Full page heap on the module turns an aliased use-after-
      # overwrite into a first-chance verifier stop. The verifier settings
      # are machine-global, so this runs strictly before the matrix step.
      - name: Run the zero-copy merge gate (slow client and region-rewrite canary)
        id: zerocopy_gate
        shell: powershell
        timeout-minutes: 30
        env:
          PAGESPEED_ZEROCOPY_GATE_TRIALS: "3"
          PAGESPEED_ZEROCOPY_GATE_CEILING: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tools\ci\Invoke-ZeroCopyGate.ps1" `
            -RepoDir $env:GITHUB_WORKSPACE -EvidenceDir "$env:RUNNER_TEMP\zerocopy-gate"
          if ($LASTEXITCODE -ne 0) { Write-Error "the zero-copy gate regressed; see the uploaded evidence"; exit 1 }

      # Arms run strictly serially: the verifier and heap settings for the
      # worker process are machine-global and one IIS instance serves them all.
      - name: Run the AppVerifier provider matrix
        id: matrix
        shell: powershell
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = 'Continue'
          $arms = $env:ARMS
          if (-not $arms) { $arms = "cuzz-nopageheap:5,cuzz-pageheap:3" }
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tools\ci\Invoke-AppVerifMatrix.ps1" `
            -RepoDir $env:GITHUB_WORKSPACE -Arms $arms -EvidenceDir "$env:RUNNER_TEMP\appverif-matrix"
          if ($LASTEXITCODE -ne 0) { Write-Error "the AppVerifier matrix regressed; see the summary above and the uploaded evidence"; exit 1 }

      - name: Collect crash dumps
        id: dumps
        if: always()
        shell: powershell
        run: |
          $since = if ($env:APPVERIF_T0) { [DateTimeOffset]::Parse($env:APPVERIF_T0).LocalDateTime } else { [DateTime]::MinValue }
          $dumpDir = if ($env:PAGESPEED_DUMP_DIR) { $env:PAGESPEED_DUMP_DIR } else { "C:\dumps\localdumps" }
          # The matrix writes one <arm>-<n>.txt fail-fast report per iteration;
          # pass the directory so a failure in any iteration is cross-checked.
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tools\ci\Collect-CrashDumps.ps1" `
            -DumpDir $dumpDir -StageDir "$env:RUNNER_TEMP\appverif-matrix\staged" -Since $since `
            -FailFastReport "$env:RUNNER_TEMP\appverif-matrix" `
            -SymbolDir "$env:BAZEL_BIN_DIR\pagespeed\iis"
          $staged = (Get-ChildItem "$env:RUNNER_TEMP\appverif-matrix\staged" -File -ErrorAction SilentlyContinue | Measure-Object).Count
          "staged=$staged" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Uploaded when the night failed or a dump was staged; the matrix and
      # zero-copy steps are the gates. A refused upload must not add a failure
      # of its own.
      - name: Upload the evidence
        if: failure() || steps.dumps.outputs.staged != '0'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-iis-appverif-matrix-evidence
          path: ${{ runner.temp }}\appverif-matrix\*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the zero-copy gate evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-iis-zerocopy-gate-evidence
          path: ${{ runner.temp }}\zerocopy-gate\*
          if-no-files-found: ignore
          retention-days: 3

      # Belt and braces: the matrix script disables the verifier in its own
      # cleanup, but leaving the settings armed would slow, and eventually
      # fail, every later job on this host. Must run even on failure.
      - name: Disable Application Verifier and page heap
        if: always()
        shell: powershell
        run: |
          try { appverif -disable * -for w3wp.exe 2>&1 | Out-Null } catch { Write-Host "appverif -disable: $($_.Exception.Message)" }
          $gflags = Get-Command gflags -ErrorAction SilentlyContinue
          $gp = $null
          if ($gflags) { $gp = $gflags.Source }
          elseif (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\gflags.exe") { $gp = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\gflags.exe" }
          if ($gp) {
            try { & $gp /p /disable w3wp.exe 2>&1 | Out-Null } catch { Write-Host "gflags disable: $($_.Exception.Message)" }
          }
          $global:LASTEXITCODE = 0
          $since = if ($env:APPVERIF_T0) { [DateTimeOffset]::Parse($env:APPVERIF_T0).LocalDateTime } else { [DateTime]::MinValue }
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass `
              -File "$env:GITHUB_WORKSPACE\tools\ci\Set-WerLocalDumps.ps1" -Disable -Purge -Since $since
          } catch { Write-Host "LocalDumps cleanup: $($_.Exception.Message)" }
          Write-Host "Application Verifier and page heap disabled, LocalDumps removed"


  # ---------------------------------------------------------------------
  # Hosted, read-only jobs. They hold no secret and no write token. The
  # tracking issue and the snapshot pull request the earlier scheduled scans
  # produced are not part of this workflow; the refreshed snapshot and the
  # reports are uploaded instead.
  # ---------------------------------------------------------------------
  nvd-scan:
    permissions:
      contents: read
    name: NVD CVE scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEVERITY: ${{ inputs.severity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the severity floor
        run: |
          case "${SEVERITY:-medium}" in
            low|medium|high|critical) ;;
            *) echo "::error::severity must be one of low, medium, high, critical"; exit 1 ;;
          esac

      # Hits the live NVD feed (plus each dependency's upstream feed) and
      # rebuilds the snapshot into the runner temp directory, so the checkout
      # stays clean. No API key is configured, so the request rate is the
      # anonymous one: a slow run, and a rate-limited one soft-skips.
      - name: Run the vendored-dependency CVE matcher against NVD (rebuild the snapshot)
        id: refresh
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/nvd"
          python3 tools/dependency/cve_scan.py \
            --severity "${SEVERITY:-medium}" \
            --refresh \
            --build-snapshot "${RUNNER_TEMP}/nvd/nvd-snapshot.json" \
            --json "${RUNNER_TEMP}/nvd/report.json" \
            | tee "${RUNNER_TEMP}/nvd/scan.txt"
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -eq 0 ]; then
            echo "refresh_ok=true" >> "$GITHUB_OUTPUT"
            echo "Refresh succeeded: snapshot rebuilt."
          elif [ "$rc" -eq 3 ]; then
            # The matcher uses exit 3 for "NVD was unreachable or the refresh
            # could not complete": an upstream outage or rate limit, not a
            # finding and not a logic error. This job only reports, and the
            # per-pull-request gate reads the committed snapshot, so skip.
            echo "refresh_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NVD unreachable or rate limited: snapshot refresh skipped, the committed snapshot is retained"
          else
            echo "refresh_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::the CVE matcher exited ${rc} (not the NVD-unreachable skip)"
            exit "$rc"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Vendored C/C++ CVE scan (report only)'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/nvd/scan.txt" 2>/dev/null || echo "(the scan produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The refreshed snapshot rides along so a reviewer, or a later bot job
      # with its own token, can propose it. A refused upload must not turn
      # the scan red.
      - name: Upload the report and the refreshed snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-cpp-cve-report
          path: ${{ runner.temp }}/nvd/
          if-no-files-found: warn
          retention-days: 3

  # The live-database dependency scan of the nightly tier, and the home of
  # two checks the pull request tier leaves out: the staleness ratchet for
  # the pinned grype database, and the image scan mode. Scan findings never
  # fail the job; the pin staleness check does, on purpose.
  dep-scan-nightly:
    permissions:
      contents: read
    name: Dependency scan (nightly, pin age and images)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYFT_VERSION: v1.44.0
      GRYPE_VERSION: v0.112.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure pinned syft + grype
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          have() { command -v "$1" >/dev/null 2>&1 && "$1" version 2>/dev/null | awk '/^Version:/{print "v"$2}'; }
          [ "$(have syft)" = "$SYFT_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh syft "$SYFT_VERSION" "$RUNNER_TEMP/bin"
          [ "$(have grype)" = "$GRYPE_VERSION" ] || \
            bash tools/sbom/install-pinned-tool.sh grype "$GRYPE_VERSION" "$RUNNER_TEMP/bin"
          syft version | awk '/^Version:/{print "syft "$2}'
          grype version | awk '/^Version:/{print "grype "$2}'

      # The staleness ratchet. The blocking dependency gate of the pull
      # request tier scans against a pinned grype database
      # (tools/sbom/grype-db-pin.json). Once that pin is older than its
      # max_age_days, this scheduled job goes red, so a pin nobody bumps
      # reddens the schedule and never a pull request. This job is the
      # home of the check.
      - name: Enforce the grype database pin age
        env:
          GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/.grype-db-pinned
        run: bash tools/sbom/provision-grype-db.sh --enforce-age

      # The live database, every surface, and the image scan mode. The image
      # surface scans the package-test images from the local container cache;
      # a hosted runner has none, so those rows read "not built" (an honest
      # row, never a clean one). The report never fails on findings.
      - name: Run the dependency scan (report only, with images)
        run: |
          set -uo pipefail
          bash tools/sbom/dep-scan.sh --images
          # Surface the severity table on the run's Summary tab.
          if [ -f sbom/scan/SUMMARY.md ]; then cat sbom/scan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      # A refused upload (artifact storage full) must not turn the scan red.
      - name: Upload SBOMs and grype reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-dep-scan-reports
          path: sbom/scan/
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------
  # The Envoy filter (pagespeed/envoy) against Envoy 1.40, every night, and
  # only here: no other tier builds it. No hosted twin (a cold Envoy build
  # does not fit a hosted runner), so it runs on the fleet or not at all.
  # ---------------------------------------------------------------------
  envoy-filter:
    permissions:
      contents: read
    name: Envoy Filter Build and Tests
    needs: event-guard
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Docker daemon gate
        run: |
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "docker daemon not ready ($i/30)"; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::the container daemon is unreachable after 60s"; exit 1; }

      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Container identity
        run: |
          echo "dev:x:$(id -u):$(id -g)::/workspace:/bin/bash" > "${RUNNER_TEMP}/ci-passwd"
          cat /etc/passwd >> "${RUNNER_TEMP}/ci-passwd"

      # A per-runner Bazel repository cache, mounted at /repo-cache: Envoy's
      # dependency archives are large, so they are kept between runs. The name
      # is suffixed per runner instance and is never logged.
      - name: Prepare the per-runner repository cache directory
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          CACHE_ROOT="${HOME}/.cache/mps-envoy-repo${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${CACHE_ROOT}"
          # Cap the cache before the job uses it (30 days, 8G; the sizing is in
          # tools/ci/prune-bazel-repository-cache.sh). It never fails the job.
          bash "${GITHUB_WORKSPACE}/tools/ci/prune-bazel-repository-cache.sh" "${CACHE_ROOT}" 30d 8G || true
          echo "REPO_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"

      - name: Build the Envoy filter and run its tests
        run: bash tools/ci/envoy-filter-build.sh

  # Kill switch notice. While the repository variable FLEET_ENABLED is 'false'
  # every build runner job here runs on its hosted twin, and the jobs that
  # have no hosted twin (the IIS and Application Verifier lanes and the
  # privileged stress rigs) are skipped. This job only says so, in an
  # annotation and the job summary, so a skipped check is never a silent one.
  fleet-off-notice:
    permissions: {}
    name: Shared build runners are switched off
    if: ${{ vars.FLEET_ENABLED == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what the switch changed
        run: |
          echo "::notice::FLEET_ENABLED is 'false': build runner jobs run on hosted runners; jobs that need a build runner host are skipped."
          {
            echo "### Shared build runners are switched off"
            echo
            echo "The repository variable FLEET_ENABLED is 'false'. Jobs that normally use the"
            echo "build runners ran on GitHub-hosted runners, slower and without the shared caches."
            echo "Jobs that need a host only the build runners provide were skipped."
            echo "Set FLEET_ENABLED back to 'true' to use the build runners again."
          } >> "$GITHUB_STEP_SUMMARY"

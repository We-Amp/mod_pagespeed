          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt //pagespeed/kernel/html:html_fuzz
          mkdir -p "${RUNNER_TEMP}/html-fuzz-bin"
          cp bazel-bin/pagespeed/kernel/html/html_fuzz "${RUNNER_TEMP}/html-fuzz-bin/html_fuzz_replay"
          EOS

      - name: Build the libFuzzer binary
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          # Same split-invocation pattern as the CSS lane.
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            --copt=-DHTML_PARSE_LIBFUZZER \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            //pagespeed/kernel/html:html_fuzz
          cp -f bazel-bin/pagespeed/kernel/html/html_fuzz "${RUNNER_TEMP}/html-fuzz-bin/html_fuzz_lf"
          EOS

      - name: Restore the persisted corpus (html-fuzz-corpus)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/html-fuzz-corpus
          key: html-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: html-fuzz-corpus-v1-

      - name: Seed the corpus from the checked-in seeds
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/html-fuzz-corpus"
          # Plain files. -n: never overwrite what the persisted cache grew.
          cp -n tools/html-parse-corpus/seeds/* "${RUNNER_TEMP}/html-fuzz-corpus"/
          EOS

      # Deterministic floor: replay the checked-in seeds through the
      # standalone binary. A fixed-size input set on purpose: the persisted
      # corpus grows unboundedly across nights. Known leak findings in the
      # kernel make leak reports noise here; memory-safety reports remain
      # the oracle.
      - name: Run the seed replay (ASan regression floor)
        run: |
          set +e
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/html-fuzz-bin/html_fuzz_replay" tools/html-parse-corpus/seeds/*
          EOS
          echo "REPLAY_RC=$?" >> "$GITHUB_ENV"

      - name: Run libFuzzer (bounded budget)
        run: |
          set +e
          docker exec -i -e FUZZ_SECONDS "${CTR}" bash -s <<'EOS'
          mkdir -p "${RUNNER_TEMP}/html-fuzz-crashes"
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/html-fuzz-bin/html_fuzz_lf" "${RUNNER_TEMP}/html-fuzz-corpus" \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=4096 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${RUNNER_TEMP}/html-fuzz-crashes/" \
            -print_final_stats=1
          EOS
          echo "FUZZ_RC=$?" >> "$GITHUB_ENV"

      - name: Gate and write the findings
        run: |
          set -uo pipefail
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          F="${RUNNER_TEMP}/html-fuzz-crashes/findings.md"
          mkdir -p "${RUNNER_TEMP}/html-fuzz-crashes"; : > "$F"
          if [ "${REPLAY_RC:-1}" != "0" ]; then
            {
              echo "### Seed replay failed (rc=${REPLAY_RC})"
              echo
              echo "The deterministic checked-in-seed ASan regression floor is red; see the run log for the sanitizer report."
            } >> "$F"
          fi
          if [ "${FUZZ_RC:-1}" != "0" ]; then
            {
              echo "### libFuzzer found a crashing input (rc=${FUZZ_RC})"
              echo
              echo "Reproducers and the corpus: the nightly-html-fuzz-evidence artifact of the run."
              echo "Replay locally with:"
              echo
              echo '    bazel run --config=clang-asan -c opt //pagespeed/kernel/html:html_fuzz -- <crash-file>'
            } >> "$F"
          fi
          if [ -s "$F" ]; then
            cat "$F" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload the evidence (crash reproducers and corpus)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-html-fuzz-evidence
          path: |
            ${{ runner.temp }}/html-fuzz-crashes/
            ${{ runner.temp }}/html-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 3

      # Save even on findings: libFuzzer writes a crash unit into the corpus
      # directory before it stops, and keeping it makes the finding a
      # persistent regression input once the bug is fixed. Guarded on the
      # lane having run so a build-stage failure cannot error the save on a
      # missing path.
      - name: Persist the corpus (html-fuzz-corpus)
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/html-fuzz-corpus
          key: html-fuzz-corpus-v1-${{ github.run_id }}

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi

  fuzz-packs:
    permissions:
      contents: read
    name: Pack loader + filter fuzz (libFuzzer)
    needs: nightly-vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 150
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
    steps:
      # libFuzzer reads a non-numeric budget as "no limit" and a budget past
      # the job timeout loses the corpus save, so bound it before anything
      # else runs.
      - name: Validate the fuzz budget
        run: |
          if ! [[ "${FUZZ_SECONDS}" =~ ^[0-9]{1,4}$ ]] || [ "$((10#${FUZZ_SECONDS}))" -lt 1 ] || [ "$((10#${FUZZ_SECONDS}))" -gt 1800 ]; then
            echo "::error::fuzz budget must be a whole number of seconds between 1 and 1800"
            exit 1
          fi

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.nightly-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.nightly-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.nightly-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host lock around the build
          # (tools/ci/ensure-dev-image.sh). A hosted runner builds it cold.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # One named container per job, started as the host user and removed in
      # the last step. Later steps run commands in it with docker exec, so
      # processes a test rig starts stay up between steps. The passwd entry
      # lets the image's passwordless sudo apply to the host uid.
      - name: Start the build container
        run: |
          set -euo pipefail
          CTR="nightly-fuzz-packs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RAM_GB="${CI_BUILD_RAM_BUDGET_GB:-16}"
          case "${RAM_GB}" in ''|*[!0-9]*) RAM_GB=16 ;; esac
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB) wins over the older RAM budget.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget "${RAM_GB}g" || exit 1
          RAM_GB="${SLOT_MEM_GB}"
          EXTRA=()
          BZL_FLAGS="--config=vendored --config=clang-libstdcxx13 --cxxopt=-std=c++20 --host_cxxopt=-std=c++20 --define=go_build=disabled --nostamp --jobs=${SLOT_JOBS}"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            BZL_FLAGS="${BZL_FLAGS} --config=remote-cache"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          BZL_FLAGS="${BZL_FLAGS} --local_ram_resources=$((RAM_GB * 1024 * 3 / 4))"
          { echo "dev:x:$(id -u):$(id -g)::/tmp/ci-home:/bin/bash"
            docker run --rm --entrypoint cat "${DOCKER_IMAGE}" /etc/passwd; } > "${RUNNER_TEMP}/ci-passwd"
          docker rm -f "${CTR}" >/dev/null 2>&1 || true
          docker run -d --init --name "${CTR}" "${EXTRA[@]}" \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${RAM_GB}g" --memory-swap="${RAM_GB}g" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/tmp/ci-home -e USER=dev \
            -e "RUNNER_TEMP=${RUNNER_TEMP}" \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w /workspace \
            "${DOCKER_IMAGE}" sleep infinity >/dev/null
          docker exec "${CTR}" bash -c 'mkdir -p "$HOME" && echo "startup --output_user_root=/tmp/bazel-out" > "$HOME/.bazelrc"'
          echo "CTR=${CTR}" >> "$GITHUB_ENV"
          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      - name: Build the ASan replay binaries
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            //pagespeed/kernel/packs:pack_loader_fuzz \
            //pagespeed/kernel/packs:rule_pack_filter_fuzz
          mkdir -p "${RUNNER_TEMP}/pack-fuzz-bin"
          cp bazel-bin/pagespeed/kernel/packs/pack_loader_fuzz "${RUNNER_TEMP}/pack-fuzz-bin/pack_loader_fuzz_replay"
          cp bazel-bin/pagespeed/kernel/packs/rule_pack_filter_fuzz "${RUNNER_TEMP}/pack-fuzz-bin/rule_pack_filter_fuzz_replay"
          EOS

      - name: Build the libFuzzer binaries
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          # Each harness reads only its own define, so one invocation builds
          # both; the defines rewrite the same output paths as the replay build.
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            --copt=-DPACK_LOADER_LIBFUZZER \
            --copt=-DRULE_PACK_FILTER_LIBFUZZER \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            //pagespeed/kernel/packs:pack_loader_fuzz \
            //pagespeed/kernel/packs:rule_pack_filter_fuzz
          cp -f bazel-bin/pagespeed/kernel/packs/pack_loader_fuzz "${RUNNER_TEMP}/pack-fuzz-bin/pack_loader_fuzz_lf"
          cp -f bazel-bin/pagespeed/kernel/packs/rule_pack_filter_fuzz "${RUNNER_TEMP}/pack-fuzz-bin/rule_pack_filter_fuzz_lf"
          EOS

      - name: Restore the persisted corpus (pack-fuzz-corpus)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pack-fuzz-corpus
          key: pack-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: pack-fuzz-corpus-v1-

      - name: Restore the persisted corpus (pack-filter-fuzz-corpus)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pack-filter-fuzz-corpus
          key: pack-filter-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: pack-filter-fuzz-corpus-v1-

      - name: Seed the corpora from the checked-in seeds
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pack-fuzz-corpus" "${RUNNER_TEMP}/pack-filter-fuzz-corpus"
          # Plain files. -n: never overwrite what the persisted cache grew.
          cp -n tools/pack-loader-corpus/seeds/* "${RUNNER_TEMP}/pack-fuzz-corpus"/
          cp -n test/pagespeed/kernel/packs/testdata/edge-seo/pack.example.json "${RUNNER_TEMP}/pack-fuzz-corpus"/
          cp -n tools/rule-pack-filter-corpus/seeds/* "${RUNNER_TEMP}/pack-filter-fuzz-corpus"/
          EOS

      - name: Run the seed replay (ASan regression floor)
        run: |
          set +e
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/pack-fuzz-bin/pack_loader_fuzz_replay" tools/pack-loader-corpus/seeds/* \
            test/pagespeed/kernel/packs/testdata/edge-seo/pack.example.json
          LOADER_RC=$?
          "${RUNNER_TEMP}/pack-fuzz-bin/rule_pack_filter_fuzz_replay" tools/rule-pack-filter-corpus/seeds/*
          FILTER_RC=$?
          exit $(( LOADER_RC != 0 ? LOADER_RC : FILTER_RC ))
          EOS
          echo "REPLAY_RC=$?" >> "$GITHUB_ENV"

      - name: Run libFuzzer (bounded budget, loader then filter)
        run: |
          set +e
          docker exec -i -e FUZZ_SECONDS "${CTR}" bash -s <<'EOS'
          mkdir -p "${RUNNER_TEMP}/pack-fuzz-crashes" "${RUNNER_TEMP}/pack-filter-fuzz-crashes"
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1:detect_leaks=0"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/pack-fuzz-bin/pack_loader_fuzz_lf" "${RUNNER_TEMP}/pack-fuzz-corpus" \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=16384 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${RUNNER_TEMP}/pack-fuzz-crashes/" \
            -print_final_stats=1
          LOADER_RC=$?
          "${RUNNER_TEMP}/pack-fuzz-bin/rule_pack_filter_fuzz_lf" "${RUNNER_TEMP}/pack-filter-fuzz-corpus" \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=8192 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${RUNNER_TEMP}/pack-filter-fuzz-crashes/" \
            -print_final_stats=1
          FILTER_RC=$?
          exit $(( LOADER_RC != 0 ? LOADER_RC : FILTER_RC ))
          EOS
          echo "FUZZ_RC=$?" >> "$GITHUB_ENV"

      - name: Gate and write the findings
        run: |
          set -uo pipefail
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          F="${RUNNER_TEMP}/pack-fuzz-crashes/findings.md"
          mkdir -p "${RUNNER_TEMP}/pack-fuzz-crashes"; : > "$F"
          if [ "${REPLAY_RC:-1}" != "0" ]; then
            {
              echo "### Seed replay failed (rc=${REPLAY_RC})"
              echo
              echo "The deterministic checked-in-seed ASan regression floor is red; see the run log for the sanitizer report."
            } >> "$F"
          fi
          if [ "${FUZZ_RC:-1}" != "0" ]; then
            {
              echo "### libFuzzer found a crashing input (rc=${FUZZ_RC})"
              echo
              echo "Reproducers and the corpora: the nightly-packs-fuzz-evidence artifact of the run."
              echo "Replay locally with:"
              echo
              echo '    bazel run --config=clang-asan -c opt //pagespeed/kernel/packs:pack_loader_fuzz -- <crash-file>'
              echo '    bazel run --config=clang-asan -c opt //pagespeed/kernel/packs:rule_pack_filter_fuzz -- <crash-file>'
              echo
              echo '(Loader crashes are under pack-fuzz-crashes/, filter crashes under pack-filter-fuzz-crashes/.)'
            } >> "$F"
          fi
          if [ -s "$F" ]; then
            cat "$F" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload the evidence (crash reproducers and corpus)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-packs-fuzz-evidence
          path: |
            ${{ runner.temp }}/pack-fuzz-crashes/
            ${{ runner.temp }}/pack-fuzz-corpus/
            ${{ runner.temp }}/pack-filter-fuzz-crashes/
            ${{ runner.temp }}/pack-filter-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 3

      # Save even on findings: libFuzzer writes a crash unit into the corpus
      # directory before it stops, and keeping it makes the finding a
      # persistent regression input once the bug is fixed. Guarded on the
      # lane having run so a build-stage failure cannot error the save on a
      # missing path.
      - name: Persist the corpus (pack-fuzz-corpus)
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pack-fuzz-corpus
          key: pack-fuzz-corpus-v1-${{ github.run_id }}

      - name: Persist the corpus (pack-filter-fuzz-corpus)
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pack-filter-fuzz-corpus
          key: pack-filter-fuzz-corpus-v1-${{ github.run_id }}

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi


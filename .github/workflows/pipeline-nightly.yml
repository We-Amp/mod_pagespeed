#
# pipeline-nightly.yml -- the nightly tier, as a reusable workflow, called by
# nightly.yml (schedule 04:17 UTC Monday to Saturday plus the Sunday run, and
# workflow_dispatch). See docs/ci/pipelines.md. The caller serializes
# nightlies (one group, never cancelled); this file carries no concurrency
# block.
#
# Jobs by class:
#   fleet-heavy   nightly-vendor (the vendored tree for every Linux job),
#                 linux-offline-build, apache-asan-stress, apache-daemon-lane,
#                 shared-cache-vary,
#                 nginx-asan-stress,
#                 nginx-protocol-matrix, full-tree-lint (3 shards), fuzz-css, fuzz-html,
#                 fuzz-packs, fuzz-js
#   fleet-iis     iis-asan-systest, iis-appverif-matrix (a Windows host with
#                 IIS; no hosted twin, so they are skipped without the fleet)
#   hosted        nvd-scan, dep-scan-nightly (the home of the grype database
#                 pin staleness check and of the image scan mode)
#
# The ASP.NET Core sidecar's native pair is not here: the scheduled nightly
# also calls the full tier (nightly.yml, job `full`), which builds the pair
# every night.
#
# Nothing in this file writes to GitHub and nothing reads a secret: every job
# holds contents: read only. Findings are reported by a red job, the job
# summary and the uploaded evidence. Filing a tracking issue or proposing a
# refreshed snapshot is left to a separate hosted bot job with its own token
# in a protected environment; it is not part of this workflow.
#
# Routing expression and guards are copied verbatim from docs/ci/pipelines.md;
# tools/ci/check-workflow-shape.sh enforces both. Artifacts carry a
# `nightly-` prefix.

name: pipeline-nightly

on:
  workflow_call:
    inputs:
      fuzz_seconds:
        description: libFuzzer time budget in seconds, per harness (1 to 1800)
        required: false
        type: string
        default: "600"
      duration:
        description: Sanitizer stress duration in seconds (Apache, nginx and IIS rigs)
        required: false
        type: string
        default: "600"
      concurrency:
        description: Concurrent request workers of the stress rigs
        required: false
        type: string
        default: "16"
      protocols:
        description: Space separated curl protocol flags for the nginx protocol matrix (empty means h1 and h2)
        required: false
        type: string
        default: ""
      arms:
        description: IIS Application Verifier arms, comma separated arm:iterations
        required: false
        type: string
        default: "cuzz-nopageheap:5,cuzz-pageheap:3"
      severity:
        description: Severity floor of the NVD scan (low, medium, high, critical)
        required: false
        type: string
        default: "medium"

permissions: {}

jobs:
  event-guard:
    name: Event guard (refuses merge_group, unexpected events, refs and actors)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse events, refs and actors this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ALLOWED: "schedule workflow_dispatch"
          ALLOWED_REFS: "refs/heads/master"
        run: |
          set -euo pipefail
          set -f
          case " ${ALLOWED} " in *" ${EVENT} "*) ;; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac
          case "${REF}" in refs/heads/gh-readonly-queue/*) echo "::error::merge queue refs never run this pipeline"; exit 1;; esac
          ok=no
          # shellcheck disable=SC2254  # the allowed refs are globs on purpose
          for r in ${ALLOWED_REFS}; do case "${REF}" in ${r}) ok=yes;; esac; done
          [ "${ok}" = yes ] || { echo "::error::ref ${REF} is not allowed in this pipeline"; exit 1; }
          if [ "${EVENT}" = workflow_dispatch ] && [ "${ACTOR}" = "github-actions[bot]" ]; then echo "::error::dispatches made with a workflow token are not allowed"; exit 1; fi
          if [ "${EVENT}" = pull_request ] && { [ "${PR_FORK}" = true ] || [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; }; then echo "::error::pull requests from forks are not allowed in this pipeline"; exit 1; fi
          echo "event ${EVENT} on ${REF} accepted"

  # ---------------------------------------------------------------------
  # The vendored tree. Every Linux and Windows job below builds from it
  # (build:vendored in pagespeed.bazelrc): the git-only dependencies are
  # cloned once, here, with whatever git identity the runner host holds, and
  # the rest of the nightly runs offline. The tree reaches the consumer jobs
  # through a runner-local or hub tarball when the runner environment offers
  # one, and through actions/cache otherwise.
  # ---------------------------------------------------------------------
  nightly-vendor:
    permissions:
      contents: read
    name: Vendor Dependencies (nightly)
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.stamp.outputs.short_sha }}
      channel: ${{ steps.renv.outputs.channel }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect runner environment
        id: renv
        run: |
          # The vendored tree reaches consumer jobs through a runner-local
          # vendor dir or the hub when the runner environment provides it,
          # and through actions/cache otherwise (docs/ci/runner-environment.md).
          channel=cache
          if [ -n "${CI_VENDOR_DIR:-}" ] || { [ -n "${CI_HUB_SSH:-}" ] && [ -n "${CI_HUB_VENDOR_DIR:-}" ]; }; then
            channel=hub
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "vendor distribution channel: ${channel}"

      - name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; bash tools/ci/check-bazel-version.sh; exit 0; fi
          if command -v npm >/dev/null 2>&1; then
            npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          fi
          command -v bazel >/dev/null 2>&1 || {
            echo "::error::bazel is not on PATH and could not be installed via npm; see docs/ci/runner-environment.md"
            exit 1
          }
          bazel --version
          bash tools/ci/check-bazel-version.sh

      # Cache channel (hosted, or a build runner without hub configuration):
      # vendor/ rides actions/cache between jobs, keyed on the dependency
      # manifest so a dependency bump re-vendors exactly once.
      - name: Restore vendored dependencies (cache channel)
        if: steps.renv.outputs.channel == 'cache'
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}

      # tools/vendor-deps.sh clones the git-only dependencies and fills the
      # Bazel repository cache; it needs python3, git and a git identity that
      # can read those repositories (the runner host's own).
      - name: Vendor all dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash tools/vendor-deps.sh vendor

      # Hub channel only: stamp + tar the tree (source, vendor/, GIT_COMMIT)
      # for the consumer jobs. On the cache channel consumers get the same
      # tree from their own checkout plus the cached vendor/.
      - name: Stamp GIT_COMMIT
        if: steps.renv.outputs.channel == 'hub'
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Create the source tarball
        if: steps.renv.outputs.channel == 'hub'
        id: tarball
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LOCAL_DIR="${CI_VENDOR_DIR:-${RUNNER_TEMP}}"
          mkdir -p "${LOCAL_DIR}"
          TARBALL="${LOCAL_DIR}/mod_pagespeed-${SHORT_SHA}.tar.zst"
          # Short-circuit re-runs: a complete tarball for this SHA was
          # published atomically by a prior run. A readable file that fails
          # `zstd -t` is not trusted and is tarred again. Re-stamp it so the
          # age-based prunes count from now.
          if [ -r "$TARBALL" ] && zstd -t -q "$TARBALL" >/dev/null 2>&1; then
            echo "Tarball for ${SHORT_SHA} present and readable; skipping re-tar"
            touch "$TARBALL"
          else
            # The temp file is runner-private (the runner's own temp dir) and
            # carries the run id and attempt: the long write never happens in
            # the vendor dir that sibling runners prune and read, and the
            # publish step copies it in under a unique name before linking.
            TMP_TARBALL="${RUNNER_TEMP:-/tmp}/$(basename "$TARBALL").${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
            rm -f "${TMP_TARBALL}"
            # Status 1 is accepted only when the sole complaint is the workspace
            # root directory changing (no file contents); a changed file is torn.
            TAR_ERR="${RUNNER_TEMP:-/tmp}/tar-err-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            set +e
            tar --zstd --dereference --mode='u+w' -cf "${TMP_TARBALL}" \
              --exclude='.git' \
              --exclude='bazel-*' \
              . 2>"${TAR_ERR}"
            tar_rc=$?
            set -e
            if [ "$tar_rc" -eq 1 ] && ! grep -v -x -e '' -e 'tar: .: file changed as we read it' "${TAR_ERR}" | grep -q .; then
              echo "::notice::workspace root changed during archiving; archive accepted"
            elif [ "$tar_rc" -ne 0 ]; then
              while IFS= read -r line; do echo "::error::${line}"; done < "${TAR_ERR}"
              echo "::error::tar failed with status ${tar_rc}"
              exit "$tar_rc"
            fi
          fi
          # Publish create-if-absent and write the digest sidecar
          # (tools/ci/publish-vendor-tarball.sh): a same-SHA tarball another
          # writer published first is adopted, never replaced.
          VENDOR_VERIFY_ZSTD=1 bash tools/ci/publish-vendor-tarball.sh "$TARBALL" ${TMP_TARBALL:+"$TMP_TARBALL"}
          # Prune other SHAs' tarballs from the shared local dir, but only
          # past a grace window (a recent tarball may still be extracting in
          # a concurrent run) and only while file times agree with this
          # host's clock (tools/ci/prune-vendor-dir.sh). Sidecars go with
          # their tarball; *.tmp sweeps cancelled runs.
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            bash tools/ci/prune-vendor-dir.sh "${CI_VENDOR_DIR}" mod_pagespeed "${SHORT_SHA}" 120
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          # Name and size only: the directory is a runner-local path.
          echo "Tarball: $(basename "$TARBALL") ($(du -h "$TARBALL" | cut -f1))"

      - name: Publish the tarball to the hub
        if: steps.renv.outputs.channel == 'hub'
        run: |
          # The ssh remote commands interpolate this runner's environment
          # client-side on purpose: the values are defined by the runner
          # environment contract (docs/ci/runner-environment.md), never
          # logged, and the remote side needs them as literals.
          if [ -z "${CI_HUB_SSH:-}" ] || [ -z "${CI_HUB_VENDOR_DIR:-}" ]; then
            echo "::notice::CI_HUB_SSH/CI_HUB_VENDOR_DIR not set: the vendor tarball stays on this runner. Consumers on other runners fail with a recovery hint; configure the runner environment or use the cache channel (docs/ci/runner-environment.md)."
            exit 0
          fi
          TARBALL="${{ steps.tarball.outputs.tarball }}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o LogLevel=ERROR"
          F="$(basename "$TARBALL")"
          TMP_DEST="${CI_HUB_VENDOR_DIR}/${F}.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME//[^A-Za-z0-9_.-]/_}.tmp"
          # The digest of the local tarball (the publish step above wrote its
          # sidecar): the hub side checks the transferred bytes against it.
          DIGEST="$(cut -d' ' -f1 "${TARBALL}.sha256")"
          # Publish ON the hub with the same script the local publish used,
          # streamed over ssh: create-if-absent (a sound published tarball is
          # never replaced), flushed before the link, digest checked, sidecar
          # written through a temp name. The remote commands expand
          # client-side on purpose.
          # SSH_OPTS is an intentional multi-token option list.
          # shellcheck disable=SC2029,SC2086
          for attempt in 1 2 3; do
            if ssh ${SSH_OPTS} "${CI_HUB_SSH}" "mkdir -p '${CI_HUB_VENDOR_DIR}'" \
               && rsync -a -e "ssh ${SSH_OPTS}" "$TARBALL" "${CI_HUB_SSH}:${TMP_DEST}" \
               && ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                    "GITHUB_RUN_ID='${GITHUB_RUN_ID}' GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' VENDOR_EXPECT_SHA256='${DIGEST}' VENDOR_VERIFY_ZSTD=1 bash -s -- '${CI_HUB_VENDOR_DIR}/${F}' '${TMP_DEST}'" \
                    < tools/ci/publish-vendor-tarball.sh; then
              echo "Published ${F} to the CI hub (attempt ${attempt})"
              # Prune hub tarballs older than the retention window: the hub
              # copy is the only one a rerun-failed-jobs consumer can reach
              # once the local copy is gone.
              ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                "bash -s -- '${CI_HUB_VENDOR_DIR}' mod_pagespeed - ${CI_HUB_VENDOR_RETENTION_MIN:-1440}" \
                < tools/ci/prune-vendor-dir.sh 2>/dev/null || true
              exit 0
            fi
            echo "::warning::hub publish failed (attempt ${attempt}/3)"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "::error::hub publish failed after 3 attempts"
          exit 1

      - name: Stamp outputs
        id: stamp
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
  # ---------------------------------------------------------------------
  # Offline vendored build (#197). The release tarball promises a build
  # with no network, so a nightly lane proves that stays true: the vendored
  # tree is staged in a fresh directory and both server modules are rebuilt
  # inside the dev image with --network none and the release lane's build
  # flags, reading only the vendored repository cache. A dependency that
  # silently stops being vendored fails here, on its own lane, and not on a
  # release day. The build is always cold, so it runs nightly only, like
  # envoy-filter.
  # ---------------------------------------------------------------------
  linux-offline-build:
    permissions:
      contents: read
    name: Linux Offline Build
    needs: nightly-vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.nightly-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.nightly-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.nightly-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"
          STAMPED=$(tr -d '[:space:]' < GIT_COMMIT)
          [ "${STAMPED}" = "${GITHUB_SHA}" ] || { echo "::error::stale vendored workspace: expected ${GITHUB_SHA}, got ${STAMPED}"; exit 1; }

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Docker daemon gate
        run: |
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "docker daemon not ready ($i/30)"; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::the container daemon is unreachable after 60s"; exit 1; }

      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Container identity
        run: |
          echo "dev:x:$(id -u):$(id -g)::/workspace:/bin/bash" > "${RUNNER_TEMP}/ci-passwd"
          cat /etc/passwd >> "${RUNNER_TEMP}/ci-passwd"

      # The offline build must not lean on anything the CI workspace holds
      # around the vendored tree: the whole tree (the source plus vendor/)
      # goes to a directory that starts empty, the way a release tarball
      # extracts. .git and the bazel-* convenience links are not part of
      # what ships, and the vendor job's tarball leaves them out too.
      - name: Stage the vendored tree in a fresh directory
        run: |
          OFFLINE_SRC="${RUNNER_TEMP}/offline-src"
          rm -rf "${OFFLINE_SRC}"
          mkdir -p "${OFFLINE_SRC}"
          tar -C "${GITHUB_WORKSPACE}" \
            --dereference --mode=u+w \
            --exclude=.git \
            --exclude='bazel-*' \
            -cf - . | tar -C "${OFFLINE_SRC}" -xf -
          echo "OFFLINE_SRC=${OFFLINE_SRC}" >> "$GITHUB_ENV"
          echo "Offline tree: $(du -sh "${OFFLINE_SRC}" | cut -f1)"

      - name: Fetch the pinned Bazel for the offline container
        run: |
          # The dev image ships Bazelisk, not Bazel: the first bazel call
          # downloads the pinned version (from .bazelversion) into
          # BAZELISK_HOME, which cannot happen inside --network none. Fetch
          # it once here, with the network on, into a directory the offline
          # step mounts as its BAZELISK_HOME. Getting the Bazel binary this
          # way is fine: the release tarball ships no Bazel either, only
          # the dependency archives.
          BAZELISK_DIR="${RUNNER_TEMP}/bazelisk"
          rm -rf "${BAZELISK_DIR}"
          mkdir -p "${BAZELISK_DIR}"
          PINNED="$(tr -d '[:space:]' < "${OFFLINE_SRC}/.bazelversion")"
          WARM="nightly-linux-offline-warm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "${WARM}" 2>/dev/null || true
          GOT="$(docker run --rm --name "${WARM}" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZELISK_HOME=/bazelisk \
            -v "${BAZELISK_DIR}:/bazelisk" \
            -v "${OFFLINE_SRC}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bazel --version)"
          echo "Warmed: ${GOT}"
          [ "${GOT}" = "bazel ${PINNED}" ] || {
            echo "::error::the warmed Bazel is not the pinned one (expected bazel ${PINNED})"
            exit 1
          }

      - name: Build both modules with no network
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget 55g || exit 1
          NAME="nightly-linux-offline-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "${NAME}" 2>/dev/null || true
          # --network none: no routes and no DNS, so a dependency that is not
          # vendored fails here instead of downloading; the Bazel binary
          # itself comes from the BAZELISK_HOME the previous step warmed.
          # --repository_disable_download serves repository-cache hits and
          # refuses every download, so a repository that is not vendored
          # fails loudly and by name, and --lockfile_mode=error makes a
          # stale MODULE.bazel.lock fail instead of re-resolving. The remote
          # cache of build:ci is switched off: it names a host this container
          # cannot reach, and a hit served from outside would only postpone
          # the failure to link time.
          docker run --rm --init \
            --name "${NAME}" \
            --network none \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/workspace -e USER=dev \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e BAZELISK_HOME=/bazelisk \
            -e BAZEL_CONFIG="--config=ci --config=hardening --config=hardening-cet -c opt --remote_cache= --jobs=${SLOT_JOBS}" \
            -v "${RUNNER_TEMP}/bazelisk:/bazelisk" \
            -v "${OFFLINE_SRC}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -u -o pipefail
              LOG=/tmp/offline-build.log
              rc=0
              # BAZEL_CONFIG is an intentional flag list -> word-splitting.
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out-offline \
                build ${BAZEL_CONFIG} --repository_disable_download \
                --lockfile_mode=error \
                --action_env=CC=clang --action_env=CXX=clang++ \
                -- //:libmod_pagespeed.so //pagespeed/nginx:ngx_pagespeed_module.so \
                2>&1 | tee "${LOG}" || rc=$?
              if [ "${rc}" -ne 0 ]; then
                echo
                echo "===== repositories and URLs the offline build tried to reach ====="
                grep -E "ERROR:|repository|registry|fetch|downloa|https?://" "${LOG}" | sort -u | head -80 || true
                echo "==================================================================="
                exit "${rc}"
              fi
              ls -la bazel-bin/libmod_pagespeed.so bazel-bin/pagespeed/nginx/ngx_pagespeed_module.so
            '

      - name: Remove the build container
        if: always()
        run: |
          # Only this job's own containers (job, run and attempt in the name).
          docker rm -f "nightly-linux-offline-warm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "nightly-linux-offline-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true


  # ---------------------------------------------------------------------
  # Sanitizer stress rigs. Each builds the ASan module in the dev image and
  # drives the module through graceful reload / restart under load inside
  # the same container (the image carries Apache, the configured nginx
  # source tree, clang with the sanitizer runtimes and passwordless sudo).
  # The sweep step is the gate; evidence is kept briefly on failure.
  # ---------------------------------------------------------------------
  apache-asan-stress:
    permissions:
      contents: read
    name: Apache ASan graceful-restart stress
    needs: nightly-vendor
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 90
    env:
      DURATION: ${{ inputs.duration || '600' }}
      CONCURRENCY: ${{ inputs.concurrency || '16' }}
    steps:
      - name: Validate the stress parameters
        run: |
          # Length-capped digit patterns first, so a huge value never reaches
          # an arithmetic test.
          if ! [[ "${DURATION}" =~ ^[0-9]{1,4}$ ]] || [ "$((10#${DURATION}))" -lt 1 ] || [ "$((10#${DURATION}))" -gt 1800 ]; then
            echo "::error::duration must be a whole number of seconds between 1 and 1800"
            exit 1
          fi
          if ! [[ "${CONCURRENCY}" =~ ^[0-9]{1,3}$ ]] || [ "$((10#${CONCURRENCY}))" -lt 1 ] || [ "$((10#${CONCURRENCY}))" -gt 256 ]; then
            echo "::error::concurrency must be a whole number between 1 and 256"
            exit 1
          fi

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.nightly-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.nightly-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.nightly-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host lock around the build
          # (tools/ci/ensure-dev-image.sh). A hosted runner builds it cold.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # One named container per job, started as the host user and removed in
      # the last step. Later steps run commands in it with docker exec, so
      # processes a test rig starts stay up between steps. The passwd entry
      # lets the image's passwordless sudo apply to the host uid.
      - name: Start the build container
        run: |
          set -euo pipefail
          CTR="nightly-apache-asan-stress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RAM_GB="${CI_BUILD_RAM_BUDGET_GB:-16}"
          case "${RAM_GB}" in ''|*[!0-9]*) RAM_GB=16 ;; esac
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB) wins over the older RAM budget.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget "${RAM_GB}g" || exit 1
          RAM_GB="${SLOT_MEM_GB}"
          EXTRA=()
          BZL_FLAGS="--config=vendored --config=clang-libstdcxx13 --cxxopt=-std=c++20 --host_cxxopt=-std=c++20 --define=go_build=disabled --nostamp --jobs=${SLOT_JOBS}"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            BZL_FLAGS="${BZL_FLAGS} --config=remote-cache"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          BZL_FLAGS="${BZL_FLAGS} --local_ram_resources=$((RAM_GB * 1024 * 3 / 4))"
          { echo "dev:x:$(id -u):$(id -g)::/tmp/ci-home:/bin/bash"
            docker run --rm --entrypoint cat "${DOCKER_IMAGE}" /etc/passwd; } > "${RUNNER_TEMP}/ci-passwd"
          docker rm -f "${CTR}" >/dev/null 2>&1 || true
          docker run -d --init --name "${CTR}" "${EXTRA[@]}" \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${RAM_GB}g" --memory-swap="${RAM_GB}g" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/tmp/ci-home -e USER=dev \
            -e "RUNNER_TEMP=${RUNNER_TEMP}" \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w /workspace \
            "${DOCKER_IMAGE}" sleep infinity >/dev/null
          docker exec "${CTR}" bash -c 'mkdir -p "$HOME" && echo "startup --output_user_root=/tmp/bazel-out" > "$HOME/.bazelrc"'
          echo "CTR=${CTR}" >> "$GITHUB_ENV"
          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      - name: Build the ASan module
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          bazel build ${BZL_FLAGS} --config=clang-asan //:libmod_pagespeed.so
          test -f bazel-bin/libmod_pagespeed.so
          EOS

      - name: Set up the ASan Apache rig
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -uo pipefail
          export REPO_DIR=/workspace RIG_DIR="${RUNNER_TEMP}/apache-asan-rig" PORT=18085
          export DOCROOT=/var/www/html ERRLOG=/var/log/apache2/error.log
          export MODULE_SO=/workspace/bazel-bin/libmod_pagespeed.so
          export ASAN_RUNTIME="$(clang -print-file-name=libclang_rt.asan-x86_64.so)"
          bash tools/stress/apache/setup_apache_asan_rig.sh
          EOS

      - name: Run the graceful-restart-under-load stress
        run: |
          set +e
          docker exec -i -e DURATION -e CONCURRENCY "${CTR}" bash -s <<'EOS'
          set -uo pipefail
          export REPO_DIR=/workspace RIG_DIR="${RUNNER_TEMP}/apache-asan-rig" PORT=18085
          export DOCROOT=/var/www/html ERRLOG=/var/log/apache2/error.log
          bash tools/stress/apache/run_apache_asan_rig.sh
          EOS
          echo "HARNESS_RC=$?" >> "$GITHUB_ENV"

      # The sweep adjudicates: it reads the Apache error log and the cores
      # for sanitizer reports and crash tokens.
      - name: Sweep for ASan and crash evidence (gate)
        run: |
          docker exec -i -e HARNESS_RC "${CTR}" bash -s <<'EOS'
          set -uo pipefail
          export REPO_DIR=/workspace RIG_DIR="${RUNNER_TEMP}/apache-asan-rig" PORT=18085
          export DOCROOT=/var/www/html ERRLOG=/var/log/apache2/error.log
          bash tools/stress/apache/sweep_apache_asan_rig.sh "${HARNESS_RC}"
          EOS

      - name: Collect the evidence
        if: failure() && env.CTR != ''
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/apache-asan-evidence"
          docker cp "${CTR}:/var/log/apache2/error.log" "${RUNNER_TEMP}/apache-asan-evidence/error.log" || true
          cp -r "${RUNNER_TEMP}/apache-asan-rig/cores" "${RUNNER_TEMP}/apache-asan-evidence/" 2>/dev/null || true

      # Debugging aid for a failed night only: the sweep above is the gate.
      # A refused upload (artifact storage full) must not add a failure of
      # its own.
      - name: Upload the evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-apache-asan-evidence
          path: ${{ runner.temp }}/apache-asan-evidence/
          if-no-files-found: ignore
          retention-days: 3

      - name: Tear down the rig (restore the module configuration)
        if: always() && env.CTR != ''
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS' || true
          export REPO_DIR=/workspace RIG_DIR="${RUNNER_TEMP}/apache-asan-rig" ERRLOG=/var/log/apache2/error.log
          bash tools/stress/apache/cleanup_apache_asan_rig.sh
          EOS

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi


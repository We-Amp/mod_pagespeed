            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w /workspace \
            "${DOCKER_IMAGE}" sleep infinity >/dev/null
          docker exec "${CTR}" bash -c 'mkdir -p "$HOME" && echo "startup --output_user_root=/tmp/bazel-out" > "$HOME/.bazelrc"'
          echo "CTR=${CTR}" >> "$GITHUB_ENV"
          # The container memory limit in GiB, the one number the lint
          # parallelism is derived from (see the lint step).
          echo "LINT_MEM_GIB=${RAM_GB}" >> "$GITHUB_ENV"
          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      # The compilation database holds absolute paths into the Bazel
      # execroot, which exists only in the container that generated it, so
      # generation and linting share this one exec.
      - name: clang-tidy (compilation database and full-tree lint)
        run: |
          docker exec -i -e BZL_FLAGS -e LINT_SHARD -e LINT_SHARDS -e LINT_MEM_GIB -e CI_SLOT_CPUS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          export BAZEL_BUILD_OPTIONS="--config=vendored --deleted_packages=pagespeed/envoy,pagespeed/iis,pagespeed/windows --keep_going${CI_SLOT_CPUS:+ --jobs=${CI_SLOT_CPUS}}"
          rm -f compile_commands.json
          # Do not let the generator die unannotated: a bare failure leaves
          # nothing in the step log.
          set +e
          python3 tools/gen_compilation_database.py -- //pagespeed/... //net/...
          gen_rc=$?
          set -e
          if [ "$gen_rc" -ne 0 ]; then
            echo "::error::compile_commands.json generation failed (bazel exited ${gen_rc}); see the compilation database output above"
            exit 1
          fi
          # Without the vendored dependency override every nginx translation
          # unit silently drops out of the partial database. A full-tree sweep
          # that skips pagespeed/nginx must fail, not pass.
          grep -q "pagespeed/nginx/ngx_pagespeed\.cc" compile_commands.json || {
            echo "::error::compile_commands.json has no pagespeed/nginx entries; nginx dropped out of the compilation database"
            exit 1
          }
          # The file list: every database entry whose absolute path matches
          # the regex the PR lint job passes in its full mode, anchored
          # right after the execroot segment
          # ((^|/execroot/[^/]+/)(base|pagespeed|net)/) so entries outside
          # those roots, test/ among them, never enter a shard. The database
          # is built from //pagespeed/... //net/... only, so every
          # translation unit in it sits under one of the roots: the anchored
          # form selects the same files the unanchored one did. A file
          # belongs to this shard when a stable hash of its path relative to
          # the execroot satisfies crc32(path) % LINT_SHARDS == LINT_SHARD,
          # so the assignment does not depend on list position even if
          # shards build slightly different databases. The list is sorted
          # for a deterministic argument order, and each file becomes an
          # anchored escaped regex.
          python3 - > "${RUNNER_TEMP}/lint-shard-files.txt" <<'PY'
          import json, os, re, zlib
          sel = re.compile(r"(^|/execroot/[^/]+/)(base|pagespeed|net)/")
          n, s = int(os.environ["LINT_SHARDS"]), int(os.environ["LINT_SHARD"])
          files = set()
          for e in json.load(open("compile_commands.json")):
              f = os.path.normpath(os.path.join(e["directory"], e["file"]))
              rel = os.path.relpath(f, e["directory"])
              if sel.search(f) and zlib.crc32(rel.encode()) % n == s:
                  files.add(f)
          if files:
              print("\n".join(sorted(files)))
          PY
          echo "shard ${LINT_SHARD} of ${LINT_SHARDS}: $(wc -l < "${RUNNER_TEMP}/lint-shard-files.txt") files"
          [ -s "${RUNNER_TEMP}/lint-shard-files.txt" ] || {
            echo "::error::shard ${LINT_SHARD} of ${LINT_SHARDS} has no files to lint"
            exit 1
          }
          mapfile -t shard_re < <(sed -e 's/[][\.^$*+?(){}|\/]/\\&/g' -e 's/^/^/' -e 's/$/$/' "${RUNNER_TEMP}/lint-shard-files.txt")
          # One clang-tidy process on this tree can take about 2 GiB, and
          # run-clang-tidy defaults -j to the host CPU count, which on a big
          # host far exceeds the container memory limit (the kernel then
          # kills the processes). Cap it: -j = min(nproc, max(4, GiB / 2)),
          # where GiB is the container's --memory value (16 GiB gives -j 8).
          lint_jobs=$(( LINT_MEM_GIB / 2 ))
          [ "${lint_jobs}" -ge 4 ] || lint_jobs=4
          [ "${lint_jobs}" -le "$(nproc)" ] || lint_jobs="$(nproc)"
          # The runner's per-slot CPU share (CI_SLOT_CPUS) caps it further.
          [ -z "${CI_SLOT_CPUS:-}" ] || [ "${lint_jobs}" -le "${CI_SLOT_CPUS}" ] || lint_jobs="${CI_SLOT_CPUS}"
          echo "run-clang-tidy-20 -j ${lint_jobs} (memory limit ${LINT_MEM_GIB} GiB)"
          run-clang-tidy-20 \
            -j "${lint_jobs}" \
            -clang-tidy-binary=clang-tidy-20 \
            -p /workspace \
            "${shard_re[@]}"
          EOS

      # A silently absent clang-tidy-20 would make run-clang-tidy a no-op
      # that exits 0: a green nightly that linted nothing.
      - name: Assert clang-tidy actually ran
        if: always() && env.CTR != ''
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          command -v run-clang-tidy-20 >/dev/null && command -v clang-tidy-20 >/dev/null \
            || { echo "::error::clang-tidy-20 or run-clang-tidy-20 is missing from the image; the lint above was a no-op"; exit 1; }
          EOS

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi

  # ---------------------------------------------------------------------
  # Fuzz lanes. Each builds an ASan replay binary (the deterministic
  # regression floor) and a libFuzzer binary (coverage-guided discovery with
  # a bounded budget), seeds a corpus that is persisted across nights with
  # actions/cache, and fails the job on a floor regression or a crash. Crash
  # reproducers and the corpus are uploaded on failure.
  # ---------------------------------------------------------------------
  fuzz-css:
    permissions:
      contents: read
    name: CSS parser fuzz (corpus floor + libFuzzer)
    needs: nightly-vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 90
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
    steps:
      # libFuzzer reads a non-numeric budget as "no limit" and a budget past
      # the job timeout loses the corpus save, so bound it before anything
      # else runs.
      - name: Validate the fuzz budget
        run: |
          if ! [[ "${FUZZ_SECONDS}" =~ ^[0-9]{1,4}$ ]] || [ "$((10#${FUZZ_SECONDS}))" -lt 1 ] || [ "$((10#${FUZZ_SECONDS}))" -gt 1800 ]; then
            echo "::error::fuzz budget must be a whole number of seconds between 1 and 1800"
            exit 1
          fi

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.nightly-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: mod-pagespeed-vendor-${{ hashFiles('bazel/repositories.bzl', 'bazel/cyclone.bzl', 'tools/vendor-deps.sh', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.nightly-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.nightly-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix mod_pagespeed)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/mod_pagespeed-${{ needs.nightly-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host lock around the build
          # (tools/ci/ensure-dev-image.sh). A hosted runner builds it cold.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # One named container per job, started as the host user and removed in
      # the last step. Later steps run commands in it with docker exec, so
      # processes a test rig starts stay up between steps. The passwd entry
      # lets the image's passwordless sudo apply to the host uid.
      - name: Start the build container
        run: |
          set -euo pipefail
          CTR="nightly-fuzz-css-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RAM_GB="${CI_BUILD_RAM_BUDGET_GB:-16}"
          case "${RAM_GB}" in ''|*[!0-9]*) RAM_GB=16 ;; esac
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB) wins over the older RAM budget.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget "${RAM_GB}g" || exit 1
          RAM_GB="${SLOT_MEM_GB}"
          EXTRA=()
          BZL_FLAGS="--config=vendored --config=clang-libstdcxx13 --cxxopt=-std=c++20 --host_cxxopt=-std=c++20 --define=go_build=disabled --nostamp --jobs=${SLOT_JOBS}"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            BZL_FLAGS="${BZL_FLAGS} --config=remote-cache"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          BZL_FLAGS="${BZL_FLAGS} --local_ram_resources=$((RAM_GB * 1024 * 3 / 4))"
          { echo "dev:x:$(id -u):$(id -g)::/tmp/ci-home:/bin/bash"
            docker run --rm --entrypoint cat "${DOCKER_IMAGE}" /etc/passwd; } > "${RUNNER_TEMP}/ci-passwd"
          docker rm -f "${CTR}" >/dev/null 2>&1 || true
          docker run -d --init --name "${CTR}" "${EXTRA[@]}" \
            ${SLOT_CPUS:+--cpus="${SLOT_CPUS}"} \
            --memory="${RAM_GB}g" --memory-swap="${RAM_GB}g" \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/ci-passwd:/etc/passwd:ro" \
            -e HOME=/tmp/ci-home -e USER=dev \
            -e "RUNNER_TEMP=${RUNNER_TEMP}" \
            -e PATH=/opt/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w /workspace \
            "${DOCKER_IMAGE}" sleep infinity >/dev/null
          docker exec "${CTR}" bash -c 'mkdir -p "$HOME" && echo "startup --output_user_root=/tmp/bazel-out" > "$HOME/.bazelrc"'
          echo "CTR=${CTR}" >> "$GITHUB_ENV"
          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      - name: Build the ASan replay binary and the corpus test
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          # Release with DCHECKs compiled out, ASan as the oracle.
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            //third_party/css_parser:parser_fuzz \
            //third_party/css_parser:parser_fuzz_corpus_test
          mkdir -p "${RUNNER_TEMP}/css-fuzz-bin"
          cp bazel-bin/third_party/css_parser/parser_fuzz "${RUNNER_TEMP}/css-fuzz-bin/parser_fuzz_replay"
          EOS

      - name: Build the libFuzzer binary
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          # The define compiles the harness main() out and exposes
          # LLVMFuzzerTestOneInput; a separate invocation from the replay
          # build because the define rewrites the same output path.
          bazel build ${BZL_FLAGS} --config=clang-asan -c opt \
            --copt=-DCSS_PARSER_LIBFUZZER \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            //third_party/css_parser:parser_fuzz
          cp -f bazel-bin/third_party/css_parser/parser_fuzz "${RUNNER_TEMP}/css-fuzz-bin/parser_fuzz_lf"
          EOS

      - name: Restore the persisted corpus (css-fuzz-corpus)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/css-fuzz-corpus
          key: css-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: css-fuzz-corpus-v1-

      - name: Seed the corpus from the harness's embedded corpus
        run: |
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/css-fuzz-corpus"
          "${RUNNER_TEMP}/css-fuzz-bin/parser_fuzz_replay" --dump_corpus="${RUNNER_TEMP}/css-fuzz-seed"
          # -n: never overwrite what the persisted cache already grew.
          cp -n "${RUNNER_TEMP}/css-fuzz-seed"/seed-* "${RUNNER_TEMP}/css-fuzz-corpus"/
          EOS

      # The run steps capture their exit status instead of failing fast so a
      # red corpus test cannot mask the fuzz result (and the reverse); the
      # gate step turns either failure red after both have run.
      - name: Run the deterministic corpus test (ASan regression floor)
        run: |
          set +e
          docker exec -i -e BZL_FLAGS "${CTR}" bash -s <<'EOS'
          bazel test ${BZL_FLAGS} --config=clang-asan -c opt --test_output=errors --nocache_test_results \
            //third_party/css_parser:parser_fuzz_corpus_test
          EOS
          echo "CORPUS_RC=$?" >> "$GITHUB_ENV"

      - name: Run libFuzzer (bounded budget)
        run: |
          set +e
          docker exec -i -e FUZZ_SECONDS "${CTR}" bash -s <<'EOS'
          mkdir -p "${RUNNER_TEMP}/css-fuzz-crashes"
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "${RUNNER_TEMP}/css-fuzz-bin/parser_fuzz_lf" "${RUNNER_TEMP}/css-fuzz-corpus" \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=4096 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${RUNNER_TEMP}/css-fuzz-crashes/" \
            -print_final_stats=1
          EOS
          echo "FUZZ_RC=$?" >> "$GITHUB_ENV"

      - name: Gate and write the findings
        run: |
          set -uo pipefail
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          F="${RUNNER_TEMP}/css-fuzz-crashes/findings.md"
          mkdir -p "${RUNNER_TEMP}/css-fuzz-crashes"; : > "$F"
          if [ "${CORPUS_RC:-1}" != "0" ]; then
            {
              echo "### parser_fuzz_corpus_test failed (rc=${CORPUS_RC})"
              echo
              echo "The deterministic embedded-corpus ASan regression floor is red; see the run log for the sanitizer report."
            } >> "$F"
          fi
          if [ "${FUZZ_RC:-1}" != "0" ]; then
            {
              echo "### libFuzzer found a crashing input (rc=${FUZZ_RC})"
              echo
              echo "Reproducers and the corpus: the nightly-css-fuzz-evidence artifact of the run."
              echo "Replay locally with:"
              echo
              echo '    bazel run --config=clang-asan -c opt //third_party/css_parser:parser_fuzz -- <crash-file>'
            } >> "$F"
          fi
          if [ -s "$F" ]; then
            cat "$F" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Debugging aid for a failed run, kept briefly. A refused upload
      # (artifact storage full) must not add a failure of its own.
      - name: Upload the evidence (crash reproducers and corpus)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-css-fuzz-evidence
          path: |
            ${{ runner.temp }}/css-fuzz-crashes/
            ${{ runner.temp }}/css-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 3

      # Save even on findings: libFuzzer writes a crash unit into the corpus
      # directory before it stops, and keeping it makes the finding a
      # persistent regression input once the bug is fixed. Guarded on the
      # lane having run so a build-stage failure cannot error the save on a
      # missing path.
      - name: Persist the corpus (css-fuzz-corpus)
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/css-fuzz-corpus
          key: css-fuzz-corpus-v1-${{ github.run_id }}

      - name: Remove the build container
        if: always()
        run: |
          if [ -n "${CTR:-}" ]; then
            # Sudo inside the container can leave root-owned files (rig
            # cores, logs, caches) in the bind-mounted workspace and temp
            # directory; hand them back to the host user before removal so
            # the runner's cleanup can delete them.
            docker exec "${CTR}" bash -c 'sudo chown -R "$(id -u):$(id -g)" /workspace "${RUNNER_TEMP}" 2>/dev/null' >/dev/null 2>&1 || true
            docker rm -f "${CTR}" >/dev/null 2>&1 || true
          fi


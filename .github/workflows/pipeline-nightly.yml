          echo "BZL_FLAGS=${BZL_FLAGS}" >> "$GITHUB_ENV"

      # The smoke exercises the event-pipe race class across HTTP protocol
      # versions: h1 and h2 are different nginx code paths with different
      # finalize and abort semantics. The protocols run sequentially inside
      # one job because the smoke manages a single nginx instance. HTTP/3 needs

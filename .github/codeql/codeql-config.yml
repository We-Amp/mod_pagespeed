name: mod_pagespeed CodeQL configuration

# Same query suite as the repository's former default setup.
# (No "queries:" entry: the default suite applies.)

# admin_console.html is the minified build output of the sources under
# pagespeed/system/console/src/, which are analysed directly. Analysing the
# bundle as well only re-raises the same findings on every rebuild.
paths-ignore:
  - pagespeed/system/console/admin_console.html

# Generated scripts and their embedded copies, built from sources that are analysed directly.
  - net/instaweb/rewriter/generated/

# These ignores apply to every language in the matrix, not only C/C++.
# C/C++ is analysed with build-mode none (no Bazel build). Vendored upstream
# trees and test code are not product code and would only add noise.
# third_party/css_parser is our own code and stays analysed.
  - third_party/apr/
  - third_party/aprutil/
  - third_party/libjpeg_turbo/
  - third_party/zlib_alias_module/
  - third_party/redis-crc/
  - test/
  - tools/ci/testdata/

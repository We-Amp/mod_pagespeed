#
# Refuses the release pipelines on any ref but master and release tags whose
# commit is on master, and on any event but the allowed ones.
# Logic: tools/ci/ref_guard.sh. Rule: docs/ci/pipelines.md (release lanes).
# Call after a checkout of master with fetch-depth 0 and tags (the guard code is
# then master's, never the tree being released); see the release pipelines.
name: ref-guard
description: Fail unless the ref is master or an allowed release tag (and, for dispatch, the tag is on master).
inputs:
  tag-glob:
    description: Allowed tag glob; empty means master only.
    default: 'v*'
  dispatch-tag:
    description: workflow_dispatch tag input to verify (omit when the workflow has none).
    default: ''
  events:
    description: Space-separated events allowed to run the workflow; empty means any.
    default: ''
  candidate:
    description: 'Candidate mode: "true" lets a dispatch on master name a tag that does not exist yet (see tools/ci/ref_guard.sh).'
    default: 'false'
  candidate-sha:
    description: Candidate mode only. The 40-hex master tip the dispatch names; must equal the commit the run is at.
    default: ''
  dry-run:
    description: Candidate mode only. The workflow's dry_run input; a candidate requires true.
    default: ''
outputs:
  ref:
    description: Ref the release jobs must check out (refs/tags/<tag> on dispatch, the pushed ref otherwise, the commit itself for a candidate).
    value: ${{ steps.guard.outputs.ref }}
  sha:
    description: Commit that ref resolves to.
    value: ${{ steps.guard.outputs.sha }}
runs:
  using: composite
  steps:
    - id: guard
      shell: bash
      env:
        ALLOWED_TAG_GLOB: ${{ inputs.tag-glob }}
        DISPATCH_TAG: ${{ inputs.dispatch-tag }}
        ALLOWED_EVENTS: ${{ inputs.events }}
        CANDIDATE: ${{ inputs.candidate }}
        CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$ALLOWED_TAG_GLOB" ]; then
          export INPUT_TAG="$DISPATCH_TAG"
        fi
        git fetch --no-tags --quiet origin '+refs/heads/master:refs/remotes/origin/master'
        bash "$GITHUB_ACTION_PATH/../../../tools/ci/ref_guard.sh" check
        bash "$GITHUB_ACTION_PATH/../../../tools/ci/ref_guard.sh" outputs >> "$GITHUB_OUTPUT"

<html>
<head>
    <meta charset="UTF-8">
    <title>Image Rewriting Test</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <h1>Image Rewriting Test</h1>
    <p>These images should be optimized by PageSpeed.</p>

    <div class="images">
        <figure>
            <img src="images/logo.png" alt="PNG Logo" width="200">
            <figcaption>PNG Image</figcaption>
        </figure>

        <figure>
            <img src="images/photo.jpg" alt="JPEG Photo" width="300">
            <figcaption>JPEG Image</figcaption>
        </figure>

        <figure>
            <img src="images/small.gif" alt="GIF Icon" width="100">
            <figcaption>GIF Image</figcaption>
        </figure>
    </div>
</body>
</html>

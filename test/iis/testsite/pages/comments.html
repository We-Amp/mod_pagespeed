<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Remove Comments Test</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <h1>Remove Comments Test</h1>

    <!-- This comment should be removed by PageSpeed -->

    <p>This page contains various HTML comments that should be removed.</p>

    <!--
        This is a multi-line comment
        that spans several lines
        and should also be removed.
    -->

    <div>
        <!-- Comment inside a div -->
        <p>Content after inline comment.</p>
    </div>

    <!--[if IE]>
    <p>This is a conditional comment for Internet Explorer.
       It should be preserved because it affects rendering.</p>
    <![endif]-->

    <!--[if !IE]><!-->
    <p>This content is for non-IE browsers.</p>
    <!--<![endif]-->

    <!-- Another regular comment at the end -->

    <script>
        // JavaScript comments are different
        /* Block comments in JS */
        console.log('Script loaded');
    </script>
</body>
</html>

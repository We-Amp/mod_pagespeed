#
# nginx proxy_cache keyed on a device class instead of the raw User-Agent.
# For image requests the class goes into the cache key, the origin's Vary is
# not used for the lookup (it would key on the raw User-Agent again), and the
# origin is sent one representative User-Agent per class, so it selects for
# the same class the key names.  The class rules are the optimizer's
# classifier at the pinned release (see "Behind a shared cache or CDN" in
# docs/daemon-adapter-deployment.md).
map $http_user_agent $device_view {
    "~*ipad|tablet"           tablet;
    "~*^(?!.*mobile).*android" tablet;
    "~*mobile|android|iphone|ipod" mobile;
    default                   desktop;
}
map $http_user_agent $device_density {
    "~2x|Retina" " Retina";
    default      "";
}
map "$device_view$device_density" $device_class_ua {
    "mobile"         "device-class Mobile";
    "mobile Retina"  "device-class Mobile";
    "tablet"         "device-class tablet";
    "tablet Retina"  "device-class tablet Retina";
    "desktop Retina" "device-class Retina";
    default          "device-class desktop";
}
proxy_cache_path /var/cache/nginx/device keys_zone=device:10m inactive=10m;
server {
  listen 80;
  location ~* \.(jpe?g|png|gif|webp|avif)$ {
    proxy_pass http://origin:80;
    proxy_cache device;
    proxy_cache_key "$request_uri|$http_accept|$http_save_data|$http_sec_ch_dpr|$device_class_ua";
    proxy_ignore_headers Vary;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header User-Agent $device_class_ua;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }
  location / {
    proxy_pass http://origin:80;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
  }
}

server {
    listen 80 default_server;
    root /var/www/html;
    pagespeed on;
    pagespeed FileCachePath /var/cache/ngx_pagespeed;
    pagespeed RewriteLevel PassThrough;
    pagespeed DaemonSocketPath /run/pagespeed-optimizer/notify.sock;
    pagespeed DaemonVolumePath /var/cache/pagespeed-optimizer/v3/cache;
    # A lifetime longer than the run (see start-origin.sh).
    expires 1h;
    # The same files with no configured lifetime, for the fallback check.
    location /no-expires/ {
        alias /var/www/html/;
        expires off;
    }
    # The same files with a long lifetime added by add_header, which nginx
    # appends as a second Cache-Control line.
    location /add-header/ {
        alias /var/www/html/;
        expires off;
        add_header Cache-Control "public, max-age=31536000";
    }
}

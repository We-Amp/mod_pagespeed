# origin-headers.sh: an application origin on a loopback port, each image
# with its own caching headers, behind a virtual host that sets its own
# caching headers for browsers.
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    DocumentRoot /var/www/oh-origin
    ModPagespeed off
    <Location /private.jpg>
        Header set Cache-Control "private, max-age=600"
    </Location>
    <Location /nostore.jpg>
        Header set Cache-Control "no-store"
    </Location>
    <Location /public.jpg>
        Header set Cache-Control "public, max-age=600"
    </Location>
    <Location /short.jpg>
        Header set Cache-Control "public, max-age=15"
    </Location>
    <Location /guard.jpg>
        Header set Cache-Control "public, max-age=600"
    </Location>
</VirtualHost>
<VirtualHost *:80>
    DocumentRoot /var/www/html
    ProxyPass /e/ http://127.0.0.1:8081/
    ProxyPass /n/ http://127.0.0.1:8081/
    <Location /e/>
        Header set Cache-Control "max-age=3600"
    </Location>
    <Location /n/>
        Header set Cache-Control "no-store"
    </Location>
</VirtualHost>

# origin-headers.sh: an application origin on a loopback port, each image
# with its own caching headers, behind a server that sets its own caching
# headers for browsers.
server {
    listen 127.0.0.1:8081;
    root /var/www/oh-origin;
    location = /private.jpg { add_header Cache-Control "private, max-age=600"; }
    location = /nostore.jpg { add_header Cache-Control "no-store"; }
    location = /public.jpg { add_header Cache-Control "public, max-age=600"; }
    location = /short.jpg { add_header Cache-Control "public, max-age=15"; }
    location = /guard.jpg { add_header Cache-Control "public, max-age=600"; }
}
server {
    listen 80 default_server;
    root /var/www/html;
    pagespeed on;
    pagespeed FileCachePath /var/cache/ngx_pagespeed;
    pagespeed RewriteLevel PassThrough;
    pagespeed DaemonSocketPath /run/pagespeed-optimizer/notify.sock;
    pagespeed DaemonVolumePath /var/cache/pagespeed-optimizer/v3/cache;
    location /e/ {
        proxy_pass http://127.0.0.1:8081/;
        expires 1h;
    }
    location /n/ {
        proxy_pass http://127.0.0.1:8081/;
        add_header Cache-Control "no-store";
    }
}

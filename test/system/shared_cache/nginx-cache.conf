# A shared cache: nginx proxy_cache keeps one copy per URL and per value of
# each request header the response's Vary names.
proxy_cache_path /var/cache/nginx/shared keys_zone=shared:10m inactive=10m;
server {
  listen 80;
  location / {
    proxy_pass http://origin:80;
    proxy_cache shared;
    proxy_cache_key $request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }
}

# pytest configuration for PageSpeed system tests
#
# Run tests with: pytest -v
# Or: python -m pytest -v

[pytest]
# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --tb=short
    --strict-markers

# Timeout for individual tests (seconds)
timeout = 120

# Custom markers
markers =
    requires_secondary: test requires secondary server (PAGESPEED_SECONDARY_HOST)
    requires_https: test requires HTTPS server (PAGESPEED_HTTPS_HOST)
    requires_stats: test requires statistics enabled (PAGESPEED_STATS_ENABLED=1)
    license: test requires license infrastructure (LICENSE_TOKEN env var or signing key)
    slow: test takes a long time to run

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning

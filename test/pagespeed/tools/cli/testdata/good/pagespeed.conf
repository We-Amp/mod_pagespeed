# A clean configuration.
ModPagespeed on
ModPagespeedFileCachePath "/var/cache/mod_pagespeed/"
ModPagespeedRewriteLevel CoreFilters
ModPagespeedEnableFilters collapse_whitespace,remove_comments
ModPagespeedDisableFilters combine_css
ModPagespeedNumRewriteThreads auto
ModPagespeedMessageBufferSize 100000
ModPagespeedStatisticsDomains Allow localhost
<IfModule pagespeed_module>
  ModPagespeedInPlaceResourceOptimization on
</IfModule>
<VirtualHost *:80>
  ServerName example.com
  ModPagespeedDomain example.com
  ModPagespeedMapRewriteDomain cdn.example.com example.com
  <Location /pagespeed_admin>
    SetHandler pagespeed_admin
    ModPagespeedRewriteLevel PassThrough
  </Location>
</VirtualHost>
<ModPagespeedIf !spdy>
  ModPagespeedEnableFilters inline_css
</ModPagespeedIf>
Include good/sites/*.conf

    pagespeed ShmMetadataCacheCheckpointIntervalSec 1;
    #@ src=doc/system expect=same
    pagespeed DefaultSharedMemoryCacheKB 51200;
    #@ src=doc/system expect=same
    pagespeed CreateSharedMemoryMetadataCache "/var/cache/pagespeed/" 51200;
    #@ src=doc/admin expect=same
    pagespeed MessageBufferSize 100000;
    #@ src=doc/admin expect=same
    pagespeed UsePerVHostStatistics on;
    #@ src=issue:ngx#1236 expect=same note=spelling with lowercase h
    pagespeed UsePerVhostStatistics on;
    #@ src=doc/admin expect=same
    pagespeed GlobalStatisticsPath /ngx_pagespeed_global_statistics;
    #@ src=doc/admin expect=same
    pagespeed GlobalAdminPath /pagespeed_global_admin;
    #@ src=doc/configuration expect=same
    pagespeed ListOutstandingUrlsOnError on;
    #@ src=old-option-table expect=same
    pagespeed TrackOriginalContentLength on;
    #@ src=issue:ngx#882 expect=same
    pagespeed InstallCrashHandler on;
    #@ src=old-option-table expect=same
    pagespeed StaticAssetCDN "http://cdn.example.com/pagespeed_static,DEFER_JS,LAZYLOAD_IMAGES_JS";
    #@ src=old-option-table expect=same
    pagespeed IproMaxResponseBytes 1048576;
    #@ src=old-option-table expect=same
    pagespeed IproMaxConcurrentRecordings 10;
    #@ src=doc/system expect=same
    pagespeed FetchWithGzip on;

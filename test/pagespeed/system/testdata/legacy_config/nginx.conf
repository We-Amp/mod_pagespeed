    pagespeed ForceCaching on;
    #@ src=doc/reference-image-optimize expect=same
    pagespeed ImageMaxRewritesAtOnce 8;
    #@ src=old-option-table expect=same
    pagespeed WebpTimeoutMs 5000;
    #@ src=doc/system expect=changed-default note=the unset default now follows the CPU budget and the server process count (1.14: 4 when threaded, else 1)
    pagespeed NumRewriteThreads 4;
    #@ src=doc/system expect=changed-default note=the unset default now follows the CPU budget and the server process count (1.14: 4 when threaded, else 1)

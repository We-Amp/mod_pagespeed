# Configuration directives from the 1.13 and 1.14 releases and from
# ngx_pagespeed, as people wrote them.  Read by
# test/pagespeed/system/legacy_config_compat_test.cc.
#
# Each directive is preceded by a line
#   #@ src=<where it comes from> expect=<class> [note=<text>]
# expect is one of
#   same             accepted, no warning
#   deprecated       accepted with a warning, has no effect
#   changed-default  accepted with the same meaning, but the default it
#                    overrides is not the old one (see the note)
#   removed          refused at configuration time: a known break; the name
#                    must also be in KnownRemoved() in the test
#   never-loaded     refused, and refused by the 1.14 release too: the
#                    option had no help text, so httpd never had a command
#                    for it
# A directive without a #@ line expects "same".
#
# Sources: doc/<page> is a page of the 1.13-era documentation that names the
# directive (the pages formerly on developers.google.com/speed/pagespeed/module,
# archived under html/doc/ of apache/incubator-pagespeed-mod); ngx-test is
# test/pagespeed_test.conf.template of apache/incubator-pagespeed-ngx;
# mod-debug is install/debug.conf.template of apache/incubator-pagespeed-mod;
# issue:<repo>#<n> is a configuration quoted in
# an issue of those repositories; old-option-table, old-filter-table,
# old-apache-config, old-mod-instaweb and old-deprecated-table name a
# registration in the 1.14.36.1 sources (used where no archived page names
# the directive, or where no example is cited).
# Together they give one line per filter and per option registered for this
# port in 1.14.36.1.

# nginx: http, server and location blocks set the scope.

http {

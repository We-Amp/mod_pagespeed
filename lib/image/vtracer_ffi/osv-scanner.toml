# osv-scanner reads this file for Cargo.lock in this directory.
#
# The four notices below are RUSTSEC "unmaintained" (and, for atty, an
# unaligned-read on Windows) advisories on crates that vtracer 0.6.5, the
# newest 0.6 release, pulls in through clap 2 (atty, ansi_term) and through
# image 0.23 -> tiff 0.6 -> miniz_oxide 0.4 (adler). Cargo features are
# additive, so they cannot be dropped from this crate's build. clap is used
# only by vtracer's command-line binary (src/main.rs), and image is used only
# by vtracer's file-decoding entry point (convert_image_to_svg); this FFI
# calls vtracer::convert() on an in-memory pixel buffer and reaches neither.
# Re-evaluate on expiry or when vtracer moves off clap 2 / image 0.23.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0056"
ignoreUntil = 2027-05-25
reason = "adler is unmaintained; pulled in by vtracer 0.6.5 via image 0.23 -> tiff 0.6 -> miniz_oxide 0.4; the FFI does not call vtracer's image-decoding path"

[[IgnoredVulns]]
id = "RUSTSEC-2021-0139"
ignoreUntil = 2027-05-25
reason = "ansi_term is unmaintained; pulled in by vtracer 0.6.5 via clap 2, which only vtracer's CLI binary uses"

[[IgnoredVulns]]
id = "RUSTSEC-2021-0145"
ignoreUntil = 2027-05-25
reason = "atty potential unaligned read (Windows); pulled in by vtracer 0.6.5 via clap 2, which only vtracer's CLI binary uses"

[[IgnoredVulns]]

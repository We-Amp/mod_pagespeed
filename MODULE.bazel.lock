              "build_file_content": "\ncc_library(\n    name = \"hiredis\",\n    srcs = [\n        \"async.c\",\n        \"hiredis.c\",\n        \"net.c\",\n        \"read.c\",\n        \"sds.c\",\n        \"alloc.c\",\n        \"sockcompat.c\",\n    ],\n    hdrs = [\n        # adding dict.c here since async.c includes it\n        \"dict.c\",\n        \"async.h\",\n        \"async_private.h\",\n        \"dict.h\",\n        \"hiredis.h\",\n        \"net.h\",\n        \"read.h\",\n        \"sds.h\",\n        \"alloc.h\",\n        \"sdsalloc.h\",\n        \"fmacros.h\",\n        \"sockcompat.h\",\n        \"win32.h\",\n    ],\n    # Our sources include these headers as \"external/hiredis/...\". Under bzlmod\n    # the repo directory carries a canonical name, so serve the headers at the\n    # old spelling through _virtual_includes.\n    include_prefix = \"external/hiredis\",\n    linkopts = select({\n        \"@platforms//os:windows\": [\"ws2_32.lib\"],\n        \"//conditions:default\": [],\n    }),\n    visibility = [\"//visibility:public\"],\n)\n",

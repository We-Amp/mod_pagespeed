          "libpsl": {
            "repoRuleId": "@@bazel_tools//tools/build_defs/repo:http.bzl%http_archive",
            "attributes": {
              "url": "https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.gz",
              "build_file_content": "\nload(\"@rules_cc//cc:defs.bzl\", \"cc_library\")\n\n# Generate the compiled-in DAFSA from the bundled Public Suffix List, exactly\n# as upstream's meson/automake build does:\n#   python psl-make-dafsa --output-format=cxx+ <psl-file> suffixes_dafsa.h\ngenrule(\n    name = \"suffixes_dafsa_h\",\n    srcs = [\n        \"src/psl-make-dafsa\",\n        \"list/public_suffix_list.dat\",\n    ],\n    outs = [\"src/suffixes_dafsa.h\"],\n    # PYTHONUTF8=1 so the PSL .dat (UTF-8, IDN names) reads on every platform;\n    # genrules run through bash on all platforms.\n    cmd = select({\n        \"@bazel_tools//src/conditions:windows\": \"PYTHONUTF8=1 python3 ./$(location src/psl-make-dafsa) --output-format=cxx+ ./$(location list/public_suffix_list.dat) $@\",\n        \"//conditions:default\": \"python3 ./$(location src/psl-make-dafsa) --output-format=cxx+ ./$(location list/public_suffix_list.dat) $@\",\n    }),\n)\n\n# Minimal config.h. We deliberately enable ONLY the builtin PSL and the\n# standard-header HAVE_* flags that are true on every toolchain we ship\n# (glibc, musl, macOS, clang-cl). No WITH_LIB* (no IDNA runtime), no gettext.\ngenrule(\n    name = \"config_h\",\n    outs = [\"src/config.h\"],\n    cmd = (\n        \"{ \" +\n        \"echo '#ifndef LIBPSL_CONFIG_H'; \" +\n        \"echo '#define LIBPSL_CONFIG_H'; \" +\n        \"echo '#define ENABLE_BUILTIN 1'; \" +\n        \"echo '#define PACKAGE_VERSION \\\"0.21.5\\\"'; \" +\n        \"echo '#define HAVE_STDIO_H 1'; \" +\n        \"echo '#define HAVE_STDLIB_H 1'; \" +\n        \"echo '#define HAVE_STRING_H 1'; \" +\n        \"echo '#define HAVE_STDINT_H 1'; \" +\n        \"echo '#define HAVE_INTTYPES_H 1'; \" +\n        \"echo '#define STDC_HEADERS 1'; \" +\n        \"echo '#endif'; \" +\n        \"} > $@\"\n    ),\n)\n\ncc_library(\n    name = \"libpsl\",\n    srcs = [\n        \"src/psl.c\",\n        \"src/lookup_string_in_fixed_set.c\",\n        \":suffixes_dafsa_h\",\n        \":config_h\",\n    ],\n    hdrs = [\n        \"include/libpsl.h\",\n        \":suffixes_dafsa_h\",\n        \":config_h\",\n    ],\n    # `includes` (NOT raw -I copts) so the search paths cover BOTH the source\n    # tree (src/psl.c, include/libpsl.h) AND the bazel-out genfiles tree where\n    # the generated config.h + suffixes_dafsa.h land. Bazel's `includes`\n    # attribute emits an -isystem (or /I) for each of {<pkg>/src, <pkg>/include}\n    # under the exec-root AND under the genfiles root, so psl.c's\n    # `#include <config.h>` and `#include \"suffixes_dafsa.h\"` resolve to the\n    # genrule outputs while the checked-in sources resolve from source. Raw\n    # -I copts on the source tree only cover the source variant; that is the\n    # build break this fixes.\n    includes = [\n        \"src\",\n        \"include\",\n    ],\n    # PSL_STATIC must also be visible to every CONSUMER of libpsl.h (e.g.\n    # domain_registry.cc) so the API is declared without __declspec(dllimport);\n    # otherwise lld-link looks for an import library and fails with\n    # \"undefined symbol: __declspec(dllimport) psl_builtin\". `defines`\n    # (unlike copts) propagate transitively to dependents. Windows-only.\n    defines = select({\n        \"@bazel_tools//src/conditions:windows\": [\"PSL_STATIC\"],\n        \"//conditions:default\": [],\n    }),\n    # psl.c's isip() helper calls WSAStringToAddressW (Winsock) on Windows to\n    # detect IP-literal hostnames; that symbol lives in ws2_32.lib. Static\n    # libpsl.lib references it but does not pull it in, so any executable\n    # linking @libpsl (the http_test, and downstream the nginx/IIS module)\n    # fails with \"undefined symbol __declspec(dllimport) WSAStringToAddressW\".\n    # linkopts propagate to dependents. Windows-only.\n    linkopts = select({\n        \"@bazel_tools//src/conditions:windows\": [\"ws2_32.lib\"],\n        \"//conditions:default\": [],\n    }),\n    # -DHAVE_CONFIG_H so psl.c picks up our generated config.h.\n    copts = select({\n        \"@bazel_tools//src/conditions:windows\": [\n            \"/DHAVE_CONFIG_H\",\n            # libpsl is linked statically (libpsl.lib), so neutralize libpsl.h's\n            # MSVC PSL_API __declspec(dllexport/dllimport) dance: with PSL_STATIC\n            # defined, PSL_API collapses to empty and psl.c emits plain static\n            # symbols (no dllexport). The matching consumer-side define lives in\n            # `defines` below so domain_registry.cc imports them as static too.\n            \"/DPSL_STATIC\",\n        ],\n        \"//conditions:default\": [\n            \"-DHAVE_CONFIG_H\",\n            # Upstream src is warning-clean under its own build but we compile\n            # with the project's stricter flags; keep third-party warnings\n            # non-fatal here (matches how other vendored C deps are treated).\n            \"-w\",\n        ],\n    }),\n    # The wrapper includes \"external/libpsl/include/libpsl.h\" (the same\n    # external/<repo>/... convention drp used). Under bzlmod the repo\n    # directory carries a canonical name, so serve the headers at that\n    # spelling through _virtual_includes.\n    include_prefix = \"external/libpsl\",\n    visibility = [\"//visibility:public\"],\n)\n",
              "strip_prefix": "libpsl-0.21.5",
              "sha256": "1dcc9ceae8b128f3c0b3f654decd0e1e891afc6ff81098f227ef260449dae208"
            }
          },
          "giflib": {
            "repoRuleId": "@@bazel_tools//tools/build_defs/repo:http.bzl%http_archive",
            "attributes": {
              "strip_prefix": "giflib-5.2.2",
              "url": "https://sourceforge.net/projects/giflib/files/giflib-5.x/giflib-5.2.2.tar.gz/download",
              "type": "tar.gz",
              "build_file_content": "\ncc_library(\n    name = \"giflib_core\",\n    srcs = [\n        'gifalloc.c',\n        'gif_err.c',\n        'openbsd-reallocarray.c'\n    ],\n    hdrs = [\n        'gif_lib.h',\n        'gif_lib_private.h',\n        'gif_hash.h',\n    ],\n    # Our sources include these headers as \"external/giflib/...\". Under bzlmod\n    # the repo directory carries a canonical name, so serve the headers at the\n    # old spelling through _virtual_includes.\n    include_prefix = \"external/giflib\",\n    visibility = [\"//visibility:public\"],\n)\n\ncc_library(\n    name = \"dgiflib\",\n    srcs = [\n        'dgif_lib.c',\n    ],\n    defines = select({\n        \"@platforms//os:windows\": [\n            '_GBA_NO_FILEIO',\n        ],\n        \"//conditions:default\": [\n            'UINT32=\\\"unsigned int\\\"',\n            '_GBA_NO_FILEIO',\n        ],\n    }),\n    copts = select({\n        \"@platforms//os:windows\": ['/DUINT32=unsigned'],\n        \"//conditions:default\": ['-Wno-pointer-sign'],\n    }),\n    deps = ['@giflib//:giflib_core',],\n    visibility = [\"//visibility:public\"],\n)\n\ncc_library(\n    name = \"egiflib\",\n    srcs = [\n        'egif_lib.c',\n        'gif_hash.c'\n    ],\n    defines = select({\n        \"@platforms//os:windows\": [\n            '_GBA_NO_FILEIO',\n            'HAVE_FCNTL_H',\n        ],\n        \"//conditions:default\": [\n            'UINT32=\\\"unsigned int\\\"',\n            '_GBA_NO_FILEIO',\n            'HAVE_FCNTL_H',\n        ],\n    }),\n    copts = select({\n        \"@platforms//os:windows\": ['/DUINT32=unsigned'],\n        \"//conditions:default\": ['-Wno-pointer-sign'],\n    }),\n    deps = ['@giflib//:giflib_core',],\n    visibility = [\"//visibility:public\"],\n)\n",
              "sha256": "be7ffbd057cadebe2aa144542fd90c6838c6a083b5e8a9048b8ee3b66b29d5fb"
            }
          },

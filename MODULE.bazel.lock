          "apr": {
            "repoRuleId": "@@bazel_tools//tools/build_defs/repo:http.bzl%http_archive",
            "attributes": {
              "strip_prefix": "apr-d7a4f5be56969ebb5d2f9d093e17eb39dd016693",
              "url": "https://github.com/apache/apr/archive/d7a4f5be56969ebb5d2f9d093e17eb39dd016693.tar.gz",
              "build_file_content": "\n\n# Linux/arm64 selector for the arm64 pre-generated APR headers. Defined inline\n# (like //third_party/libwebp's is_x86) so it is visible inside the @apr repo.\nconfig_setting(\n    name = \"linux_arm64\",\n    constraint_values = [\n        \"@platforms//os:linux\",\n        \"@platforms//cpu:arm64\",\n    ],\n)\n\ncc_library(\n    name = \"apr\",\n    srcs = [\n        'atomic/unix/builtins.c',\n        'atomic/unix/ia32.c',\n        'atomic/unix/mutex.c',\n        'atomic/unix/mutex64.c',\n        'dso/unix/dso.c',\n        'file_io/unix/buffer.c',\n        'file_io/unix/copy.c',\n        'file_io/unix/dir.c',\n        'file_io/unix/fileacc.c',\n        'file_io/unix/filedup.c',\n        'file_io/unix/filepath.c',\n        'file_io/unix/filepath_util.c',\n        'file_io/unix/filestat.c',\n        'file_io/unix/flock.c',\n        'file_io/unix/fullrw.c',\n        'file_io/unix/mktemp.c',\n        'file_io/unix/open.c',\n        'file_io/unix/pipe.c',\n        'file_io/unix/readwrite.c',\n        'file_io/unix/seek.c',\n        'file_io/unix/tempdir.c',\n        'locks/unix/global_mutex.c',\n        'locks/unix/proc_mutex.c',\n        'locks/unix/thread_cond.c',\n        'locks/unix/thread_mutex.c',\n        'locks/unix/thread_rwlock.c',\n        'memory/unix/apr_pools.c',\n        'misc/unix/charset.c',\n        'misc/unix/env.c',\n        'misc/unix/errorcodes.c',\n        'misc/unix/getopt.c',\n        'misc/unix/otherchild.c',\n        'misc/unix/rand.c',\n        'misc/unix/start.c',\n        'misc/unix/version.c',\n        'mmap/unix/common.c',\n        'mmap/unix/mmap.c',\n        'network_io/unix/inet_ntop.c',\n        'network_io/unix/inet_pton.c',\n        'network_io/unix/multicast.c',\n        'network_io/unix/sendrecv.c',\n        'network_io/unix/sockaddr.c',\n        'network_io/unix/socket_util.c',\n        'network_io/unix/sockets.c',\n        'network_io/unix/sockopt.c',\n        'passwd/apr_getpass.c',\n 
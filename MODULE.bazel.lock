          "libpng": {
            "repoRuleId": "@@bazel_tools//tools/build_defs/repo:http.bzl%http_archive",
            "attributes": {
              "strip_prefix": "libpng-1.6.58",
              "url": "https://github.com/glennrp/libpng/archive/v1.6.58.tar.gz",
              "build_file_content": "\n\n# TODO(oschaaf): we need to revisit this for linking against the system library\n# later on.\n\ngenrule(\n  name = \"copy_prebuild_header\",\n  srcs = [\"scripts/pnglibconf.h.prebuilt\"],\n  outs = [\"pnglibconf.h\"],\n  cmd = \"cp $< $@\",\n)\n\ncc_library(\n    name = \"libpng\",\n    srcs = [\n            \"png.c\",\n            \"pngerror.c\",\n            \"pngget.c\",\n            \"pngmem.c\",\n            \"pngpread.c\",\n            \"pngread.c\",\n            \"pngrio.c\",\n            \"pngrtran.c\",\n            \"pngrutil.c\",\n            \"pngset.c\",\n            \"pngtrans.c\",\n            \"pngwio.c\",\n            \"pngwrite.c\",\n            \"pngwtran.c\",\n            \"pngwutil.c\",\n    ],\n    hdrs = [\n            \"pngpriv.h\",\n            \"pnginfo.h\",\n            \"png.h\",\n            \"pngconf.h\",\n            \"pngdebug.h\",\n            \"pngstruct.h\",\n            \":copy_prebuild_header\",\n    ],\n    includes = [\".\"],\n    # Our sources include these headers as \"external/libpng/...\". Under bzlmod\n    # the repo directory carries a canonical name, so serve the headers at the\n    # old spelling through _virtual_includes.\n    include_prefix = \"external/libpng\",\n    deps = [\"@zlib_ng//:zlib-ng\"],\n    defines = [\n              # We end up including setjmp.h directly, but libpng\n              # doesn't like that. This define tells libpng to not\n              # complain about our inclusion of setjmp.h.\n              'PNG_SKIP_SETJMP_CHECK',\n\n              # The PNG_FREE_ME_SUPPORTED define was dropped in libpng\n              # 1.4.0beta78, with its behavior becoming the default\n              # behavior.\n              # Hence, we define it ourselves for version >= 1.4.0\n              'PNG_FREE_ME_SUPPORTED',\n\n              # Disable ARM NEON optimizations since we don't compile\n              # the NEON assembly files\n              'PNG_ARM_NEON_OPT=0',\n            ],\n    visibility = [\"//visibility:public\"],\n)\n",
              "sha256": "a9d4df463d36a6e5f9c29bd6f4967312d17e996c1854f3511f833924eb1993cf"
            }
          },
          "libwebp": {
            "repoRuleId": "@@bazel_tools//tools/build_defs/repo:http.bzl%http_archive",
            "attributes": {
              "urls": [
                "https://github.com/webmproject/libwebp/archive/v1.5.0.tar.gz"
              ],
              "sha256": "668c9aba45565e24c27e17f7aaf7060a399f7f31dba6c97a044e1feacb930f37",
              "strip_prefix": "libwebp-1.5.0",
              "build_file_content": "\n# Description:\n#   WebP codec library\n\nlicenses([\"notice\"])  # WebM license\n\nexports_files([\"COPYING\"])\n\n# Config setting for x86/x64 platforms where SSE is available\nconfig_setting(\n    name = \"is_x86\",\n    constraint_values = [\"@platforms//cpu:x86_64\"],\n)\n\nconfig_setting(\n    name = \"is_x86_32\",\n    constraint_values = [\"@platforms//cpu:x86_32\"],\n)\n\n# SSE intrinsics - only built on x86 platforms\ncc_library(\n    name = \"libwebp_sse\",\n    srcs = select({\n        \":is_x86\": glob([\n            \"src/dsp/*_sse2.c\",\n            \"src/dsp/*_sse41.c\",\n        ]) + [\"sharpyuv/sharpyuv_sse2.c\"],\n        \":is_x86_32\": glob([\n            \"src/dsp/*_sse2.c\",\n            \"src/dsp/*_sse41.c\",\n        ]) + [\"sharpyuv/sharpyuv_sse2.c\"],\n        \"//conditions:default\": [],\n    }),\n    hdrs = glob([\n        \"src/dsp/*.h\",\n        \"src/webp/*.h\",\n        \"src/dec/*.h\",\n        \"src/enc/*.h\",\n        \"src/utils/*.h\",\n        \"sharpyuv/*.h\",\n    ]),\n    copts = select({\n        \":is_x86\": [\"-mssse3\", \"-msse4.1\"],\n        \":is_x86_32\": [\"-mssse3\", \"-msse4.1\"],\n        \"//conditions:default\": [],\n    }),\n    includes = [\".\"],\n    visibility = [\"//visibility:private\"],\n)\n\n# SharpYUV CPU info - compiles cpu.c with VP8GetCPUInfo renamed to\n# SharpYuvGetCPUInfo, providing the symbol that sharpyuv.c expects.\ncc_library(\n    name = \"sharpyuv_cpu\",\n    srcs = [\"src/dsp/cpu.c\"],\n    hdrs = [\n        \"src/dsp/cpu.h\",\n        \"src/webp/types.h\",\n    ],\n    includes = [\".\"],\n    local_defines = [\"VP8GetCPUInfo=SharpYuvGetCPUInfo\"],\n    visibility = [\"//visibility:private\"],\n)\n\ncc_library(\n    name = \"libwebp\",\n    srcs = glob([\n        \"src/dsp/*.c\",\n        \"src/dsp/*.h\",\n        \"src/utils/*.c\",\n        \"src/utils/*.h\",\n        \"src/dec/*.c\",\n        \"src/dec/*.h\",\n        \"src/mux/*.c\",\n        \"src/mux/*.h\",\n        \"src/demux/*.c\",\n        \"src/demux/*.h\",\n        \"src/enc/*.c\",\n        \"src/enc/*.h\",\n        \"sharpyuv/*.c\",\n        \"sharpyuv/*.h\",\n    ], exclude = [\n        \"src/dsp/*_sse2.c\",\n        \"src/dsp/*_sse41.c\",\n        \"sharpyuv/sharpyuv_sse2.c\",\n        \"sharpyuv/sharpyuv_cpu.c\",\n    ]) + [\n        \"imageio/imageio_util.c\",\n        \"imageio/webpdec.c\",\n        \"imageio/metadata.c\",\n    ],\n    hdrs = glob([\n        \"src/webp/*.h\",\n        \"examples/unicode.h\",\n    ]) + [\n        \"imageio/webpdec.h\",\n        \"imageio/metadata.h\",\n        \"imageio/imageio_util.h\",\n    ],\n    copts = [],\n    defines = [],\n    includes = [\n        \".\",\n        \"src\",\n    ],\n    # Our sources include these headers as \"external/libwebp/...\". Under bzlmod\n    # the repo directory carries a canonical name, so serve the headers at the\n    # old spelling through _virtual_includes.\n    include_prefix = \"external/libwebp\",\n    linkopts = [],\n    visibility = [\"//visibility:public\"],\n    deps = [\n        \":libwebp_sse\",\n        \":sharpyuv_cpu\",\n    ],\n)\n"
            }
          },

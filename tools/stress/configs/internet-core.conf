# internet-core.conf — serve the flattened internet-variety corpus (/corpus-internet)
# and actively rewrite it at RewriteLevel CoreFilters. One localhost vhost on
# :18080 (Listen comes from ports.conf). Sanitizer is injected via LD_PRELOAD by
# cell_run.sh, not here. See tools/stress/README.md.
<VirtualHost *:18080>
    ServerName localhost
    DocumentRoot /corpus-internet
    DirectoryIndex index.html
    # Quiet the per-request CSS-parse INFO chatter the diverse corpus provokes
    # (keeps 'notice'-level Apache crash lines; drops pagespeed INFO echo of
    # source CSS). Sanitizer reports go to stderr regardless of LogLevel.
    LogLevel notice
    <Directory /corpus-internet>
        Require all granted
        AllowOverride None
        Options +FollowSymLinks
    </Directory>
    <IfModule pagespeed_module>
        ModPagespeed on
        AddOutputFilterByType MOD_PAGESPEED_OUTPUT_FILTER text/html
        ModPagespeedFileCachePath "/tmp/pgcache_core/"
        ModPagespeedRewriteLevel CoreFilters
        ModPagespeedEnableFilters combine_css,combine_javascript,inline_css,rewrite_css,rewrite_javascript,extend_cache,rewrite_images,fallback_rewrite_css_urls
        ModPagespeedInPlaceResourceOptimization on
        # Sub-resources straight from disk — no HTTP loopback consuming worker
        # slots under restart chaos. /res/* and /pages/* map under the docroot.
        ModPagespeedLoadFromFile "http://localhost:18080/" "/corpus-internet/"
        # Keep the rewriter churning so workers are mid-Harvest / CleanParse at
        # teardown: short deadline + low implicit TTL force re-rewrites.
        ModPagespeedRewriteDeadlinePerFlushMs 10
        ModPagespeedImplicitCacheTtlMs 1000
        <Location /mod_pagespeed_statistics>
            Require all granted
            SetHandler mod_pagespeed_statistics
        </Location>
    </IfModule>
    CustomLog /tmp/internet_replay.log "%r"
</VirtualHost>

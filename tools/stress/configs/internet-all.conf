# internet-all.conf — same flattened corpus as internet-core.conf but with a
# BROAD filter set (more rewriter code paths active = more chances for a worker
# to be inside a rewrite/parse path touching a static at teardown). Distinct
# FileCachePath so it never shares state with the CoreFilters cell.
<VirtualHost *:18080>
    ServerName localhost
    DocumentRoot /corpus-internet
    DirectoryIndex index.html
    LogLevel notice
    <Directory /corpus-internet>
        Require all granted
        AllowOverride None
        Options +FollowSymLinks
    </Directory>
    <IfModule pagespeed_module>
        ModPagespeed on
        AddOutputFilterByType MOD_PAGESPEED_OUTPUT_FILTER text/html
        ModPagespeedFileCachePath "/tmp/pgcache_all/"
        ModPagespeedRewriteLevel CoreFilters
        ModPagespeedEnableFilters combine_css,combine_javascript,inline_css,inline_javascript,rewrite_css,rewrite_javascript,extend_cache,rewrite_images,recompress_images,convert_jpeg_to_webp,convert_png_to_jpeg,resize_images,inline_images,rewrite_style_attributes,rewrite_style_attributes_with_url,fallback_rewrite_css_urls,flatten_css_imports,defer_javascript,lazyload_images,insert_image_dimensions,insert_dns_prefetch,collapse_whitespace,remove_comments,elide_attributes,trim_urls,sprite_images
        ModPagespeedInPlaceResourceOptimization on
        ModPagespeedLoadFromFile "http://localhost:18080/" "/corpus-internet/"
        ModPagespeedRewriteDeadlinePerFlushMs 10
        ModPagespeedImplicitCacheTtlMs 1000
        <Location /mod_pagespeed_statistics>
            Require all granted
            SetHandler mod_pagespeed_statistics
        </Location>
    </IfModule>
    CustomLog /tmp/internet_replay.log "%r"
</VirtualHost>

name: x
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-guard:
    runs-on: ubuntu-24.04
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" =~ ^refs/tags/module-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::dispatch on a module release tag"; exit 1; }
  plan:
    needs: event-guard
    runs-on: ubuntu-24.04
    steps:
      - run: echo plan
  sign-checksums:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo sign

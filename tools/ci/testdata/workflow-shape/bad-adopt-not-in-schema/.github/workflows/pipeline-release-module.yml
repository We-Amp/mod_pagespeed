name: x
on:
  workflow_call:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - run: echo version
  adopt:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 1,2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-a
          path: in/asset-a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adopt-binding
          path: binding.json
  build:
    needs: [version, adopt]
    if: ${{ !cancelled() && needs.adopt.result == 'success' && needs.adopt.outputs.adopted != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-a
          path: a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-b-${{ matrix.x }}
          path: b
  sign:
    needs: [version, adopt]
    if: ${{ needs.adopt.outputs.adopted != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: adopt-binding
          path: adopt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-a
          path: a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: s
  validate:
    needs: [version, adopt, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: s
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-a*
          path: stage

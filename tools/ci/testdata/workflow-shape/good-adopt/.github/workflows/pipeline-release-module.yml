name: x
on:
  workflow_call:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - run: echo version
  adopt:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 1,2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-a
          path: in/asset-a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adopt-binding
          path: binding.json
  build:
    needs: [version, adopt]
    if: ${{ !cancelled() && needs.adopt.result == 'success' && needs.adopt.outputs.adopted != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-a
          path: a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-b-${{ matrix.x }}
          path: b
  sign:
    needs: [version, adopt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: adopt-binding
          path: adopt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-a
          path: a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: s
  validate:
    needs: [version, adopt, sign]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: s
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-a*
          path: stage
  windows-sign:
    needs: [version, adopt]
    if: ${{ !cancelled() && needs.adopt.result == 'success' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.candidate != 'true' && needs.version.outputs.rehearsal != 'true' && startsWith(github.ref, 'refs/tags/module-v') && github.ref == format('refs/tags/{0}', needs.version.outputs.tag) }}
    runs-on: windows-2022
    environment: release
    steps:
      - name: Check the payload
        run: echo check
      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: echo sign
  msi-sign:
    needs: [version, adopt]
    if: ${{ !cancelled() && needs.adopt.result == 'success' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.candidate != 'true' && needs.version.outputs.rehearsal != 'true' && startsWith(github.ref, 'refs/tags/module-v') && github.ref == format('refs/tags/{0}', needs.version.outputs.tag) }}
    runs-on: windows-2022
    environment: release
    steps:
      - name: Check the payload
        run: echo check
      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: echo sign
  provenance:
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.candidate != 'true' && needs.version.outputs.rehearsal != 'true' }}
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.validate.outputs.provenance_subjects }}
      provenance-name: multiple.intoto.jsonl
      upload-assets: false
  publish:
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: multiple.intoto.jsonl
          path: provenance

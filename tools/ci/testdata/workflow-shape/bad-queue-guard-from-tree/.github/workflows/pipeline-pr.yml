name: pipeline
on:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse fork and Dependabot PRs in the merge queue
        if: github.event_name == 'merge_group'
        run: bash tools/ci/queue_fork_guard.sh
  vendor:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - run: echo vendor

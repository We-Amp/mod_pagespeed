name: pipeline
on:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse fork and Dependabot PRs in the merge queue
        if: github.event_name == 'merge_group'
        run: bash tools/ci/queue_fork_guard.sh

name: pipeline-nightly
on:
  workflow_call:
permissions:
  contents: read
jobs:
  event-guard:
    name: Event guard (refuses merge_group and unexpected events)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse events this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          ALLOWED: "schedule workflow_dispatch"
        run: |
          set -euo pipefail
          echo extra
          case " ${ALLOWED} " in *" ${EVENT} "*) echo "event ${EVENT} accepted";; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac
  vendor:
    needs: event-guard
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo vendor
  build:
    needs: vendor
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo build
  report:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo report
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo hosted jobs need no edge

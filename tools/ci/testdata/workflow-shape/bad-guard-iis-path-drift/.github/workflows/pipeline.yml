name: pipeline
on:
  workflow_call:
permissions:
  contents: read
jobs:
  iis-smoke:
    needs: changes
    if: ${{ vars.FLEET_IIS_ENABLED == 'true' && needs.changes.outputs.iis == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-iis' }}
    steps:
      - run: echo smoke

name: pipeline
on:
  workflow_call:
permissions:
  contents: read
jobs:
  css-smoke:
    needs: changes
    if: ${{ vars.FLEET_ENABLED == 'true' && needs.changes.outputs.css == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    steps:
      - run: echo smoke
